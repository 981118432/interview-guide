r](https://www.morganmckinley.com/sg/salary-guide/data/ai-ml-engineer/singapore)\n\n### Frontier-lab career sources\n- [Anthropic - Careers](https://www.anthropic.com/careers)\n- [Anthropic - Forward Deployed Engineer](https://job-boards.greenhouse.io/anthropic/jobs/4985877008)\n- [Anthropic - Applied AI Engineer](https://job-boards.greenhouse.io/anthropic/jobs/5116274008)\n- [OpenAI Careers](https://openai.com/careers/search/)\n- [OpenAI - Applied Evals](https://openai.com/careers/software-engineer-applied-evals-san-francisco/)\n- [OpenAI - Frontier Evals & Environments](https://openai.com/careers/research-engineer-frontier-evals-and-environments-san-francisco/)\n- [OpenAI - Agent Infrastructure SWE](https://openai.com/careers/software-engineer-agent-infrastructure-san-francisco/)\n- [Sundeep Teki - How to Get Hired at OpenAI/Anthropic/DeepMind 2026](https://www.sundeepteki.org/advice/how-to-get-hired-at-openai-anthropic-and-google-deepmind-in-2026)\n- [Sundeep Teki - AI Research Engineer Interview Guide](https://www.sundeepteki.org/advice/the-ultimate-ai-research-engineer-interview-guide-cracking-openai-anthropic-google-deepmind-top-ai-labs)\n- [Sundeep Teki - FDE Interviews](https://www.sundeepteki.org/advice/the-definitive-guide-to-forward-deployed-engineer-interviews-in-2026)\n- [Hashnode - Complete 2026 Guide to FDE](https://hashnode.com/blog/a-complete-2026-guide-to-the-forward-deployed-engineer)\n\n### Interview process sources\n- [Design Gurus - System Design Interviews Changed in 2026](https://designgurus.substack.com/p/system-design-interviews-changed)\n- [IGotAnOffer - Anthropic Interview Process](https://igotanoffer.com/en/advice/anthropic-interview-process)\n- [Jobright - Anthropic Technical Interview 2026](https://jobright.ai/blog/anthropic-technical-interview-questions-complete-guide-2026/)\n- [Sierra - The AI-Native Interview](https://sierra.ai/blog/the-ai-native-interview)\n- [Alexey Grigorev - AI Engineering Field Guide (Interview Process)](https://github.com/alexeygrigorev/ai-engineering-field-guide/blob/main/interview/01-interview-process.md)\n- [interviewing.io - Meta AI-Assisted Coding Interview](https://interviewing.io/blog/how-to-use-ai-in-meta-s-ai-assisted-coding-interview-with-real-prompts-and-examples)\n- [Exponent - OpenAI System Design 2026](https://www.tryexponent.com/blog/openai-system-design-interview)\n- [Exponent - Anthropic System Design 2026](https://www.tryexponent.com/blog/anthropic-system-design-interview)\n\n### Emerging role coverage\n- [AI Career Lab - Agentic-AI Job Guide 2026](https://theaicareerlab.com/blog/agentic-ai-jobs-guide-2026)\n- [Practical DevSecOps - Top 10 Emerging AI Security Roles](https://www.practical-devsecops.com/emerging-ai-security-roles/)\n- [Fast Company - Google/Box CEOs: FDE most in-demand](https://www.fastcompany.com/91541878/google-box-ceos-say-this-is-the-most-in-demand-job-in-tech)\n- [Computerworld - FDE career emerging from AI shift](https://www.computerworld.com/article/4171867/heres-one-career-emerging-from-the-ai-shift-forward-deployed-engineers.html)\n- [Rootly - AI SRE Guide 2026](https://rootly.com/ai-sre-guide)\n- [Resolve.ai - What is an AI SRE](https://resolve.ai/glossary/what-is-ai-sre)\n- [Medium - Rise of MCP Skills](https://medium.com/@adnanmasood/the-rise-of-model-context-protocol-mcp-skills-5f0d6a1c3579)\n\n### Compliance & regulation\n- [EU AI Act Implementation Timeline](https://artificialintelligenceact.eu/implementation-timeline/)\n- [Secure Privacy - EU AI Act 2026 Compliance](https://secureprivacy.ai/blog/eu-ai-act-2026-compliance)\n- [Augment Code - EU AI Act 2026 Guide](https://www.augmentcode.com/guides/eu-ai-act-2026)\n\n---\n\n*See also: [Question Bank](01-question-bank.md) | [Answer Frameworks](02-answer-frameworks.md) | [Behavioral for AI Roles](05-behavioral-for-ai-roles.md) | [Role Transition Guide](../TRANSITION_GUIDE.md)*\n", "content_zh": "# 2026 年 AI 就业市场趋势（2026 年 8 月）\n\n这篇资料讨论 AI 招聘市场、岗位名称、技能要求、薪酬、面试流程和新兴方向。具体价格、岗位数量和法规都具有时效性，使用前应重新核对来源和日期。\n\n## 三个核心变化\n\n### 1. 市场又热又冷\n\nAI 相关投入和高端岗位仍在增长，但普通、缺乏业务结果的“AI 包装岗位”竞争激烈。企业更看重能把模型能力接入真实产品并控制质量、成本和风险的人。\n\n### 2. 职位名称趋于融合，工作内容更加细分\n\nPrompt Engineer 等独立职位被吸收到 AI 应用工程、评测、产品、可靠性和安全岗位中。候选人需要展示完整系统能力，而不是只会写 Prompt。\n\n### 3. Forward Deployed Engineer 成为重要方向\n\nFDE 需要深入客户场景，完成集成、定制、排障和反馈闭环，连接产品、工程和客户。它要求技术实现能力、业务理解和沟通影响力同时较强。\n\n## 2026 年岗位分类\n\n### 仍在持续招聘的岗位\n\nAI 应用工程师、ML Engineer、平台工程师、数据工程师、解决方案工程师、AI 产品经理和工程管理岗位仍然存在，但要求越来越偏向生产化。\n\n### 2025 年后增长的新岗位\n\n包括 AI Evaluation Engineer、Agentic Systems Engineer、AI Reliability Engineer、AI Security/LLM Red Team Specialist、MCP Engineer 和 FDE。\n\n### 正在合并的岗位\n\n单独的 Prompt Engineer、只负责 Demo 的 AI 原型岗位和没有评测/部署责任的模型集成岗位，往往被合并到更完整的应用工程或产品团队中。\n\n## 不同职级的技能\n\n### L4-L5\n\n能够独立完成 API 集成、RAG 基础链路、Prompt、评测和服务部署；理解日志、测试、缓存、限流和成本。\n\n### L6-L7\n\n能够设计跨服务的 Agent/RAG 平台，处理评测、可观测性、多租户、可靠性、安全和团队协作，并能说明业务结果。\n\n### L8+ / Principal\n\n负责技术方向、组织级平台、供应商策略、风险治理、跨团队影响力和长期架构，能把技术投入与公司目标联系起来。\n\n### 管理路线\n\n需要建立团队能力、评测文化、交付机制、人才梯队和风险治理，而不是只做技术选型。\n\n### PM/TPM 路线\n\n要理解模型能力边界、质量指标、用户体验、合规、成本和交付依赖，能够把 AI 不确定性转化成产品决策。\n\n## 招聘信息通常要求什么\n\n### 必备能力\n\nPython 或 Java 后端、模型 API、RAG、Agent、Tool Calling、评测、可观测性、云部署、数据处理和安全。很多岗位还要求能通过真实项目证明质量和成本改进。\n\n### 加分能力\n\nMCP、多 Agent、模型微调、推理优化、向量数据库、LLM-as-Judge、Langfuse/LangSmith、Kubernetes、FinOps 和领域经验。\n\n### 技术栈趋势\n\n招聘要求经常组合 Python、TypeScript/Java、LangChain/LangGraph、主流模型 API、vLLM、向量数据库、云平台、评测和监控工具。具体框架会变化，因此应掌握原理和迁移能力。\n\n### 非技术要求\n\n写作、沟通、客户协作、需求澄清、影响力、问题分解和在不确定性中做决策，往往决定高级候选人的差异。\n\n## 薪酬与地域\n\n薪酬受地区、公司层级、岗位稀缺性、股票和实际影响力影响。不要只根据职位名称判断级别，应询问职责范围、评估标准、薪酬结构和晋升路径。金融、企业软件、医疗、安全和基础设施仍然有较强的 AI 应用需求。\n\n## 面试流程\n\n常见流程包括招聘方沟通、编码/后端基础、AI 知识、系统设计、项目深挖、行为面试和团队匹配。AI 岗位还可能要求现场 RAG/Agent 设计、评测方案、模型选择、故障排查或白板演练。\n\n前沿实验室通常更关注推理、研究理解、代码能力和复杂系统设计；应用型公司更关注交付、成本、业务指标、可靠性和跨团队协作。\n\n## 重点关注的新岗位\n\n- **FDE：** 面向客户交付复杂 AI 系统\n- **AI Evaluation Engineer：** 建设数据集、指标、评测流水线和质量门禁\n- **Agentic Systems Engineer：** 负责 Agent 编排、工具、状态和可靠性\n- **AI Reliability Engineer：** 处理延迟、成本、可用性、漂移和事故\n- **AI Security Engineer：** 防御 Prompt Injection、数据泄露、模型和供应链风险\n- **MCP Engineer：** 建设工具协议、Server、Client、权限和生态治理\n\n## 战略建议\n\n把后端工程能力迁移到 AI 应用生产化：从模型调用扩展到数据、RAG、Agent、评测、可观测性、成本、权限和安全。准备面试时用真实项目证明你如何发现问题、做权衡、验证效果和推动上线。\n\n## 参考资料说明\n\n招聘报告、薪酬数据、实验室招聘页、面试经验和法规信息都应标注发布日期并定期复核。动态内容不能当作永久事实。\n", "summary_content": "# 《2026 年 AI 就业市场趋势》中文概要\n\n## 核心结论\n\nAI 岗位正在从“会调用模型”转向“能把 AI 做成可交付、可评测、可运营的系统”。Prompt、Agent、评测、可靠性、安全和客户交付能力正在融合。\n\n## 对你的定位\n\n你的 Java 后端、Python Agent、RAG、MCP、RAGAS、Langfuse 和金融业务经验，适合包装成“AI 应用生产化工程师”能力，而不是模型训练研究路线。\n\n## 面试重点\n\n- 讲清楚真实项目和个人职责\n- 用指标说明质量、成本和稳定性\n- 准备 RAG、Agent、评测、MCP 和故障排查白板题\n- 关注 FDE、AI Eval、Agent、Reliability 和 MCP 等岗位方向\n"}, {"filename": "07-faq.md", "section_id": "00-interview-prep", "section_label": "00 · 面试准备", "label": "快速 FAQ", "title_zh": "AI 工程、RAG 与 Agent 快速问答", "summary": "用短答案覆盖 AI 工程、RAG、Agent、模型、评测、推理、记忆和安全等高频问题，适合复习前快速扫一遍。", "detail": "FAQ 适合作为复习索引，不适合替代深入学习。它把常见概念压缩成可快速回忆的答案，例如 RAG 与微调的区别、混合检索、GraphRAG、上下文工程、MCP、Agentic RAG、LLM-as-judge、RAGAS、vLLM、提示词注入和 Agent 沙箱。遇到与你项目相关的问题，建议从 FAQ 先恢复答案骨架，再回到题库或白板练习补充架构、指标和故障处理细节。", "content": "# Frequently Asked Questions: AI Engineering, RAG, and Agents\n\nShort, direct answers to the questions people ask most about modern AI system design. Each answer points to the chapter where the topic is covered in depth.\n\n## Table of Contents\n\n- [General: AI Engineering Role](#general)\n- [RAG and Retrieval](#rag)\n- [Agents and Tool Use](#agents)\n- [Models and Selection](#models)\n- [Evaluation and Observability](#evaluation)\n- [Inference and Cost](#inference)\n- [Memory and State](#memory)\n- [Security and Safety](#security)\n\n---\n\n## General\n\n### What is an AI engineer?\n\nAn AI engineer builds production systems on top of large language models. The role sits between traditional software engineering and machine learning research: less model training, more system design around models that already exist. Day-to-day work covers prompt and context engineering, retrieval pipelines, agent loops, evaluation harnesses, and the infrastructure that keeps it all online. See [AI Job Market Trends](06-job-market-trends-2026.md).\n\n### What is the difference between an AI engineer and an ML engineer?\n\nML engineers train, fine-tune, and ship models. AI engineers compose existing models (usually via APIs) into products. ML engineers spend their time on datasets and training loops. AI engineers spend their time on prompts, RAG, agents, evals, and latency. The boundary blurs at large companies that do both. See [Transition Guide](../TRANSITION_GUIDE.md).\n\n### How do I become an AI engineer?\n\nIf you already write production code, the gap is small: learn how LLMs behave, learn RAG and agent patterns, learn evaluation, and learn one inference stack. The [Transition Guide](../TRANSITION_GUIDE.md) maps your current role (backend, frontend, QA, PM, data, DevOps) to the AI roles that fit and the specific skills to close.\n\n### What programming language should I learn for AI engineering?\n\nPython is the default for AI work. TypeScript is the most common second language because frontend and edge agent stacks live there. C# and Go show up in enterprise infrastructure roles. Most production AI code reads as ordinary application code: HTTP clients, queue consumers, database calls, plus calls to a model provider.\n\n### Is AI engineering a good career?\n\nDemand is strong and pay tracks senior software engineering, often higher at frontier labs. The risk is that the stack changes fast: a framework that mattered last year may be deprecated today. The skills that compound across releases are evaluation, system design, and grounded debugging. See [Job Market Trends](06-job-market-trends-2026.md).\n\n---\n\n## RAG\n\n### What is RAG?\n\nRetrieval-Augmented Generation is the pattern of fetching external context (documents, rows, code, images) at query time and putting it in the LLM's prompt so the model can ground its answer instead of hallucinating from training data. It is the most common production pattern for any LLM that needs to know things outside its training cutoff. See [RAG Fundamentals](../06-retrieval-systems/01-rag-fundamentals.md).\n\n### How does RAG work?\n\nA user query is converted into a search request, the system retrieves the most relevant chunks from a knowledge store (vector DB, keyword index, graph, or a mix), reranks them, and passes the top results to the LLM as context for generation. The two failure points are retrieval (the right chunk was not returned) and generation (the model ignored or misused the chunk). Most RAG failures are retrieval failures.\n\n### Is RAG dead because of long context windows?\n\nNo. Even with 1M-2M token context windows on Claude Opus 4.7, Claude Sonnet 4.6, GPT-5.5, and Gemini 3.1 Pro, RAG wins on cost, latency, freshness, and corpus scale. Enterprise datasets (SharePoint, log archives, code monorepos) exceed any context window. RAG acts as the filter that finds the 0.01% of data worth putting into that high-value window. See [RAG vs Long Context](../06-retrieval-systems/14-production-rag-at-scale.md).\n\n### What is the difference between RAG and fine-tuning?\n\nRAG injects knowledge at query time through context. Fine-tuning bakes behavior into the weights. The rule of thumb: **RAG for facts, fine-tuning for form**. Use RAG when the knowledge changes, when you need citations, or when data must stay outside the model. Use fine-tuning when you want a consistent tone, a strict output format, or lower latency on repeated tasks. See [Fine-Tuning Strategies](../03-training-and-adaptation/02-fine-tuning-strategies.md).\n\n### What is the best vector database?\n\nThere is no single best. Pinecone wins on managed scale and SLAs. Qdrant leads open-source speed (roughly 12ms p99 at 10M vectors). Weaviate has the strongest native hybrid (BM25 + dense + metadata in one query). Milvus is the choice once you need distributed scale beyond 50M vectors. pgvector is the right answer if you are already on Postgres and your index is under 10M vectors. See [Vector Databases](../06-retrieval-systems/04-vector-databases.md).\n\n### What is contextual retrieval?\n\nContextual retrieval is an Anthropic technique that prepends a short LLM-generated context summary to each chunk before embedding and indexing it, so the chunk carries its place in the document with it. Anthropic reports a 49% reduction in retrieval failures with hybrid search, and 67% when combined with a reranker. See [Contextual Retrieval](../06-retrieval-systems/10-contextual-retrieval.md).\n\n### What is hybrid search?\n\nHybrid search combines sparse keyword retrieval (typically BM25) with dense vector retrieval and fuses the two ranked lists into one, usually with Reciprocal Rank Fusion. The sparse arm catches exact tokens (product codes, function names, rare nouns); the dense arm catches synonyms and intent. Every modern vector DB ships hybrid out of the box. See [Hybrid Search](../06-retrieval-systems/05-hybrid-search.md).\n\n### What is GraphRAG?\n\nGraphRAG extracts entities and relationships from a corpus, builds a knowledge graph, and queries by traversal instead of (or alongside) vector similarity. It is the right pattern for **aggregative questions** (\"summarize all legal risks across these 50 contracts\") where vector RAG returns related-but-disconnected chunks. Microsoft's LazyGraphRAG defers expensive community summarization to query time, cutting ingestion cost. See [GraphRAG](../06-retrieval-systems/07-graph-rag.md).\n\n### What is the best chunk size for RAG?\n\nThere is no universal answer. 300-500 token chunks with 50-token overlap is a reasonable default for prose. Code and structured data want larger chunks (1000-2000 tokens). The bigger wins come from **structure-aware chunking** (split at headers, paragraphs, code blocks), **contextual chunking** (prepend a summary), and **hierarchical chunking** (index small chunks, return the parent context). See [Chunking Strategies](../06-retrieval-systems/02-chunking-strategies.md).\n\n---\n\n## Agents\n\n### What is an AI agent?\n\nAn AI agent is a system where an LLM decides what to do next, runs a tool, observes the result, and decides again, all in a loop. The simplest agent is the ReAct pattern: Thought → Action → Observation → repeat. Modern agents (Claude Opus 4.7, GPT-5.5 reasoning, DeepSeek-R2) bake the reasoning step into the model itself. See [Agent Fundamentals](../07-agentic-systems/01-agent-fundamentals.md).\n\n### What is the difference between an agent and a chatbot?\n\nA chatbot responds to a message. An agent **takes actions** in the world: runs code, calls APIs, reads files, sends messages, books appointments. That distinction matters because actions are hard to roll back, so agents need very different guardrails, sandboxing, and human-in-the-loop patterns. See [Agentic Security](../07-agentic-systems/09-agentic-security-and-sandboxing.md).\n\n### What is MCP (Model Context Protocol)?\n\nMCP is an open protocol that lets LLM applications connect to tools and data sources through a standard interface. Anthropic launched it in November 2024. Governance moved to the Linux Foundation's Agentic AI Foundation in December 2025. Adoption is universal: Anthropic, OpenAI, Google, Microsoft, AWS all support it. As of May 2026 there are over 2,300 public MCP servers. See [Tool Use and MCP](../07-agentic-systems/03-tool-use-and-mcp.md).\n\n### What is the best agent framework?\n\nThe big three cover most production needs. **LangGraph** (graph-based, surpassed CrewAI in stars in early 2026) is the default for stateful multi-agent control flow with checkpointing. **CrewAI** (now v1.13, used in 60%+ of the Fortune 500) is the choice for role-based business automation. **Microsoft Agent Framework** (RC 1.0 February 2026, GA Q2 2026) is the consolidated successor to AutoGen and Semantic Kernel for enterprise .NET and Python. See [Framework Selection Guide](../09-frameworks-and-tools/08-framework-selection-guide.md).\n\n### What is agentic RAG?\n\nAgentic RAG replaces the linear retrieve-then-generate pipeline with a loop where the agent decides what to retrieve, evaluates whether the results are good enough, and re-queries if not. Patterns include Self-RAG (model emits reflection tokens), Corrective RAG (separate grader), Adaptive RAG (classifier picks the depth), and multi-hop decomposition. Budget for 8-12 seconds per query at three to four iterations. See [Agentic RAG](../06-retrieval-systems/08-agentic-rag.md).\n\n### How do computer-use agents work?\n\nA computer-use agent takes screenshots of a desktop or browser, decides on a mouse and keyboard action, executes it, and takes another screenshot. The three production options are Claude Computer Use (OS-portable via screenshots), Google Gemini Computer Use (browser-optimized via DOM awareness), and OpenAI Operator (web-task focused). Claude Sonnet 4.6 reaches 72.5% on OSWorld-Verified, up from 14.9% at the October 2024 launch. See [Computer-Use Agents](../17-tool-use-and-computer-agents/04-computer-use-agents.md).\n\n### What is context engineering?\n\nContext engineering is curating the full set of tokens an agent sees on every inference turn (system prompt, tools, retrieved data, prior tool results, message history), as opposed to prompt engineering, which writes one good instruction once. It matters because long-running agents suffer **context rot**: accuracy drops as the window fills with stale tool output. The core techniques are compaction (summarize and restart the loop), just-in-time loading (hold references, fetch on demand), structured note-taking (write progress outside the window), and sub-agent isolation (delegate detail-heavy sub-tasks to a clean window that returns a short summary). The goal is the smallest high-signal token set per turn. See [Context Engineering](../05-prompting-and-context/05-context-engineering.md).\n\n### What are Agent Skills?\n\nAgent Skills are folders of instructions, scripts, and resources that an agent loads on demand to specialize at a task. Each skill is a `SKILL.md` file with YAML metadata plus optional bundled files. They use **progressive disclosure**: the name and description sit in the system prompt, the full `SKILL.md` loads only when the agent judges it relevant, and referenced files load only as needed, which keeps context small. Skills complement MCP: MCP connects an agent to tools and data, Skills teach it the workflow for using them. See [Building Tool-Use Agents](../17-tool-use-and-computer-agents/05-building-tool-agents.md).\n\n---\n\n## Models\n\n### What is the best LLM right now?\n\nThere is no single best model as of August 2026, and the leaderboard is fractured by task. **Claude Fable 5** holds the capability ceiling at $10/$50 per 1M. **Claude Opus 5** (July 24) is the long-horizon agentic coding choice at $5/$25, with a Fast mode at $10/$50. **GPT-5.6** ships as three tiers, with Sol at $5/$30, Terra at $2/$12 as the general production default, and Luna at $0.20/$1.20 for volume work. **Gemini 3.7 Flash** (August 13) is the cheap multimodal workhorse at a half-price $0.75/$3.75 through year-end. **Claude Sonnet 5** is the price-to-quality workhorse at a permanent $2/$10, cheaper than the Sonnet 4.6 it replaced. See [Model Taxonomy](../02-model-landscape/01-model-taxonomy.md).\n\n### How much does Claude / GPT / Gemini / DeepSeek cost?\n\nPricing changes monthly. As of June 2026, frontier-tier closed models run roughly $3-15 per million input tokens and $15-75 per million output tokens, with caching cutting that 75-90% on repeated prefixes. Mid-tier models (Claude Sonnet 4.6, GPT-5.5-mini, Gemini 3.1 Flash) run roughly $0.30-3 / $1-15 per million. **DeepSeek reset the floor**: V4 Pro is $0.435 / $0.87 per 1M (75% discount made permanent May 22, 2026), and V4 Flash is $0.14 / $0.28 per 1M with a 1M context window, roughly 10x cheaper than the closed frontier for many tasks. Always cross-check the provider pricing pages for current rates. See [Pricing and Costs](../02-model-landscape/03-pricing-and-costs.md).\n\n### What is the difference between Claude Opus and Claude Sonnet?\n\nOpus is Anthropic's frontier tier (Opus 4.8: smartest of the 4.x line, $5/$25). Sonnet is the production workhorse: roughly 90% of Opus quality at 60% of the price. Haiku is the fast tier: cheap, low-latency, good for routing and classification. Above all three sits Claude Fable 5 ($10/$50), the capability ceiling for work that justifies 2x Opus pricing. The right pattern is to route easy queries to Haiku, mid queries to Sonnet, hard ones to Opus, and only ceiling-bound work to Fable. See [Model Selection](../02-model-landscape/04-model-selection-guide.md).\n\n### Should I use an open-source model?\n\nYes for cost-per-query at high volume, data residency, or fine-tuning needs. Open-weight quality has closed to within 5-15 points of the closed frontier (Qwen3-Embedding-8B leads MTEB Multilingual, Llama 4 Maverick and DeepSeek V4 Pro are competitive frontier picks). The tradeoff is operational: you own the inference stack, the GPU bill, and the security patches. See [Model Landscape](../02-model-landscape/01-model-taxonomy.md).\n\n### What is prompt caching?\n\nPrompt caching keeps the KV cache for a fixed prompt prefix warm on the inference server so subsequent calls only pay for the new tokens. All major providers support it. Cache reads are 75-90% cheaper than fresh tokens. The catch: cache writes typically cost 25% more, so caching only pays off if you reuse the same prefix at least 3-5 times within the TTL (usually 5 minutes). See [KV Cache and Context Caching](../04-inference-optimization/02-kv-cache-and-context-caching.md).\n\n---\n\n## Evaluation\n\n### How do you evaluate an LLM?\n\nLLM evaluation is layered: **reference-free metrics** (faithfulness, relevance, coherence via LLM-as-judge) for rapid iteration, **golden test sets** for regression, and **task-specific metrics** (exact match for QA, BLEU for translation, pass@k for code). For RAG specifically, use the RAG Triad: context relevance, faithfulness, answer relevance. See [LLM Evaluation](../14-evaluation-and-observability/01-llm-evaluation.md).\n\n### What is LLM-as-judge?\n\nLLM-as-judge uses one LLM to score the output of another against a rubric (correctness, helpfulness, safety). It scales where human evaluation cannot, but has known biases: position bias, verbosity bias, self-preference bias. The standard practice is to use a stronger model as judge (Claude Opus 4.8 or GPT-5.5 reasoning), randomize positions, and validate against a small human-labeled sample.\n\n### What is the best LLM observability tool?\n\nThe leading platforms are **Langfuse** (best self-hosted open-source, acquired by ClickHouse in January 2026), **Braintrust** (best for eval-driven CI/CD with quality gates), **LangWatch** (best for agent simulation), **LangSmith** (LangChain-native), and **Arize Phoenix** (OTel-native). Pick based on deployment model (SaaS vs self-hosted), whether you need CI/CD gating, and how heavily you use a specific framework. See [Observability](../14-evaluation-and-observability/02-observability.md).\n\n### What is RAGAS?\n\nRAGAS (Retrieval Augmented Generation Assessment) is a Python library for RAG evaluation. It provides reference-free metrics (faithfulness, answer relevance, context relevance) and reference-based metrics (context recall, context precision) computed with LLM-as-judge. It is the de facto starting point for any RAG eval pipeline. See [RAG Evaluation](../06-retrieval-systems/13-rag-evaluation-patterns.md).\n\n### How do you detect and handle model drift in production?\n\nDrift comes from two sides: the **provider** silently updates a model (or you migrate versions), and your **traffic** shifts away from what your prompts and evals were tuned on. Detection: pin model versions explicitly, run a canary eval suite daily against the pinned and latest versions, track output-distribution stats (length, refusal rate, format validity) and judge-scored quality on a sampled live slice, and alert on deltas. Response: a frozen golden set tells you whether the model changed or your traffic did; re-run prompt evals before adopting a new version, and keep the previous version warm for instant rollback. Treat an unexplained quality drop like an incident with an on-call path, not a curiosity.\n\n---\n\n## Inference\n\n### What is vLLM?\n\nvLLM is an open-source LLM inference engine that pioneered PagedAttention (virtual-memory-style allocation of the KV cache). It is the default open inference engine when the workload is \"Llama, Mistral, Qwen, or DeepSeek under continuous batching.\" It is the easiest to operate and best-patched of the major engines. Multimodal deployments must run v0.18.2+ due to a February 2026 CVE. See [Serving Infrastructure](../04-inference-optimization/06-serving-infrastructure.md).\n\n### What is the difference between vLLM and SGLang?\n\nBoth are open-source inference engines. vLLM has broader model coverage and operational maturity. SGLang has roughly 29% higher throughput on structured-output and function-calling workloads thanks to async constrained decoding, and best-in-class prefix-cache reuse via RadixAttention. Important caveat: SGLang's multimodal path has unpatched CVEs as of May 2026, so multimodal traffic should run on vLLM v0.18.2+ instead.\n\n### What is TensorRT-LLM?\n\nNVIDIA's inference engine. Delivers 2-4x higher throughput than vLLM and TGI on H100/H200/B200, but at the cost of 1-2 weeks of setup and a hard NVIDIA lock-in. The right choice when you have committed NVIDIA capacity and the throughput delta pays for the operational tax.\n\n### How do you optimize LLM inference cost?\n\nFive high-leverage moves: **model cascading** (route easy queries to small models, hard ones to frontier), **prompt caching** (75-90% off repeated prefixes), **semantic caching** (skip the LLM call entirely for similar queries), **quantization** (FP8 or 4-bit weights to fit more on a GPU), and **continuous batching** (vLLM/SGLang batch at the iteration level). Together they routinely cut inference cost by 10x without losing quality. See [Cost Optimization](../04-inference-optimization/07-cost-optimization-playbook.md).\n\n### What is speculative decoding?\n\nSpeculative decoding lets an LLM generate multiple tokens per forward pass by having a cheaper \"draft\" model (or extra heads on the main model, like Medusa) predict the next few tokens, then verifying them all in a single parallel pass on the target model. The win is 2-3x faster wall-clock generation with zero quality loss. Built into vLLM and TensorRT-LLM. See [Speculative Decoding](../04-inference-optimization/03-speculative-decoding.md).\n\n### What is a token budget and how do you enforce it?\n\nA token budget is a hard ceiling on token consumption at a chosen scope: per request (max input plus `max_tokens` output), per user or tenant per day, per agent task (step budgets so a runaway loop cannot burn the month's spend), and per team per month for expensive tiers. Enforcement lives in the gateway, not in prompts: count tokens before dispatch, reject or downgrade requests over the per-request cap, decrement tenant quotas atomically, and terminate agent runs that exceed their step budget with a clean escalation. The practical pairing is budget plus routing: when a tenant nears quota, the router degrades them to a cheaper tier instead of cutting them off.\n\n### How do you design fallbacks across multiple LLM providers?\n\nTreat providers as unreliable dependencies with policy differences, not just uptime differences. The pattern: a primary with one or two fallbacks per task type, circuit breakers per provider on error rate, p95 latency, and rate-limit headroom, with pre-emptive traffic shifting before hard limits. Three details separate production designs from whiteboard ones: **provider-paired prompts** (a prompt tuned for Claude underperforms on GPT-5.5, so prompt variants version with the provider), **cache economics** (failing over resets your prefix cache, so a warm primary can beat a nominally cheaper cold fallback), and **policy-aware fallback** (a provider can decline a content category your product needs, which is a failure class your health checks will not catch). Verify the whole chain monthly with a game-day drill.\n\n---\n\n## Memory\n\n### What is the best AI agent memory framework?\n\nThe four mature options as of May 2026 are **Mem0** (broadest standalone memory layer, scores 92.5 on LoCoMo and 94.4 on LongMemEval), **Zep** (temporal-aware production pipelines with native conversation summarization), **Letta** (OS-style paging for long-running agents with unbounded memory), and **Cognee** (knowledge-graph-first for RAG-heavy workflows). Pick by use case: chatbot personalization → Mem0; production agent at scale → Zep; long-horizon task agent → Letta; KG-grounded RAG → Cognee. See [Agentic Memory](../08-memory-and-state/04-agentic-memory-mem0.md).\n\n### What is the difference between short-term and long-term memory in agents?\n\nShort-term memory lives in the LLM's context window (the current turn, tool outputs, scratchpad). Long-term memory persists across sessions in a vector DB, graph, or relational store. Memory architectures split further: **episodic** (past trajectories), **semantic** (extracted facts about the user/world), **procedural** (learned skills, playbooks). Picking the right tier for a given fact matters: a session preference promoted to long-term memory leaks across sessions. See [Memory Architectures](../08-memory-and-state/01-memory-architectures.md).\n\n### How does a knowledge graph help an AI agent?\n\nA knowledge graph stores entities and relationships explicitly (User → OWNER_OF → Project_A). It gives the agent **deterministic** retrieval over structured relationships, which vector search cannot. The strongest pattern is hybrid: vector search finds the entry node by similarity, graph traversal expands relevant context. Used for compliance, multi-hop reasoning, and any domain where relationships are first-class (legal, biomedical, finance). See [Long-Term Memory](../08-memory-and-state/03-long-term-memory.md).\n\n---\n\n## Security\n\n### What is prompt injection?\n\nPrompt injection is the LLM-era version of SQL injection: malicious content in a user input or a retrieved document overrides the system instructions and makes the model do something it should not. **Direct injection** is in the user prompt. **Indirect injection** is hidden in a document the model reads (a webpage, an email, a PDF). The OWASP LLM Top 10 lists it as the #1 LLM risk. See [Prompt Injection Defense](../05-prompting-and-context/08-prompt-injection-defense.md).\n\n### How do you prevent prompt injection?\n\nThere is no silver bullet: prompt injection cannot be fully \"escaped\" the way SQL can. The production defense stack combines: **input isolation** (XML tags marking untrusted content), **dual-LLM patterns** (small guard model classifies intent before the main model sees the input), **canary tokens** (detect if the model leaked its system prompt), **least-privilege tool scopes**, and **human-in-the-loop** on destructive tool calls. See [Agentic Security](../07-agentic-systems/09-agentic-security-and-sandboxing.md).\n\n### What is OWASP LLM Top 10?\n\nThe OWASP Top 10 for LLM Applications (v2.0, released 2025) is the canonical list of LLM security risks. Top entries: prompt injection, insecure output handling, training data poisoning, model denial of service, supply chain vulnerabilities, sensitive information disclosure, insecure plugin design, excessive agency, overreliance, and model theft. The 2026 update for agentic apps adds goal hijacking, identity abuse, and cascading failures as top risks. See [LLM Security](../12-security-and-access/01-llm-security.md).\n\n### What is sandboxing in AI agents?\n\nSandboxing isolates the code an agent generates and runs from the host system. The standard pattern uses ephemeral micro-VMs (E2B, Docker, Firecracker) that spin up in under 10ms, run the code, and get destroyed. Without sandboxing, a prompt-injected agent can `rm -rf /` or exfiltrate secrets. With sandboxing, the worst case is a destroyed throwaway container.\n\n---\n\n## Related Reading\n\n- [Question Bank (128 senior interview questions)](01-question-bank.md)\n- [Answer Frameworks](02-answer-frameworks.md)\n- [Common Pitfalls](03-common-pitfalls.md)\n- [Whiteboard Exercises](04-whiteboard-exercises.md)\n- [AI Job Market Trends](06-job-market-trends-2026.md)\n\n---\n\n*Have a question that should be here? Open an issue or PR on the repo.*\n", "content_zh": "# AI 工程、RAG 与 Agent 常见问题\n\n## 通用问题\n\n### 什么是 AI Engineer？\n\nAI Engineer 负责把模型能力接入真实产品，包括数据处理、Prompt、RAG、Agent、工具、评测、部署、监控、安全和成本。重点是应用工程和生产化，不等同于训练基础模型。\n\n### AI Engineer 和 ML Engineer 有什么区别？\n\nML Engineer 更偏数据、训练、特征、模型部署和机器学习平台；AI Engineer 更偏 LLM 应用、检索、Agent、工具编排、评测和产品集成。两者边界会随团队变化。\n\n### 如何成为 AI Engineer？\n\n先打好后端、Python、数据和 API 基础，再学习 LLM、RAG、Agent、评测、可观测性、部署和安全。通过一个真实可运行的项目证明质量、成本和故障处理能力。\n\n### 应该学习哪种编程语言？\n\nPython 适合模型、数据和 Agent 生态；Java、Go 或 TypeScript 适合后端服务、平台和企业集成。优先使用团队生产栈，并理解跨语言服务边界。\n\n### AI 工程是好职业吗？\n\n机会较多，但岗位要求快速变化。长期竞争力来自解决业务问题、上线和运营 AI 系统的能力，而不是只会某个热门框架。\n\n## RAG\n\n### 什么是 RAG？\n\nRAG 在生成前从外部知识库检索相关内容，再把内容放入上下文，让模型基于较新的、可追溯的资料回答。\n\n### RAG 如何工作？\n\n离线侧解析、分块、生成 Embedding 并建立索引；在线侧接收查询、改写、混合检索、重排序、组装上下文、调用 LLM 并返回引用。\n\n### 长上下文出现后 RAG 过时了吗？\n\n没有。RAG 仍然提供选择性上下文、权限过滤、数据新鲜度、来源引用和成本控制。长上下文可以减少部分检索需求，但也带来成本、中间丢失和数据隔离问题。\n\n### RAG 和微调有什么区别？\n\nRAG 改变模型回答时可访问的知识，适合频繁更新和需要引用的内容；微调改变行为、风格、格式或任务模式，适合稳定且高质量的训练样本。两者可以组合。\n\n### 最好的向量数据库是什么？\n\n没有通用答案。比较数据规模、过滤、多租户、延迟、召回、备份、运维、成本和团队经验。用真实数据和查询做基准。\n\n### 什么是 Contextual Retrieval？\n\n在分块前或分块时为文本块补充文档、章节和主题上下文，使孤立文本块包含更多语义信息，再进行检索。\n\n### 什么是 Hybrid Search？\n\n同时使用稠密向量检索和 BM25 等稀疏检索，再用 RRF 或加权方式合并，兼顾同义表达和精确关键词。\n\n### 什么是 GraphRAG？\n\n从文档中抽取实体和关系构建知识图谱，查询时结合图遍历与文本检索。它适合关系推理和跨文档连接明显的场景，但构建和维护成本更高。\n\n### RAG 最佳分块大小是多少？\n\n没有固定答案。根据文档结构、查询粒度、模型上下文和评测结果选择，通常需要结合递归分块、重叠、父子块和语义分块实验。\n\n## Agent\n\n### 什么是 AI Agent？\n\nAgent 是以目标为导向，能根据观察结果选择步骤、调用工具并维护状态的模型驱动系统。它通常包含模型、工具、状态、编排、限制和评测。\n\n### Agent 和 Chatbot 有什么区别？\n\nChatbot 主要围绕对话生成回答；Agent 可以规划、调用工具、读取外部数据、执行动作和循环验证。Agent 也可能只是聊天系统中的一个局部组件。\n\n### 什么是 MCP？\n\nMCP 是连接 LLM 应用与工具、资源、Prompt 的协议标准。它降低集成成本，但 Server 权限、身份、供应链和工具审计仍需单独设计。\n\n### 最好的 Agent 框架是什么？\n\n取决于状态管理、图编排、工具生态、调试、持久化和团队技术栈。先理解 Workflow、状态机、ReAct 和可靠性，再选择框架；不要让框架隐藏关键控制流。\n\n### 什么是 Agentic RAG？\n\nAgent 根据任务动态决定查询改写、检索次数、工具和验证步骤。它比固定 RAG 灵活，但延迟、成本、循环和安全风险更高。\n\n### Computer-use Agent 如何工作？\n\n模型读取屏幕或页面状态，选择点击、输入、滚动等动作，再观察结果并继续。生产环境需要沙箱、网络策略、动作确认、审计和失败暂停。\n\n### 什么是 Context Engineering？\n\n它是系统化设计模型每次调用所见信息的过程，包括 Prompt、工具、检索结果、历史、记忆、状态、压缩、排序和权限，而不只是写提示词。\n\n### 什么是 Agent Skills？\n\nSkill 是可复用的任务能力描述、执行步骤、输入输出和安全边界。它不同于底层 MCP Tool，也不同于改变模型权重的 Fine-tuning。\n\n## 模型\n\n### 当前最好的 LLM 是哪个？\n\n没有脱离任务的最佳模型。根据质量、推理、上下文、工具调用、延迟、成本、隐私、可用性和评测结果选择，并保留路由与 Fallback。\n\n### Claude、GPT、Gemini、DeepSeek 的成本是多少？\n\n价格经常变化，应查看官方价格页。成本还包括输入/输出 token、缓存、重试、Embedding、重排序、GPU 和运维，不能只比较单价。\n\n### Claude Opus 和 Sonnet 有什么区别？\n\n通常是能力、速度和价格的不同定位，但具体能力会随版本变化。使用固定任务集比较，不要把型号名称当成永久结论。\n\n### 应该使用开源模型吗？\n\n在需要数据控制、成本优化、定制或离线部署时考虑开源模型；同时承担 GPU、运维、升级、质量和许可证责任。可用多模型架构降低风险。\n\n### 什么是 Prompt Caching？\n\n对重复的 Prompt 前缀或上下文复用计算，减少成本和延迟。要保持前缀稳定，并处理版本、权限、TTL 和失效。\n\n## 评测\n\n### 如何评估 LLM？\n\n定义任务级数据集和 rubric，结合规则指标、LLM-as-Judge、人工评测、用户反馈、任务完成率、延迟和成本。持续评测而不是只做一次 Demo 测试。\n\n### 什么是 LLM-as-Judge？\n\n使用一个 LLM 按明确标准评价另一个模型的输出。它适合扩大评测规模，但会有位置偏差、长度偏差、模型偏好和评分不稳定，需要人工校准。\n\n### 最好的 LLM 可观测工具是什么？\n\n选择能记录 Trace、Prompt、模型、工具、检索、token、成本、反馈和评测的工具。Langfuse、LangSmith 等只是工具，关键是指标设计和数据治理。\n\n### 什么是 RAGAS？\n\nRAGAS 是评估 RAG 检索与生成质量的一组指标和方法，包括 Faithfulness、Answer Relevance、Context Precision 和 Context Recall。\n\n### 如何检测生产中的模型漂移？\n\n监控输入分布、检索结果、输出质量、拒答、幻觉、用户反馈、延迟和成本，并与固定基线和评测集比较。发现漂移后做切片分析、回滚或重新评测。\n\n## 推理\n\n### 什么是 vLLM？\n\nvLLM 是用于高吞吐 LLM 推理服务的开源框架，常见能力包括 Paged Attention、Continuous Batching、OpenAI 兼容 API 和多模型部署。\n\n### vLLM 和 SGLang 有什么区别？\n\n两者都面向高效推理，但对模型执行、结构化生成、缓存和编排的优化重点不同。用目标模型、硬件和真实请求基准测试选择。\n\n### 什么是 TensorRT-LLM？\n\n它是 NVIDIA 生态中的推理优化方案，适合在 NVIDIA 硬件上做深度编译、量化和性能优化，代价是平台绑定和部署复杂度。\n\n### 如何优化 LLM 推理成本？\n\n减少无效 token 和重复调用，使用缓存、模型路由、批处理、量化、蒸馏、上下文压缩和合理输出限制，并用单位成功任务成本评估。\n\n### 什么是 Speculative Decoding？\n\n用小模型生成候选 token，再由大模型批量验证，以提高解码速度。是否有效取决于接受率、模型匹配和验证开销。\n\n### 什么是 Token Budget，如何强制执行？\n\nToken Budget 是一次请求允许使用的输入/输出或推理 token 上限。调用前估算，设置 max tokens，超限前摘要、截断、路由或拒答，并记录实际消耗。\n\n### 如何设计多模型供应商 Fallback？\n\n统一模型网关，记录能力差异，设置超时、熔断、健康检查、重试和备用模型。切换后仍要做质量、格式、成本和数据处理验证。\n\n## 记忆\n\n### 最好的 Agent Memory 框架是什么？\n\n取决于短期状态、长期事实、语义检索、用户画像、权限、过期和删除需求。先定义记忆生命周期，再选择数据库或框架。\n\n### 短期记忆和长期记忆有什么区别？\n\n短期记忆服务当前任务和对话上下文；长期记忆跨会话保存用户或业务事实。长期记忆需要来源、置信度、权限、更新、过期和删除策略。\n\n### 知识图谱如何帮助 Agent？\n\n图谱显式表示实体、关系和约束，帮助 Agent 做多跳查询、关系验证和一致性检查。构建成本和数据更新成本是主要权衡。\n\n## 安全\n\n### 什么是 Prompt Injection？\n\n攻击者通过用户输入、网页、文档或工具结果注入伪指令，诱导模型忽略原有规则、泄露数据或执行危险动作。\n\n### 如何防止 Prompt Injection？\n\n不可信内容与系统指令隔离，工具最小权限，参数和输出校验，沙箱和网络限制，高风险操作人工确认，并通过对抗测试持续验证。\n\n### 什么是 OWASP LLM Top 10？\n\n它总结 LLM 应用常见风险，例如 Prompt Injection、敏感信息泄露、供应链、数据/模型投毒、错误输出、过度代理权限和拒绝服务。它是风险清单，不是完整安全方案。\n\n### 什么是 Agent Sandboxing？\n\n在隔离环境中限制 Agent 的文件、网络、进程、凭据和资源权限，防止模型或工具影响主机和生产系统。沙箱要配合审计、超时、配额和人工确认。\n\n## 相关阅读\n\n完成 FAQ 快速复习后，回到题库和白板练习，用完整架构和真实项目经历回答追问。\n", "summary_content": "# 《AI 工程、RAG 与 Agent FAQ》中文概要\n\n## 用途\n\nFAQ 适合快速复习和恢复答案骨架，不替代题库、白板练习和生产实践。\n\n## 覆盖范围\n\nAI Engineer 定位、RAG、混合检索、GraphRAG、Agent、MCP、Context Engineering、模型选择、评测、RAGAS、推理优化、记忆和安全。\n\n## 复习方法\n\n先尝试用 30 秒回答问题，再回到题库补充架构、指标、失败模式和权衡。与你的经历关联时，优先联系金融数据 RAG、Tool Calling、上下文压缩、RAGAS、Langfuse 和 MCP。\n"}, {"filename": "01-foundations/01-llm-internals.md", "section_id": "01-foundations", "section_label": "01 · 基础知识", "label": "01 llm internals", "title_zh": "LLM 内部机制", "summary": "理解 LLM 内部组件如何影响质量、显存、延迟和吞吐。重点掌握 Transformer、注意力、GQA、RoPE、Pre-LN、MoE 和 KV Cache 的系统设计含义。", "detail": "", "content": "# LLM Internals\n\nThe architectural core of modern LLMs: transformers, MoE, attention math, RoPE, GQA, KV cache, and the inference-optimal scaling shift driving 2026 model design.\n\nThis chapter covers the core concepts behind large language models. Understanding these internals is essential for making informed architectural decisions about AI systems. For practical implications of these architectural choices, see [Inference Optimization](../04-inference-optimization/) (KV cache, PagedAttention), [Model Taxonomy](../02-model-landscape/01-model-taxonomy.md) (MoE models in production), and [Glossary](../GLOSSARY.md) for definitions of MoE, RoPE, ALiBi, GQA, MLA.\n\n## Table of Contents\n\n- [The Transformer Revolution](#the-transformer-revolution)\n- [Architecture Variants](#architecture-variants)\n- [Mixture of Experts (MoE)](#mixture-of-experts-moe)\n- [Scaling Laws: Training vs. Inference Optimal](#scaling-laws-training-vs-inference-optimal)\n- [Native Multimodality](#native-multimodality)\n- [Self-Attention Mechanism](#self-attention-mechanism)\n- [Multi-Head Attention](#multi-head-attention)\n- [Position Encodings](#position-encodings)\n- [Feed-Forward Networks](#feed-forward-networks)\n- [Layer Normalization](#layer-normalization)\n- [Putting It All Together](#putting-it-all-together)\n- [Key Numbers to Know](#key-numbers-to-know)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## The Transformer Revolution\n\nBefore 2017, sequence modeling relied on recurrent architectures (RNNs, LSTMs) that processed tokens sequentially. This created two problems:\n\n1. **Training was slow**: Sequential processing prevented parallelization\n2. **Long-range dependencies were hard**: Information had to flow through many hidden states\n\nThe Transformer architecture, introduced in \"Attention Is All You Need\" (Vaswani et al., 2017), solved both problems by replacing recurrence with self-attention.\n\n**Mental model for distributed systems engineers:**\nThink of recurrence like a single-threaded request pipeline where each step depends on the previous. Self-attention is like a fully connected graph where every node can query every other node in parallel.\n\n```mermaid\nflowchart LR\n    subgraph RNN [RNN sequential]\n        A1[t1] --> A2[t2]\n        A2 --> A3[t3]\n        A3 --> A4[t4]\n    end\n    subgraph TX [Transformer parallel]\n        B1[t1]\n        B2[t2]\n        B3[t3]\n        B4[t4]\n        B1 <--> B2\n        B1 <--> B3\n        B1 <--> B4\n        B2 <--> B3\n        B2 <--> B4\n        B3 <--> B4\n    end\n```\n\n---\n\n## Architecture Variants\n\nThree main variants emerged based on which parts of the original Transformer are used:\n\n| Architecture | Attention Type | Examples | Best For |\n|--------------|---------------|----------|----------|\n| Encoder-only | Bidirectional | BERT, RoBERTa | Classification, NER, embeddings |\n| Decoder-only | Causal (left-to-right) | GPT-4, Claude, Llama | Text generation, chat |\n| Encoder-Decoder | Cross-attention | T5, BART | Translation, summarization |\n\n### Decoder-Only (Most LLMs Today)\n\n```\n┌─────────────────────────────────────────────────────┐\n│                 Decoder Block (×N)                  │\n│  ┌───────────────────────────────────────────────┐  │\n│  │           Masked Self-Attention               │  │\n│  │   (Each token attends only to previous)       │  │\n│  └───────────────────────────────────────────────┘  │\n│                         │                           │\n│                    Add & Norm                       │\n│                         │                           │\n│  ┌───────────────────────────────────────────────┐  │\n│  │              Feed-Forward Network             │  │\n│  └───────────────────────────────────────────────┘  │\n│                         │                           │\n│                    Add & Norm                       │\n└─────────────────────────────────────────────────────┘\n                          │\n                          ▼\n                   Output Probabilities\n```\n\n**Why decoder-only dominates:**\n- Simplest architecture\n- Pre-training objective (next token prediction) aligns with generation\n- Scales well with compute\n\n### Encoder-Only (BERT-style)\n\nUses bidirectional attention. Each token sees all other tokens. Cannot generate text autoregressively but excels at understanding tasks.\n\n**Practical relevance:**\n- Fine-tuned for classification (intent detection, sentiment)\n- Backbone for embedding models\n- Smaller, faster for specific tasks\n\n### Encoder-Decoder (The Return of the Encoder)\n\nWhile decoder-only dominated for years, there has been a partial return to encoder-decoder architectures for specialized **reasoning** and **verification** tasks (e.g., internal verifiers inside the o-series and Claude reasoning models).\n\n---\n\n## Mixture of Experts (MoE)\n\n**The most significant architectural shift in frontier models (GPT-5.5, Claude Opus 4.7, Gemini 3.1 Pro, DeepSeek V4, Llama 4 Maverick, Mixtral).**\n\nMoE replaces the dense Feed-Forward Network (FFN) with multiple \"experts\" and a \"router\" that selects which experts process a given token.\n\n```\n┌─────────────────────────────────────────────────────┐\n│                 MoE Layer (Decoder)                 │\n│  ┌───────────────────────────────────────────────┐  │\n│  │               Attention Layer                 │  │\n│  └───────────────────────────────────────────────┘  │\n│                         │                           │\n│                 ┌───────▼───────┐                   │\n│                 │     Router    │                   │\n│                 └─┬───┬───┬───┬─┘                   │\n│          ┌────────┘   │   │   └────────┐            │\n│          ▼            ▼   ▼            ▼            │\n│   ┌──────────┐ ┌──────────┐ ┌──────────┐ ┌──────────┐│\n│   │ Expert 1 │ │ Expert 2 │ │ Expert 3 │ │ Expert N ││\n│   └────┬─────┘ └────┬─────┘ └────┬─────┘ └────┬─────┘│\n│        └────────────┴───┬───┴────────────┘        │\n└─────────────────────────▼───────────────────────────┘\n```\n\n### Key MoE Nuances for System Design:\n1. **Total vs. Active Parameters**: A 1.6T parameter MoE model (like DeepSeek V4 Pro) might only use 49B parameters per token. Llama 4 Maverick is 17B active across 128 experts. Kimi K2.6 is 1T total / 32B active.\n    - **Memory constraint**: You must store all 1.2T parameters (high VRAM).\n    - **Compute constraint**: You only pay for 100B params of FLOPs (faster latency).\n2. **Routing Collapse**: If the router only picks one expert, the others don't learn. Modern models use **load balancing loss** and **auxiliary losses** to ensure all experts are utilized.\n3. **DeepSeek-V3 Refinements**: Introduced **Multi-head Latent Attention (MLA)** and **Auxiliary-loss-free load balancing**, which became the de-facto standard for MoE efficiency. DeepSeek V4 (April 2026) extends both techniques to a 1M-token context window.\n\nThe routing decision per token, as a flowchart:\n\n```mermaid\nflowchart TD\n    A[Token] --> B[Attention layer]\n    B --> C[Router]\n    C -->|Top-2 routing| D[Expert 1]\n    C -->|Top-2 routing| E[Expert 3]\n    C -.skipped.-> F[Expert 2]\n    C -.skipped.-> G[Expert N]\n    D --> H[Weighted sum]\n    E --> H\n    H --> I[Next layer]\n```\n\n---\n\n## Scaling Laws: Training vs. Inference Optimal\n\nThe original Chinchilla laws (2022) focused on being **Training-Optimal**: finding the best model size for a given training budget.\n\nThe industry has now shifted to **Inference-Optimal** scaling:\n- **Over-training**: Training smaller models (e.g., Llama 3 8B) on massive data (15T+ tokens) far beyond the Chinchilla point.\n- **Why?**: The cost of inference over millions of users dwarfs the one-time training cost. A 7B model trained for 10x longer is cheaper to serve than a 70B model trained at the Chinchilla point.\n\n---\n\n## Native Multimodality\n\nOlder models used **Vision Adapters** (connecting a frozen CLIP-style vision encoder to an LLM). Frontier models (GPT-5.2, Gemini 3) are **Native Multimodal**.\n\n- **Shared Vocabulary**: Visual tokens and text tokens exist in the same latent space.\n- **Uniform Transformer**: The same blocks process both pixels and text.\n- **Benefit**: Much better spatial reasoning and \"world model\" understanding compared to adapter-based approaches.\n\n---\n\n## Self-Attention Mechanism\n\nSelf-attention is the core innovation. It allows each token to \"attend to\" (gather information from) all other tokens in a sequence.\n\n### The Intuition\n\nConsider the sentence: \"The animal didn't cross the street because it was too tired.\"\n\nWhat does \"it\" refer to? Understanding requires connecting \"it\" to \"animal\". Self-attention learns these connections by computing relevance scores between all token pairs.\n\n### The Math\n\nFor input sequence X of n tokens with dimension d:\n\n```\nQ = XW_Q   (Query: What am I looking for?)\nK = XW_K   (Key: What do I contain?)\nV = XW_V   (Value: What do I contribute?)\n\nAttention(Q, K, V) = softmax(QK^T / √d_k) × V\n```\n\n**Step by step:**\n1. **QK^T**: Dot product measures similarity between queries and keys (n × n matrix)\n2. **/ √d_k**: Scale to prevent softmax saturation with large dimensions\n3. **softmax**: Convert to probabilities (each row sums to 1)\n4. **× V**: Weighted sum of values based on attention weights\n\n### Why Scale by √d_k?\n\n**Interview favorite**: This is frequently asked because it reveals understanding of numerical stability.\n\nWithout scaling, as dimension d grows, dot products grow proportionally. Large dot products push softmax into saturated regions where gradients vanish.\n\n```python\n# Without scaling (problematic for large d)\nd = 512\nq = np.random.randn(d)\nk = np.random.randn(d)\ndot = np.dot(q, k)  # Expected magnitude: ~√d ≈ 22.6\n\n# With scaling\nscaled_dot = dot / np.sqrt(d)  # Expected magnitude: ~1\n```\n\n### Attention Complexity\n\n| Operation | Time Complexity | Space Complexity |\n|-----------|-----------------|------------------|\n| QK^T computation | O(n²d) | O(n²) |\n| Softmax | O(n²) | O(n²) |\n| Weighted sum with V | O(n²d) | O(nd) |\n\nThe O(n²) complexity limits context length. A 100K context window means 10 billion attention computations per layer.\n\n---\n\n## Multi-Head Attention\n\nInstead of single attention, modern transformers use multiple \"heads\" that attend to different aspects in parallel.\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│                    Multi-Head Attention                      │\n│                                                              │\n│   ┌─────────┐  ┌─────────┐  ┌─────────┐       ┌─────────┐   │\n│   │ Head 1  │  │ Head 2  │  │ Head 3  │  ...  │ Head h  │   │\n│   │ d_k=64  │  │ d_k=64  │  │ d_k=64  │       │ d_k=64  │   │\n│   └────┬────┘  └────┬────┘  └────┬────┘       └────┬────┘   │\n│        │            │            │                  │        │\n│        └────────────┴────────────┴──────────────────┘        │\n│                              │                               │\n│                         Concatenate                          │\n│                              │                               │\n│                         W_O (project)                        │\n└─────────────────────────────────────────────────────────────┘\n```\n\n**Why multiple heads?**\n- Different heads learn different patterns (syntax, semantics, coreference)\n- Similar to ensemble methods: multiple perspectives improve robustness\n- Enables parallel processing across heads\n\n**Typical configuration:**\n- GPT-3 175B: 96 heads × 128 dimensions = 12,288 total dimension\n- Llama 2 70B: 64 heads × 128 dimensions = 8,192 total dimension\n\n### Grouped Query Attention (GQA)\n\n**Critical for production systems**: Standard multi-head attention requires storing separate K and V for each head in the KV cache. GQA shares K and V across groups of heads.\n\n| Attention Type | K,V per Query | KV Cache Reduction | Examples |\n|----------------|---------------|-------------------|----------|\n| Multi-Head (MHA) | 1:1 | Baseline | GPT-3 |\n| Grouped-Query (GQA) | 8:1 typical | ~8x | Llama 2, Mistral |\n| Multi-Query (MQA) | All:1 | ~n_heads × | PaLM, Falcon |\n\n**Practical impact:**\nFor Llama 2 70B at 8K context:\n- MHA KV cache: ~10 GB per request\n- GQA KV cache: ~1.3 GB per request\n\nThis directly affects batch size and therefore throughput.\n\n---\n\n## Position Encodings\n\nSelf-attention is permutation-invariant. Without position information, \"dog bites man\" and \"man bites dog\" would be identical. Position encodings inject sequence order.\n\n### Sinusoidal (Original Transformer)\n\nUses sine and cosine functions of different frequencies:\n\n```\nPE(pos, 2i) = sin(pos / 10000^(2i/d))\nPE(pos, 2i+1) = cos(pos / 10000^(2i/d))\n```\n\n**Properties:**\n- Deterministic, no learned parameters\n- Can theoretically extrapolate to longer sequences\n- In practice, extrapolation does not work well\n\n### Learned Absolute\n\nLearn a separate embedding for each position:\n\n```python\nposition_embeddings = nn.Embedding(max_length, d_model)\n```\n\n**Properties:**\n- Simple and effective\n- Cannot extrapolate beyond training length\n- Most early models (GPT-2, BERT)\n\n### Rotary Position Embedding (RoPE)\n\nEncode position by rotating the query and key vectors:\n\n```\nRoPE(x, pos) = x × cos(pos × θ) + rotate(x) × sin(pos × θ)\n```\n\n**Properties:**\n- Relative: Attention depends on (pos_q - pos_k)\n- Extrapolates better than absolute\n- Used in: Llama, Mistral, PaLM\n\n### ALiBi (Attention with Linear Biases)\n\nAdd position-dependent bias directly to attention scores:\n\n```\nAttention = softmax(QK^T / √d_k - m × distance)\n```\n\nWhere m is a head-specific slope and distance is |pos_q - pos_k|.\n\n**Properties:**\n- No modification to embeddings\n- Excellent extrapolation\n- Used in: BLOOM, MPT\n\n### Position Encoding Comparison\n\n| Method | Extrapolation | Compute Overhead | Modern Usage |\n|--------|---------------|------------------|--------------|\n| Sinusoidal | Poor | None | Rarely |\n| Learned | None | Minimal | Legacy |\n| RoPE | Good | ~5% | Most LLMs |\n| ALiBi | Excellent | ~2% | Some LLMs |\n\n---\n\n## Feed-Forward Networks\n\nEach transformer layer has a feed-forward network (FFN) that processes each position independently:\n\n```python\ndef feed_forward(x):\n    hidden = activation(x @ W1 + b1)  # Expand: d → 4d\n    output = hidden @ W2 + b2         # Contract: 4d → d\n    return output\n```\n\n**Key properties:**\n- Position-wise: Same weights applied to each position\n- Expansion ratio: Typically 4x (e.g., 4096 → 16384 → 4096)\n- Where parameters live: FFN has ~2/3 of layer parameters\n\n### Activation Functions\n\n| Activation | Formula | Properties | Usage |\n|------------|---------|------------|-------|\n| ReLU | max(0, x) | Simple, sparse | Original |\n| GELU | x × Φ(x) | Smooth, used in BERT | GPT-2, BERT |\n| SwiGLU | Swish(xW) × xV | State of the art | Llama, PaLM |\n\nSwiGLU adds a gating mechanism that improves performance at the cost of ~50% more parameters in the FFN.\n\n### GLU Variants\n\n```python\n# Standard FFN\nhidden = gelu(x @ W1)\noutput = hidden @ W2\n\n# SwiGLU FFN\ngate = silu(x @ W_gate)\nhidden = x @ W_up\noutput = (gate * hidden) @ W_down\n```\n\n---\n\n## Layer Normalization\n\nLayer normalization stabilizes training by normalizing activations:\n\n```python\ndef layer_norm(x, gamma, beta):\n    mean = x.mean(dim=-1, keepdim=True)\n    var = x.var(dim=-1, keepdim=True)\n    normalized = (x - mean) / sqrt(var + eps)\n    return gamma * normalized + beta\n```\n\n### Pre-LN vs Post-LN\n\n**Post-LN (Original Transformer):**\n```\nx = x + Attention(LayerNorm(x))  # Wrong - this is Pre-LN\nx = LayerNorm(x + Attention(x))  # Post-LN: normalize after residual\n```\n\n**Pre-LN (Modern LLMs):**\n```\nx = x + Attention(LayerNorm(x))  # Pre-LN: normalize before sublayer\n```\n\n| Variant | Training Stability | Final Performance | Usage |\n|---------|-------------------|-------------------|-------|\n| Post-LN | Harder | Slightly better | Original papers |\n| Pre-LN | Much easier | Good | Most modern LLMs |\n\nPre-LN is standard because it enables training deep models without careful learning rate tuning.\n\n### RMSNorm\n\nSimplification that skips mean centering:\n\n```python\ndef rms_norm(x, gamma):\n    rms = sqrt(mean(x^2) + eps)\n    return gamma * (x / rms)\n```\n\n~10-15% faster than LayerNorm with similar performance. Used in Llama, Mistral.\n\n---\n\n## Putting It All Together\n\nA complete transformer layer:\n\n```python\nclass TransformerLayer:\n    def __init__(self, d_model, n_heads, d_ff):\n        self.attn_norm = RMSNorm(d_model)\n        self.attn = MultiHeadAttention(d_model, n_heads)\n        self.ff_norm = RMSNorm(d_model)\n        self.ff = SwiGLU_FFN(d_model, d_ff)\n    \n    def forward(self, x, mask=None):\n        # Pre-norm attention with residual\n        h = x + self.attn(self.attn_norm(x), mask)\n        # Pre-norm FFN with residual\n        out = h + self.ff(self.ff_norm(h))\n        return out\n```\n\n**Full model:**\n```\nToken IDs → Embedding → [Transformer Layer × N] → Output Norm → LM Head → Logits\n```\n\n---\n\n## Key Numbers to Know\n\n### Model Sizes\n\n| Model | Parameters | Layers | Heads | Dimension | FFN Dim |\n|-------|------------|--------|-------|-----------|---------|\n| GPT-3 | 175B | 96 | 96 | 12,288 | 49,152 |\n| Llama 2 70B | 70B | 80 | 64 | 8,192 | 28,672 |\n| Llama 2 7B | 7B | 32 | 32 | 4,096 | 11,008 |\n| Mistral 7B | 7B | 32 | 32 | 4,096 | 14,336 |\n\n### Memory Requirements\n\n```\nModel weights (FP16) ≈ 2 bytes × parameters\n- 70B model: ~140 GB\n- 7B model: ~14 GB\n\nKV Cache per token (FP16):\n= 2 × layers × heads × head_dim × 2 bytes\n- Llama 70B: 2 × 80 × 64 × 128 × 2 = 2.6 MB per token\n- At 8K context: 21 GB per request\n```\n\n### Compute Requirements\n\n```\nFLOPs per token forward pass ≈ 2 × parameters\n- 70B model: ~140 TFLOPs per token\n- Generate 100 tokens: 14 PFLOPs\n\nH100 at 990 TFLOPS (FP16):\n- Single token: 140ms theoretical (actual: ~20-50ms with batching)\n```\n\n---\n\n## Key Takeaways\n\n- The shift from RNN to Transformer was about parallelization, not just quality; this is why GPU scaling laws followed.\n- MoE separates total parameters (memory cost) from active parameters (compute cost): a 1.2T MoE model can serve at the latency of a 100B dense model.\n- Inference-optimal scaling beats Chinchilla in production: over-train small models because inference cost dominates training cost over a model's lifetime.\n- GQA is the single highest-impact KV-cache optimization in current models; understand the N:G ratio before discussing serving cost.\n- Pre-LN with RMSNorm is the modern default; if you see Post-LN in an interview answer, the candidate is referencing 2018 papers.\n\n---\n\n## Interview Questions\n\n### Q: Explain why transformer attention is O(n²) and what alternatives exist.\n\n**Strong answer:**\nAttention computes pairwise similarities between all tokens. For sequence length n:\n- QK^T is [n, d] × [d, n] = n² multiplications per head\n- Storage for attention weights: n² floats\n\nAlternatives:\n- Sparse attention (Longformer): O(n) with local + global patterns\n- Linear attention (Performer): O(n) using random feature approximation\n- Flash Attention: Still O(n²) compute but O(n) memory via kernel fusion\n- State-space models (Mamba): O(n) fully linear\n\nThe tradeoff: n² is necessary for full long-range dependencies, but most tasks do not need all pairwise interactions.\n\n### Q: What is the KV cache and why does it matter for serving?\n\n**Strong answer:**\nDuring autoregressive generation, we generate one token at a time. Without caching, we would recompute K and V for all previous tokens on each step.\n\nThe KV cache stores K and V from previous positions. On each new token:\n1. Compute Q, K, V only for the new position\n2. Concatenate new K, V to cached K, V\n3. Compute attention with full K, V\n\nThis reduces per-token complexity from O(n) to O(1) for K and V computation.\n\n**The cost:** Memory scales linearly with sequence length. For Llama 70B at 8K context, KV cache is ~21 GB per request. This limits batch size and requires techniques like PagedAttention.\n\n### Q: Why do modern LLMs use Pre-LN instead of Post-LN?\n\n**Strong answer:**\nPre-LN places normalization before each sublayer rather than after. This creates a more direct path for gradients through residual connections.\n\nWith Post-LN, gradients must pass through the normalization, which can cause instability at the start of training. Post-LN requires learning rate warmup and careful initialization.\n\nPre-LN enables training very deep models (100+ layers) without special initialization. The tradeoff is slightly lower final performance, but in practice, the training stability is worth it.\n\n### Q: What is the difference between MHA, MQA, and GQA?\n\n**Strong answer:**\nAll three are multi-head attention variants that differ in how K and V heads are shared:\n\n- **MHA (Multi-Head Attention)**: Each query head has its own K and V heads. N:N ratio.\n- **MQA (Multi-Query Attention)**: All query heads share a single K and V head. N:1 ratio.\n- **GQA (Grouped-Query Attention)**: Groups of query heads share K and V heads. N:G ratio (typical G=8).\n\nMemory impact for KV cache:\n- MHA: Full size\n- MQA: 1/N size (but quality degrades)\n- GQA: 1/G size (best tradeoff)\n\nLlama 2 70B uses GQA with 8 KV heads for 64 query heads, reducing KV cache by 8x with minimal quality loss.\n\n---\n\n## References\n\n- Vaswani et al. \"Attention Is All You Need\" (2017)\n- Su et al. \"RoFormer: Enhanced Transformer with Rotary Position Embedding\" (2021)\n- Press et al. \"Train Short, Test Long: Attention with Linear Biases\" (ALiBi, 2022)\n- Shazeer \"GLU Variants Improve Transformer\" (2020)\n- Ainslie et al. \"GQA: Training Generalized Multi-Query Transformer Models\" (2023)\n- [Illustrated Transformer](https://jalammar.github.io/illustrated-transformer/)\n- [The Annotated Transformer](https://nlp.seas.harvard.edu/2018/04/03/attention.html)\n\n---\n\n*Next: [Tokenization Deep Dive](02-tokenization-deep-dive.md)*\n", "content_zh": "# LLM 内部机制\n\n## 学习重点\n\n本章从 Transformer、注意力、位置编码、FFN、LayerNorm、MoE 和多模态等组件解释 LLM 如何工作。系统设计面试不要求背出全部公式，但要能说明每个组件对质量、显存、延迟和扩展性的影响。\n\n## 核心内容\n\n- Decoder-only 适合自回归生成；Encoder-only 适合理解和表示；Encoder-Decoder 适合输入输出转换任务。\n- MoE 通过只激活部分专家降低每 token 计算量，但会增加路由、通信、负载均衡和显存管理复杂度。\n- Self-Attention 的计算和显存通常随序列长度呈二次增长，因此长上下文需要 Flash Attention、稀疏注意力、缓存和分块策略。\n- MHA、MQA 和 GQA 在质量、KV Cache 大小和带宽之间做不同权衡；GQA 是生产服务中常见的折中方案。\n- RoPE、ALiBi 和学习型位置编码影响长度外推、相对位置表达和模型兼容性。\n- Pre-LN 通常更容易稳定训练，RMSNorm 以更低开销提供归一化能力。\n\n## 面试回答角度\n\n解释架构时从输入 token、Embedding、位置编码、Transformer Block、Logits 到采样完整走一遍，再补充 KV Cache、参数规模、显存和吞吐。不要只说模型参数量，要说明推理时真正影响成本的是权重、激活、KV Cache、并发和序列长度。\n", "summary_content": "# 《LLM 内部机制》中文概要\n\n理解 LLM 内部组件如何影响质量、显存、延迟和吞吐。重点掌握 Transformer、注意力、GQA、RoPE、Pre-LN、MoE 和 KV Cache 的系统设计含义。\n"}, {"filename": "01-foundations/02-tokenization-deep-dive.md", "section_id": "01-foundations", "section_label": "01 · 基础知识", "label": "02 tokenization deep dive", "title_zh": "Tokenization 深入理解", "summary": "Tokenization 不只是预处理细节，它直接影响成本、上下文长度、分块、缓存和延迟。要掌握 BPE、WordPiece、SentencePiece、特殊 token 和多语言差异。", "detail": "", "content": "# Tokenization Deep Dive\n\nTokenization is the process of converting text into discrete units (tokens) that models can process. It directly impacts model capabilities, costs, and performance.\n\n## Table of Contents\n\n- [Why Tokenization Matters](#why-tokenization-matters)\n- [Tokenization Algorithms](#tokenization-algorithms)\n- [Vocabulary Design Tradeoffs](#vocabulary-design-tradeoffs)\n- [Special Tokens](#special-tokens)\n- [Multilingual Tokenization](#multilingual-tokenization)\n- [Token Counting for Cost Estimation](#token-counting-for-cost-estimation)\n- [Common Tokenization Issues](#common-tokenization-issues)\n- [Practical Tokenization Patterns](#practical-tokenization-patterns)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## Why Tokenization Matters\n\n### For System Design\n\n1. **Cost**: LLM APIs charge per token. Tokenization efficiency directly affects costs.\n2. **Context limits**: Token count, not word count, determines what fits in context.\n3. **Capability**: Some tasks (character counting, anagrams) are hard because of tokenization.\n4. **Consistency**: Same text tokenizes differently across models.\n\n### For Understanding LLM Behavior\n\n**Classic interview question**: Why does GPT struggle to count letters in \"strawberry\"?\n\nBecause \"strawberry\" is tokenized as multiple subwords. The model never sees individual characters; it sees subword units. Counting letters requires reasoning about internal structure of tokens.\n\n---\n\n## Tokenization Algorithms\n\n### Byte Pair Encoding (BPE)\n\nThe most common algorithm. Used by GPT-series, Llama, Claude.\n\n**Training algorithm:**\n1. Start with vocabulary of individual bytes (256 tokens)\n2. Count all adjacent token pairs in training corpus\n3. Merge most frequent pair into a new token\n4. Repeat until vocabulary size reached\n\n**Example:**\n```\nCorpus: \"low lower lowest\"\nInitial: ['l', 'o', 'w', ' ', 'l', 'o', 'w', 'e', 'r', ' ', 'l', 'o', 'w', 'e', 's', 't']\n\nStep 1: Most frequent pair is ('l', 'o'). Merge to 'lo'.\n['lo', 'w', ' ', 'lo', 'w', 'e', 'r', ' ', 'lo', 'w', 'e', 's', 't']\n\nStep 2: Most frequent pair is ('lo', 'w'). Merge to 'low'.\n['low', ' ', 'low', 'e', 'r', ' ', 'low', 'e', 's', 't']\n\nStep 3: Most frequent pair is ('low', 'e'). Merge to 'lowe'.\n['low', ' ', 'lowe', 'r', ' ', 'lowe', 's', 't']\n\nContinue until vocabulary size target...\n```\n\n**Properties:**\n- Deterministic tokenization given trained vocabulary\n- Common words tend to be single tokens\n- Rare words split into subwords\n\n### WordPiece\n\nUsed by BERT-family models.\n\n**Key difference from BPE:**\n- BPE: Merge based on frequency\n- WordPiece: Merge based on likelihood improvement\n\n```\nScore = freq(AB) / (freq(A) * freq(B))\n```\n\nThis favors merges that are more meaningful than random co-occurrence.\n\n**Visual marker:** WordPiece uses ## prefix for continuation tokens:\n```\n\"embedding\" becomes [\"em\", \"##bed\", \"##ding\"]\n```\n\n### Unigram (SentencePiece)\n\nUsed by T5, ALBERT, some multilingual models.\n\n**Training algorithm:**\n1. Start with large candidate vocabulary\n2. Compute loss if each token were removed\n3. Remove tokens that increase loss least\n4. Repeat until vocabulary size reached\n\n**Key difference:** Works with probabilities rather than frequencies. Can recover from suboptimal early merges.\n\n### Comparison\n\n| Algorithm | Merge Criterion | Tokenization | Used By |\n|-----------|-----------------|--------------|---------|\n| BPE | Frequency | Deterministic | GPT, Llama, Claude |\n| WordPiece | Likelihood | Deterministic | BERT, DistilBERT |\n| Unigram | Probability | Probabilistic | T5, mT5, XLNet |\n\n---\n\n## Vocabulary Design Tradeoffs\n\n### Vocabulary Size\n\n| Size | Example | Pros | Cons |\n|------|---------|------|------|\n| Small (10K) | Some early models | Smaller embeddings | Long token sequences |\n| Medium (32K) | Llama 2 | Good balance | Multilingual inefficiency |\n| Large (128K) | Llama 3/4, Claude Sonnet 4.6, Mistral Medium 3.5 | **Current standard.** High compression ratio. | Larger embeddings table |\n| Huge (200K+) | GPT-5.5 (o200k), Claude Opus 4.7 | Native multimodal and multilingual efficiency | Memory pressure at the LM Head |\n\n**The vocab-expansion deep dive:**\n- **Llama 3/4 (128k)**: By moving from 32k to 128k, Meta improved English compression by ~15% and non-English languages like Hindi by 3-4x. \n- **GPT-4o/5.2 (o200k_base)**: Tiktoken's latest encoding provides superior compression for code and multilingual text, reducing API costs indirectly by using fewer tokens for the same meaning.\n\n### Character vs Subword vs Word\n\n| Granularity | Example | Tokens for \"running\" | Tradeoffs |\n|-------------|---------|---------------------|-----------|\n| Character | ByT5 | ['r','u','n','n','i','n','g'] | Handles any text but very long sequences |\n| Subword | GPT | ['running'] or ['run','ning'] | Good balance |\n| Word | Early NLP | ['running'] | Short sequences but cannot handle OOV |\n\nModern LLMs universally use subword tokenization for the balance of vocabulary size and sequence length.\n\n### Byte-Level BPE\n\nGPT-2 introduced byte-level BPE:\n- Base vocabulary is 256 bytes, not characters\n- Can represent any text without UNK tokens\n- Unicode handled naturally as byte sequences\n\n```python\n# Character-level: Needs explicit handling of characters\ntext = \"cafe\"  # Unknown character might become [UNK]\n\n# Byte-level: Works with any text (no UNK needed)\ntext = \"cafe\"  # Becomes bytes, then BPE operates on bytes\n```\n\n---\n\n## Special Tokens\n\nSpecial tokens handle structural information outside normal text:\n\n| Token | Purpose | Example |\n|-------|---------|---------|\n| BOS | Beginning of sequence | Signals start of generation |\n| EOS | End of sequence | Signals completion |\n| PAD | Padding | Fill batches to equal length |\n| UNK | Unknown token | Fallback for OOV (rare with byte BPE) |\n| SEP | Separator | Divide segments (BERT-style) |\n\n### Chat Templates\n\nModern chat models use special tokens for conversation structure:\n\n**Llama 2 format:**\n```\n[INST] <<SYS>>\nYou are a helpful assistant.\n<<\/SYS>>\n\nUser message here [/INST] Assistant response here\n```\n\n**ChatML (OpenAI style):**\n```\n<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n<|im_start|>user\nHello!<|im_end|>\n<|im_start|>assistant\nHi there!<|im_end|>\n```\n\n**Why this matters:**\n- Wrong formatting leads to poor results\n- Special tokens are not in pre-training data\n- Libraries like transformers use chat_template for automatic formatting\n\n---\n\n## Multilingual Tokenization\n\n### The Challenge\n\nTokenizers trained primarily on English have poor efficiency for other languages:\n\n| Language | Tokens for \"Hello\" | Tokens for equivalent greeting |\n|----------|-------------------|-------------------------------|\n| English | 1 (\"Hello\") | - |\n| Chinese | - | 2-3+ for equivalent |\n| Japanese | - | 3-5+ for equivalent |\n| Korean | - | 2-4+ for equivalent |\n\n**Cost implication:** Non-English users pay 2-3x more per semantic unit.\n\n### Solutions\n\n1. **Multilingual training corpus:** Train tokenizer on balanced multilingual data\n2. **Larger vocabulary:** More room for non-English tokens\n3. **Language-specific tokenizers:** Separate tokenizers per language family\n\n**Models with good multilingual support:**\n- mT5, XLM-R: Trained on 100+ languages\n- GPT-4, Claude 3.5: Large vocabulary with multilingual coverage\n- Gemini: Designed for multilingual from the start\n\n| Model | Chinese | Japanese | Korean | Hindi |\n|-------|---------|----------|--------|--------|\n| GPT-2 | 2.5x | 3.0x | 2.8x | 6.0x |\n| GPT-4 (cl100k) | 1.4x | 1.6x | 1.5x | 3.2x |\n| GPT-5.2 (o200k) | 1.1x | 1.2x | 1.1x | 1.4x |\n| Llama 3/4 (128k)| 1.2x | 1.3x | 1.2x | 1.5x |\n\n---\n\n## Multimodal Tokenization (pixels-to-tokens)\n\nModern native multimodal models do not just \"see\" images; they tokenize them.\n\n### Image Tokenization (Vision Transformers)\nImages are split into patches (e.g., 14x14 pixels). Each patch is passed through a vision encoder (like SigLIP) to produce a single visual token.\n- **Fixed Token Cost**: Most models use a fixed number of tokens per image at a specific resolution (e.g., 256 or 729 tokens per image).\n- **Dynamic Resolution**: Some models (Gemini 3) use a variable number of tokens depending on image aspect ratio and detail level.\n\n### Audio/Video Tokenization\n- **Audio**: Compressed into discrete units using codecs like EnCodec, then represented as a sequence of audio tokens.\n- **Video**: Treated as a sequence of image frames (temporal tokenization). A 1-second video @ 1FPS might cost as much as 1 high-res image.\n\n---\n\n## Token Counting for Cost Estimation\n\n### Quick Estimation Rules\n\nFor English text:\n- **Words to tokens:** ~1.3 tokens per word\n- **Characters to tokens:** ~4 characters per token\n- **Pages to tokens:** ~500-800 tokens per page\n\n```python\ndef estimate_tokens(text: str) -> int:\n    # Rough estimation for English\n    word_count = len(text.split())\n    return int(word_count * 1.3)\n```\n\n### Accurate Counting\n\nUse the model-specific tokenizer:\n\n```python\nimport tiktoken\n\n# For OpenAI models\nencoding = tiktoken.encoding_for_model(\"gpt-4\")\ntokens = encoding.encode(\"Your text here\")\ntoken_count = len(tokens)\n\n# For Llama/Anthropic, use transformers\nfrom transformers import AutoTokenizer\ntokenizer = AutoTokenizer.from_pretrained(\"meta-llama/Llama-2-7b\")\ntokens = tokenizer.encode(\"Your text here\")\ntoken_count = len(tokens)\n```\n\n### Cost Calculation\n\n```python\ndef calculate_cost(input_text: str, output_text: str, model: str) -> float:\n    pricing = {\n        \"gpt-4o\": {\"input\": 2.50, \"output\": 10.00},  # per 1M tokens\n        \"gpt-4o-mini\": {\"input\": 0.15, \"output\": 0.60},\n        \"claude-3.5-sonnet\": {\"input\": 3.00, \"output\": 15.00},\n    }\n    \n    encoding = tiktoken.encoding_for_model(model)\n    input_tokens = len(encoding.encode(input_text))\n    output_tokens = len(encoding.encode(output_text))\n    \n    cost = (\n        (input_tokens / 1_000_000) * pricing[model][\"input\"] +\n        (output_tokens / 1_000_000) * pricing[model][\"output\"]\n    )\n    return cost\n```\n\n---\n\n## Common Tokenization Issues\n\n### Issue 1: Token Boundary Misalignment\n\n**Problem:** Text operations may not align with token boundaries.\n\n```python\ntext = \"Hello world\"\n# Tokens: [\"Hello\", \" world\"]  # Note: space is part of second token\n\n# Truncating at character 6 (\"Hello \") splits a token\n```\n\n**Solution:** Always truncate at token boundaries when managing context.\n\n### Issue 2: Inconsistent Tokenization\n\n**Problem:** Same text tokenizes differently based on context.\n\n```python\n# GPT tokenizer example\n\"New York\"     # Might be [\"New\", \" York\"]\n\"NewYork\"      # Might be [\"New\", \"York\"]\n\" New York\"    # Might be [\" New\", \" York\"]\n```\n\n**Implication:** Token counts can vary based on surrounding text. Always tokenize the full context.\n\n### Issue 3: Code and Structured Data\n\n**Problem:** Code and JSON often tokenize inefficiently.\n\n```python\n# Python code often tokenizes poorly\n\"def calculate_average(numbers):\"\n# Becomes many tokens: [\"def\", \" calculate\", \"_\", \"average\", \"(\", \"numbers\", \"):\", ...]\n\n# JSON keys tokenize individually\n'{\"firstName\": \"John\"}'\n# Many tokens for structure\n```\n\n**Mitigation:** \n- Some models have code-optimized tokenizers\n- Consider compressing JSON before sending\n- Use structured output modes when available\n\n### Issue 4: Whitespace Handling\n\n**Problem:** Tokenizers handle whitespace differently.\n\n```python\n# Leading spaces often become separate tokens\n\" Hello\"  # [\" \", \"Hello\"] or [\" Hello\"]\n\n# Multiple spaces may merge or stay separate\n\"Hello  world\"  # Behavior varies by tokenizer\n```\n\n**Best practice:** Normalize whitespace before tokenizing.\n\n---\n\n## Practical Tokenization Patterns\n\n### Pattern 1: Context Window Management\n\n```python\ndef fit_to_context(\n    system_prompt: str,\n    user_message: str,\n    history: list[str],\n    max_tokens: int = 8000,\n    reserve_for_output: int = 2000\n) -> str:\n    encoding = tiktoken.encoding_for_model(\"gpt-4\")\n    \n    available = max_tokens - reserve_for_output\n    \n    # System prompt always included\n    tokens_used = len(encoding.encode(system_prompt))\n    available -= tokens_used\n    \n    # User message always included\n    tokens_used = len(encoding.encode(user_message))\n    available -= tokens_used\n    \n    # Add history from most recent, drop oldest if needed\n    included_history = []\n    for msg in reversed(history):\n        msg_tokens = len(encoding.encode(msg))\n        if msg_tokens <= available:\n            included_history.insert(0, msg)\n            available -= msg_tokens\n        else:\n            break\n    \n    return format_prompt(system_prompt, included_history, user_message)\n```\n\n### Pattern 2: Chunking at Token Boundaries\n\n```python\ndef chunk_at_token_boundaries(\n    text: str,\n    chunk_size: int = 500,\n    overlap: int = 50\n) -> list[str]:\n    encoding = tiktoken.encoding_for_model(\"gpt-4\")\n    tokens = encoding.encode(text)\n    \n    chunks = []\n    start = 0\n    while start < len(tokens):\n        end = min(start + chunk_size, len(tokens))\n        chunk_tokens = tokens[start:end]\n        chunk_text = encoding.decode(chunk_tokens)\n        chunks.append(chunk_text)\n        start = end - overlap\n    \n    return chunks\n```\n\n### Pattern 3: Token Budget Allocation\n\n```python\nclass TokenBudget:\n    def __init__(self, total: int):\n        self.total = total\n        self.allocated = {}\n    \n    def allocate(self, component: str, tokens: int) -> bool:\n        used = sum(self.allocated.values())\n        if used + tokens > self.total:\n            return False\n        self.allocated[component] = tokens\n        return True\n    \n    def remaining(self) -> int:\n        return self.total - sum(self.allocated.values())\n\n# Usage\nbudget = TokenBudget(total=8000)\nbudget.allocate(\"system_prompt\", 500)\nbudget.allocate(\"retrieved_context\", 2000)\nbudget.allocate(\"user_message\", 200)\nbudget.allocate(\"output_reserve\", 2000)\n# Remaining: 3300 tokens for conversation history\n```\n\n---\n\n## Interview Questions\n\n### Q: Why does GPT-4 struggle with simple character counting?\n\n**Strong answer:**\nTokenization converts text to subword units, not characters. When asked \"How many 'r's in strawberry?\", the model sees tokens like [\"str\", \"aw\", \"berry\"] rather than individual letters.\n\nThe model has to reason about the internal structure of tokens it does not directly observe. This requires memorizing or computing character compositions of tokens, which is an emergent capability that is not always reliable.\n\nThe solution is to prompt the model to spell out the word character by character first, then count. This forces the creation of character-level tokens.\n\n### Q: How would you estimate token count for cost planning?\n\n**Strong answer:**\nFor rough estimation: multiply word count by 1.3 for English text.\n\nFor accurate counting: Use the model-specific tokenizer.\n- OpenAI: tiktoken library\n- Others: transformers AutoTokenizer\n\nImportant considerations:\n- Non-English text uses 1.5-3x more tokens\n- Code and structured data tokenize inefficiently\n- Always budget extra for output tokens (typically priced higher)\n- Include system prompts and formatting tokens\n\nFor production cost estimation, I sample real requests and measure actual token usage, then apply safety margins.\n\n### Q: What happens when switching tokenizers between models?\n\n**Strong answer:**\nEvery model family has its own tokenizer. You cannot reuse tokens across models because:\n\n1. **Vocabulary differs:** Token IDs mean different strings\n2. **Merge rules differ:** Same text splits differently\n3. **Special tokens differ:** Chat formatting varies\n\nPractical implications:\n- Always use the correct tokenizer for token counting\n- Cached embeddings are model-specific\n- Prompt templates need per-model adjustment\n- Fine-tuned models inherit their base tokenizer\n\n### Q: How do you handle tokenization for RAG chunking?\n\n**Strong answer:**\nKey considerations:\n\n1. **Chunk at token boundaries:** Splitting mid-token corrupts text when decoded\n2. **Account for template tokens:** System prompt, formatting consume tokens\n3. **Leave headroom:** Retrieved chunks plus question must fit context\n\nImplementation approach:\n```python\n# Determine available tokens for chunks\navailable = max_context - system_prompt_tokens - question_tokens - output_reserve\n\n# Chunk with overlap at token boundaries\nchunks = chunk_at_token_boundaries(document, chunk_size=500, overlap=50)\n\n# Select chunks until budget exhausted\nselected = []\ntokens_used = 0\nfor chunk in ranked_chunks:\n    chunk_tokens = count_tokens(chunk)\n    if tokens_used + chunk_tokens <= available:\n        selected.append(chunk)\n        tokens_used += chunk_tokens\n```\n\n---\n\n## References\n\n- Sennrich et al. \"Neural Machine Translation of Rare Words with Subword Units\" (BPE, 2016)\n- Wu et al. \"Google's Neural Machine Translation System\" (WordPiece, 2016)\n- Kudo and Richardson \"SentencePiece: A simple and language independent subword tokenizer\" (2018)\n- OpenAI tiktoken library: https://github.com/openai/tiktoken\n- HuggingFace tokenizers: https://github.com/huggingface/tokenizers\n\n---\n\n*Previous: [LLM Internals](01-llm-internals.md) | Next: [Attention Mechanisms](03-attention-mechanisms.md)*\n", "content_zh": "# Tokenization 深入理解\n\n## 核心概念\n\nTokenization 把文本转换成模型处理的 token ID。BPE、WordPiece 和 Unigram/SentencePiece 在词表构造、未知词处理、多语言和 token 数量上各有取舍。\n\n## 为什么影响系统设计\n\nToken 数决定上下文是否超限、输入输出成本、KV Cache 大小、吞吐和延迟。英文、中文、代码、JSON、空格和特殊符号的 token 化方式不同，不能用字符数简单代替 token 数。\n\n## 生产实践\n\n- 使用目标模型对应的 tokenizer 计算预算。\n- 在 token 边界做截断和分块，避免把结构或代码从中间切断。\n- 为系统提示、历史对话、检索上下文和输出预留独立预算。\n- 对多语言、代码和结构化数据建立专门测试集。\n- 记录 tokenizer 和模型版本，避免升级后成本和上下文行为发生隐性变化。\n\n## 面试要点\n\n能够解释词表大小、字符/子词/字节级方案的权衡，并说明 token 计数如何影响限流、成本估算、上下文压缩和 RAG 分块。\n", "summary_content": "# 《Tokenization 深入理解》中文概要\n\nTokenization 不只是预处理细节，它直接影响成本、上下文长度、分块、缓存和延迟。要掌握 BPE、WordPiece、SentencePiece、特殊 token 和多语言差异。\n"}, {"filename": "01-foundations/03-attention-mechanisms.md", "
