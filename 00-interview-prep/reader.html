, failure, conflict, ambiguity, learning\n- [ ] Include at least one story where you were wrong and one where you were overruled (Examples 5 and 6 show the shape)\n- [ ] Practice telling stories in 2-3 minutes (timed), plus a 30-second version of each\n- [ ] For each story, identify: situation, your specific actions, measurable results, learnings\n- [ ] Include at least one AI-specific story (model failure, bias, stakeholder education)\n- [ ] Record yourself once per story and fix what you hear\n- [ ] Do one full mock with a peer who interrupts\n- [ ] Prepare 3-5 thoughtful questions for interviewers, including the leveling and compensation set for late-stage calls\n- [ ] Research the company's AI products and potential ethical considerations\n\n---\n\n*See also: [Question Bank](01-question-bank.md) | [Answer Frameworks](02-answer-frameworks.md) | [Common Pitfalls](03-common-pitfalls.md)*\n"}, {"filename": "06-job-market-trends-2026.md", "label": "2026 岗位趋势", "title_zh": "2026 年 AI 就业市场趋势", "summary": "介绍 AI 岗位从单一模型开发转向应用工程、评测、可靠性、安全、MCP 和 Forward Deployed Engineer 等细分方向的变化。", "detail": "这篇资料从岗位名称、技能层级、招聘要求、薪酬、地区、面试流程和新兴岗位几个角度描述 2026 年市场。对你的定位而言，最有价值的不是记住具体公司或薪资数字，而是理解“AI 应用生产化”正在成为独立能力：包括 Agent 编排、RAG、Tool Calling、评测、可观测性、成本和安全。阅读时要结合自己的 Java 后端基础、Python Agent 开发经验和金融业务背景，形成清晰的岗位叙事。", "content": "# AI Job Market Trends - August 2026\n\n> **Last verified: August 15, 2026.** This chapter distills what's actually happening in AI hiring right now - titles companies post, skills they screen for, compensation ranges, and the interview formats you'll encounter. Sourced from 100+ public job listings, hiring reports, and recruiter signals across April-August 2026. Compensation tables below are from the May 17, 2026 sweep and have not been re-run; treat them as floors.\n\n> **August 2026 update:** Three datapoints worth carrying into interviews and career planning. First, the entry-level squeeze now has administrative payroll evidence behind it: a widely cited Stanford Digital Economy Lab paper revised in August 2026 with ADP data through June reports that workers aged 22-25 in AI-exposed occupations sit about **19% below** the employment level they would have reached had they kept pace with less-exposed peers, while experienced workers show no comparable gap. The mechanism the authors identify is reduced hiring rather than increased separations, which matters: the entry door is narrower, but the people already inside are not being pushed out. Second, the infrastructure buildout is now the clearest wage story in the market. Indeed Hiring Lab (July 14, 2026) puts data-center roles at **six of every 1,000 US job postings, up from two per 1,000 in May 2023**, and reports that data-center installation and maintenance work pays about **42% more per hour** than equivalent non-data-center roles. If you are technical but not an ML researcher, that is where the leverage is. Third, capability-tiered access programs at the frontier labs (Daybreak Blue and Red, Project Glasswing) have created a small but real category of roles that require verified identity and security clearance-adjacent vetting, which is a new consideration in where you apply.\n>\n> **June 2026 update:** Two market-moving events since the May sweep. Anthropic released **Claude Fable 5** (June 9, $10/$50 per 1M), bringing Mythos-class capability to general availability with an Opus 4.8 fallback safeguard; expect a wave of capability-ceiling product work and the eval, safety, and routing roles that come with it. DeepSeek made its **75% V4 Pro discount permanent** (May 22), accelerating the cost-engineering hiring trend: candidates who can exploit a 70x price spread across model tiers are screening well. Compensation rows below are from the May 17 sweep; treat them as floors in the segments those events touch.\n\nThis chapter is for engineers planning their next move, hiring managers building rubrics, and engineering leaders making organizational design decisions. It complements [TRANSITION_GUIDE.md](../TRANSITION_GUIDE.md) (how to transition into AI roles) and the [Question Bank](01-question-bank.md) (what to study).\n\n---\n\n## Table of Contents\n\n- [The Three Headline Shifts](#the-three-headline-shifts)\n- [Role Taxonomy in 2026](#role-taxonomy-in-2026)\n- [Skills by Career Level](#skills-by-career-level)\n- [What Job Listings Actually Require](#what-job-listings-actually-require)\n- [Compensation Reality](#compensation-reality)\n- [Geographic & Industry Distribution](#geographic--industry-distribution)\n- [Interview Process Patterns](#interview-process-patterns)\n- [Emerging Roles to Watch](#emerging-roles-to-watch)\n- [Strategic Takeaways](#strategic-takeaways)\n- [References](#references)\n\n---\n\n## The Three Headline Shifts\n\nIf you read nothing else, internalize these three things.\n\n### 1. The market is paradoxically hot and cold.\n\nQ1 2026 saw ~52,050 tech layoffs (Oracle 30K, Amazon, Meta, Dell), the highest Q1 since 2023 ([Kore1](https://www.kore1.com/tech-layoffs-2026/); [Tom's Hardware](https://www.tomshardware.com/tech-industry/tech-industry-lays-off-nearly-80-000-employees-in-the-first-quarter-of-2026-almost-50-percent-of-affected-positions-cut-due-to-ai)). Simultaneously, AI roles grew +8.9% QoQ and +4.8% YoY, with ~275,000 unfilled AI roles ([Allwork.space](https://allwork.space/2026/05/ai-hiring-is-rising-even-as-tech-layoffs-surge-140/)). Junior/entry-level engineers were hit hardest - routine codegen, QA testing, basic frontend work disproportionately cut. Senior + specialist AI roles remained resilient.\n\n**Implication:** \"Tech hiring\" and \"AI hiring\" are not the same story in 2026. If your career is generalist mid-level SWE work, you're feeling the cold market. If you're AI-specialized at senior level, you're in a sellers' market.\n\n### 2. The title is collapsing; the work is fragmenting.\n\nMost companies now post \"AI Engineer\" as the umbrella, but inside the role you specialize quickly into RAG, agents, evals, fine-tuning, or platform work. [\"Most AI job titles will collapse into 'AI Engineer' over the next 18 months; prestige labels survive only at frontier labs\"](https://www.ivanturkovic.com/2026/04/24/ai-job-titles-2026-naming-chaos/). The \"Prompt Engineer\" standalone title has effectively disappeared from major job boards - the skill survived; the title didn't ([PE Collective](https://pecollective.com/blog/is-prompt-engineering-a-real-career/); [Medium - Prompt Engineering Is Dead 2026](https://medium.com/write-a-catalyst/prompt-engineering-is-dead-2026-ai-systems-engineering-7acdbbcb2160)).\n\n**Implication:** If you're hiring a \"Prompt Engineer,\" you're 18 months behind. Define the actual problem (eval rigor? agent debugging? customer-facing tuning?) and hire for that specific role.\n\n### 3. Forward Deployed Engineer is the breakout role of 2026.\n\nFDE didn't exist as a discrete category at frontier labs in mid-2025. By May 2026, OpenAI, Anthropic, and Google are all hiring hundreds. Google/Box CEOs publicly called it \"the most in-demand job in tech\" ([Fast Company](https://www.fastcompany.com/91541878/google-box-ceos-say-this-is-the-most-in-demand-job-in-tech); [Hashnode FDE guide](https://hashnode.com/blog/a-complete-2026-guide-to-the-forward-deployed-engineer)). TC stabilized at $350-550K mid-to-senior.\n\n**Implication:** Frontier-AI buyers (Fortune 500, government, biotech) demand on-site engineering presence as a contractual deliverable. FDE is the role that exists because the buyer values it - not because it's the most efficient way to deliver software.\n\n---\n\n## Role Taxonomy in 2026\n\n### Established titles (still hiring strongly)\n\n| Title | Description | Where it's posted |\n|-------|-------------|-------------------|\n| **AI Engineer** | The de facto general-purpose AI title. Other titles are collapsing into it. | Universal - most postings |\n| **LLM Engineer** | Centered on transformer fine-tuning, RAG, agents. Distinct from ML Engineer. | Mid-large companies; [iSmart LLM JD 2026](https://www.ismartrecruit.com/job-descriptions/llm-engineer) |\n| **ML Engineer / ML+AI Software Engineer** | Classic training-and-deployment role. | [levels.fyi ML/AI focus](https://www.levels.fyi/t/software-engineer/focus/ml-ai) |\n| **Applied AI Engineer** | Customer-embedded variant at frontier labs. | [Anthropic Applied AI](https://job-boards.greenhouse.io/anthropic/jobs/5116274008) |\n| **Member of Technical Staff (MTS)** | Deliberately ambiguous title that blurs research vs engineering. | OpenAI, Anthropic, Thinking Machines, Mistral ([Scout AI on MTS](https://scoutnow.ai/blog/rebirth-member-of-technical-staff)) |\n| **AI Research Engineer / Research Scientist** | Frontier labs only; PhD-preferred. | [Sundeep Teki - AI Research Eng 2026](https://www.sundeepteki.org/advice/the-ultimate-ai-research-engineer-interview-guide-cracking-openai-anthropic-google-deepmind-top-ai-labs) |\n| **AI Solutions Architect** | Heavy in enterprise. | EY, Caterpillar, Deloitte ([EY listing](https://careers.ey.com/ey/job/Amsterdam-AI-Solution-Architect-1083-HP/1258705801/)) |\n| **AI Platform Engineer** | Owns the internal LLM-ops platform. | [Augment Code spec 2026](https://www.augmentcode.com/guides/ai-platform-engineering-leader-job-spec) |\n| **AI Engineering Manager** | Highest-paying single role; median $293.5K ([AI Pulse benchmarks](https://theaimarketpulse.com/salaries/)). | Universal at scale-ups+ |\n| **AI Product Manager** | Required for nearly every B2B SaaS. | Universal ([Aakash Gupta](https://www.aakashg.com/product-manager-requirements/)) |\n| **AI Technical Program Manager (TPM)** | Specializations: \"Responsible AI TPM,\" \"AI Infrastructure TPM,\" \"GenAI Customer Performance TPM\" | Microsoft, AMD, Together AI |\n\n### NEW titles since 2025\n\n| Title | Why it emerged | Where it's posted |\n|-------|----------------|-------------------|\n| **Forward Deployed Engineer (FDE)** | Frontier-AI buyers demand on-site engineering as a deliverable. | OpenAI, Anthropic, Google ([Anthropic FDE](https://job-boards.greenhouse.io/anthropic/jobs/4985877008)) |\n| **AI Evaluation Engineer** | Eval work matured into a discrete discipline. | OpenAI ([Applied Evals](https://openai.com/careers/software-engineer-applied-evals-san-francisco/), [Frontier Evals](https://openai.com/careers/research-engineer-frontier-evals-and-environments-san-francisco/)), Apple, Scale AI, Distyl, Apex |\n| **Agentic Systems Engineer / AI Agent Engineer** | Agents became their own engineering surface. | Teradata, GE Vernova, Deloitte, OpenAI ([Agent Infrastructure SWE](https://openai.com/careers/software-engineer-agent-infrastructure-san-francisco/)) |\n| **AI Reliability Engineer** | Production AI needs SRE-like discipline; distinct from traditional SRE. | Anthropic ([Staff/Sr AI Reliability](https://www.anthropic.com/jobs)); AI SRE as a category being defined by Resolve.ai, Rootly. |\n| **AI Security Engineer / LLM Red Team Specialist** | Prompt-injection defense and jailbreak research as a discipline. | Life360 ([Principal AI Security Engineer](https://www.remoterocketship.com/us/company/life360/jobs/principal-ai-security-engineer-ai-native-platform-united-states-remote/)); 10 emerging AI security roles enumerated by [Practical DevSecOps](https://www.practical-devsecops.com/emerging-ai-security-roles/). |\n| **MCP Engineer / MCP Software Engineer** | MCP adoption made server development its own specialty. | Descope ([MCP SWE](https://careers.descope.com/p/fe57f6224769-mcp-model-context-protocol-software-engineer)) |\n| **AI Operator / Computer-Use Specialist** | Tied to OpenAI Operator and Claude Cowork. | $75-120K specialist tier ([Coasty](https://coasty.ai/blog/best-computer-use-platform-2026-20260402)) |\n\n### Roles disappearing or consolidating\n\n- **Prompt Engineer (standalone):** Title is dying. Skill remains as table stakes.\n- **Distillation Engineer:** Appears as a *responsibility* in fine-tuning/inference engineer postings, not its own widely-posted req.\n\n---\n\n## Skills by Career Level\n\n### L4-L5 (Mid-level IC, 3-5 yrs)\n\n- Python production proficiency - **71% of AI job postings** ([Second Talent](https://www.secondtalent.com/resources/most-in-demand-ai-engineering-skills-and-salary-ranges/))\n- Hands-on with at least one major LLM provider SDK (OpenAI, Anthropic, Bedrock) and one orchestration framework - most commonly LangChain/LangGraph (34.3% of agentic AI postings; [Agentic Engineering Jobs](https://agentic-engineering-jobs.com/langchain-job-market-2026))\n- Vector DB fundamentals: Pinecone, Weaviate, pgvector - tool-specific experience is learnable in weeks; conceptual understanding matters most\n- RAG: chunking, hybrid search, BM25, reranking, retrieval evals\n- Containerization: Docker (15.4%), Kubernetes (17.6%)\n- Cloud: AWS (32.9%), Azure (26%)\n\n### L6-L7 (Senior / Staff)\n\n- Production LLM systems shipped end-to-end - \"industry experience shipping real systems is a better signal than an academic credential\"\n- Multi-tenant isolation across vector indexes, GPU memory, agent state\n- Eval frameworks (LangSmith / Langfuse / Braintrust); eval-gated CI/CD\n- Fine-tuning / LoRA / QLoRA / RLHF\n- Cost optimization - token budgets, model routing, caching\n- \"Reason about LLMs, vector stores, and RAG as part of standard system design, not as a niche specialty\" ([Design Gurus](https://designgurus.substack.com/p/system-design-interviews-changed))\n\n### L8+ (Principal / Leadership IC)\n\n- Own agent orchestration layers, model-routing, LLMOps platforms serving all eng teams\n- Runtime governance for non-deterministic systems\n- Architect for SOC 2 / HIPAA / EU AI Act compliance - trigger DPIA + FRIA under AI Act Article 27\n- \"Define technical vision and scale engineering teams matters more than coding prowess alone\"\n\n### Manager track (EM / Director)\n\n- AI Engineering Manager median $293.5K - highest-paying single role ([AI Pulse](https://theaimarketpulse.com/salaries/))\n- Hiring rubrics now weight: \"can you put this person in a room with a PM and a junior eng and have them drive technical direction without making a mess\" - 5 of 7 hiring managers surveyed ([Design Gurus](https://designgurus.substack.com/p/system-design-interviews-changed))\n- Mission alignment and safety judgment heavily weighted at frontier labs ([Anthropic EM guide](https://www.gethireready.com/interview-guides/engineering-manager-anthropic))\n\n### PM track (AI PM / AI TPM)\n\n- \"AI is the new baseline, not a bonus skill\"\n- 4+ yrs PM, ideally B2B SaaS or AI-driven product\n- Critical: \"fewer than 1 in 4 senior AI PM candidates meet the bar for technical fluency + product rigor\" ([Aakash Gupta](https://www.aakashg.com/product-manager-requirements/))\n- \"Candidates who can show a working prototype outperform those who can only describe one\"\n\n---\n\n## What Job Listings Actually Require\n\n### Must-Have (called out as required across 100+ postings)\n\n- Python production code, 3+ yrs\n- LLM API integration (OpenAI / Anthropic / Bedrock)\n- RAG pipeline experience including vector DB, chunking, retrieval evals\n- Production-grade observability and eval pipelines\n- Cloud + Kubernetes + IaC\n- Agent debugging / multi-step workflow tracing\n- Prompt injection / jailbreak defense for security-sensitive roles\n\n### Nice-to-Have (explicitly listed as \"plus\" or \"bonus\")\n\n- Publications or OSS contributions; working portfolio of 3-5 projects beats a paper for applied roles\n- CUDA / GPU-level optimization - must-have at NVIDIA/frontier labs, nice-to-have elsewhere\n- Distillation / model compression\n- Distributed inference experience\n- Java/C++ for legacy enterprise integration\n- Reinforcement learning beyond RLHF\n\n### Top Tech Stack in Listings (May 2026)\n\nRanked by frequency:\n\n1. **Python** - 71% of all AI postings\n2. **PyTorch / JAX** - universal at frontier labs\n3. **LangChain / LangGraph** - 34.3% of agentic postings, #1 framework\n4. **LlamaIndex** - co-occurs in 38% of LangChain listings\n5. **AWS (32.9%) / Azure (26%) / GCP / Vertex / Bedrock**\n6. **Kubernetes (17.6%) + Docker (15.4%)**\n7. **Vector DBs:** Pinecone, Weaviate, Qdrant, Chroma, pgvector\n8. **MCP (Model Context Protocol)** - now [\"a fundamental requirement\"](https://medium.com/@adnanmasood/the-rise-of-model-context-protocol-mcp-skills-5f0d6a1c3579) at cutting-edge teams\n9. **Observability:** LangSmith, Langfuse, Braintrust, Arize\n10. **Inference engines:** vLLM, SGLang, TensorRT-LLM\n11. **Terraform / Helm / Ray / Kubeflow / MLflow / Feast** - internal platform stack\n12. **Provider SDKs:** OpenAI Agents SDK, Claude SDK, Vercel AI SDK, Mastra, Pydantic AI\n\n### By Company Tier\n\n- **Frontier labs** (Anthropic, OpenAI, xAI): PyTorch/JAX, vLLM/custom inference, internal evals, MCP servers, CUDA/GPU-level optimization\n- **Scale-ups** (Cursor, Harvey, Sierra, Decagon, Glean, Perplexity): TypeScript + Python mix, LangGraph / OpenAI Agents SDK, Pinecone/pgvector, LangSmith/Braintrust evals\n- **Enterprises** (Deloitte, EY, Caterpillar, Citi): Azure-heavy, Bedrock, LangChain, governance/MLOps focus, on-prem capability\n\n### Non-Technical Requirements\n\n- **Communication / cross-functional collaboration** - table stakes at senior+\n- **Customer-facing skills** - load-bearing for FDE roles; Anthropic requires 3+ yrs in \"technical, customer-facing role\"\n- **OSS contributions** - Anthropic states explicitly: [\"if you have done interesting independent research, written an insightful blog post, or made substantial contributions to open-source software, put that at the TOP of your resume\"](https://www.sundeepteki.org/advice/how-to-get-hired-at-openai-anthropic-and-google-deepmind-in-2026)\n- **Publications** - required for AI Research Engineer; only ~50% of Anthropic technical staff hold PhDs\n- **Mission alignment** - Anthropic explicitly screens for it via a Behavioral and Values round\n- **Regulatory experience:** SOC 2 / HIPAA / FedRAMP for enterprise; EU AI Act familiarity (FRIA/DPIA) for EU operations\n- **Security clearance** - required for Lockheed and federal-adjacent roles\n\n---\n\n## Compensation Reality\n\n> Public-source ranges only. Verify with [levels.fyi](https://www.levels.fyi/) for current data. All figures USD unless noted.\n\n| Tier / Company | Level | Total Comp |\n|---|---|---|\n| **Anthropic (SF)** | Senior SWE | $316K base / $563K TC |\n| **Anthropic (SF)** | Lead SWE | $332K base / $785K TC |\n| **OpenAI (SF)** | All SWE | $251K – $1.28M+ TC |\n| **OpenAI (SF)** | L5 SWE | $336K base + $774K stock = $1.15M TC |\n| **OpenAI MTS / Research Scientist** | - | $245K – $685K base |\n| **Cursor (Anysphere)** | SWE | $850K – $1.28M TC |\n| **Sierra** | SWE | $200K – $460K TC; median $450K |\n| **Thinking Machines Lab** | All eng | $450K – $500K base (Q1 H-1B filings) |\n| Google AI Engineer | L3-L6 | $183K – $583K TC; median $280K |\n| Microsoft AI Engineer | All | $238K – $355K+ TC; median $282K |\n| **US National AI Engineer** | Entry (0-2y) | $90-135K base / $110-160K TC |\n| **US National AI Engineer** | Mid (3-5y) | $140-210K base / $170-260K TC |\n| **US National AI Engineer** | Senior (6-9y) | $180-280K base / $220-350K+ TC |\n| **US National AI Engineer** | Staff/Principal (10+y) | $250-400K+ base / $350-600K+ TC |\n| RAG Engineer Senior | - | $195-290K base; $400K+ TC at frontier |\n| LLM Fine-Tuning Specialist | - | $195K-$350K |\n| AI Security Engineer | - | $152-210K |\n| LLM Red Team Specialist | - | $160-230K |\n| **AI Engineering Manager** | - | $293.5K median (highest-paying single role) |\n| AI Product Manager | - | $141K – $250K (median $159K) |\n| **Agentic AI Architect** | - | $260K – $420K base |\n| AI Evaluation Engineer | - | Too few public postings for a stable range; companies level it against their senior SWE band. Use the US National Senior row as the anchor. |\n| MCP / Integrations Engineer | - | New title with thin public data; typically leveled as senior platform engineering. Anchor to the senior SWE band. |\n| London (Quant fund / FAANG) | Senior ML | £140-180K base; £200K+ TC |\n| London (Google DeepMind) | Senior | £110-155K base + RSU |\n| Berlin / Germany | Senior | €95-130K |\n| **Bangalore (Top GCC / AI-first)** | Senior | ₹1-2 Cr TC |\n| Bangalore (Fresh PhD / top MS) | Entry | ₹22-32 LPA |\n| Singapore | Avg | S$221,200 |\n| Singapore (Principal/Lead) | 10+y | S$323,505 |\n\n**Sources:** [levels.fyi Anthropic](https://www.levels.fyi/companies/anthropic/salaries/software-engineer), [OpenAI](https://www.levels.fyi/companies/openai/salaries/software-engineer), [Cursor](https://www.levels.fyi/companies/cursor/salaries/software-engineer), [Sierra](https://www.levels.fyi/companies/sierra/salaries/software-engineer), [Pin AI Comp Guide 2026](https://www.pin.com/blog/ai-compensation-salary-guide/), [Kore1 salary guide](https://www.kore1.com/ai-engineer-salary-guide/), [AI Pulse benchmarks](https://theaimarketpulse.com/salaries/), [Career Check London 2026](https://www.careercheck.io/blog/ml-engineer-salary-london-2026), [Zen van Riel Europe](https://zenvanriel.com/job/ai-engineer-salary-europe/), [Scaler India](https://www.scaler.com/topics/ai-ml-engineer-salary-complete-guide/).\n\n### Compensation insight\n\nThe gap between frontier-lab MTS comp (~$600-795K median at Anthropic/OpenAI) and enterprise AI engineering (~$170-260K mid-level) is **3-5x**. Choose your company tier with eyes open.\n\n---\n\n## Geographic & Industry Distribution\n\n- **Concentration:** 65%+ of AI engineers are in SF + NYC\n- **Two-tier market:** Indeed Hiring Lab reports ~95% of hiring firms have NOT posted an AI job - adoption is concentrated among largest firms ([Indeed Hiring Lab Jan 2026](https://www.hiringlab.org/2026/01/16/ai-adoption-accelerating-still-concentrated-among-largest-firms/))\n- **Enterprise adoption:** 72% of enterprises have at least one AI workload in production as of Q1 2026 ([Medha Cloud](https://medhacloud.com/blog/ai-adoption-statistics-2026))\n- **Consulting boom:** BCG reports 25% of $14.4B 2025 revenue ($3.6B) was AI consulting ([Metaintro BCG](https://www.metaintro.com/blog/bcg-25-percent-ai-revenue-consulting-jobs-2026))\n- **International hiring up 82% YoY**; 67% of companies offering relocation packages\n- **Remote-friendly:** LangChain ecosystem 35.2% remote, 48.4% hybrid, 16.4% strictly onsite\n- **Indeed AI Tracker:** 4.2% of all postings in Dec 2025 - sustained growth amid broader hiring weakness\n\n---\n\n## Interview Process Patterns\n\nThe May 2026 standard at AI-native companies:\n\n1. **Recruiter screen** (30 min) - culture/mission + comp + visa\n2. **Technical phone screen** (60-90 min) - practical coding, production-style\n3. **Take-home** (48 hr - 3 day) - common at LangChain, Mistral, Eightfold; build a small RAG/agent system. [\"Not a test of whether you can build, but how - code quality, evals, error handling\"](https://github.com/alexeygrigorev/ai-engineering-field-guide/blob/main/interview/01-interview-process.md)\n4. **Onsite/virtual loop** (4-6 hr): coding round + AI system design + project deep dive + behavioral. [\"Whiteboard-only rounds are mostly gone, even Google's format is collaborative now\"](https://designgurus.substack.com/p/system-design-interviews-changed)\n5. **Hiring manager / values round** - explicit at Anthropic\n\n### AI-role specifics\n\n- **System design rounds** now expect LLM infra, GPU scheduling, vector stores, RAG, eval-gated CI, cost/latency tradeoffs\n- **AI-assisted coding rounds** at Meta, Canva, Google, Microsoft, Sierra, Cursor explicitly allow AI tools (Cursor, Copilot, Claude) - evaluating prompt skill and output validation\n- **Take-home transparency:** Add an \"AI audit note\" - what you used AI for, what you changed, why. Transparency beats stealth\n- **Sierra:** in-person-only at SF or NY offices; \"Plan + Build + Present\" 2-hour agent assessment with no algorithm rounds\n- **Cursor:** 8-hour take-home using their own product with limited docs and a Slack channel - assesses product sense, autonomy, system design\n- **Anthropic:** \"the answer that sounds like it was written the night before is a bad signal\"\n\n### Frontier-lab specifics\n\n- **Anthropic:** 90-minute, 4-level progressively harder coding problem testing whether you write clean modular code that absorbs new requirements. Values round explicit.\n- **OpenAI:** \"Design the OpenAI Playground\" - wireframes + API + DB schema for thread/message history; multi-tenant secure cloud IDE\n- **Mistral (Paris):** 5-round process, no remote, with a dedicated \"LLM theory\" stage covering transformer internals and alignment\n\n---\n\n## Emerging Roles to Watch\n\nThese roles are growing fastest in May 2026 - bet on them if you're planning a 12-month career trajectory.\n\n### Forward Deployed Engineer (FDE)\n- **Why:** Frontier-AI buyers (Fortune 500, government, biotech) demand on-site engineering as a contractual deliverable\n- **Comp:** $350-550K mid-to-senior at frontier labs\n- **Skills:** RAG, fine-tuning, distillation, MCP, customer-facing communication, evals at the customer site\n- **Where:** OpenAI, Anthropic, Google, ElevenLabs, Cohere, Mistral, scale-ups\n\n### AI Evaluation Engineer\n- **Why:** Eval matured into a discipline; production needs eval-gated CI/CD\n- **Comp:** $100-110/hr contractor; $200-400K FT at frontier labs\n- **Skills:** LLM-as-judge calibration, error analysis methodology, statistical correction, dataset curation, regression detection\n- **Where:** OpenAI (Applied Evals, Frontier Evals), Apple, Scale AI, Distyl, Apex\n\n### Agentic Systems Engineer\n- **Why:** Multi-agent and tool-use are first-class systems engineering\n- **Comp:** $84-250K typical; agentic AI architect $260-420K\n- **Skills:** LangGraph / multi-agent orchestration, MCP, A2A protocol, agent debugging, tool design, sandbox security\n- **Where:** Teradata, GE Vernova, Deloitte, OpenAI (Agent Infrastructure)\n\n### AI Reliability Engineer\n- **Why:** Production AI needs SRE-like discipline for non-deterministic systems\n- **Comp:** Senior $250-400K at frontier labs (Anthropic posting Staff/Sr roles)\n- **Skills:** Incident response for AI agents, runaway-loop containment, cost anomaly detection, multi-provider fallback\n- **Where:** Anthropic; \"AI SRE\" category being defined by Resolve.ai, Rootly\n\n### AI Security Engineer / LLM Red Team Specialist\n- **Why:** Prompt injection + jailbreak research became discrete disciplines after the May 2026 AI security inflection (Mythos disclosure, Daybreak, MDASH, first in-the-wild AI-built zero-day)\n- **Comp:** $152-230K depending on specialty\n- **Skills:** Indirect prompt injection defense, jailbreak research, constitutional classifiers, model supply-chain trust, MCP threat modeling\n- **Where:** Life360, frontier labs, security-focused enterprises\n\n### MCP Engineer\n- **Why:** MCP ecosystem maturity made server development its own specialty\n- **Skills:** MCP server design (HTTP/STDIO), OAuth resource server pattern, agent-card signing, MCP security\n- **Where:** Descope, Anthropic-aligned scale-ups, internal platforms at Fortune 500\n\n---\n\n## Strategic Takeaways\n\nFor **engineers** planning the next move:\n\n1. **Position as a specialist, not \"Prompt Engineer.\"** Pick a discipline (evals, agents, RAG, FDE, MLOps) and build depth.\n2. **Working portfolio > paper.** Ship 3-5 production-grade projects with evals and observability. Anthropic, OpenAI, and scale-ups all weight this over publications for applied roles.\n3. **FDE is high-leverage.** If you can pair technical depth with customer-facing communication, FDE comp at frontier labs is the top of the market outside founder/staff equity at unicorns.\n4. **The market is bifurcated.** Generalist mid-level SWE work is being cut. Senior AI specialists are in a sellers' market. Plan your trajectory accordingly.\n\nFor **hiring managers** building rubrics:\n\n1. **Hire for the specific problem, not for \"AI Engineer.\"** If you write a generic AI Engineer JD, you'll get generic candidates.\n2. **Evaluate shipped systems first.** A take-home that simulates your actual workload (build a small RAG agent for our domain) is more predictive than algorithm puzzles.\n3. **AI-assisted coding rounds are now standard.** Watching candidates prompt + validate model output is more informative than blocking AI use.\n4. **Comp banding matters.** Frontier-lab comp is creating retention pressure 2 tiers down. If you're an enterprise hiring AI talent, calibrate to local market plus a 15-25% AI premium for senior+.\n\nFor **engineering leaders** doing org design:\n\n1. **Map roles to the work, not to titles.** \"AI Engineer\" is your umbrella. Inside it: name explicit specializations (RAG lead, agent lead, eval lead, platform lead).\n2. **Eval Engineer is a real role.** Don't make a feature engineer own the metric they're trying to improve. Separate measurement from delivery.\n3. **FDE only pays off above ~$500K customer ARR.** Below that, use solutions engineering. Above, FDE earns its comp through customer-specific engineering that documentation can't generalize.\n4. **AI Reliability Engineer is the role you don't know you need yet.** When your first agent loops at 3 AM and burns $50K of API spend before the loop guard fires, you'll wish you had this role 6 months earlier.\n\n---\n\n## References\n\nThis chapter is sourced from 100+ public job listings, hiring reports, and recruiter signals as of May 17, 2026. Key sources:\n\n### Hiring market reports\n- [Ivan Turkovic - AI Job Titles 2026: A CTO's Guide to the Naming Chaos](https://www.ivanturkovic.com/2026/04/24/ai-job-titles-2026-naming-chaos/)\n- [Kore1 - AI Engineer Salary Guide 2026](https://www.kore1.com/ai-engineer-salary-guide/)\n- [Kore1 - Tech Layoffs Q1 2026](https://www.kore1.com/tech-layoffs-2026/)\n- [Pin - AI Compensation Benchmarks 2026](https://www.pin. -make-salaries-685000)\n- [Career Check - ML Engineer Salary London 2026](https://www.careercheck.io/blog/ml-engineer-salary-london-2026)\n- [Zen van Riel - AI Engineer Salary Europe](https://zenvanriel.com/job/ai-engineer-salary-europe/)\n- [Scaler - AI/ML Engineer Salary India](https://www.scaler.com/topics/ai-ml-engineer-salary-complete-guide/)\n- [Morgan McKinley - Singapore AI/ML Engineer](https://www.morganmckinley.com/sg/salary-guide/data/ai-ml-engineer/singapore)\n\n### Frontier-lab career sources\n- [Anthropic - Careers](https://www.anthropic.com/careers)\n- [Anthropic - Forward Deployed Engineer](https://job-boards.greenhouse.io/anthropic/jobs/4985877008)\n- [Anthropic - Applied AI Engineer](https://job-boards.greenhouse.io/anthropic/jobs/5116274008)\n- [OpenAI Careers](https://openai.com/careers/search/)\n- [OpenAI - Applied Evals](https://openai.com/careers/software-engineer-applied-evals-san-francisco/)\n- [OpenAI - Frontier Evals & Environments](https://openai.com/careers/research-engineer-frontier-evals-and-environments-san-francisco/)\n- [OpenAI - Agent Infrastructure SWE](https://openai.com/careers/software-engineer-agent-infrastructure-san-francisco/)\n- [Sundeep Teki - How to Get Hired at OpenAI/Anthropic/DeepMind 2026](https://www.sundeepteki.org/advice/how-to-get-hired-at-openai-anthropic-and-google-deepmind-in-2026)\n- [Sundeep Teki - AI Research Engineer Interview Guide](https://www.sundeepteki.org/advice/the-ultimate-ai-research-engineer-interview-guide-cracking-openai-anthropic-google-deepmind-top-ai-labs)\n- [Sundeep Teki - FDE Interviews](https://www.sundeepteki.org/advice/the-definitive-guide-to-forward-deployed-engineer-interviews-in-2026)\n- [Hashnode - Complete 2026 Guide to FDE](https://hashnode.com/blog/a-complete-2026-guide-to-the-forward-deployed-engineer)\n\n### Interview process sources\n- [Design Gurus - System Design Interviews Changed in 2026](https://designgurus.substack.com/p/system-design-interviews-changed)\n- [IGotAnOffer - Anthropic Interview Process](https://igotanoffer.com/en/advice/anthropic-interview-process)\n- [Jobright - Anthropic Technical Interview 2026](https://jobright.ai/blog/anthropic-technical-interview-questions-complete-guide-2026/)\n- [Sierra - The AI-Native Interview](https://sierra.ai/blog/the-ai-native-interview)\n- [Alexey Grigorev - AI Engineering Field Guide (Interview Process)](https://github.com/alexeygrigorev/ai-engineering-field-guide/blob/main/interview/01-interview-process.md)\n- [interviewing.io - Meta AI-Assisted Coding Interview](https://interviewing.io/blog/how-to-use-ai-in-meta-s-ai-assisted-coding-interview-with-real-prompts-and-examples)\n- [Exponent - OpenAI System Design 2026](https://www.tryexponent.com/blog/openai-system-design-interview)\n- [Exponent - Anthropic System Design 2026](https://www.tryexponent.com/blog/anthropic-system-design-interview)\n\n### Emerging role coverage\n- [AI Career Lab - Agentic-AI Job Guide 2026](https://theaicareerlab.com/blog/agentic-ai-jobs-guide-2026)\n- [Practical DevSecOps - Top 10 Emerging AI Security Roles](https://www.practical-devsecops.com/emerging-ai-security-roles/)\n- [Fast Company - Google/Box CEOs: FDE most in-demand](https://www.fastcompany.com/91541878/google-box-ceos-say-this-is-the-most-in-demand-job-in-tech)\n- [Computerworld - FDE career emerging from AI shift](https://www.computerworld.com/article/4171867/heres-one-career-emerging-from-the-ai-shift-forward-deployed-engineers.html)\n- [Rootly - AI SRE Guide 2026](https://rootly.com/ai-sre-guide)\n- [Resolve.ai - What is an AI SRE](https://resolve.ai/glossary/what-is-ai-sre)\n- [Medium - Rise of MCP Skills](https://medium.com/@adnanmasood/the-rise-of-model-context-protocol-mcp-skills-5f0d6a1c3579)\n\n### Compliance & regulation\n- [EU AI Act Implementation Timeline](https://artificialintelligenceact.eu/implementation-timeline/)\n- [Secure Privacy - EU AI Act 2026 Compliance](https://secureprivacy.ai/blog/eu-ai-act-2026-compliance)\n- [Augment Code - EU AI Act 2026 Guide](https://www.augmentcode.com/guides/eu-ai-act-2026)\n\n---\n\n*See also: [Question Bank](01-question-bank.md) | [Answer Frameworks](02-answer-frameworks.md) | [Behavioral for AI Roles](05-behavioral-for-ai-roles.md) | [Role Transition Guide](../TRANSITION_GUIDE.md)*\n"}, {"filename": "07-faq.md", "label": "快速 FAQ", "title_zh": "AI 工程、RAG 与 Agent 快速问答", "summary": "用短答案覆盖 AI 工程、RAG、Agent、模型、评测、推理、记忆和安全等高频问题，适合复习前快速扫一遍。", "detail": "FAQ 适合作为复习索引，不适合替代深入学习。它把常见概念压缩成可快速回忆的答案，例如 RAG 与微调的区别、混合检索、GraphRAG、上下文工程、MCP、Agentic RAG、LLM-as-judge、RAGAS、vLLM、提示词注入和 Agent 沙箱。遇到与你项目相关的问题，建议从 FAQ 先恢复答案骨架，再回到题库或白板练习补充架构、指标和故障处理细节。", "content": "# Frequently Asked Questions: AI Engineering, RAG, and Agents\n\nShort, direct answers to the questions people ask most about modern AI system design. Each answer points to the chapter where the topic is covered in depth.\n\n## Table of Contents\n\n- [General: AI Engineering Role](#general)\n- [RAG and Retrieval](#rag)\n- [Agents and Tool Use](#agents)\n- [Models and Selection](#models)\n- [Evaluation and Observability](#evaluation)\n- [Inference and Cost](#inference)\n- [Memory and State](#memory)\n- [Security and Safety](#security)\n\n---\n\n## General\n\n### What is an AI engineer?\n\nAn AI engineer builds production systems on top of large language models. The role sits between traditional software engineering and machine learning research: less model training, more system design around models that already exist. Day-to-day work covers prompt and context engineering, retrieval pipelines, agent loops, evaluation harnesses, and the infrastructure that keeps it all online. See [AI Job Market Trends](06-job-market-trends-2026.md).\n\n### What is the difference between an AI engineer and an ML engineer?\n\nML engineers train, fine-tune, and ship models. AI engineers compose existing models (usually via APIs) into products. ML engineers spend their time on datasets and training loops. AI engineers spend their time on prompts, RAG, agents, evals, and latency. The boundary blurs at large companies that do both. See [Transition Guide](../TRANSITION_GUIDE.md).\n\n### How do I become an AI engineer?\n\nIf you already write production code, the gap is small: learn how LLMs behave, learn RAG and agent patterns, learn evaluation, and learn one inference stack. The [Transition Guide](../TRANSITION_GUIDE.md) maps your current role (backend, frontend, QA, PM, data, DevOps) to the AI roles that fit and the specific skills to close.\n\n### What programming language should I learn for AI engineering?\n\nPython is the default for AI work. TypeScript is the most common second language because frontend and edge agent stacks live there. C# and Go show up in enterprise infrastructure roles. Most production AI code reads as ordinary application code: HTTP clients, queue consumers, database calls, plus calls to a model provider.\n\n### Is AI engineering a good career?\n\nDemand is strong and pay tracks senior software engineering, often higher at frontier labs. The risk is that the stack changes fast: a framework that mattered last year may be deprecated today. The skills that compound across releases are evaluation, system design, and grounded debugging. See [Job Market Trends](06-job-market-trends-2026.md).\n\n---\n\n## RAG\n\n### What is RAG?\n\nRetrieval-Augmented Generation is the pattern of fetching external context (documents, rows, code, images) at query time and putting it in the LLM's prompt so the model can ground its answer instead of hallucinating from training data. It is the most common production pattern for any LLM that needs to know things outside its training cutoff. See [RAG Fundamentals](../06-retrieval-systems/01-rag-fundamentals.md).\n\n### How does RAG work?\n\nA user query is converted into a search request, the system retrieves the most relevant chunks from a knowledge store (vector DB, keyword index, graph, or a mix), reranks them, and passes the top results to the LLM as context for generation. The two failure points are retrieval (the right chunk was not returned) and generation (the model ignored or misused the chunk). Most RAG failures are retrieval failures.\n\n### Is RAG dead because of long context windows?\n\nNo. Even with 1M-2M token context windows on Claude Opus 4.7, Claude Sonnet 4.6, GPT-5.5, and Gemini 3.1 Pro, RAG wins on cost, latency, freshness, and corpus scale. Enterprise datasets (SharePoint, log archives, code monorepos) exceed any context window. RAG acts as the filter that finds the 0.01% of data worth putting into that high-value window. See [RAG vs Long Context](../06-retrieval-systems/14-production-rag-at-scale.md).\n\n### What is the difference between RAG and fine-tuning?\n\nRAG injects knowledge at query time through context. Fine-tuning bakes behavior into the weights. The rule of thumb: **RAG for facts, fine-tuning for form**. Use RAG when the knowledge changes, when you need citations, or when data must stay outside the model. Use fine-tuning when you want a consistent tone, a strict output format, or lower latency on repeated tasks. See [Fine-Tuning Strategies](../03-training-and-adaptation/02-fine-tuning-strategies.md).\n\n### What is the best vector database?\n\nThere is no single best. Pinecone wins on managed scale and SLAs. Qdrant leads open-source speed (roughly 12ms p99 at 10M vectors). Weaviate has the strongest native hybrid (BM25 + dense + metadata in one query). Milvus is the choice once you need distributed scale beyond 50M vectors. pgvector is the right answer if you are already on Postgres and your index is under 10M vectors. See [Vector Databases](../06-retrieval-systems/04-vector-databases.md).\n\n### What is contextual retrieval?\n\nContextual retrieval is an Anthropic technique that prepends a short LLM-generated context summary to each chunk before embedding and indexing it, so the chunk carries its place in the document with it. Anthropic reports a 49% reduction in retrieval failures with hybrid search, and 67% when combined with a reranker. See [Contextual Retrieval](../06-retrieval-systems/10-contextual-retrieval.md).\n\n### What is hybrid search?\n\nHybrid search combines sparse keyword retrieval (typically BM25) with dense vector retrieval and fuses the two ranked lists into one, usually with Reciprocal Rank Fusion. The sparse arm catches exact tokens (product codes, function names, rare nouns); the dense arm catches synonyms and intent. Every modern vector DB ships hybrid out of the box. See [Hybrid Search](../06-retrieval-systems/05-hybrid-search.md).\n\n### What is GraphRAG?\n\nGraphRAG extracts entities and relationships from a corpus, builds a knowledge graph, and queries by traversal instead of (or alongside) vector similarity. It is the right pattern for **aggregative questions** (\"summarize all legal risks across these 50 contracts\") where vector RAG returns related-but-disconnected chunks. Microsoft's LazyGraphRAG defers expensive community summarization to query time, cutting ingestion cost. See [GraphRAG](../06-retrieval-systems/07-graph-rag.md).\n\n### What is the best chunk size for RAG?\n\nThere is no universal answer. 300-500 token chunks with 50-token overlap is a reasonable default for prose. Code and structured data want larger chunks (1000-2000 tokens). The bigger wins come from **structure-aware chunking** (split at headers, paragraphs, code blocks), **contextual chunking** (prepend a summary), and **hierarchical chunking** (index small chunks, return the parent context). See [Chunking Strategies](../06-retrieval-systems/02-chunking-strategies.md).\n\n---\n\n## Agents\n\n### What is an AI agent?\n\nAn AI agent is a system where an LLM decides what to do next, runs a tool, observes the result, and decides again, all in a loop. The simplest agent is the ReAct pattern: Thought → Action → Observation → repeat. Modern agents (Claude Opus 4.7, GPT-5.5 reasoning, DeepSeek-R2) bake the reasoning step into the model itself. See [Agent Fundamentals](../07-agentic-systems/01-agent-fundamentals.md).\n\n### What is the difference between an agent and a chatbot?\n\nA chatbot responds to a message. An agent **takes actions** in the world: runs code, calls APIs, reads files, sends messages, books appointments. That distinction matters because actions are hard to roll back, so agents need very different guardrails, sandboxing, and human-in-the-loop patterns. See [Agentic Security](../07-agentic-systems/09-agentic-security-and-sandboxing.md).\n\n### What is MCP (Model Context Protocol)?\n\nMCP is an open protocol that lets LLM applications connect to tools and data sources through a standard interface. Anthropic launched it in November 2024. Governance moved to the Linux Foundation's Agentic AI Foundation in December 2025. Adoption is universal: Anthropic, OpenAI, Google, Microsoft, AWS all support it. As of May 2026 there are over 2,300 public MCP servers. See [Tool Use and MCP](../07-agentic-systems/03-tool-use-and-mcp.md).\n\n### What is the best agent framework?\n\nThe big three cover most production needs. **LangGraph** (graph-based, surpassed CrewAI in stars in early 2026) is the default for stateful multi-agent control flow with checkpointing. **CrewAI** (now v1.13, used in 60%+ of the Fortune 500) is the choice for role-based business automation. **Microsoft Agent Framework** (RC 1.0 February 2026, GA Q2 2026) is the consolidated successor to AutoGen and Semantic Kernel for enterprise .NET and Python. See [Framework Selection Guide](../09-frameworks-and-tools/08-framework-selection-guide.md).\n\n### What is agentic RAG?\n\nAgentic RAG replaces the linear retrieve-then-generate pipeline with a loop where the agent decides what to retrieve, evaluates whether the results are good enough, and re-queries if not. Patterns include Self-RAG (model emits reflection tokens), Corrective RAG (separate grader), Adaptive RAG (classifier picks the depth), and multi-hop decomposition. Budget for 8-12 seconds per query at three to four iterations. See [Agentic RAG](../06-retrieval-systems/08-agentic-rag.md).\n\n### How do computer-use agents work?\n\nA computer-use agent takes screenshots of a desktop or browser, decides on a mouse and keyboard action, executes it, and takes another screenshot. The three production options are Claude Computer Use (OS-portable via screenshots), Google Gemini Computer Use (browser-optimized via DOM awareness), and OpenAI Operator (web-task focused). Claude Sonnet 4.6 reaches 72.5% on OSWorld-Verified, up from 14.9% at the October 2024 launch. See [Computer-Use Agents](../17-tool-use-and-computer-agents/04-computer-use-agents.md).\n\n### What is context engineering?\n\nContext engineering is curating the full set of tokens an agent sees on every inference turn (system prompt, tools, retrieved data, prior tool results, message history), as opposed to prompt engineering, which writes one good instruction once. It matters because long-running agents suffer **context rot**: accuracy drops as the window fills with stale tool output. The core techniques are compaction (summarize and restart the loop), just-in-time loading (hold references, fetch on demand), structured note-taking (write progress outside the window), and sub-agent isolation (delegate detail-heavy sub-tasks to a clean window that returns a short summary). The goal is the smallest high-signal token set per turn. See [Context Engineering](../05-prompting-and-context/05-context-engineering.md).\n\n### What are Agent Skills?\n\nAgent Skills are folders of instructions, scripts, and resources that an agent loads on demand to specialize at a task. Each skill is a `SKILL.md` file with YAML metadata plus optional bundled files. They use **progressive disclosure**: the name and description sit in the system prompt, the full `SKILL.md` loads only when the agent judges it relevant, and referenced files load only as needed, which keeps context small. Skills complement MCP: MCP connects an agent to tools and data, Skills teach it the workflow for using them. See [Building Tool-Use Agents](../17-tool-use-and-computer-agents/05-building-tool-agents.md).\n\n---\n\n## Models\n\n### What is the best LLM right now?\n\nThere is no single best model as of August 2026, and the leaderboard is fractured by task. **Claude Fable 5** holds the capability ceiling at $10/$50 per 1M. **Claude Opus 5** (July 24) is the long-horizon agentic coding choice at $5/$25, with a Fast mode at $10/$50. **GPT-5.6** ships as three tiers, with Sol at $5/$30, Terra at $2/$12 as the general production default, and Luna at $0.20/$1.20 for volume work. **Gemini 3.7 Flash** (August 13) is the cheap multimodal workhorse at a half-price $0.75/$3.75 through year-end. **Claude Sonnet 5** is the price-to-quality workhorse at a permanent $2/$10, cheaper than the Sonnet 4.6 it replaced. See [Model Taxonomy](../02-model-landscape/01-model-taxonomy.md).\n\n### How much does Claude / GPT / Gemini / DeepSeek cost?\n\nPricing changes monthly. As of June 2026, frontier-tier closed models run roughly $3-15 per million input tokens and $15-75 per million output tokens, with caching cutting that 75-90% on repeated prefixes. Mid-tier models (Claude Sonnet 4.6, GPT-5.5-mini, Gemini 3.1 Flash) run roughly $0.30-3 / $1-15 per million. **DeepSeek reset the floor**: V4 Pro is $0.435 / $0.87 per 1M (75% discount made permanent May 22, 2026), and V4 Flash is $0.14 / $0.28 per 1M with a 1M context window, roughly 10x cheaper than the closed frontier for many tasks. Always cross-check the provider pricing pages for current rates. See [Pricing and Costs](../02-model-landscape/03-pricing-and-costs.md).\n\n### What is the difference between Claude Opus and Claude Sonnet?\n\nOpus is Anthropic's frontier tier (Opus 4.8: smartest of the 4.x line, $5/$25). Sonnet is the production workhorse: roughly 90% of Opus quality at 60% of the price. Haiku is the fast tier: cheap, low-latency, good for routing and classification. Above all three sits Claude Fable 5 ($10/$50), the capability ceiling for work that justifies 2x Opus pricing. The right pattern is to route easy queries to Haiku, mid queries to Sonnet, hard ones to Opus, and only ceiling-bound work to Fable. See [Model Selection](../02-model-landscape/04-model-selection-guide.md).\n\n### Should I use an open-source model?\n\nYes for cost-per-query at high volume, data residency, or fine-tuning needs. Open-weight quality has closed to within 5-15 points of the closed frontier (Qwen3-Embedding-8B leads MTEB Multilingual, Llama 4 Maverick and DeepSeek V4 Pro are competitive frontier picks). The tradeoff is operational: you own the inference stack, the GPU bill, and the security patches. See [Model Landscape](../02-model-landscape/01-model-taxonomy.md).\n\n### What is prompt caching?\n\nPrompt caching keeps the KV cache for a fixed prompt prefix warm on the inference server so subsequent calls only pay for the new tokens. All major providers support it. Cache reads are 75-90% cheaper than fresh tokens. The catch: cache writes typically cost 25% more, so caching only pays off if you reuse the same prefix at least 3-5 times within the TTL (usually 5 minutes). See [KV Cache and Context Caching](../04-inference-optimization/02-kv-cache-and-context-caching.md).\n\n---\n\n## Evaluation\n\n### How do you evaluate an LLM?\n\nLLM evaluation is layered: **reference-free metrics** (faithfulness, relevance, coherence via LLM-as-judge) for rapid iteration, **golden test sets** for regression, and **task-specific metrics** (exact match for QA, BLEU for translation, pass@k for code). For RAG specifically, use the RAG Triad: context relevance, faithfulness, answer relevance. See [LLM Evaluation](../14-evaluation-and-observability/01-llm-evaluation.md).\n\n### What is LLM-as-judge?\n\nLLM-as-judge uses one LLM to score the output of another against a rubric (correctness, helpfulness, safety). It scales where human evaluation cannot, but has known biases: position bias, verbosity bias, self-preference bias. The standard practice is to use a stronger model as judge (Claude Opus 4.8 or GPT-5.5 reasoning), randomize positions, and validate against a small human-labeled sample.\n\n### What is the best LLM observability tool?\n\nThe leading platforms are **Langfuse** (best self-hosted open-source, acquired by ClickHouse in January 2026), **Braintrust** (best for eval-driven CI/CD with quality gates), **LangWatch** (best for agent simulation), **LangSmith** (LangChain-native), and **Arize Phoenix** (OTel-native). Pick based on deployment model (SaaS vs self-hosted), whether you need CI/CD gating, and how heavily you use a specific framework. See [Observability](../14-evaluation-and-observability/02-observability.md).\n\n### What is RAGAS?\n\nRAGAS (Retrieval Augmented Generation Assessment) is a Python library for RAG evaluation. It provides reference-free metrics (faithfulness, answer relevance, context relevance) and reference-based metrics (context recall, context precision) computed with LLM-as-judge. It is the de facto starting point for any RAG eval pipeline. See [RAG Evaluation](../06-retrieval-systems/13-rag-evaluation-patterns.md).\n\n### How do you detect and handle model drift in production?\n\nDrift comes from two sides: the **provider** silently updates a model (or you migrate versions), and your **traffic** shifts away from what your prompts and evals were tuned on. Detection: pin model versions explicitly, run a canary eval suite daily against the pinned and latest versions, track output-distribution stats (length, refusal rate, format validity) and judge-scored quality on a sampled live slice, and alert on deltas. Response: a frozen golden set tells you whether the model changed or your traffic did; re-run prompt evals before adopting a new version, and keep the previous version warm for instant rollback. Treat an unexplained quality drop like an incident with an on-call path, not a curiosity.\n\n---\n\n## Inference\n\n### What is vLLM?\n\nvLLM is an open-source LLM inference engine that pioneered PagedAttention (virtual-memory-style allocation of the KV cache). It is the default open inference engine when the workload is \"Llama, Mistral, Qwen, or DeepSeek under continuous batching.\" It is the easiest to operate and best-patched of the major engines. Multimodal deployments must run v0.18.2+ due to a February 2026 CVE. See [Serving Infrastructure](../04-inference-optimization/06-serving-infrastructure.md).\n\n### What is the difference between vLLM and SGLang?\n\nBoth are open-source inference engines. vLLM has broader model coverage and operational maturity. SGLang has roughly 29% higher throughput on structured-output and function-calling workloads thanks to async constrained decoding, and best-in-class prefix-cache reuse via RadixAttention. Important caveat: SGLang's multimodal path has unpatched CVEs as of May 2026, so multimodal traffic should run on vLLM v0.18.2+ instead.\n\n### What is TensorRT-LLM?\n\nNVIDIA's inference engine. Delivers 2-4x higher throughput than vLLM and TGI on H100/H200/B200, but at the cost of 1-2 weeks of setup and a hard NVIDIA lock-in. The right choice when you have committed NVIDIA capacity and the throughput delta pays for the operational tax.\n\n### How do you optimize LLM inference cost?\n\nFive high-leverage moves: **model cascading** (route easy queries to small models, hard ones to frontier), **prompt caching** (75-90% off repeated prefixes), **semantic caching** (skip the LLM call entirely for similar queries), **quantization** (FP8 or 4-bit weights to fit more on a GPU), and **continuous batching** (vLLM/SGLang batch at the iteration level). Together they routinely cut inference cost by 10x without losing quality. See [Cost Optimization](../04-inference-optimization/07-cost-optimization-playbook.md).\n\n### What is speculative decoding?\n\nSpeculative decoding lets an LLM generate multiple tokens per forward pass by having a cheaper \"draft\" model (or extra heads on the main model, like Medusa) predict the next few tokens, then verifying them all in a single parallel pass on the target model. The win is 2-3x faster wall-clock generation with zero quality loss. Built into vLLM and TensorRT-LLM. See [Speculative Decoding](../04-inference-optimization/03-speculative-decoding.md).\n\n### What is a token budget and how do you enforce it?\n\nA token budget is a hard ceiling on token consumption at a chosen scope: per request (max input plus `max_tokens` output), per user or tenant per day, per agent task (step budgets so a runaway loop cannot burn the month's spend), and per team per month for expensive tiers. Enforcement lives in the gateway, not in prompts: count tokens before dispatch, reject or downgrade requests over the per-request cap, decrement tenant quotas atomically, and terminate agent runs that exceed their step budget with a clean escalation. The practical pairing is budget plus routing: when a tenant nears quota, the router degrades them to a cheaper tier instead of cutting them off.\n\n### How do you design fallbacks across multiple LLM providers?\n\nTreat providers as unreliable dependencies with policy differences, not just uptime differences. The pattern: a primary with one or two fallbacks per task type, circuit breakers per provider on error rate, p95 latency, and rate-limit headroom, with pre-emptive traffic shifting before hard limits. Three details separate production designs from whiteboard ones: **provider-paired prompts** (a prompt tuned for Claude underperforms on GPT-5.5, so prompt variants version with the provider), **cache economics** (failing over resets your prefix cache, so a warm primary can beat a nominally cheaper cold fallback), and **policy-aware fallback** (a provider can decline a content category your product needs, which is a failure class your health checks will not catch). Verify the whole chain monthly with a game-day drill.\n\n---\n\n## Memory\n\n### What is the best AI agent memory framework?\n\nThe four mature options as of May 2026 are **Mem0** (broadest standalone memory layer, scores 92.5 on LoCoMo and 94.4 on LongMemEval), **Zep** (temporal-aware production pipelines with native conversation summarization), **Letta** (OS-style paging for long-running agents with unbounded memory), and **Cognee** (knowledge-graph-first for RAG-heavy workflows). Pick by use case: chatbot personalization → Mem0; production agent at scale → Zep; long-horizon task agent → Letta; KG-grounded RAG → Cognee. See [Agentic Memory](../08-memory-and-state/04-agentic-memory-mem0.md).\n\n### What is the difference between short-term and long-term memory in agents?\n\nShort-term memory lives in the LLM's context window (the current turn, tool outputs, scratchpad). Long-term memory persists across sessions in a vector DB, graph, or relational store. Memory architectures split further: **episodic** (past trajectories), **semantic** (extracted facts about the user/world), **procedural** (learned skills, playbooks). Picking the right tier for a given fact matters: a session preference promoted to long-term memory leaks across sessions. See [Memory Architectures](../08-memory-and-state/01-memory-architectures.md).\n\n### How does a knowledge graph help an AI agent?\n\nA knowledge graph stores entities and relationships explicitly (User → OWNER_OF → Project_A). It gives the agent **deterministic** retrieval over structured relationships, which vector search cannot. The strongest pattern is hybrid: vector search finds the entry node by similarity, graph traversal expands relevant context. Used for compliance, multi-hop reasoning, and any domain where relationships are first-class (legal, biomedical, finance). See [Long-Term Memory](../08-memory-and-state/03-long-term-memory.md).\n\n---\n\n## Security\n\n### What is prompt injection?\n\nPrompt injection is the LLM-era version of SQL injection: malicious content in a user input or a retrieved document overrides the system instructions and makes the model do something it should not. **Direct injection** is in the user prompt. **Indirect injection** is hidden in a document the model reads (a webpage, an email, a PDF). The OWASP LLM Top 10 lists it as the #1 LLM risk. See [Prompt Injection Defense](../05-prompting-and-context/08-prompt-injection-defense.md).\n\n### How do you prevent prompt injection?\n\nThere is no silver bullet: prompt injection cannot be fully \"escaped\" the way SQL can. The production defense stack combines: **input isolation** (XML tags marking untrusted content), **dual-LLM patterns** (small guard model classifies intent before the main model sees the input), **canary tokens** (detect if the model leaked its system prompt), **least-privilege tool scopes**, and **human-in-the-loop** on destructive tool calls. See [Agentic Security](../07-agentic-systems/09-agentic-security-and-sandboxing.md).\n\n### What is OWASP LLM Top 10?\n\nThe OWASP Top 10 for LLM Applications (v2.0, released 2025) is the canonical list of LLM security risks. Top entries: prompt injection, insecure output handling, training data poisoning, model denial of service, supply chain vulnerabilities, sensitive information disclosure, insecure plugin design, excessive agency, overreliance, and model theft. The 2026 update for agentic apps adds goal hijacking, identity abuse, and cascading failures as top risks. See [LLM Security](../12-security-and-access/01-llm-security.md).\n\n### What is sandboxing in AI agents?\n\nSandboxing isolates the code an agent generates and runs from the host system. The standard pattern uses ephemeral micro-VMs (E2B, Docker, Firecracker) that spin up in under 10ms, run the code, and get destroyed. Without sandboxing, a prompt-injected agent can `rm -rf /` or exfiltrate secrets. With sandboxing, the worst case is a destroyed throwaway container.\n\n---\n\n## Related Reading\n\n- [Question Bank (128 senior interview questions)](01-question-bank.md)\n- [Answer Frameworks](02-answer-frameworks.md)\n- [Common Pitfalls](03-common-pitfalls.md)\n- [Whiteboard Exercises](04-whiteboard-exercises.md)\n- [AI Job Market Trends](06-job-market-trends-2026.md)\n\n---\n\n*Have a question that should be here? Open an issue or PR on the repo.*\n"}];

function escapeHtml(value) { return value.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function inline(value) {
  let result = escapeHtml(value);
  result = result.replace(/`([^`]+)`/g, '<code>$1</code>');
  result = result.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  result = result.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  result = result.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return result;
}
function renderMarkdown(source) {
  const lines = source.replace(/\r/g, '').split('\n');
  let html = '', inCode = false, code = [], list = null, table = false;
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  const closeTable = () => { if (table) { html += '</tbody></table>'; table = false; } };
  for (const line of lines) {
    if (line.startsWith('```')) { if (inCode) { html += `<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`; code = []; inCode = false; } else { closeList(); closeTable(); inCode = true; } continue; }
    if (inCode) { code.push(line); continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const cells = line.trim().replace(/^\||\|$/g, '').split('|').map(x => x.trim());
      if (/^\s*[-:]+\s*$/.test(cells[0] || '')) continue;
      closeList();
      if (!table) { html += '<table><thead><tr>' + cells.map(x => `<th>${inline(x)}</th>`).join('') + '</tr></thead><tbody>'; table = true; }
      else html += '<tr>' + cells.map(x => `<td>${inline(x)}</td>`).join('') + '</tr>';
      continue;
    }
    closeTable();
    const heading = line.match(/^(#{1,3})\s+(.*)$/);
    if (heading) { closeList(); const level = heading[1].length; html += `<h${level}>${inline(heading[2])}</h${level}>`; continue; }
    const bullet = line.match(/^\s*[-*+]\s+(.*)$/);
    const numbered = line.match(/^\s*\d+\.\s+(.*)$/);
    if (bullet || numbered) { const wanted = numbered ? 'ol' : 'ul'; if (list !== wanted) { closeList(); html += `<${wanted}>`; list = wanted; } html += `<li>${inline((bullet || numbered)[1])}</li>`; continue; }
    if (/^>\s?/.test(line)) { closeList(); html += `<blockquote>${inline(line.replace(/^>\s?/, ''))}</blockquote>`; continue; }
    closeList();
    if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  closeList(); closeTable(); if (inCode) html += `<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`;
  return html;
}
function render() {
  const doc = documents[current];
  document.getElementById('eyebrow').textContent = doc.label;
  document.getElementById('title').textContent = doc.title_zh;
  document.getElementById('doc-list').innerHTML = documents.map((item, index) => `<button class="${index === current ? 'active' : ''}" data-doc="${index}">${item.label}</button>`).join('');
  document.querySelectorAll('[data-doc]').forEach(button => button.onclick = () => { current = Number(button.dataset.doc); mode = 'english'; render(); });
  document.getElementById('tabs').innerHTML = modes.map(item => `<button class="${item.id === mode ? 'active' : ''}" data-mode="${item.id}">${item.label}</button>`).join('');
  document.querySelectorAll('[data-mode]').forEach(button => button.onclick = () => { mode = button.dataset.mode; render(); });
  const panel = document.getElementById('panel');
  if (mode === 'english') panel.innerHTML = `<div class="markdown">${renderMarkdown(doc.content)}</div>`;
  if (mode === 'chinese') panel.innerHTML = `<div class="detail"><div class="summary"><strong>中文学习提示</strong><br>${doc.summary}</div>${doc.detail}</div>`;
  if (mode === 'summary') panel.innerHTML = `<div class="summary"><strong>中文概要</strong><br>${doc.summary}</div><p>建议：先阅读本概要，再切换到英文详情定位原文，最后用中文详情整理自己的面试表达。</p>`;
}
render();
</script>
