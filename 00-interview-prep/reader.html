CI/CD\n\n代码测试之外，还要对 Prompt、工具 Schema、模型配置、评测集和安全规则做版本管理。Pull Request 触发单元测试、离线评测、回归测试、提示词注入测试和成本检查；通过门禁后灰度发布，监控异常再回滚。\n\n模型供应商升级时要重新跑固定测试集，不能因为 API 兼容就默认行为兼容。\n\n### Q32：如何处理 Rate Limit 和 Quota？\n\n在网关统一实施按用户、租户、模型和 API Key 的限流；使用令牌桶或漏桶控制请求速率，结合并发限制、队列、指数退避和带抖动的重试。对 429、超时和服务端错误分别处理，避免盲目重试造成雪崩。\n\n需要配额监控、预算告警、优先级队列、Fallback 模型和降级响应。限流策略必须与租户公平性和业务优先级结合。\n\n### Q33：描述 LLM 应用安全策略\n\n覆盖提示词注入、间接注入、敏感数据泄露、越权工具调用、供应链风险、输出安全、模型拒答绕过、日志泄露和多租户隔离。工具必须最小权限、参数校验、审计和人工确认；代码执行必须放在隔离沙箱。\n\n安全是分层控制：输入检测、上下文隔离、工具策略、输出过滤、网络限制、审计和事件响应共同承担风险，不能只依赖系统 Prompt。\n\n## 工具与生命周期问题\n\n### Q34：不同向量数据库的权衡是什么？\n\n比较维度包括召回质量、过滤能力、索引类型、扩展方式、多租户隔离、备份恢复、延迟、运维复杂度和成本。Pinecone 等托管服务降低运维成本，Qdrant/Weaviate 提供专用能力，pgvector 适合已有 PostgreSQL 且规模适中的团队。\n\n不要脱离数据量和查询模式选数据库。必须用自己的向量、过滤条件和并发模型做基准测试。\n\n### Q35：如何处理模型更新和供应商弃用？\n\n建立模型目录、版本锁定、变更通知、评测门禁和回滚路径。新旧模型并行运行固定评测集和少量流量，比较质量、延迟、成本和安全指标后再切换。\n\n抽象模型网关，避免业务代码直接绑定单一供应商；保留 Prompt、参数、响应和错误的版本记录。\n\n### Q36：什么是 DSPy，什么时候使用？\n\nDSPy 把 Prompt 和多步 LLM 程序表示成模块，通过示例、指标和优化器自动改进指令或少量参数。它适合有稳定评测集、希望系统化优化 Prompt、并且不想手工反复试错的场景。\n\n它不是所有问题的替代方案。数据集和指标不可靠时，自动优化可能放大错误；生产中仍需人工审查、版本管理和回归门禁。\n\n### Q37：如何设计持续改进的反馈闭环？\n\n收集显式反馈（点赞、点踩、纠正）和隐式反馈（重试、停留、任务完成、人工转接）。将反馈脱敏、去重、标注并分成错误类型，回流到评测集、Prompt/Skill 优化、检索改进和模型路由。\n\n不要直接把所有用户反馈当作训练数据。要检查反馈质量、选择偏差、隐私和奖励投机，并持续比较线上指标与离线指标。\n\n### Q38：解释 token 计数，以及它为什么重要\n\nToken 是模型处理文本的基本单位。Token 数影响上下文是否超限、输入输出成本、KV Cache、延迟和批处理效率。不同模型的 tokenizer 不同，不能用字符数粗略替代真实 token 数。\n\n生产系统应在调用前估算 token，设置输入/输出预算，在超限前进行截断、摘要或降级，并记录每次调用的 token 与成本。\n\n### Q39：如何客观比较不同 RAG 系统？\n\n固定数据集、问题、参考答案、指标和运行环境，分别比较检索、生成、端到端质量、延迟、成本和稳定性。使用统计置信区间、分层切片和人工抽检，避免只展示平均分。\n\n同时测试新鲜数据、长文档、稀有术语、权限过滤、多语言、对抗输入和无答案问题。最终选择应反映业务目标，而不是单一公开指标。\n\n## 集成方法问题\n\n### Q40：什么时候使用 Self-Consistency，什么时候使用 Best-of-N？\n\nSelf-Consistency 让模型对同一个问题采样多条推理路径，再用多数或聚合结果选择答案，适合存在多个推理路径且答案可比较的任务。Best-of-N 生成多个候选，再用评分器挑选最优答案，适合开放式生成。\n\n两者都会增加调用成本。必须防止评分器偏好表面流畅、奖励投机或重复答案，并根据质量提升是否值得额外成本决定是否启用。\n\n### Q41：如何防止 Best-of-N 中的奖励投机？\n\n使用独立且多维的评分器，加入事实性、安全性、任务完成和引用正确性，而不是只评分文风。对候选结果做去重、对抗测试和人工抽检；不要让生成模型完全知道评分器的漏洞。\n\n### Q42：设计比较两个 LLM 开放式任务的评测系统\n\n固定输入集和任务说明，随机化 A/B 输出顺序，使用盲评的 LLM-as-Judge 和人工样本。评分维度包括正确性、完整性、相关性、风格、安全和格式，报告胜率、平局、置信区间和按任务类型的切片。\n\n还要控制位置偏差、长度偏差、模型自偏好和评测污染，并结合用户反馈和生产任务完成率。\n\n### Q43：集成学习和模型仲裁有什么区别？\n\n集成学习通常组合多个模型的输出，以降低方差或提升泛化；模型仲裁则由一个路由器或裁判根据输入、候选答案和成本选择模型或答案。前者强调组合，后者强调动态决策。\n\n在 LLM 系统中，两者可以结合：多个模型生成候选，仲裁器根据质量和成本选择，最后用业务指标验证是否比单模型更好。\n\n### Q44：什么时候使用 Multi-Agent Debate，什么时候使用 Mixture of Agents？\n\nMulti-Agent Debate 让多个 Agent 互相质疑和修正，适合需要批评、验证和对抗推理的任务；Mixture of Agents 通常让不同 Agent 负责不同能力，最后由聚合器综合，适合专业分工和并行处理。\n\n两者都增加延迟、成本和协调复杂度。只有当错误代价高、任务天然可分解且评测证明多 Agent 有收益时才使用。\n\n### Q45：什么时候使用 LangChain，什么时候从零实现？\n\n框架适合快速组合模型、工具、检索和常见中间件，降低样板代码；从零实现适合流程简单、对延迟和依赖控制要求高、或框架抽象阻碍调试的场景。\n\n选择时评估团队熟悉度、可观测性、版本稳定性、扩展点、性能和迁移成本。不要因为框架流行就把所有业务逻辑隐藏在不可调试的抽象中。\n\n### Q46：如何处理长对话的上下文窗口限制？\n\n采用最近消息保留、历史摘要、事实/实体提取、分层记忆、按需检索和上下文压缩。明确区分短期对话状态、长期用户记忆和外部知识库。\n\n压缩结果需要评测信息保真度，不能只看 token 减少比例。对关键字段保留结构化状态，并允许在必要时回溯原始历史。\n\n### Q47：如何防御 Prompt Injection？\n\n把不可信输入、检索文档和工具返回值视为数据而不是指令；隔离系统指令与外部内容，限制工具权限，使用结构化输出、输入/输出检测、沙箱、网络策略和人工确认。\n\n不要把单一关键词过滤或系统 Prompt 当作完整防御。要对间接注入、跨步骤传播、工具参数污染和数据外泄进行端到端测试。\n\n### Q48：什么时候选择微调而不是 Prompt Engineering？\n\n当任务行为稳定、拥有高质量示例、需要持续一致的格式/风格/工具调用，并且 Prompt 已无法满足质量或成本要求时考虑微调。知识经常变化、需要引用和快速更新时优先 RAG。\n\n先建立 Prompt 基线和评测集，再用小规模微调实验比较收益、数据准备成本、推理成本和维护成本。\n\n### Q49：如何优化实时 LLM 应用的延迟？\n\n先分解 TTFT、检索、重排序、首 token、生成和后处理延迟，再针对瓶颈优化：流式输出、缓存、查询改写控制、并行工具调用、较小模型路由、上下文压缩、批处理和连接复用。\n\n同时监控 P50/P95/P99，避免平均延迟掩盖尾延迟。优化必须保持质量、可靠性和安全门禁。\n\n## 高级问题（2025 年 12 月）\n\n下面的问题把前面的基础能力放到更接近生产事故、架构决策和组织协作的场景中。回答时仍然使用“范围 → 指标 → 架构 → 权衡 → 评测 → 可靠性”的顺序。\n\n### Q50：解释 MCP，以及它为什么对生产 Agent 很重要\n\nMCP 为模型连接工具、资源和提示词提供标准协议，减少每个应用分别编写适配器的重复工作。生产使用时要补充 Server 身份、工具权限、传输安全、审计、版本兼容和用户确认；协议标准化不等于自动安全。\n\n### Q51：Agent 完成一个本应 5 次调用的任务，却调用了 47 次，如何调试？\n\n先通过 Trace 重建每次模型调用、工具调用、上下文和状态转换，区分重复规划、工具失败、参数错误、上下文丢失和停止条件失效。再设置最大迭代次数、重复动作检测、单任务预算、工具超时和显式终止状态，并用回归样本验证调用数下降后质量没有下降。\n\n### Q52：什么时候选择推理模型（o3、DeepSeek-R1），而不是标准模型（GPT-5.2）？\n\n在复杂数学、规划、代码和多步推理任务中，推理模型可能值得额外成本；简单抽取、分类、改写和高吞吐任务通常使用标准模型更合适。用任务级准确率、延迟、成本和失败率做比较，不要仅凭模型名称决定。\n\n### Q53：系统接受用户输入时，如何防止 Prompt Injection？\n\n将用户输入视为不可信数据，隔离系统指令，限制工具权限，使用结构化参数和输出校验，并对敏感操作要求人工确认。测试直接注入、间接注入、跨轮次传播、文档注入和工具返回值注入。\n\n### Q54：Agentic RAG 与传统 RAG 有什么区别？\n\n传统 RAG 通常执行固定的查询、检索、重排序和生成流程；Agentic RAG 允许模型根据问题拆分任务、改写查询、选择工具、循环检索和验证结果。Agentic RAG 更灵活，但成本、延迟、可预测性和安全风险更高，应先证明固定流程无法满足需求。\n\n### Q55：RAG 在测试数据上很好，生产却失败，你检查什么？\n\n检查生产数据分布、文档新鲜度、解析和分块、权限过滤、Embedding/索引版本、查询类型、召回结果、Prompt、模型版本和上下文长度。将线上失败样本加入分层评测集，区分检索失败、上下文使用失败和生成幻觉，再针对根因修复。\n\n### Q56：如何为可以执行真实动作的自主 Agent 设计 Guardrail？\n\n采用最小权限工具、明确动作边界、参数校验、金额/范围限制、沙箱、网络策略、速率和预算限制。读操作可以自动执行，写入、付款、删除和外部通信等高风险动作必须人工确认，并保留完整审计和可回滚记录。\n\n### Q57：解释 KV Cache，以及它对推理优化的意义\n\nKV Cache 保存已经计算的注意力 Key/Value，避免生成每个新 token 时重复计算上下文。它能降低解码计算，但会随上下文和并发增长，占用大量显存；因此要结合 Paged Attention、缓存量化、批处理和上下文限制设计。\n\n### Q58：设计一个保证用户 Prompt 不会泄露给另一个用户的系统\n\n在 API、会话状态、缓存、向量检索、日志、队列和模型上下文的每一层都携带并校验租户/用户身份。缓存键、Checkpoint、索引过滤和 Trace 必须隔离；用跨租户攻击、并发请求和错误重试测试数据泄露。\n\n### Q59：LLM 成本比预期高 10 倍，如何调查？\n\n先按租户、路由、模型、输入/输出 token、缓存命中、重试、Agent 循环和工具调用拆分账单。重点排查上下文膨胀、重复请求、失败重试风暴、错误模型路由和输出失控，再通过预算、限额、缓存、压缩、路由和回归成本门禁修复。\n\n### Q60：如何评估 LLM 是否产生幻觉？\n\n把回答拆成可验证事实，与检索上下文、数据库或可信来源逐条核对；使用蕴含判断、引用正确性、人工标注和用户反馈。区分无依据陈述、事实错误、来源错配和合理推断，并跟踪生产中的幻觉率和纠错率。\n\n### Q61：比较不同 Embedding 模型用于 RAG 的权衡\n\n比较领域召回率、语言覆盖、向量维度、索引大小、延迟、服务成本和对精确字段/缩写的处理能力。必须用自己的查询集和分块方式评估，还要观察与 BM25、重排序组合后的端到端效果。\n\n### Q62：检索结果相关，但 LLM 忽略它们并依赖训练知识，如何修复？\n\n检查上下文格式、来源标记、上下文长度和关键内容位置；在 Prompt 中要求基于来源回答、证据不足时明确拒答并返回引用。减少噪声、重排序、把证据放在有效位置，并增加“仅根据上下文回答”的回归样本。\n\n### Q63：如何管理生产环境的 Prompt 版本？\n\n把 Prompt 当作代码管理：版本号、变更说明、作者、评测结果、关联模型和回滚版本都要记录。发布前跑离线回归和安全测试，线上灰度并记录每次请求使用的 Prompt 版本。\n\n### Q64：设计一个真正可用于生产的语义缓存\n\n缓存键不仅包含归一化查询，还应包含租户、权限、模型、Prompt、知识库版本和关键参数。使用相似度阈值、TTL、失效策略和敏感查询绕过；命中后仍要检查权限与数据新鲜度，并评估错误缓存的风险。\n\n### Q65：Agent 可以执行任意 Python 代码，如何保证安全？\n\n不要在主机直接执行。使用短生命周期沙箱、最小文件系统、禁用或限制网络、资源配额、系统调用策略、超时和进程隔离；输出经过过滤，代码和依赖做审计，所有执行记录可追踪。高风险动作需要人工确认。\n\n## 高级问题——2026 年 3 月\n\n### Q66：什么时候使用 Claude 的 extended/adaptive thinking，而不是标准模式？如何控制成本？\n\n复杂推理、规划和代码任务可以启用更高思考预算；简单任务使用标准模式。通过任务路由、最大思考预算、超时、缓存、质量门禁和失败降级控制成本，并用任务级收益而非“思考 token 越多越好”来评估。\n\n### Q67：GPT-5.5 的 reasoning effort 如何工作？什么时候选它而不是 Claude Opus 4.8？\n\n把 reasoning effort 看成质量、延迟和成本之间的控制旋钮。选择时比较真实任务上的推理正确率、工具调用、长上下文、结构化输出、延迟和价格；不要只根据公开榜单或品牌选择。\n\n### Q68：如何把 Claude Code 或 OpenHands 作为 CI/CD 的自动修复组件？\n\n让 Agent 在隔离分支和沙箱中读取构建日志，提出修改，运行受限测试并生成 Pull Request，禁止直接部署和访问生产凭据。必须有测试门禁、变更审查、供应链检查、回滚、审计和人工批准。\n\n### Q69：低成本高能力的 DeepSeek 开源权重模型会怎样改变生产架构？\n\n可以增加自托管、批处理、蒸馏和多模型路由的选择，但要重新评估 GPU、运维、许可证、数据安全、质量波动和供应链风险。保留供应商模型作为 Fallback，并用统一模型网关隔离业务。\n\n### Q70：如何利用供应商 Prompt Caching 提高命中率？\n\n把稳定的系统指令、工具定义和长期知识放在 Prompt 前部，把用户动态内容放在后部；保持序列化格式稳定，减少不必要的版本变化，并监控命中率、缓存成本和失效原因。\n\n### Q71：如何使用 LLM-as-a-Judge 构建生产评测流水线？失败模式是什么？\n\n定义清晰 rubric，固定输入和评分格式，使用盲评、成对比较、多评判器和人工校准。注意评分器偏见、位置偏差、长度偏差、模型自偏好、评测污染和指标被优化的问题；评测结果必须与用户和业务指标对照。\n\n### Q72：解释 MCP 2.0 及生产环境 MCP Server 的安全风险\n\n重点讨论工具权限、资源访问、身份认证、传输、Server 供应链、提示词注入、日志和租户隔离。生产部署要有工具白名单、OAuth/密钥管理、沙箱、审计、速率限制和版本兼容测试。\n\n### Q73：如何设计动态语义路由，选择能满足质量要求的最低成本模型？\n\n先定义任务难度和质量阈值，再使用分类器、Embedding 相似度、历史成功率或小模型预测路由。记录路由决策和实际质量，防止反馈循环；对不确定样本升级到更强模型，并定期重新校准。\n\n### Q74：候选人声称系统准确率 95%，你会问什么？\n\n询问数据集来源、样本量、标签质量、指标定义、分母、时间切分、类别分布、拒答处理、置信区间、生产分布和人工复核。还要确认是否存在数据泄露、重复样本或只测了容易样本。\n\n### Q75：SWE-bench Verified 和 LiveCodeBench 有什么区别？哪个更适合评估 Coding Agent？\n\n比较任务来源、验证方式、污染风险、交互过程和评测目标。Coding Agent 评估不应只看最终测试通过率，还要看修改范围、工具使用、失败恢复、成本、时间和安全性；根据目标选择或组合基准。\n\n### Q76：供应商静默升级模型后，生产幻觉率增加 30%，如何响应？\n\n通过模型版本、质量指标和固定回归集检测变化，冻结或切回已知版本，扩大人工抽检并隔离影响流量。随后与供应商确认变更，更新 Prompt/路由或模型，补充版本锁定、变更监控和自动回滚。\n\n### Q77：如何设计 99.9% 可用性的多供应商 LLM 架构？\n\n建立统一网关和能力抽象，保留至少一个可切换供应商；实现健康检查、超时、熔断、重试、Fallback、限流和区域冗余。先明确不同供应商输出差异，使用契约测试、质量监控和故障演练验证切换。\n\n### Q78：是否可以用 1M 上下文替代整个 RAG 管线？\n\n比较长上下文的输入成本、延迟、注意力衰减、数据权限、新鲜度、上下文污染和可解释性。对小规模静态知识可以采用混合方案，但企业系统通常仍需要检索、权限过滤、摘要和来源控制。\n\n### Q79：多租户 Agent 读取外部网页时，如何防御 Prompt Injection？\n\n把网页和文档作为不可信数据，隔离指令与内容；工具调用采用最小权限和结构化参数，敏感动作需要确认，网络访问使用白名单和沙箱。跨租户状态、缓存、Trace 和外部内容都要隔离。\n\n### Q80：Error Analysis 与 Automated Evals 有什么区别？什么时候优先哪个？\n\nError Analysis 通过人工查看失败样本发现未知问题和错误类别；Automated Evals 适合持续回归、门禁和大规模比较。新系统或问题不明确时先做人工错误分析，错误模式稳定后再自动化，并持续抽样防止评测盲区。\n\n## 高级问题——2026 年 5 月\n\n### Q81：如何为 2026 年 6 月的生产 Agent 选择 Frontier 模型？\n\n先用自己的任务集比较质量、工具调用、长上下文、延迟、成本、安全和可用性，再针对候选模型做灰度。模型选择必须能被评测和回滚，不应把供应商营销材料当成生产结论。\n\n### Q82：如何利用 DeepSeek V3.2/V4 的低价、缓存折扣和峰谷价格？\n\n把稳定 Prompt 前缀、批处理和缓存命中率纳入成本模型，将可延迟任务安排到低峰，将复杂任务和实时任务分开路由。缓存折扣不能掩盖质量、可用性、区域和供应商依赖风险。\n\n### Q83：模型宣称 10M 上下文，但长上下文评测很差，如何建议团队？\n\n上下文窗口上限不等于有效注意力容量。先测任务相关位置、长文档召回、成本和延迟，再选择检索、分层摘要、分块和短上下文路由，而不是简单把全部资料塞进去。\n\n### Q84：什么时候在生产中部署 latent/continuous-space reasoning？\n\n只有当模型在目标任务上稳定改善质量，且部署栈、可观测性、成本和故障处理成熟时才考虑。新型推理机制要先建立可重复基线，确认它不是只在少数 benchmark 上有效。\n\n### Q85：什么时候 Agent 需要超越长上下文的 Memory 层？\n\n当信息需要跨会话持久化、按用户检索、长期更新、权限隔离或结构化管理时，才引入长期记忆。短期上下文足以解决当前任务时不要增加记忆层；记忆写入必须有来源、置信度、过期和删除策略。\n\n### Q86：Prompt Engineer 职位减少后，哪些工作取代了它？\n\nPrompt 工作被吸收到 AI 应用工程、评测、产品、Agent、可靠性和安全岗位中。市场更重视把提示词变成可测试、可观测、可维护的系统能力，而不是孤立地编写漂亮 Prompt。\n\n### Q87：Agent 五分钟内调用坏工具 400 次，如何从架构层阻止？\n\n编排器设置最大步数、重复动作检测、状态机终止条件和预算；工具层做熔断、参数校验、幂等和速率限制；成本层设置租户/任务配额、告警和人工升级。三层都需要记录 Trace。\n\n### Q88：Agent-as-Judge 与 LLM-as-Judge 的升级何时值得？\n\nAgent-as-Judge 可以调用工具、查看多步轨迹并验证过程，适合 Agent 行为和任务完成评估；代价是成本、延迟、评测自身的工具权限和循环风险。先确认简单 Judge 无法覆盖的问题，再增加能力。\n\n### Q89：如何为客服 Agent 设计 Process Reward Model？\n\n对检索证据、工具选择、权限遵守、步骤效率、事实性和最终任务结果分别打分。防止奖励退化要使用多维指标、独立验证集、人工抽检和对抗样本，避免模型只优化表面格式。\n\n### Q90：什么时候使用 A2A，什么时候使用 MCP？\n\nMCP 主要标准化 Agent 与工具/资源的连接；A2A 主要解决 Agent 之间的发现、委托和协作。复杂系统可以用 A2A 编排 Agent，再由每个 Agent 使用 MCP 访问工具，但两层都需要身份、权限和审计。\n\n### Q91：MCP STDIO 传输出现高危漏洞，生产架构如何修复？\n\n盘点所有 Server 和依赖，隔离不可信 Server，升级修复版本，限制 STDIO 宿主权限，增加沙箱和工具白名单，并通过供应链扫描、回归测试和分阶段发布验证修复。\n\n### Q92：AI 构造的零日漏洞被用于攻击后，威胁模型如何变化？\n\n攻击者发现和利用漏洞的速度提高，防御系统要把 Agent、代码模型、工具和依赖纳入持续威胁建模。增加最小权限、网络隔离、代码审查、SBOM、秘密扫描、异常检测和事件响应演练。\n\n### Q93：面向欧盟多租户 AI 产品，如何做 FRIA/DPIA 双评估？\n\n分别评估基本权利影响和个人数据保护影响，记录用途、数据流、风险、缓解措施、供应商、人工监督、保留期限和用户申诉。把结论落实到权限、日志、数据最小化、透明度和发布门禁。\n\n### Q94：如何设计能填表、点击和读屏的 Computer-use Agent？\n\n使用隔离桌面和浏览器、最小网络策略、域名白名单、敏感字段遮罩、动作预览和高风险操作确认。所有点击和输入都要有可审计轨迹，失败时暂停而不是不断重试。\n\n### Q95：第三方只提供模型权重、不提供训练数据，如何做供应链信任？\n\n核验来源、许可证、签名、哈希、构建环境、已知漏洞、模型卡和评测；使用 Sigstore/OpenSSF 等签名机制确认制品来源，但签名不能证明训练数据合法或模型没有后门，仍需沙箱、行为评测和持续监控。\n\n### Q96：RAG Agent 读取不可信网页时，如何设计分层防御？\n\n抓取层做域名、文件类型和恶意内容过滤；解析层把指令与数据分离；检索层进行权限和来源控制；生成层要求证据引用；工具层最小权限、沙箱和人工确认；线上监控注入命中、异常工具调用和数据外泄。\n\n### Q97：MoE 模型给推理服务带来哪些系统设计变化？\n\n需要关注专家路由、专家负载不均、跨设备通信、容量因子、显存布局和批处理。服务系统要监控热点专家和 token dropping，针对并发、序列长度和硬件拓扑做基准，而不能只按总参数估算资源。\n\n### Q98：客户每月花费 5 万美元，如何报价蒸馏项目？\n\n拆分数据准备、教师模型生成、训练、评测、部署和维护成本，计算蒸馏后质量、延迟、GPU/托管成本和回本周期。明确重蒸馏触发条件，例如任务分布、模型或业务规则变化，而不是承诺一次训练永久有效。\n\n### Q99：高吞吐开源模型服务如何选择 vLLM、SGLang 和 TensorRT-LLM？\n\n根据模型支持、硬件、吞吐、首 token 延迟、结构化输出、工具调用、量化和团队运维能力做基准。vLLM 通用性强，SGLang 适合复杂生成程序，TensorRT-LLM 适合 NVIDIA 深度优化；最终以实际工作负载决定。\n\n### Q100：如何为六个月预测周期选择 AI 加速器策略？\n\n估算模型大小、并发、上下文、利用率、供货、功耗、网络、软件栈和折旧，再比较 GPU、专用 ASIC 和云端租用。保留弹性容量与多供应商选择，避免根据单一芯片峰值性能做决策。\n\n### Q101：多租户 RAG 在 Pinecone、Weaviate 和 pgvector 中如何选择？\n\n比较 Namespace、分片和 Row-Level Security 的隔离强度、噪声邻居影响、审计能力、运维和成本。不能只按查询速度选择；要测试租户规模、过滤、备份恢复、权限错误和审计要求。\n\n### Q102：什么时候需要招聘 Forward Deployed Engineer，而不是扩充客户成功或解决方案工程？\n\n当客户部署需要深度定制、现场解决技术问题并把反馈带回产品时，FDE 的价值更高。若主要是培训、配置和关系维护，客户成功更合适；若主要是标准化售前集成，Solutions Engineering 更合适。岗位边界应以交付瓶颈和可复制性决定。\n\n### Q103：第三方 Agent SDK 事件说明了什么供应商锁定风险？\n\n模型协议、订阅政策、用量计费和 Agent 平台都可能变化。架构上应使用统一网关、可替换模型、自己的 Prompt/评测资产、数据可迁移格式和多供应商 Fallback，避免把核心状态绑定到一个供应商。\n\n### Q104：自主经营实验对生产 Agent 设计有什么启示？\n\nLLM 可以完成连续任务，但在目标理解、记账、长期规划和异常恢复上仍会犯系统性错误。生产设计应缩小动作边界、引入结构化状态、预算和人工监督，并让 Agent 在不确定时停下来请求确认。\n\n### Q105：闭源模型和开源策略如何平衡？\n\n闭源模型提供强能力和托管便利，开源模型提供部署控制、成本和可定制性。采用分层策略：核心复杂任务使用高质量模型，稳定高频任务使用自托管或微调模型，并用统一评测与路由降低锁定。\n\n### Q106：如何在团队中建立真正有效的 AI 评测文化？\n\n从产品目标和失败案例建立评测集，明确指标和质量门禁，把评测纳入 PR 与发布流程，定期人工复核并公开回归结果。防止工程师刷指标：使用隐藏集、分层切片、线上反馈和多维指标，而不是只优化一个总分。\n\n### Q107：生成式 AI 功能的 PRD 应包含哪些内容？\n\n包括用户问题、非目标、输入输出、质量指标、幻觉政策、拒答和 Fallback、数据与权限、Prompt/模型方案、评测方法、成本、延迟、安全、人工介入、监控、灰度和回滚。PRD 必须说明“什么时候系统不应该自动回答”。\n\n### Q108：如何设计 p99 小于 500ms 的实时欺诈检测系统？\n\n把预算拆给规则、特征查询、传统模型、RAG/LLM 和最终决策。硬实时路径优先使用缓存特征和确定性模型，LLM 放到异步解释或低风险补充路径；超时必须有安全默认结果，不能让 LLM 拖垮 p99。\n\n### Q109：多数 Pull Request 由 Agent 生成时，如何设计代码审查？\n\n要求 Agent 提交可审计的变更说明、测试和风险；使用静态扫描、依赖检查、单元/集成测试、秘密扫描和人工审批。高风险目录、权限和部署配置必须提高审查级别，不能把另一个 Agent 的批准当作最终信任。\n\n### Q110：AI 法律检索工具生成虚假引用，如何处理事故与披露？\n\n先停止受影响功能、保留证据、识别范围并通知相关方，再纠正输出和评估业务影响。修复包括来源强制校验、引用存在性检查、证据不足拒答、人工审查、审计和对外披露政策；事后把事故样本加入回归集。\n\n## 高级问题——2026 年 6 月\n\n### Q111：如何评价按分类器将敏感查询路由到更强模型的模式？\n\n它可以在成本和能力之间做分层，但分类器错误会导致敏感请求走错模型或质量不足。需要明确敏感定义、分类器评测、默认安全路径、审计、Fallback 和数据处理边界。\n\n### Q112：Agent 短任务表现好，运行超过 30 分钟就恶化，如何诊断？\n\n检查上下文增长、状态丢失、旧目标污染、工具结果冗余、循环和错误恢复。通过阶段摘要、结构化状态、记忆分层、Checkpoint、计划重建和周期性自检控制长任务复杂度。\n\n### Q113：Computer-use Agent 演示成功，生产工作流失败 30%，如何做可靠性工程？\n\n建立真实任务集和失败分类，记录屏幕、动作、环境、延迟和权限状态；增加重试上限、元素定位兜底、环境标准化、人工接管和安全暂停。按任务完成率、误操作率和恢复时间做灰度。\n\n### Q114：如何为内部 Agent 设计 Agent Skills？\n\nSkill 是可复用的任务能力说明和执行步骤，MCP Tool 是可调用接口，微调则改变模型行为。Skill 应有版本、输入输出、权限、依赖、示例、评测和安全边界，安装前经过审核。\n\n### Q115：评测分数持续提高，但生产投诉不变，如何诊断评测投机？\n\n检查评测集污染、指标定义、样本代表性、评分器偏差和是否只优化容易样本。增加真实失败样本、隐藏集、人工抽检、用户结果和按租户/任务切片的线上指标。\n\n### Q116：如何设计成本感知的多供应商路由？\n\n路由器需要读取任务难度、上下文长度、预算、供应商健康度和历史质量，选择满足质量阈值的最低成本模型。记录决策、实际结果和成本，设置熔断、Fallback、配额和反馈去偏。\n\n## 高级问题——2026 年 7 月\n\n### Q117：MCP 无状态修订如何迁移现有有状态 Server？\n\n先盘点会话、初始化、粘性会话和 Server 主动请求的依赖，把状态迁移到外部存储或由客户端携带状态句柄。分阶段兼容新旧协议，做回放、故障转移和并发测试后再移除旧握手。\n\n### Q118：单一 Frontier 供应商连续故障，如何设计 Agent 平台？\n\n把模型调用抽象到网关，保留能力相近的备用供应商，支持超时、熔断、重试、任务续跑和结果降级。对关键任务保存 Checkpoint，进行供应商故障演练并记录质量差异。\n\n### Q119：编码 CLI 偷传整个代码库，如何设计不可绕过的遥测？\n\n默认最小采集，明确数据边界，敏感文件和秘密本地过滤；所有外发请求都经过可审计网关和用户可见的策略控制。隐私开关必须由本地强制执行，不能只依赖服务端承诺。\n\n### Q120：如何设计请求级模型路由器？\n\n使用任务标签、历史质量、成本和上下文特征预测模型能力需求，采用候选模型逐级升级。标签来自人工、离线评测和真实结果；要防止路由反馈循环、选择偏差、供应商故障和质量漂移。\n\n### Q121：如何设计能容纳越界模型的能力评测环境？\n\n将模型运行在无生产凭据、隔离网络、最小文件系统和受限工具的沙箱，使用可回收环境、出站代理、蜜罐和行为监控。任何评测模型都不应接触真实第三方生产系统。\n\n### Q122：Agent Data Injection 如何攻击有支付权限的浏览 Agent？\n\n把网页、订单、商品字段和邮件都视为不可信数据，支付动作必须由结构化策略和人工确认控制。限定金额、收款方、域名和会话，使用双重确认、审计、撤销和异常检测。\n\n## 高级问题——2026 年 8 月\n\n### Q123：模型价格大幅上涨，如何重建成本模型？\n\n把价格按输入、输出、缓存、峰谷、供应商和路由拆分，重新计算每个业务任务的单位成本和预算。通过缓存、压缩、小模型路由、批处理、Fallback 和限额应对价格变化，同时保留质量门禁。\n\n### Q124：高能力网络安全模型采用审批等级，如何设计访问控制？\n\n使用身份验证、组织/用户风险等级、硬件密钥、用途审批、最小权限、环境隔离和持续审计。高风险能力分级开放，所有请求绑定责任主体、预算和可追溯记录。\n\n### Q125：恶意 npm 包打开仓库就执行代码，如何防御？\n\n锁定依赖和供应链来源，验证签名与哈希，禁用自动执行钩子，使用隔离工作区和无凭据环境，运行依赖扫描、SBOM、静态分析和沙箱测试。编码 Agent 不能默认拥有宿主机全部权限。\n\n### Q126：如何审核和分发 Agent Plugins？\n\n把 Skill、MCP Server、依赖、权限和网络访问作为整体审核。建立来源验证、静态/动态扫描、人工审查、沙箱试运行、版本锁定、发布审批、撤回和审计流程；不能只依赖静态恶意检测。\n\n### Q127：如何在无状态 MCP 规范上设计安全的多租户 Server？\n\n使用服务端签发、不可猜测且有过期时间的状态句柄，把租户、用户、权限和资源绑定到句柄并每次校验。加入 OAuth、作用域、速率限制、审计、数据过滤和重放防护，不能因为协议无状态就省略身份认证。\n\n### Q128：生成文本和图片的产品如何满足 EU 与加州透明度要求？\n\n建立生成内容标识、用户告知、来源/水印或元数据、日志、申诉和供应商责任链。根据地区和风险分类制定不同控制，保存可审计证据，并让产品、法务、安全和工程共同维护合规流程。\n\n## 关键要点\n\n- AI 系统设计不能只谈模型，要覆盖数据、检索、生成、工具、评测、可观测性、安全和运营。\n- 优秀回答会明确假设、指标和权衡，并说明如何验证。\n- 生产系统必须有成本控制、失败降级、权限隔离、人工升级和回滚路径。\n- 复杂技术不等于复杂架构；先建立最小可行方案，再根据真实瓶颈增加 Agent、记忆或多模型能力。\n\n## 面试技巧总结\n\n先用 SPIDER 组织系统设计题，用 ETA 解释概念，用 Trade-off 分析方案，用 Debugging 框架回答事故，用 STAR-L 讲真实经历。结合自己的项目时，要准确区分独立实现、参与建设和只理解原理的部分。\n\n## 参考资料\n\n原文中列出的研究、产品文档、模型和市场资料应以原始来源为准。涉及价格、岗位趋势、法规、协议版本和模型能力的内容具有时效性，面试前需要重新核对日期和官方信息。\n\n## 系统设计场景\n\n### 场景 1：设计客服聊天机器人\n\n先明确渠道、用户规模、支持的业务范围、是否需要查订单或执行退款，以及人工转接和合规要求。基础架构包括 API 网关、身份认证、意图识别、知识库检索、订单工具、LLM、输出安全检查、会话状态和人工升级。\n\n核心设计点是把只读问答和有副作用的动作分开；订单、退款和账户修改必须校验权限并要求确认。对无答案、工具超时、模型故障和敏感问题提供明确降级。用解决率、转人工率、首次解决率、延迟、成本和用户满意度评测。\n\n### 场景 2：设计文档处理流水线\n\n设计异步流水线：上传 → 病毒扫描 → 文档解析 → OCR/版面识别 → 表格和图片处理 → 清洗 → 分块 → Embedding → 索引 → 质量检查。每一步使用任务队列和幂等 ID，失败进入重试或 Dead Letter Queue。\n\n需要保存原始文件、解析版本、文档状态、错误原因和索引版本；对权限继承、重复文件、增量更新、超大文件、低质量 OCR 和删除传播做设计。监控吞吐、处理延迟、失败率、队列积压和索引新鲜度。\n\n### 场景 3：设计企业搜索 RAG 系统\n\n同时设计离线索引和在线查询管线。离线侧负责连接器、权限同步、解析、分块、Embedding、BM25 和向量索引；在线侧负责鉴权、查询改写、混合检索、重排序、上下文组装、LLM 生成和来源引用。\n\n最关键的是权限不能只在生成后过滤，必须在检索层完成租户、用户和文档 ACL 过滤。评测集要覆盖精确字段、同义问题、无答案、权限边界和文档更新，并跟踪 Recall、Faithfulness、引用正确率和搜索延迟。\n\n### 场景 4：设计代码助手\n\n明确代码补全、问答、搜索、修改、运行测试和提交 PR 的范围。只读索引、代码搜索和编辑工具可以分层开放；执行命令、修改文件、访问网络和创建 PR 必须在沙箱、工作区和权限策略下运行。\n\n关键能力包括仓库索引、上下文选择、差异预览、测试验证、秘密扫描、依赖供应链检查、人工审查和回滚。评测代码正确率、测试通过率、修改范围、任务完成时间、工具调用成本和误操作率。\n\n### 场景 5：设计 AI 内容审核系统\n\n采用规则、传统分类模型、Embedding 检索和 LLM 复核的分层架构。低风险内容快速通过，高风险或不确定内容进入更强模型和人工审核；模型输出必须结构化，保留证据、策略版本和决定原因。\n\n系统需要处理多语言、图片/视频、多租户策略、申诉、模型漂移和突发流量。评测不能只看准确率，还要按违规类别计算 Precision、Recall、误杀率、漏放率、审核延迟和人工负载，并为模型故障提供安全默认策略。\n", "summary_content": "# 《AI 系统设计面试题库》中文概要\n\n## 内容范围\n\n本章覆盖 128 道 AI 系统设计问题和 5 个综合设计场景，主题包括：\n\n- RAG、分块、混合检索、重排序和多租户隔离\n- Agent、ReAct、Tool Calling、MCP、Flow Engineering 和 Multi-agent\n- 模型选择、推理模型、Embedding、KV Cache、批处理和量化\n- LLM 评测、RAGAS、幻觉、可观测性、CI/CD 和成本控制\n- 向量数据库、DSPy、反馈闭环、Prompt 版本和安全\n- 客服、文档处理、企业搜索、代码助手和内容审核系统设计\n\n## 面试答题主线\n\n所有题目都可以沿着这条主线组织：\n\n```text\n澄清场景 → 明确指标 → 画出数据流 → 深挖关键路径\n→ 讨论评测与可观测性 → 补充可靠性、安全和成本\n```\n\n## 最应该掌握的知识\n\n### RAG\n\n能够完整解释数据接入、解析、分块、Embedding、向量检索、BM25、RRF、重排序、上下文组装、LLM 生成和引用。要知道什么时候用 RAG，什么时候用微调或长上下文。\n\n### Agent\n\n能够区分 Workflow 和 Agent，解释 ReAct 循环、Tool Calling、MCP、状态管理、Checkpoint、循环限制、人工升级和多 Agent 的适用边界。\n\n### 评测\n\n能够从检索、生成和端到端三个层面设计评测，并把 RAGAS、LLM-as-Judge、人工抽检、用户反馈和生产回归结合起来。\n\n### 生产化\n\n必须主动覆盖延迟、吞吐、成本、限流、配额、Fallback、模型版本、Prompt 版本、可观测性、故障恢复、权限隔离和安全。\n\n## 对你的重点关联\n\n- RRF、BM25 和向量检索可以结合金融产品知识查询说明\n- Tool Calling、循环限制和 Flow Engineering 可以结合 AliceFeed Copilot 说明\n- 上下文压缩可以用于回答长对话和 Agent 状态管理\n- RAGAS、测评集和自动化回归可以用于回答 LLM 应用评测\n- Langfuse 可以用于回答 Agent Trace、Prompt 版本和可观测性\n- Java 后端经验可以用于说明网关、限流、缓存、队列、数据一致性和故障恢复\n\n## 学习顺序\n\n1. 先掌握 Q1-Q10 的 RAG 基础架构\n2. 再学习 Q11-Q17 的 Agent 和 MCP\n3. 用 Q18-Q49 补齐模型、推理、评测、生产和安全基础\n4. 用 Q50-Q128 训练前沿场景和追问能力\n5. 最后练习 5 个综合系统设计场景\n\n## 一句话总结\n\n这不是一份单纯的模型知识题库，而是一套训练“如何把 AI 能力设计成可评测、可观测、可控制、可上线系统”的面试材料。\n"}, {"filename": "02-answer-frameworks.md", "section_id": "00-interview-prep", "section_label": "00 · 面试准备", "label": "答题框架", "title_zh": "AI 系统设计答题框架", "summary": "提供 SPIDER、ETA、Trade-off、Debugging 和 STAR-L 五种框架，帮助你把零散知识组织成结构化、可追问的面试回答。", "detail": "SPIDER 用于系统设计：先澄清范围，再确定优先级，画出初始架构，深入关键路径，补充评测与可观测性，最后讨论可靠性和规模。ETA 用于解释概念：先用简单语言说明，再补充技术细节，最后落到应用场景与权衡。Trade-off 用于比较方案，Debugging 用于定位线上问题，STAR-L 用于行为面试。你的回答可以把这些框架和真实项目结合起来：先说明金融问答场景，再讲 RAG、Tool Calling、上下文压缩和 Langfuse，最后用 RAGAS 或回归测试说明如何验证效果。", "content": "# Answer Frameworks for AI System Design Interviews\n\nFive structured frameworks for AI system design interviews: SPIDER for design questions, ETA for concepts, tradeoff analysis, debugging, and STAR-L for behavioral.\n\nStrong interview answers follow consistent structures. This chapter provides frameworks for different question types, with examples and anti-patterns. Pair these frameworks with worked examples from the [Question Bank](01-question-bank.md) and rehearse with [Whiteboard Exercises](04-whiteboard-exercises.md).\n\n## Table of Contents\n\n- [System Design Framework (SPIDER)](#system-design-framework-spider)\n- [Worked Example: SPIDER in a 45-Minute Session](#worked-example-spider-in-a-45-minute-session) ⭐ *NEW*\n- [Concept Explanation Framework (ETA)](#concept-explanation-framework-eta)\n- [Tradeoff Analysis Framework](#tradeoff-analysis-framework)\n- [Debugging and Troubleshooting Framework](#debugging-and-troubleshooting-framework)\n- [Behavioral Questions Framework (STAR-L)](#behavioral-questions-framework-star-l)\n- [Handling Unknown Topics](#handling-unknown-topics)\n- [Common Mistakes and How to Avoid Them](#common-mistakes-and-how-to-avoid-them)\n\n---\n\n## System Design Framework (SPIDER)\n\nUse this framework for any system design question involving AI components. The full motion with rough time budget per phase:\n\n```mermaid\nflowchart LR\n    A[S Scope and clarify<br/>5 min] --> B[P Prioritize requirements<br/>3 min]\n    B --> C[I Initial architecture<br/>10 min]\n    C --> D[D Deep dive critical paths<br/>15 min]\n    D --> E[E Evaluation and observability<br/>5 min]\n    E --> F[R Reliability and scale<br/>5 min]\n```\n\n### S - Scope and Clarify\n\n**Purpose:** Narrow the problem space and show you think before you build.\n\n**Questions to ask:**\n- What is the scale? (users, requests, data volume)\n- What are the latency requirements?\n- What accuracy or quality bar must we meet?\n- Are there compliance or security requirements?\n- What is the existing infrastructure?\n- What is the budget constraint?\n\n**Example:**\n```\nInterviewer: Design a customer support chatbot.\n\nYou: Before I dive in, I want to clarify a few things:\n- What volume are we expecting? Thousands or millions of conversations per day?\n- Is this customer-facing or internal support?\n- What languages need to be supported?\n- Do we need to integrate with existing ticketing systems?\n- What is our accuracy target for resolved vs escalated?\n```\n\n**Anti-pattern:** Jumping straight into architecture without understanding requirements.\n\n---\n\n### P - Prioritize Requirements\n\n**Purpose:** Identify what matters most and design toward it.\n\n**Create a priority matrix:**\n\n| Requirement | Priority | Implication |\n|-------------|----------|-------------|\n| Low latency | High | May limit model size |\n| High accuracy | High | Need good retrieval + eval |\n| Cost efficiency | Medium | Optimize with caching |\n| Multi-language | Medium | Affects embedding choice |\n\n**State your priorities explicitly:**\n```\n\"Given these requirements, I will prioritize latency and accuracy. \nCost optimization will be a second-order concern once we have the basic system working.\"\n```\n\n---\n\n### I - Initial Architecture\n\n**Purpose:** Draw the high-level system before diving into details.\n\n**Standard components for AI systems:**\n```\n┌──────────┐     ┌──────────┐     ┌──────────┐     ┌──────────┐\n│  Client  │────▶│  API GW  │────▶│ AI Layer │────▶│  LLM(s)  │\n└──────────┘     └──────────┘     └──────────┘     └──────────┘\n                                        │\n                                        ▼\n                                  ┌──────────┐\n                                  │ Data/RAG │\n                                  └──────────┘\n```\n\n**Explain each component briefly:**\n- What it does\n- Why it is needed\n- What alternatives exist\n\n---\n\n### D - Deep Dive into Critical Paths\n\n**Purpose:** Show depth on the most important parts.\n\n**Choose 2-3 areas to deep dive based on:**\n- What the interviewer seems most interested in\n- What is novel or complex about this system\n- Where the biggest risks lie\n\n**Example deep dives:**\n- RAG pipeline: chunking, embedding, retrieval, reranking\n- Agent loop: tool selection, error handling, termination\n- Data pipeline: ingestion, processing, indexing\n- Security: isolation, permissions, audit\n\n**Signal your intent:**\n```\n\"I will now go deeper on the RAG pipeline since retrieval quality is critical to this system.\"\n```\n\n---\n\n### E - Evaluation and Observability\n\n**Purpose:** Show you think about production operations.\n\n**Cover:**\n1. **Metrics:** What do you measure?\n2. **Evaluation:** How do you know it works?\n3. **Monitoring:** How do you detect problems?\n4. **Alerting:** When do humans get paged?\n\n**Standard metrics for AI systems:**\n- Latency (p50, p95, p99)\n- Token usage / cost\n- Quality scores (offline and sampled online)\n- Error rates by type\n- Cache hit rates\n\n---\n\n### R - Reliability and Scale\n\n**Purpose:** Address failure modes and growth.\n\n**Failure modes to discuss:**\n- LLM provider outage\n- Rate limiting\n- Bad model outputs\n- Data pipeline failures\n- Cache invalidation\n\n**Scaling considerations:**\n- Where are the bottlenecks?\n- What scales horizontally vs vertically?\n- What costs scale with usage?\n\n---\n\n## Worked Example: SPIDER in a 45-Minute Session\n\nA condensed transcript showing how the framework sounds in a real loop. The prompt: \"Design a document Q&A system for a 10,000-employee company.\" Notes in brackets mark the framework step and the clock.\n\n```\n[0:00 - S: Scope]\nYou: \"Before I draw anything, let me scope this. Roughly how many\ndocuments, what types, and what freshness do answers need?\"\nInterviewer: \"About 2 million documents, mostly PDFs and wikis.\nUpdated daily is fine.\"\nYou: \"Two more: what accuracy bar are we targeting, and is this\ninternal-only or exposed to customers?\"\nInterviewer: \"Internal. Wrong answers are embarrassing but not\ncatastrophic. p95 under 3 seconds.\"\nYou: \"So: 2M mixed documents, daily freshness, internal users,\nsoft accuracy bar, p95 under 3s. I'll design for 10K employees\nwith maybe 5% daily active. That's roughly 500-2,000 queries/hour\nat peak. Sound right?\"\nInterviewer: \"Works.\"\n\n[0:05 - P: Plan the architecture out loud]\nYou: \"I'll draw the full pipeline first, then deep dive where you\nwant. Ingestion on the left: connectors, parsing, chunking,\nembedding, vector store. Serving on the right: query, hybrid\nretrieval, rerank, generation with citations, response. Eval and\nmonitoring underneath as a cross-cutting layer.\"\n\n[0:08 - I: Identify components, draw and narrate]\nYou: \"Ingestion: connectors pull from SharePoint and Confluence\nnightly. Parsing handles PDFs with a document-AI tier first and a\nvision-LLM fallback for complex layouts. Chunking is structure-\naware, 300-500 tokens with headers prepended. Embeddings go into\na vector DB with metadata: source, team, date, access tags.\"\nInterviewer: \"Why hybrid retrieval instead of pure vector?\"\nYou: \"Internal corpora are full of project codenames and\nacronyms. Embeddings miss exact-match tokens; BM25 catches them.\nRRF to fuse, cross-encoder rerank on the top 50. That combination\nis the difference between 70% and 90%+ retrieval hit rate here.\"\n\n[0:18 - D: Deep dive where the interviewer steers]\nInterviewer: \"Go deeper on access control.\"\nYou: \"Permissions evaluated at retrieval time, not index time.\nEvery chunk carries ACL tags from the source system. The retrieval\nquery filters on the caller's groups before similarity scoring, so\na result the user can't read never enters the candidate set. Index-\ntime filtering breaks the moment permissions change; retrieval-time\nfiltering follows the source of truth. Cache keys include the\npermission set so a cached answer never leaks across groups.\"\n\n[0:30 - E: Evaluate your own design]\nYou: \"Weaknesses I'd flag in my own design: nightly sync means up\nto 24h staleness, fine per requirements but I'd add webhook-based\ninvalidation for the wikis later. The reranker adds ~150ms at p95,\nworth it for quality. Failure modes: provider outage falls back to\na second model with provider-specific prompts; retrieval returning\nnothing returns 'not found in our docs' rather than letting the\nmodel improvise.\"\n\n[0:38 - R: Requirements check and evaluation story]\nYou: \"Back to the requirements: 3s p95 gives me a budget of\n~400ms retrieval, ~150ms rerank, ~2s generation, with streaming so\nperceived latency is under a second. For quality, I'd stand up a\n200-case golden set from real employee questions, score\nfaithfulness and citation accuracy with an LLM judge calibrated\nmonthly against human review, and sample 2% of production traffic.\nAnything else you'd like me to go deeper on?\"\n```\n\n**What this transcript demonstrates:**\n- Scope took five minutes and produced numbers the whole design referenced.\n- The candidate narrated while drawing and invited steering at each phase.\n- Deep-dive answers led with the decision, then the reason, then the failure mode.\n- The candidate critiqued their own design before the interviewer had to.\n- Evaluation was part of the design, not an afterthought.\n\n---\n\n## Concept Explanation Framework (ETA)\n\nUse this for conceptual questions like \"Explain RAG\" or \"What is speculative decoding?\"\n\n### E - Explain Simply\n\nStart with a one-sentence definition anyone could understand.\n\n**Example for KV Cache:**\n```\n\"KV cache stores intermediate computations during LLM generation so we \ndo not have to redo work for previous tokens when generating each new token.\"\n```\n\n---\n\n### T - Technical Details\n\nAdd the technical depth appropriate for the interviewer.\n\n**Example for KV Cache:**\n```\n\"Specifically, for each layer in the transformer, we cache the Key and \nValue tensors for all positions. On each new token, we only compute K \nand V for the new position and concatenate with the cache. \n\nThe memory scales as: 2 × layers × heads × head_dim × sequence_length × batch_size\n\nFor a 70B model with 8K context, that is roughly 10GB per request.\"\n```\n\n---\n\n### A - Applications and Tradeoffs\n\nConnect to practical usage and discuss tradeoffs.\n\n**Example for KV Cache:**\n```\n\"This is critical for production serving. Without it, generation would be \nquadratic in sequence length.\n\nThe tradeoff is memory usage. This is why techniques like PagedAttention \nand Grouped Query Attention exist: to reduce KV cache memory while \npreserving the benefits.\n\nContext caching features from OpenAI and Anthropic are essentially \nserver-side KV cache persistence for shared prefixes.\"\n```\n\n---\n\n## Tradeoff Analysis Framework\n\nWhen asked to compare options or justify a decision, use this structure.\n\n### Step 1: State the Options Clearly\n\n```\n\"For embedding models, we have three main options:\n1. OpenAI text-embedding-3-large: Highest quality, API cost\n2. Cohere embed-v3: Good quality, better pricing\n3. Self-hosted BGE: Full control, operational overhead\"\n```\n\n### Step 2: Define Evaluation Criteria\n\nPick criteria that matter for this specific decision:\n\n| Criteria | Weight | Reasoning |\n|----------|--------|-----------|\n| Quality | High | Search accuracy is key feature |\n| Cost at scale | High | 100M embeddings/month |\n| Latency | Medium | Batch indexing, not real-time |\n| Ops overhead | Medium | Small team |\n\n### Step 3: Analyze Each Option\n\nCreate a comparison matrix:\n\n| Option | Quality | Cost | Latency | Ops | Score |\n|--------|---------|------|---------|-----|-------|\n| OpenAI | ★★★★★ | ★★ | ★★★★ | ★★★★★ | 4.2 |\n| Cohere | ★★★★ | ★★★★ | ★★★★ | ★★★★★ | 4.2 |\n| BGE | ★★★★ | ★★★★★ | ★★★ | ★★ | 3.6 |\n\n### Step 4: Make a Recommendation with Reasoning\n\n```\n\"I would recommend Cohere for this use case because:\n1. Quality is close to OpenAI based on MTEB scores\n2. Better pricing at our volume (100M embeddings/month)\n3. No operational overhead vs self-hosting\n4. We can switch to self-hosted later if costs become prohibitive\n\nThe risk is vendor dependency, which we mitigate by \nabstracting the embedding interface.\"\n```\n\n---\n\n## Debugging and Troubleshooting Framework\n\nWhen asked \"How would you debug X?\" or \"The system is doing Y, how do you fix it?\" The 4-step diagnostic motion:\n\n```mermaid\nflowchart TD\n    A[Gather information<br/>When, who, what] --> B[Form hypotheses<br/>3 to 5 candidates]\n    B --> C[Diagnostic approach<br/>Traces and isolation]\n    C --> D[Propose fixes<br/>And verification plan]\n    D --> E{Verified}\n    E -->|No| B\n    E -->|Yes| F[Ship fix with monitoring]\n```\n\n### Step 1: Gather Information\n\n```\n\"First, I would ask:\n- When did this start? What changed?\n- Is it all requests or a subset?\n- What does the error look like exactly?\n- Are there patterns (time of day, user segment, query type)?\"\n```\n\n### Step 2: Form Hypotheses\n\n```\n\"Based on the symptoms, my top hypotheses are:\n1. Retrieval quality degraded (recent data changes?)\n2. Model output quality dropped (prompt changed? different model?)\n3. Context length exceeded (longer documents?)\n4. Rate limiting causing timeouts\"\n```\n\n### Step 3: Describe Diagnostic Approach\n\n```\n\"To isolate the cause:\n1. Check traces for failing requests to see where they diverge\n2. Compare retrieval results to a known-good baseline\n3. Check model version and prompt version in deployment\n4. Review metrics for any correlated changes\"\n```\n\n### Step 4: Propose Fixes and Verification\n\n```\n\"If it is retrieval quality, I would:\n1. Re-index with verified chunking\n2. Validate on test set before deploying\n3. Roll out gradually with A/B comparison\n4. Set up alerts on retrieval quality metrics to catch future issues\"\n```\n\n---\n\n## Behavioral Questions Framework (STAR-L)\n\nFor behavioral questions in AI roles, use STAR-L (STAR + Learnings).\n\n### S - Situation\n\nSet the context briefly.\n\n```\n\"We had just launched our RAG-powered search feature and were getting \ncomplaints about incorrect answers for technical queries.\"\n```\n\n### T - Task\n\nWhat was your specific responsibility?\n\n```\n\"As the tech lead, I needed to diagnose the issue and ship a fix quickly \nwhile maintaining user trust.\"\n```\n\n### A - Action\n\nWhat did YOU do? Use \"I\" not \"we.\"\n\n```\n\"I first instrumented detailed tracing to understand where failures occurred.\nI found that our chunking strategy was splitting code blocks mid-function.\nI designed a code-aware chunking approach that preserved semantic units.\nI also added a confidence score display so users could calibrate trust.\"\n```\n\n### R - Result\n\nQuantify if possible.\n\n```\n\"Answer quality on technical queries improved from 65% to 89% in our \nevaluation suite. User complaints dropped 70% within two weeks.\"\n```\n\n### L - Learnings\n\nWhat would you do differently?\n\n```\n\"I learned that chunking strategies need to be content-aware from the start.\nNow I always test chunking with the actual document distribution before \nlaunching. I also build evaluation suites earlier in the process.\"\n```\n\n---\n\n## Handling Unknown Topics\n\nIt is acceptable to not know everything. Handle unknowns professionally.\n\n### If You Do Not Know At All\n\n```\n\"I am not familiar with [X]. Based on the name, I would guess it is related \nto [Y]. Can you tell me more about what it does, and I can discuss how \nI would approach the problem it solves?\"\n```\n\n### If You Know Partially\n\n```\n\"I have read about [X] but have not used it in production. My understanding \nis that it [description]. In practice, I would need to read the documentation \nand likely prototype before making architectural decisions.\"\n```\n\n### If You Know the Concept but Not Details\n\n```\n\"I understand the general approach of [X] - [brief explanation]. I do not \nhave the specific parameters or benchmarks memorized, but I know where to \nfind them and what questions to ask when evaluating it.\"\n```\n\n---\n\n## Common Mistakes and How to Avoid Them\n\n### Mistake 1: Jumping to Solutions\n\n**Wrong:**\n```\nInterviewer: \"How would you design a document Q&A system?\"\nYou: \"I would use LangChain with Pinecone and GPT-5.5.\"\n```\n\n**Right:**\n```\n\"Before defining the solution, I want to understand the requirements.\nWhat types of documents? What volume? What accuracy is needed?\"\n```\n\n---\n\n### Mistake 2: Ignoring Cost\n\n**Wrong:**\n```\n\"I would always use the biggest frontier model for the best quality.\"\n```\n\n**Right:**\n```\n\"Model selection depends on the quality bar and volume. For high-volume, \nlower-stakes queries, I might use Claude Haiku 4.5, GPT-5.5-mini, or \nDeepSeek V4 Flash and reserve Claude Sonnet 4.6 or GPT-5.5 for complex \ncases. At 1M queries/day, this could save $50K/month without meaningful \nquality loss.\"\n```\n\n---\n\n### Mistake 3: Not Discussing Failure Modes\n\n**Wrong:**\n```\n\"The system retrieves documents, sends them to the LLM, and returns the answer.\"\n```\n\n**Right:**\n```\n\"The happy path is straightforward. But let me discuss failure modes:\n- What if retrieval returns no relevant documents?\n- What if the LLM hallucinates despite good context?  \n- What if the provider is rate-limited or down?\n\nFor each, we need detection and fallback strategies.\"\n```\n\n---\n\n### Mistake 4: Overcomplicating\n\n**Wrong:**\n```\n\"We need a separate service for chunking, another for embedding, \na message queue between them, a stream processor for real-time, \nthree different vector databases for redundancy...\"\n```\n\n**Right:**\n```\n\"Let me start with the simplest architecture that could work, \nthen add complexity only where justified by requirements.\n\nFor this scale, a single service with async processing might be sufficient.\nIf we need higher throughput, we can add message queues at that point.\"\n```\n\n---\n\n### Mistake 5: Not Asking for Feedback\n\n**Wrong:**\n```\n*Talks for 10 minutes without checking in*\n```\n\n**Right:**\n```\n\"I have covered the high-level architecture. Would you like me to dive \ndeeper into any specific component, or should I move on to evaluation?\"\n```\n\n---\n\n## Quick Reference: Signals of Strong Answers\n\n| Signal | Example |\n|--------|---------|\n| Asks clarifying questions | \"What is the latency requirement?\" |\n| Uses concrete numbers | \"This adds ~50ms latency\" |\n| Discusses tradeoffs | \"We gain X but lose Y\" |\n| Mentions failure modes | \"If this fails, we need to...\" |\n| References real systems | \"Similar to how Notion does...\" |\n| Acknowledges uncertainty | \"I would need to benchmark this\" |\n| Checks in with interviewer | \"Should I go deeper here?\" |\n| Connects to experience | \"In my experience with X...\" |\n\n---\n\n## Anti-Patterns to Avoid\n\n| Anti-Pattern | Better Approach |\n|--------------|-----------------|\n| Buzzword dropping | Explain what you mean |\n| Name dropping without depth | Only mention what you can discuss |\n| \"It depends\" without elaboration | Explain what it depends on |\n| Absolute statements | Use hedging language when appropriate |\n| Dismissing valid options | Acknowledge tradeoffs |\n| Not knowing when to stop | Read interviewer cues |\n\n---\n\n## Key Takeaways\n\n- Frameworks are scaffolding, not scripts; interviewers can tell when a candidate is reciting vs. thinking, so internalize the structure then make it conversational.\n- SPIDER works for any 45-minute system design loop; if the interviewer cuts you off, you have still hit the highest-signal phases.\n- \"It depends\" is fine ONLY when followed by \"it depends on X, Y, Z, and here is how each changes the answer\"; otherwise it reads as hedging.\n- Always end deep dives with one sentence on observability and one on failure modes; this is the single biggest gap between senior and staff answers.\n- Behavioral answers without quantified results (STAR-L's R) get scored as anecdotal; bring numbers even if approximate.\n\n---\n\n*See also: [Question Bank](01-question-bank.md) | [Common Pitfalls](03-common-pitfalls.md) | [Whiteboard Exercises](04-whiteboard-exercises.md)*\n", "content_zh": "# AI 系统设计面试答题框架\n\n本章提供五种结构化框架，覆盖 AI 系统设计面试中的系统设计、概念解释、方案权衡、问题排查和行为面试。它们的目标不是让你背模板，而是帮助你在压力下保持回答结构。\n\n## 目录\n\n- [系统设计框架：SPIDER](#系统设计框架spider)\n- [SPIDER 45 分钟示例](#spider-45-分钟示例)\n- [概念解释框架：ETA](#概念解释框架eta)\n- [权衡分析框架](#权衡分析框架)\n- [调试与故障排查框架](#调试与故障排查框架)\n- [行为面试框架：STAR-L](#行为面试框架star-l)\n- [如何处理不了解的主题](#如何处理不了解的主题)\n- [常见错误与改进方式](#常见错误与改进方式)\n- [优秀回答的信号](#优秀回答的信号)\n- [应该避免的反模式](#应该避免的反模式)\n\n## 系统设计框架：SPIDER\n\nSPIDER 是系统设计面试的六步框架：\n\n```text\nS — Scope and Clarify：明确范围与澄清问题\nP — Prioritize Requirements：确定需求优先级\nI — Initial Architecture：画出初始架构\nD — Deep Dive into Critical Paths：深入关键路径\nE — Evaluation and Observability：评测与可观测性\nR — Reliability and Scale：可靠性与规模化\n```\n\n### S：明确范围与澄清问题\n\n不要一听到题目就开始画架构。先确认用户、场景和目标：\n\n- 谁使用系统？内部员工、普通消费者、企业客户还是开发者？\n- 主要任务是问答、检索、生成、推荐、执行动作，还是多种任务组合？\n- 哪些功能必须支持，哪些功能明确不在本次设计范围内？\n- 需要实时回答还是允许异步处理？\n- 是否需要来源引用、人工确认、权限隔离或审计？\n\n还要确认规模和约束：请求量、并发量、文档量、平均输入输出 token、目标延迟、可接受成本和可用性目标。如果题目没有给出数字，可以主动提出合理假设，并说明后续会根据假设进行容量估算。\n\n### P：确定需求优先级\n\n把需求分成三类：\n\n1. **功能需求：** 系统必须做什么，例如回答问题、调用工具、返回引用。\n2. **质量需求：** 系统需要做到什么程度，例如准确率、延迟、可解释性和一致性。\n3. **约束与边界：** 预算、合规、隐私、数据新鲜度、供应商限制和运维能力。\n\n面试中不需要一开始覆盖所有边界情况，但要明确 MVP 和后续增强功能。例如，第一版可以先做单租户、同步问答和基础引用；多租户隔离、复杂权限、异步任务和高级评测可以作为后续阶段。\n\n### I：画出初始架构\n\n先画最小可行系统，不要一开始堆满组件。典型的 RAG 初始架构可以包含：\n\n```text\n用户\n  ↓\nAPI Gateway / 鉴权 / 限流\n  ↓\n查询理解与路由\n  ↓\n检索层：向量检索 + BM25 + 重排序\n  ↓\n上下文组装\n  ↓\nLLM Gateway / 模型路由\n  ↓\n答案、引用与安全检查\n  ↓\n用户\n```\n\n旁路要画出数据接入、索引、缓存、日志、评测和监控。每画一个组件，都应该能够说明它解决了什么问题，避免为了显得复杂而添加组件。\n\n### D：深入关键路径\n\n从初始架构中挑一到两个最重要的链路深入，而不是平均介绍所有组件。常见深挖点包括：\n\n- RAG 的分块、Embedding、混合检索、RRF 和重排序\n- Agent 的循环控制、工具协议、状态保存和失败恢复\n- 模型路由、Fallback、限流和成本控制\n- 多租户数据隔离与权限校验\n- 长上下文、上下文压缩和记忆策略\n\n深挖时要讲清楚数据如何流动、每一步的输入输出、延迟和失败模式，以及为什么选择当前方案而不是其他方案。\n\n### E：评测与可观测性\n\nAI 系统不能只用“感觉效果不错”来判断质量。至少应说明：\n\n- 检索质量：Precision@K、Recall@K、MRR、NDCG\n- 生成质量：Faithfulness、Answer Relevance、事实正确性和引用正确性\n- 业务效果：任务完成率、用户满意度、人工转接率和重新生成率\n- 工程指标：延迟、吞吐、错误率、token 消耗和单位请求成本\n- 追踪信息：Prompt 版本、模型版本、工具调用链、检索结果和最终答案\n\n离线使用固定测试集和回归评测，线上通过抽样评测、用户反馈和 A/B 测试验证。对于关键变更设置质量门禁，避免只因为功能发布成功就认为系统改进了。\n\n### R：可靠性与规模化\n\n最后讨论系统如何面对真实生产环境：\n\n- 超时、重试、熔断和降级\n- 模型供应商故障与多供应商 Fallback\n- 工具错误、Agent 死循环和最大迭代次数\n- 限流、配额、预算和成本告警\n- 数据备份、幂等、Checkpoint 和异步任务\n- 灰度发布、回滚、审计和安全事件处理\n\n## SPIDER 45 分钟示例\n\n以“设计一个企业知识库问答系统”为例，可以按以下节奏组织面试：\n\n### 0～5 分钟：澄清范围\n\n确认用户类型、文档类型、是否需要多租户、是否需要引用、数据更新频率、目标 QPS、目标延迟和准确性要求。主动说明假设，例如第一版面向企业内部员工，文档每天增量更新，P95 延迟目标为 3 秒。\n\n### 5～12 分钟：需求和指标\n\n列出核心功能和非功能需求。把“回答准确”拆成可测指标，例如召回率、忠实度、答案相关性和任务完成率；把“快”拆成检索、重排序、模型生成各阶段的延迟预算。\n\n### 12～20 分钟：初始架构\n\n画出数据接入和查询两条管线。数据接入包括解析、清洗、分块、Embedding 和索引；查询包括鉴权、查询改写、混合检索、重排序、上下文组装、LLM 生成和引用返回。\n\n### 20～32 分钟：关键路径深挖\n\n根据面试官兴趣选择一个主题深入。例如解释为什么同时使用向量检索和 BM25，如何用 RRF 融合，如何处理文档权限，以及如何避免跨租户数据进入上下文。\n\n### 32～38 分钟：评测和可观测性\n\n说明离线测试集、RAGAS、LLM-as-Judge、人工抽检、Langfuse 类链路追踪以及 Prompt/模型版本管理。强调评测指标需要和真实业务目标关联。\n\n### 38～45 分钟：可靠性、成本和扩展\n\n讨论缓存、限流、超时、重试、Fallback、异步索引、成本控制和故障降级。最后主动总结当前设计的主要权衡，并提出下一阶段的增强方向。\n\n## 概念解释框架：ETA\n\nETA 用于回答“什么是某个技术概念，以及它为什么重要”：\n\n```text\nE — Explain Simply：先用简单语言解释\nT — Technical Details：补充技术细节\nA — Applications and Tradeoffs：说明应用与权衡\n```\n\n例如解释 RAG：先说“RAG 是让模型回答前先查找外部知识的方式”；然后说明文档接入、分块、Embedding、检索、重排序和上下文生成；最后说明它适合知识经常更新且需要来源引用的场景，同时会增加延迟和系统复杂度。\n\n不要一上来堆缩写。先让面试官确认你理解问题，再根据追问逐步增加深度。\n\n## 权衡分析框架\n\n当面试官要求比较两个方案时，按四步回答：\n\n### 第一步：明确方案\n\n先准确复述正在比较的选项。例如“我们比较的是 RAG 和 Fine-tuning，而不是比较两个具体模型”。\n\n### 第二步：定义评价标准\n\n根据场景选择标准：质量、延迟、成本、数据新鲜度、隐私、可解释性、运维复杂度、扩展性和供应商依赖。\n\n### 第三步：逐项分析\n\n对每个标准说明两种方案的表现，并指出前提。不要把“某方案总是更好”当作结论，因为权衡取决于数据规模、流量和业务风险。\n\n### 第四步：给出有依据的建议\n\n明确推荐方案，说明推荐成立的条件，并指出什么时候会切换到另一个方案。优秀回答还会提出小规模实验或评测，用数据验证假设。\n\n## 调试与故障排查框架\n\n### 第一步：收集信息\n\n确认故障开始时间、影响范围、受影响的模型/Prompt/数据版本、请求样本、错误日志、延迟、成本和近期变更。先确认现象，再讨论原因。\n\n### 第二步：提出假设\n\n按层次列出假设：输入数据、检索、Prompt、模型、工具、编排、基础设施和外部供应商。根据影响范围和变更时间确定优先级。\n\n### 第三步：说明诊断方法\n\n把每个假设对应到验证动作，例如重放固定样本、比较 Prompt 版本、查看检索结果、检查 Tool Trace、对比模型输出和查询监控指标。不要只说“查看日志”，要说明看什么字段、如何判断结果。\n\n### 第四步：提出修复并验证\n\n先缓解线上影响，再修复根因。修复后用回归测试、指标对比、灰度发布和持续监控确认问题消失，同时补充防止再次发生的测试或告警。\n\n## 行为面试框架：STAR-L\n\n```text\nS — Situation：背景\nT — Task：任务\nA — Action：行动\nR — Result：结果\nL — Learnings：学习与复盘\n```\n\n回答行为问题时，重点放在你做了什么、为什么这样做、结果如何，而不是长篇描述项目背景。结果尽量使用可验证的指标，但不能为了让故事更漂亮而编造数字。如果结果不理想，也可以说明你如何发现问题、如何调整以及学到了什么。\n\n对于 AI 项目，故事可以覆盖：需求不明确、模型效果不稳定、Prompt/Skill 调优、评测回归、Agent 死循环、跨团队协作、线上事故和安全风险。\n\n## 如何处理不了解的主题\n\n### 完全不了解\n\n直接承认不知道，但说明你会如何拆解问题、查找资料、验证假设，并把已知的相关概念连接起来。不要用术语堆砌来掩盖不了解。\n\n### 部分了解\n\n先回答确定的部分，再明确边界：“我理解它解决的是 X，通常通过 Y 实现；具体到 Z 细节，我没有在生产环境中独立负责过。”\n\n### 理解原理但缺乏细节\n\n说明原理、应用场景、关键权衡和你会如何验证。把“理解原理”和“有生产实践”明确区分，这比夸大经历更可信。\n\n## 常见错误与改进方式\n\n### 错误 1：直接跳到解决方案\n\n没有澄清用户、规模和约束就开始画图，容易解决错误的问题。先复述目标并确认假设。\n\n### 错误 2：忽略成本\n\n只谈质量和延迟，却不谈模型调用、Embedding、存储、重排序和人工评测成本。至少给出成本来源和控制方法。\n\n### 错误 3：不讨论失败模式\n\n生产系统一定会遇到超时、限流、错误数据、模型故障和工具失败。要主动说明重试、降级、Fallback、人工升级和回滚。\n\n### 错误 4：过度复杂\n\n没有证明需要 Multi-agent、复杂记忆或自研基础设施，就不要加入。先给最小可行架构，再根据需求增加复杂度。\n\n### 错误 5：不请求反馈\n\n面试是互动过程。完成一个阶段后可以问：“这个方向符合你的预期吗？要不要深入检索链路或可靠性？”\n\n## 优秀回答的信号\n\n- 先澄清问题，再给方案\n- 能把业务目标转化为工程指标\n- 主动讨论成本、延迟、质量和可靠性的权衡\n- 能画出清晰的数据流和控制流\n- 说明评测、监控和回滚方式\n- 对自己的生产实践边界保持诚实\n- 能根据面试官反馈调整深度\n\n## 应该避免的反模式\n\n- 把模型本身当作完整系统\n- 只背诵术语，不解释术语解决的问题\n- 把 RAG、微调和长上下文当成互相替代的万能答案\n- 只谈正常路径，不谈失败和安全\n- 给出没有前提的绝对结论\n- 把参与过的项目描述成自己独立设计和实现\n\n## 关键要点\n\n系统设计回答的核心不是组件数量，而是能否围绕目标建立一条完整、可验证、可运营的推理链：需求 → 指标 → 架构 → 关键权衡 → 评测 → 可靠性。对于你的面试准备，建议把 SPIDER 用在 RAG、Agent、MCP 和评测系统题目上，把 STAR-L 用在 AliceFeed Copilot、上下文压缩、Langfuse 和回归测试等真实经历上。\n", "summary_content": "# 《AI 系统设计面试答题框架》中文概要\n\n## 这篇资料解决什么问题\n\n它解决的是“知道技术，但面试时回答不成体系”的问题。资料提供了系统设计、概念解释、方案比较、故障排查和行为面试五种回答框架。\n\n## 最重要的框架\n\n### SPIDER：系统设计\n\n```text\nS 明确范围 → P 确定优先级 → I 初始架构 →\nD 深入关键路径 → E 评测与可观测性 → R 可靠性与规模化\n```\n\n### ETA：解释概念\n\n```text\n先简单解释 → 补充技术细节 → 说明应用和权衡\n```\n\n### STAR-L：行为面试\n\n```text\n背景 → 任务 → 行动 → 结果 → 学习\n```\n\n## 面试中必须主动覆盖的内容\n\n- 需求和非目标\n- 延迟、吞吐、成本和质量指标\n- 数据流和控制流\n- 失败模式、降级和恢复\n- 评测、监控和回滚\n- 安全、权限和数据隔离\n- 自己真实负责的范围\n\n## 与你的经历结合\n\n- 用 SPIDER 讲 AliceFeed Copilot 的 Agent 架构和金融问答流程\n- 用 Trade-off 解释 BM25 + 向量检索 + RRF 的选择\n- 用 Debugging 讲 Agent 调用循环、上下文压缩和效果回退\n- 用 E 部分讲 RAGAS 测评集、自动化回归和 Langfuse 链路追踪\n- 用 STAR-L 讲 DeepAgents 搭建、Tool Calling、Middleware 和团队协作\n\n## 一句话记忆\n\n优秀的 AI 系统设计回答不是“我知道哪些组件”，而是“我如何从目标出发，设计一个可以评测、监控、降级和持续改进的系统”。\n"}, {"filename": "03-common-pitfalls.md", "section_id": "00-interview-prep", "section_label": "00 · 面试准备", "label": "常见陷阱", "title_zh": "AI 系统设计面试常见陷阱", "summary": "总结会让高级候选人失分的模式：跳过数据管道、只谈模型、不谈评测和成本、忽视多租户与故障降级，以及表达缺少结构。", "detail": "这篇资料把失分点分成架构、技术知识、沟通、面试策略和 AI 特有问题几类。核心提醒是：不要把 AI 系统描述成一个模型调用；必须覆盖数据处理、检索、生成、评测、监控、权限、安全和失败兜底。回答时要主动说清楚假设、指标和权衡，避免把理解过的原理包装成独立负责的生产经验。对于你的面试准备尤其要注意区分“我主导实现”“我参与建设”和“我理解原理但还需要深入”的边界。", "content": "# Common Pitfalls in AI System Design Interviews\n\nThis chapter covers frequent mistakes candidates make in AI system design interviews, why they hurt your evaluation, and how to avoid them.\n\n## Table of Contents\n\n- [Architecture Pitfalls](#architecture-pitfalls)\n- [Technical Knowledge Pitfalls](#technical-knowledge-pitfalls)\n- [Communication Pitfalls](#communication-pitfalls)\n- [Interview Strategy Pitfalls](#interview-strategy-pitfalls)\n- [AI-Specific Pitfalls](#ai-specific-pitfalls)\n- [Checklists for Self-Review](#checklists-for-self-review)\n\n---\n\n## Architecture Pitfalls\n\n### Pitfall 1: Skipping the Data Pipeline\n\n**What goes wrong:**\nCandidates design the inference path in detail but barely mention how data gets into the system.\n\n**Why it matters:**\nData quality drives AI system quality. A beautiful RAG architecture is useless if the document ingestion pipeline produces garbage chunks.\n\n**What interviewers notice:**\n- No mention of how documents are processed\n- Assumes embeddings magically appear\n- Ignores updates and deletions\n\n**Better approach:**\n```\n\"Before discussing retrieval, let me walk through the data pipeline:\n\n1. Document ingestion: File upload, API integration, crawler\n2. Preprocessing: Format conversion, cleaning, metadata extraction\n3. Chunking: [Strategy] based on document structure\n4. Embedding: Batch processing with [model]\n5. Indexing: Upsert to vector database with metadata\n6. Updates: Incremental re-indexing on document changes\"\n```\n\n---\n\n### Pitfall 2: One-Size-Fits-All Model Selection\n\n**What goes wrong:**\nCandidates say they would use GPT-4 (or any single model) for everything.\n\n**Why it matters:**\nDifferent tasks have different requirements. Using a frontier model for classification is wasteful. Using a small model for complex reasoning fails.\n\n**What interviewers notice:**\n- No discussion of cost implications\n- No consideration of latency requirements\n- No model cascade or routing\n\n**Better approach:**\n```\n\"Model selection varies by task:\n\n- Intent classification: Fine-tuned BERT or GPT-5.5-mini\n- Simple responses: Claude Haiku 4.5, GPT-5.5-mini, or DeepSeek V4 Flash\n- Complex reasoning: Claude Sonnet 4.6 or GPT-5.5\n- Code generation: Claude Sonnet 4.6 (Opus 4.8 for the hardest cases)\n\nI would implement a router that classifies query complexity \nand routes to the appropriate model. This typically reduces \ncosts 60-70% with minimal quality impact.\"\n```\n\n---\n\n### Pitfall 3: Ignoring the Evaluation Layer\n\n**What goes wrong:**\nCandidates describe how to build the system but not how to know if it works.\n\n**Why it matters:**\nAI systems fail in subtle ways. Without evaluation, you ship broken systems and never detect degradation.\n\n**What interviewers notice:**\n- No test set mentioned\n- No quality metrics defined\n- No monitoring for production issues\n\n**Better approach:**\n```\n\"Evaluation has three layers:\n\n1. Offline: Golden test set evaluated on every change\n   - Retrieval: Precision@5, Recall@5, MRR\n   - Generation: Faithfulness, relevance (RAGAS)\n   - End-to-end: Answer correctness vs ground truth\n\n2. Online: Sampled evaluation in production\n   - LLM-as-judge on 5% of requests\n   - User feedback (thumbs up/down)\n   - Completion rate for task-oriented queries\n\n3. Alerting: Automated detection\n   - Quality score drops below threshold\n   - Latency exceeds SLA\n   - Error rate spikes\"\n```\n\n---\n\n### Pitfall 4: Underestimating Multi-Tenancy Complexity\n\n**What goes wrong:**\nCandidates treat multi-tenant RAG as simply adding a \"tenant_id\" field.\n\n**Why it matters:**\nMulti-tenant AI systems have unique failure modes around data leakage, isolation, and fair resource allocation.\n\n**What interviewers notice:**\n- Post-retrieval filtering (major red flag)\n- No discussion of cache isolation\n- No consideration of noisy neighbor\n\n**Better approach:**\n```\n\"Multi-tenancy for RAG is harder than traditional systems:\n\n1. Retrieval isolation: Filter BEFORE retrieval at the database level\n   WRONG: retrieve(query, top_k=100) then filter by tenant\n   RIGHT: retrieve(query, top_k=10, filter={tenant_id: X})\n\n2. Context isolation: Never mix tenants in LLM context\n\n3. Cache isolation: Scope all cache keys by tenant\n   cache_key = f'{tenant_id}:{query_hash}'\n\n4. Embedding isolation: Consider tenant-specific embedding spaces\n   for highest security requirements\n\n5. Audit: Log tenant context for all operations\n\nI would also run regular isolation tests with adversarial \nqueries designed to probe for cross-tenant leakage.\"\n```\n\n---\n\n### Pitfall 5: No Graceful Degradation\n\n**What goes wrong:**\nThe system has no fallback when the LLM provider is down, rate-limited, or returning errors.\n\n**Why it matters:**\nLLM providers have outages. Rate limits get hit. Failure handling separates production-ready from prototype.\n\n**What interviewers notice:**\n- No mention of fallbacks\n- No retry strategy\n- Single provider dependency\n\n**Better approach:**\n```\n\"Reliability layers:\n\n1. Retry with backoff: Transient errors get retried\n   - Exponential backoff with jitter\n   - Max 3 attempts\n\n2. Fallback providers: If primary fails, try secondary\n   - OpenAI → Anthropic → local model\n   - Abstract the interface to enable swapping\n\n3. Cached responses: Return cached results for known queries\n   - Exact match cache for repeated questions\n   - Semantic cache for similar questions\n\n4. Graceful degradation: Partial functionality on failure\n   - Retrieval fails → return direct LLM response with disclaimer\n   - LLM fails → return relevant chunks without synthesis\n\n5. Circuit breaker: Fail fast when provider is degraded\n   - Prevents cascading latency issues\"\n```\n\n---\n\n## Technical Knowledge Pitfalls\n\n### Pitfall 6: Confusing Embedding and Generation Models\n\n**What goes wrong:**\nCandidates talk about generating text with embedding models or treating generation as retrieval.\n\n**What to know:**\n- **Embedding models:** Map text → vector. Used for search/retrieval.\n- **Generation models:** Produce text given a prompt. Used for responses.\n\n**How they connect:**\nRAG uses embedding models for retrieval, then passes retrieved chunks to a generation model.\n\n---\n\n### Pitfall 7: Misunderstanding Context Windows\n\n**What goes wrong:**\n- Assuming 128K context means 128K tokens of useful context\n- Not accounting for system prompt, retrieved chunks, and conversation history\n- Ignoring the \"lost in the middle\" phenomenon\n\n**What to know:**\n- Context window is the limit, not the target\n- Attention degrades for middle content\n- Practical useful context is much smaller than the limit\n\n**Better framing:**\n```\n\"While current frontier models advertise 1M-token windows, I design for much smaller effective context:\n\n- System prompt: ~500 tokens\n- Retrieved context: 3-5 chunks × 500 tokens = 1.5-2.5K\n- Conversation history: Last 5 turns × 300 tokens = 1.5K\n- Buffer for output: ~2K\n\nTotal active context: ~7K tokens, well below limit.\n\nThis keeps the model focused on relevant information and \navoids the lost-in-the-middle problem documented in Liu et al.\"\n```\n\n---\n\n### Pitfall 8: Not Understanding Token Economics\n\n**What goes wrong:**\nCandidates discuss features without understanding cost implications.\n\n**What to know:**\n- Pricing is per token, input vs output often priced differently\n- Output tokens cost 2-4x input tokens for most providers\n- Streaming does not change cost\n\n**Quick reference (June 2026, verify current):**\n\n| Model | Input/1M | Output/1M |\n|-------|----------|-----------|\n| Claude Fable 5 | $10 | $50 |\n| Claude Opus 4.8 | $5 | $25 |\n| GPT-5.5 | $5 | $30 |\n| Claude Sonnet 4.6 | $3 | $15 |\n| Gemini 3.1 Pro | $2 | $12 |\n| Claude Haiku 4.5 | $1 | $5 |\n| DeepSeek V4 Flash | $0.14 | $0.28 |\n\n**Cost calculation example:**\n```\n10,000 queries/day\nAverage: 2K input tokens, 500 output tokens\nModel: Claude Sonnet 4.6\n\nDaily cost = 10K × (2K × $3/1M + 500 × $15/1M)\n          = 10K × ($0.006 + $0.0075)\n          = 10K × $0.0135\n          = $135/day = ~$4K/month\n```\n\n**The caching lever (often the difference between candidates):**\n```\nSame workload, but 1.5K of the 2K input is a shared prefix\n(system prompt + tool schemas) served from cache at 10% of\nthe input price:\n\nDaily cost = 10K × (0.5K × $3/1M + 1.5K × $0.30/1M + 500 × $15/1M)\n          = 10K × ($0.0015 + $0.00045 + $0.0075)\n          = ~$94/day = ~$2.8K/month   (30% saved by prompt shape alone)\n\nDesign implication: keep the static content (instructions, schemas)\nat the front of the prompt and the dynamic content at the end, so\nthe prefix stays byte-identical across requests and the cache hits.\n```\n\n---\n\n### Pitfall 9: Shallow Understanding of RAG Components\n\n**What goes wrong:**\nCandidates can list the components (chunking, embedding, retrieval, generation) but cannot explain the tradeoffs within each.\n\n**Depth expected for chunks:**\n- Why chunk at all? (Context limits, retrieval precision)\n- Chunk size tradeoffs? (Smaller = more precise, larger = more context)\n- Overlap purpose? (Prevent losing context at boundaries)\n- When to use semantic chunking? (Complex documents with variable structure)\n\n**Depth expected for retrieval:**\n- Why hybrid search? (Dense good at semantics, sparse good at keywords)\n- What is reranking? (Two-stage: fast recall then accurate ranking)\n- How to handle no results? (Fallback strategies)\n\n---\n\n### Pitfall 10: Treating Prompts as Magic\n\n**What goes wrong:**\nCandidates hand-wave \"and then we prompt the model to...\" without discussing prompt engineering.\n\n**What interviewers want to see:**\n- Prompt structure (system, context, user)\n- Instruction clarity\n- Output format specification\n- Few-shot examples if appropriate\n- Defense against edge cases\n\n**Better approach:**\n```\n\"The generation prompt has this structure:\n\nSYSTEM:\nYou are a support assistant for [Product]. Answer questions \nusing ONLY the provided context. If the context does not \ncontain the answer, say 'I don't have information about that.'\nAlways cite the source document.\n\nCONTEXT:\n[Retrieved chunks with source metadata]\n\nUSER:\n[User's question]\n\nI specify the output format explicitly and use few-shot \nexamples for complex response structures. For this use case, \nI also include negative examples showing when to abstain.\"\n```\n\n**Prompt failure modes worth naming in an interview:**\n\n| Failure mode | What it looks like | Defense |\n|--------------|--------------------|---------|\n| Lost in the middle | Critical instruction buried at token 40K gets ignored | Put rules at the start and end; keep middle for data |\n| Instruction hierarchy break | Retrieved document text overrides the system prompt | Wrap untrusted content in delimiters; treat it as data, never as instructions |\n| Format slipping | JSON output degrades after long sessions or model updates | Engine-level structured output (json_schema, tool schemas), not \"please return JSON\" |\n| Cache-busting dynamism | A timestamp at the top of the prompt kills the prefix cache on every request | Static content first, dynamic content last |\n| Prompt-model coupling | A prompt tuned on one provider silently underperforms after a model swap | Version prompts with the model ID; re-run evals on every model change |\n\nNaming two or three of these unprompted moves a prompting answer from junior to senior, because each one is a production incident the interviewer has probably lived through.\n\n---\n\n## Communication Pitfalls\n\n### Pitfall 11: Monologuing Without Interaction\n\n**What goes wrong:**\nCandidates talk for 10-15 minutes without checking in with the interviewer.\n\n**Why it matters:**\nInterviews are conversations. Monologuing misses signals about what the interviewer cares about.\n\n**Better approach:**\nCheck in every 3-5 minutes:\n- \"Should I go deeper on retrieval or move to generation?\"\n- \"Does this architecture make sense before I discuss details?\"\n- \"Is there a specific component you would like me to focus on?\"\n\n---\n\n### Pitfall 12: Not Leading with Structure\n\n**What goes wrong:**\nCandidates start talking without signaling what they will cover.\n\n**Why it matters:**\nInterviewers have mental models. If they cannot map your answer to their expectations, you seem disorganized.\n\n**Better approach:**\nLead with a roadmap:\n```\n\"I will structure my answer in four parts:\n1. High-level architecture\n2. Deep dive on the RAG pipeline\n3. Scaling and reliability\n4. Evaluation approach\n\nLet me start with the high-level architecture...\"\n```\n\n---\n\n### Pitfall 13: Technical Jargon Without Explanation\n\n**What goes wrong:**\nCandidates drop terms like \"PagedAttention\" or \"GQA\" without explaining them.\n\n**Why it matters:**\nIf the interviewer does not know the term, you seem like you are name-dropping. If they do know it, they might ask follow-up questions you cannot answer.\n\n**Better approach:**\nBrief explanation when introducing terms:\n```\n\"I would use vLLM which implements PagedAttention. \nThis manages the KV cache like virtual memory, reducing \nfragmentation and enabling higher throughput.\"\n```\n\n---\n\n### Pitfall 14: Defending Wrong Answers\n\n**What goes wrong:**\nWhen the interviewer hints that an approach is wrong, candidates double down instead of reconsidering.\n\n**Why it matters:**\nStubbornness is a red flag. Being coachable is valuable.\n\n**Better approach:**\n```\nInterviewer: \"What about the case where...\"\nYou: \"That is a good point. I had not considered [X]. \nLet me revise my approach...\"\n```\n\n---\n\n## Interview Strategy Pitfalls\n\n### Pitfall 15: Solving a Different Problem\n\n**What goes wrong:**\nCandidates get excited about a particular technology and design for that instead of the stated requirements.\n\n**Example:**\nAsked to design a simple Q&A system, candidate designs a complex multi-agent system with autonomous research capabilities.\n\n**Better approach:**\nDesign to requirements, then offer extensions:\n```\n\"This design meets the core requirements. If we wanted to \nextend it to handle more complex multi-step queries, we \ncould add an agent layer, but I would not start there.\"\n```\n\n---\n\n### Pitfall 16: Not Managing Time\n\n**What goes wrong:**\nCandidates spend 20 minutes on architecture and have no time for evaluation, reliability, or scaling.\n\n**Better approach:**\nAllocate time explicitly:\n- Clarification: 3-5 min\n- High-level design: 5-7 min\n- Deep dives: 10-15 min\n- Evaluation/reliability: 5-7 min\n- Questions/wrap-up: 3-5 min\n\nCheck the clock and adjust.\n\n---\n\n### Pitfall 17: Not Drawing\n\n**What goes wrong:**\nCandidates describe architecture verbally without diagramming.\n\n**Why it matters:**\nVisual communication is clearer and shows you can communicate with stakeholders.\n\n**Better approach:**\nDraw boxes and arrows as you explain. Label clearly. Use the diagram as a reference through the discussion.\n\n---\n\n## AI-Specific Pitfalls\n\n### Pitfall 18: Treating AI Components as Black Boxes\n\n**What goes wrong:**\nCandidates treat \"call the LLM\" as an atomic operation without understanding what happens inside.\n\n**Expectation for senior roles:**\n- Understand prefill vs decode phases\n- Know what affects latency (TTFT vs TPS)\n- Understand KV cache implications\n- Be aware of batching effects\n\n---\n\n### Pitfall 19: Ignoring Hallucination Risk\n\n**What goes wrong:**\nCandidates design systems that blindly trust LLM output.\n\n**Why it matters:**\nHallucinations are inherent to LLMs. Production systems must handle them.\n\n**Better approach:**\n```\n\"Hallucination mitigation has multiple layers:\n\n1. Retrieval grounding: Answer from context only\n2. Citation enforcement: Every claim cites a source\n3. Abstention: Model says 'I don't know' when appropriate\n4. Output validation: Check for impossible claims\n5. Confidence display: Show users when to verify\"\n```\n\n---\n\n### Pitfall 20: Security as an Afterthought\n\n**What goes wrong:**\nSecurity considerations come at the end, if at all.\n\n**Why it matters:**\nAI systems have novel attack surfaces (prompt injection, data leakage). Security needs to be designed in.\n\n**Better approach:**\nWeave security into the design:\n```\n\"For the retrieval layer, I use metadata filtering at the \ndatabase level to ensure tenant isolation. The system prompt \nuses instruction hierarchy to resist injection. Output \npasses through a content filter before reaching the user.\"\n```\n\n---\n\n## Checklists for Self-Review\n\n### Before the Interview\n\n- [ ] Reviewed RAG architecture patterns\n- [ ] Know current model pricing (ballpark)\n- [ ] Can explain chunking strategies\n- [ ] Understand embedding vs generation\n- [ ] Know common evaluation metrics\n- [ ] Can discuss at least one vector database\n- [ ] Understand multi-tenancy challenges\n- [ ] Can discuss prompt engineering techniques\n\n### During the Interview\n\n- [ ] Asked clarifying questions\n- [ ] Stated priorities and tradeoffs\n- [ ] Drew a diagram\n- [ ] Mentioned evaluation approach\n- [ ] Discussed failure modes\n- [ ] Addressed security/isolation\n- [ ] Checked in with interviewer\n- [ ] Managed time across sections\n\n### After Each Section\n\n- [ ] Did I explain WHY, not just WHAT?\n- [ ] Did I mention tradeoffs?\n- [ ] Did I use concrete numbers where applicable?\n- [ ] Did I avoid unnecessary complexity?\n\n---\n\n*See also: [Question Bank](01-question-bank.md) | [Answer Frameworks](02-answer-frameworks.md) | [Whiteboard Exercises](04-whiteboard-exercises.md)*\n", "content_zh": "# AI 系统设计面试常见陷阱\n\n这篇资料总结会让高级 AI 工程候选人失分的模式。重点不是背“正确答案”，而是在面试时主动补齐容易遗漏的维度。\n\n## 架构陷阱\n\n### 陷阱 1：跳过数据管道\n\n只画模型和 API，不讨论数据来源、解析、清洗、分块、索引、更新、权限和删除。生产 RAG 的质量往往首先取决于数据管道，而不是最后调用哪个模型。\n\n### 陷阱 2：模型选择一刀切\n\n不能因为某个模型排行榜高就把所有请求都发给它。应按任务难度、延迟、成本、上下文、隐私和质量要求做路由，并保留评测和 Fallback。\n\n### 陷阱 3：忽略评测层\n\n“看起来回答不错”不是评测。要说明测试集、检索指标、Faithfulness、答案正确性、用户反馈、人工抽检和回归门禁。\n\n### 陷阱 4：低估多租户复杂度\n\n租户隔离不仅是向量过滤，还涉及缓存、Prompt、Checkpoint、日志、权限、错误信息和异步队列。过滤必须在检索前发生。\n\n### 陷阱 5：没有优雅降级\n\n模型超时、供应商故障、工具失败和配额耗尽都要有处理方式：Fallback、缓存、简化回答、人工升级、重试上限和明确的错误响应。\n\n## 技术知识陷阱\n\n### 陷阱 6：混淆 Embedding 模型和生成模型\n\nEmbedding 用于把文本映射到向量空间并进行相似度检索；生成模型负责根据输入生成结果。二者的训练目标、评测方式、延迟和成本都不同。\n\n### 陷阱 7：误解上下文窗口\n\n上下文窗口大小不等于模型能同等利用所有内容。要讨论 token 预算、位置注意力、中间丢失、上下文压缩和长上下文成本。\n\n### 陷阱 8：不了解 Token Economics\n\n输入、输出、缓存命中、重试、工具调用、Embedding 和重排序都会产生成本。要以“单位成功任务成本”而不是单次模型价格衡量。\n\n### 陷阱 9：对 RAG 组件理解浅\n\n不能只说“接入向量数据库”。需要理解解析、分块、Embedding、稠密/稀疏检索、RRF、重排序、引用、权限和评测之间的关系。\n\n### 陷阱 10：把 Prompt 当作魔法\n\nPrompt 是系统行为的一部分，需要版本管理、测试、评测和回滚。Prompt 不能弥补错误数据、错误权限或不合理的系统流程。\n\n## 沟通陷阱\n\n### 陷阱 11：单方面长篇独白\n\n面试是互动过程。讲完假设或架构阶段后，要确认面试官是否希望深入某个关键路径。\n\n### 陷阱 12：没有先给结构\n\n先说“我会从需求、架构、检索、生成、评测和可靠性六部分回答”，面试官更容易跟上，也更容易判断你的覆盖范围。\n\n### 陷阱 13：只使用术语不解释\n\n第一次提到 RRF、HNSW、Agentic RAG 或 Context Engineering 时，用一句普通语言解释它解决什么问题。\n\n### 陷阱 14：为错误答案辩护\n\n发现假设不成立时，应明确修正并说明新推理。能快速承认和修正错误，通常比坚持错误答案更能体现工程成熟度。\n\n## 面试策略陷阱\n\n### 陷阱 15：解决了另一个问题\n\n先复述用户、场景、规模和非目标。如果需求是低延迟分类，不要直接设计一个复杂的自主 Agent。\n\n### 陷阱 16：不会管理时间\n\n为澄清、初始架构、关键路径、评测和可靠性预留时间。不要在一个组件上深入 20 分钟后没有留下整体设计。\n\n### 陷阱 17：不画图\n\n至少画出请求流、数据流、关键存储、模型调用和失败路径。图不需要漂亮，但要能帮助双方讨论边界和瓶颈。\n\n## AI 特有陷阱\n\n### 陷阱 18：把 AI 组件当黑盒\n\n说明模型输入输出、上下文、工具调用、评测和失败模式。不要只说“调用 LLM，它会自动完成”。\n\n### 陷阱 19：忽略幻觉风险\n\n讨论来源、证据、拒答、引用校验、人工复核和线上监控。尤其是金融、医疗、法律场景，不能只依赖模型自信度。\n\n### 陷阱 20：安全事后考虑\n\n从一开始就考虑 Prompt Injection、数据泄露、越权工具、代码执行、供应链、沙箱、租户隔离和审计。\n\n## 自查清单\n\n### 面试前\n\n- 能否在两分钟内解释自己的项目和职责\n- 是否准备了 RAG、Agent、评测和故障排查故事\n- 是否知道每个关键指标的统计口径\n- 是否区分独立实现、参与建设和理解原理\n\n### 面试中\n\n- 是否先澄清需求和假设\n- 是否主动讲指标、成本、失败和安全\n- 是否根据面试官反馈调整深度\n- 是否在时间结束前总结权衡\n\n### 每个章节之后\n\n- 我能否不用术语解释核心概念\n- 我能否举出一个生产失败模式\n- 我能否说清楚如何评测和监控\n- 我能否把知识点和真实项目联系起来\n", "summary_content": "# 《AI 系统设计面试常见陷阱》中文概要\n\n## 核心提醒\n\n高级候选人失分通常不是因为不知道某个模型，而是因为没有覆盖数据管道、评测、成本、失败、安全和沟通结构。\n\n## 面试前记住五件事\n\n1. 先澄清问题，不要急着画架构。\n2. 不要把模型当作完整系统。\n3. 每个方案都要说明指标、成本和权衡。\n4. 主动讨论失败、降级、权限和安全。\n5. 准确区分自己的真实经验边界。\n\n## 与你的经历结合\n\n可以用 AliceFeed 的 RAG、Tool Calling、上下文压缩、RAGAS、Langfuse 和回归测试，分别回答数据、Agent、评测、可观测性和生产化问题。\n"}, {"filename": "04-whiteboard-exercises.md", "section_id": "00-interview-prep", "section_label": "00 · 面试准备", "label": "9 个白板练习", "title_zh": "AI 系统设计白板练习", "summary": "通过企业 RAG、客服机器人、代码审查、文档处理、实时审核、多租户平台、语义搜索、评测流水线和 Agent 记忆等场景模拟完整面试。", "detail": "白板练习要求你在有限时间内完成从需求澄清到架构落图。每个练习都强调关键组件、数据流、容量估算、延迟、可靠性、评测和安全。建议每次先口述目标和非目标，再画最小可行架构，最后主动挑一个关键链路深入。对你来说，企业 RAG、评测流水线、Agent 记忆和多租户 AI 平台最值得优先练习，因为它们能直接连接到金融数据问答、RRF 检索、RAGAS、上下文压缩和调用链路观测等经历。", "content": "# Whiteboard Exercises for AI System Design\n\nThis chapter provides detailed walkthroughs of system design exercises commonly asked in AI-focused interviews. Each exercise includes the full problem statement, a structured solution approach, and discussion points that distinguish strong candidates.\n\n## Table of Contents\n\n- [Exercise 1: Enterprise RAG System](#exercise-1-enterprise-rag-system)\n- [Exercise 2: Customer Support Chatbot](#exercise-2-customer-support-chatbot)\n- [Exercise 3: Code Review Assistant](#exercise-3-code-review-assistant)\n- [Exercise 4: Document Processing Pipeline](#exercise-4-document-processing-pipeline)\n- [Exercise 5: Real-Time Content Moderation](#exercise-5-real-time-content-moderation)\n- [Exercise 6: Multi-Tenant AI Platform](#exercise-6-multi-tenant-ai-platform)\n- [Exercise 7: Semantic Search at Scale](#exercise-7-semantic-search-at-scale)\n- [Exercise 8: Evaluation Pipeline for a Production LLM Product](#exercise-8-evaluation-pipeline-for-a-production-llm-product) ⭐ *NEW*\n- [Exercise 9: Memory and State for a Long-Running Agent](#exercise-9-memory-and-state-for-a-long-running-agent) ⭐ *NEW*\n- [Tips for Whiteboard Exercises](#tips-for-whiteboard-exercises)\n\n---\n\n## Exercise 1: Enterprise RAG System\n\n### Problem Statement\n\nDesign a RAG-based knowledge assistant for a large enterprise with the following requirements:\n\n- 10 million documents from multiple sources (SharePoint, Confluence, Google Drive, internal wikis)\n- 50,000 employees with role-based access\n- Documents update continuously\n- Must respect document permissions at query time\n- Sub-3 second response time for 95% of queries\n- Support for multiple languages (English, Spanish, Mandarin)\n\n### Time Allocation (35 minutes)\n\n| Phase | Time | Focus |\n|-------|------|-------|\n| Clarification | 3 min | Scope, priorities, constraints |\n| High-level architecture | 7 min | Components and data flow |\n| Data pipeline | 8 min | Ingestion, chunking, indexing |\n| Query pipeline | 8 min | Retrieval, generation, permissions |\n| Reliability and scale | 5 min | Failure handling, scaling |\n| Evaluation | 4 min | Metrics and monitoring |\n\n### Solution Walkthrough\n\n#### Clarification Questions\n\n```\n1. What is the document size distribution? (PDFs, wikis, code?)\n2. How often do permissions change? (Impacts caching strategy)\n3. Is conversation history required or single-turn Q&A?\n4. What is the accuracy bar? (Can we say \"I don't know\"?)\n5. Are there compliance requirements? (Audit, data residency)\n```\n\n#### High-Level Architecture\n\n```\n┌─────────────────────────────────────────────────────────────────────────┐\n│                          DATA PLANE                                      │\n│  ┌──────────────┐    ┌──────────────┐    ┌──────────────────────────────┐│\n│  │   Connectors │───▶│   Processor  │───▶│       Vector Database        ││\n│  │ (SP,GD,Conf) │    │ (chunk,embed)│    │  (Pinecone/Qdrant/Weaviate)  ││\n│  └──────────────┘    └──────────────┘    └──────────────────────────────┘│\n│                                                      ▲                   │\n│                                                      │ sync              │\n│  ┌──────────────────────────────────────────────────┼───────────────────┐│\n│  │                    Permission Service            │                   ││\n│  └──────────────────────────────────────────────────┼───────────────────┘│\n└─────────────────────────────────────────────────────┼───────────────────┘\n                                                      │\n┌─────────────────────────────────────────────────────┼───────────────────┐\n│                          QUERY PLANE                │                   │\n│  ┌──────────────┐    ┌──────────────┐    ┌─────────┴──────┐             │\n│  │    User      │───▶│  Query API   │───▶│   Retriever    │             │\n│  │  Interface   │    │              │    │ (+ perm filter)│             │\n│  └──────────────┘    └──────────────┘    └────────┬───────┘             │\n│                             │                      │                     │\n│                             ▼                      ▼                     │\n│                      ┌──────────────┐    ┌──────────────┐               │\n│                      │   Reranker   │◀───│   Chunks     │               │\n│                      └──────┬───────┘    └──────────────┘               │\n│                             │                                            │\n│                             ▼                                            │\n│                      ┌──────────────┐    ┌──────────────┐               │\n│                      │  Generator   │───▶│   Response   │               │\n│                      │    (LLM)     │    │  + Citations │               │\n│                      └──────────────┘    └──────────────┘               │\n└─────────────────────────────────────────────────────────────────────────┘\n```\n\n#### Data Pipeline Deep Dive\n\n**1. Connectors:**\n```\nEach source has a dedicated connector:\n- SharePoint: Graph API with delta sync\n- Confluence: REST API with webhooks\n- Google Drive: Drive API with push notifications\n\nConnector responsibilities:\n- Fetch document content and metadata\n- Track change events (create, update, delete)\n- Extract permissions from source system\n- Normalize to common document schema\n```\n\n**2. Document Schema:**\n```json\n{\n  \"doc_id\": \"uuid\",\n  \"source\": \"sharepoint|confluence|gdrive\",\n  \"source_id\": \"original_id_in_source\",\n  \"title\": \"string\",\n  \"content\": \"string\",\n  \"content_type\": \"pdf|html|docx|md\",\n  \"language\": \"en|es|zh\",\n  \"permissions\": {\n    \"users\": [\"user_id_1\", \"user_id_2\"],\n    \"groups\": [\"group_id_1\"],\n    \"visibility\": \"private|internal|public\"\n  },\n  \"metadata\": {\n    \"author\": \"string\",\n    \"created_at\": \"timestamp\",\n    \"updated_at\": \"timestamp\",\n    \"path\": \"folder/path\"\n  }\n}\n```\n\n**3. Chunking Strategy:**\n```\nGiven mixed document types, use adaptive chunking:\n\n- Markdown/HTML: Semantic chunking by headers\n- PDFs: Layout-aware chunking using document AI\n- Wiki pages: Section-based chunking\n\nChunk parameters:\n- Target size: 512 tokens\n- Overlap: 50 tokens\n- Preserve: headers, tables, code blocks\n\nEach chunk inherits parent document permissions.\n```\n\n**4. Embedding:**\n```\nMultilingual requirement suggests:\n- Model: Cohere embed-v3 (multilingual, good quality)\n- Alternative: OpenAI text-embedding-3-large\n\nBatch embedding:\n- Process in batches of 100 chunks\n- Rate limit handling with exponential backoff\n- Store embedding with chunk in vector DB\n```\n\n**5. Vector Database Choice:**\n```\nPinecone or Qdrant for this scale.\n\nSelection criteria:\n- Metadata filtering: Critical for permissions\n- Scale: 10M docs × 5 chunks = 50M vectors\n- Hybrid search: Needed for keyword queries\n\nSchema:\n- Vector: embedding\n- Metadata: doc_id, chunk_id, language, permissions, source\n```\n\n#### Query Pipeline Deep Dive\n\n**1. Permission Resolution:**\n```python\ndef get_user_permissions(user_id: str) -> PermissionSet:\n    \"\"\"\n    Resolve all documents user can access.\n    Returns set of:\n    - Direct user grants\n    - Group memberships expanded\n    - Public document access\n    \n    CACHED with 5-minute TTL since permissions change infrequently.\n    \"\"\"\n    cache_key = f\"permissions:{user_id}\"\n    if cached := cache.get(cache_key):\n        return cached\n    \n    perms = permission_service.resolve(user_id)\n    cache.set(cache_key, perms, ttl=300)\n    return perms\n```\n\n**2. Retrieval with Filtering:**\n```python\ndef retrieve(query: str, user_id: str, top_k: int = 20) -> List[Chunk]:\n    perms = get_user_permissions(user_id)\n    \n    # Detect language for query\n    lang = detect_language(query)\n    \n    # Build permission filter\n    # User can see: public docs, their own, or groups they belong to\n    filter = {\n        \"$or\": [\n            {\"visibility\": \"public\"},\n            {\"users\": {\"$in\": [user_id]}},\n            {\"groups\": {\"$in\": perms.groups}}\n        ]\n    }\n    \n    # Optional: boost same-language content\n    if lang != \"en\":\n        filter[\"language\"] = lang\n    \n    results = vector_db.search(\n        query_embedding=embed(query),\n        top_k=top_k,\n        filter=filter\n    )\n    return results\n```\n\n**3. Reranking:**\n```\nRerank top-20 to get top-5 with cross-encoder.\nModel: bge-reranker-v2-m3 (multilingual)\nLatency budget: ~100ms\n```\n\n**4. Generation:**\n```python\ndef generate(query: str, chunks: List[Chunk], user_id: str) -> Response:\n    context = format_chunks_with_citations(chunks)\n    \n    prompt = f\"\"\"You are a knowledge assistant for [Company].\nAnswer the question using ONLY the provided context.\nIf the context does not contain the answer, say \"I could not find information about that in our knowledge base.\"\nAlways cite sources using [1], [2] format.\n\nCONTEXT:\n{context}\n\nQUESTION: {query}\n\"\"\"\n    \n    response = llm.generate(\n        prompt=prompt,\n        model=\"gpt-4o\",\n        temperature=0.1\n    )\n    \n    return format_with_source_links(response, chunks)\n```\n\n#### Scaling and Reliability\n\n**Latency Budget (p95 < 3s):**\n```\nPermission resolution:   50ms  (cached)\nEmbedding:              100ms\nVector search:          100ms\nReranking:              150ms\nLLM generation:        1500ms\nNetwork/overhead:       100ms\n─────────────────────────────\nTotal:                 2000ms (buffer for P95)\n```\n\n**Scaling Considerations:**\n```\n- Vector DB: Sharded by source or hash\n- Embedding service: Horizontal scale, stateless\n- LLM calls: Multiple providers for redundancy\n- Cache: Redis cluster for permissions and responses\n```\n\n**Failure Handling:**\n```\n- Vector DB down: Return cached results + degraded warning\n- LLM down: Fallback to secondary provider\n- Rate limiting: Queue with backpressure\n- Embedding service: Batch retries with circuit breaker\n```\n\n#### Evaluation Approach\n\n**Offline Metrics:**\n```\n- Retrieval: Precision@5, Recall@5, MRR\n- Generation: RAGAS (faithfulness, relevance)\n- End-to-end: Answer correctness on test set\n```\n\n**Online Metrics:**\n```\n- User feedback: Thumbs up/down\n- Query reformulation rate: User rephrasing indicates failure\n- Citation click-through: Are sources useful?\n```\n\n**Monitoring:**\n```\n- Latency dashboards by percentile\n- Permission filter hit rate\n- Empty result rate by source\n- Cost per query\n```\n\n---\n\n## Exercise 2: Customer Support Chatbot\n\n### Problem Statement\n\nDesign an AI-powered customer support system for an e-commerce company:\n\n- Handle 10,000 conversations per day\n- Access to product catalog (1M products), order history, FAQs\n- Goal: Resolve 70% of tickets without human handoff\n- Support order lookup, returns, product questions\n- Multilingual support (3 languages)\n- Integration with existing Zendesk ticketing\n\n### Solution Highlights\n\n**Key Architectural Decisions:**\n\n1. **Agent Architecture with Flow Control:**\n```\n┌─────────────────────────────────────────────────────────┐\n│                                                         │\n│   ┌─────────┐     ┌─────────────┐     ┌─────────────┐   │\n│   │ Intake  │────▶│  Classify   │────▶│   Router    │   │\n│   └─────────┘     └─────────────┘     └──────┬──────┘   │\n│                                              │           │\n│         ┌────────────────┬──────────────────┼───────┐   │\n│         ▼                ▼                  ▼       ▼   │\n│   ┌───────────┐   ┌───────────┐   ┌───────────┐ ┌─────┐ │\n│   │Order Flow │   │Product Q&A│   │ Returns   │ │Human│ │\n│   └─────┬─────┘   └─────┬─────┘   └─────┬─────┘ └─────┘ │\n│         │               │               │               │\n│         └───────────────┴───────────────┘               │\n│                         │                               │\n│                   ┌─────▼─────┐                         │\n│                   │  Response │                         │\n│                   │ Generator │                         │\n│                   └───────────┘                         │\n└────────────────────────── ndwritten notes\n- HIPAA/SOC2 compliance\n- Human review for low-confidence extractions\n\n### Solution Highlights\n\n**Pipeline Architecture:**\n\n```\n┌────────┐   ┌───────────┐   ┌────────────┐   ┌────────────┐\n│ Ingest │──▶│ Classify  │──▶│  Extract   │──▶│  Validate  │\n└────────┘   └───────────┘   └────────────┘   └────────────┘\n                                                     │\n                                     ┌───────────────┼───────────────┐\n                                     ▼               ▼               ▼\n                              ┌──────────┐   ┌──────────┐   ┌──────────┐\n                              │ Auto-pass│   │  Review  │   │  Reject  │\n                              └──────────┘   └──────────┘   └──────────┘\n```\n\n**Key Components:**\n\n1. **Document Classification:**\n```\nFine-tuned classifier on document types:\n- Invoice, Contract, Receipt, Form, ID, Other\n\nModel: LayoutLMv3 or fine-tuned ViT\nConfidence threshold: 0.95 for auto-routing\n```\n\n2. **Extraction Strategy:**\n```\nTiered extraction based on document type:\n\nTier 1: Document AI (Textract/Azure)\n- Good for structured forms\n- Fast and cheap\n- Returns confidence scores\n\nTier 2: Vision LLM (Claude Opus 4.8, GPT-5.5, Gemini 3.1 Pro)\n- Fallback for complex layouts\n- Better for unstructured text\n- More expensive\n\nCombine outputs and cross-validate.\n```\n\n3. **Validation Rules:**\n```python\nvalidation_rules = {\n    \"invoice\": [\n        (\"total\", lambda x: x > 0, \"Total must be positive\"),\n        (\"date\", lambda x: parse_date(x), \"Invalid date format\"),\n        (\"vendor_id\", lambda x: regex_match(x, TAX_ID_PATTERN), \"Invalid tax ID\"),\n        (\"line_items\", lambda x: sum(i.amount for i in x) == total, \"Line items must sum to total\")\n    ],\n    \"contract\": [\n        (\"parties\", lambda x: len(x) >= 2, \"Contract must have at least 2 parties\"),\n        (\"effective_date\", lambda x: parse_date(x), \"Invalid date\"),\n
