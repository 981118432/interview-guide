      (\"signature_present\", lambda x: x == True, \"Signature required\")\n    ]\n}\n```\n\n4. **Human Review Interface:**\n```\nReviewer sees:\n- Original document image\n- Extracted fields with confidence scores\n- Validation errors highlighted\n- Suggested corrections from LLM\n- One-click approval or field-level corrections\n```\n\n5. **Compliance Measures:**\n```\nHIPAA/SOC2 requirements:\n- All documents encrypted at rest (AES-256)\n- TLS 1.3 in transit\n- Audit log for all access and changes\n- PHI detection and masking\n- Retention policies enforced\n- Access controls with MFA\n```\n\n---\n\n## Exercise 5: Real-Time Content Moderation\n\n### Problem Statement\n\nDesign a content moderation system for a social platform:\n\n- 1 million posts per day (text, images, video)\n- Latency requirement: under 500ms for posts to be visible\n- Detect: hate speech, violence, adult content, spam\n- Appeal workflow for false positives\n- Support 10 languages\n\n### Solution Highlights\n\n**Architecture Pattern: Multi-Stage Cascade**\n\n```\n         ┌───────────────────────────────────────────┐\n         │              Fast Filters                 │\n         │   (regex, blocklist, hash matching)       │\n         └─────────────────┬─────────────────────────┘\n                           │ Pass 95%\n                           ▼\n         ┌───────────────────────────────────────────┐\n         │            ML Classifiers                 │\n         │   (text: BERT, image: CLIP, video: X3D)   │\n         └─────────────────┬─────────────────────────┘\n                           │ Uncertain 5%\n                           ▼\n         ┌───────────────────────────────────────────┐\n         │            LLM Analysis                   │\n         │   (context-aware, nuanced decisions)      │\n         └─────────────────┬─────────────────────────┘\n                           │ Still uncertain 0.5%\n                           ▼\n         ┌───────────────────────────────────────────┐\n         │            Human Review                   │\n         └───────────────────────────────────────────┘\n```\n\n**Key Design Decisions:**\n\n1. **Latency Optimization:**\n```\nTarget: 500ms total\n\nStage 1 (Fast): 20ms\n- Regex patterns\n- Known hash matching (PhotoDNA)\n- Blocklist lookup\n\nStage 2 (ML): 80ms\n- Batched inference on GPU\n- Small specialized models\n- Parallel text/image processing\n\nStage 3 (LLM): 400ms (async for borderline)\n- Only 5% of content reaches here\n- Used for nuanced decisions\n```\n\n2. **Threshold Strategy:**\n```python\nclass ModerationDecision:\n    BLOCK = \"block\"          # High confidence violation\n    ALLOW = \"allow\"          # High confidence safe\n    LIMIT = \"limit\"          # Reduce distribution\n    REVIEW = \"human_review\"  # Queue for human\n\nthresholds = {\n    \"hate_speech\": {\n        \"block\": 0.95,\n        \"limit\": 0.80,\n        \"review\": 0.60\n    },\n    \"adult_content\": {\n        \"block\": 0.98,  # Higher threshold, legal implications\n        \"limit\": 0.90,\n        \"review\": 0.70\n    }\n}\n```\n\n3. **Appeal Workflow:**\n```\n1. User submits appeal\n2. Content queued for human review\n3. Different reviewer than original (blind review)\n4. Decision logged with reasoning\n5. If overturned:\n   - Content restored\n   - Original decision added to training data as negative\n   - Model retrained periodically\n```\n\n---\n\n## Exercise 6: Multi-Tenant AI Platform\n\n### Problem Statement\n\nDesign a multi-tenant AI platform (AI-as-a-Service):\n\n- Serve 500+ enterprise customers\n- Each customer has their own documents and models\n- Complete data isolation between tenants\n- Per-tenant usage tracking and billing\n- Different pricing tiers with different capabilities\n- SOC2 compliance required\n\n### Solution Highlights\n\n**Tenant Isolation Architecture:**\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                         API Gateway                              │\n│  ┌──────────────────────────────────────────────────────────┐   │\n│  │   Auth → Tenant Context → Rate Limit → Route             │   │\n│  └──────────────────────────────────────────────────────────┘   │\n└─────────────────────────────────────────────────────────────────┘\n                               │\n                               ▼\n┌─────────────────────────────────────────────────────────────────┐\n│                    Tenant-Aware Service Layer                    │\n│                                                                  │\n│  All operations scoped to tenant_id from context                │\n│  - Retrieval filters by tenant                                  │\n│  - Cache keys prefixed by tenant                                │\n│  - Audit logs include tenant                                    │\n└─────────────────────────────────────────────────────────────────┘\n                               │\n           ┌───────────────────┼───────────────────┐\n           ▼                   ▼                   ▼\n┌─────────────────┐ ┌─────────────────┐ ┌─────────────────┐\n│  Shared Vector  │ │  Shared LLM     │ │  Shared Object  │\n│  DB (filtered)  │ │  (no tenant     │ │  Storage        │\n│                 │ │   data in prompt│ │  (tenant paths) │\n│  tenant_id in   │ │   history)      │ │                 │\n│  all metadata   │ │                 │ │  s3://bucket/   │\n└─────────────────┘ └─────────────────┘ │  {tenant_id}/   │\n                                        └─────────────────┘\n```\n\n**Critical Isolation Points:**\n\n```python\nclass TenantContext:\n    tenant_id: str\n    user_id: str\n    tier: str  # \"starter\" | \"pro\" | \"enterprise\"\n    \n    def __enter__(self):\n        # Set tenant context for all downstream calls\n        _tenant_context.set(self)\n        \n    def __exit__(self, *args):\n        _tenant_context.set(None)\n\n# Middleware ensures tenant context on every request\n@middleware\ndef enforce_tenant_context(request, call_next):\n    tenant_id = extract_tenant_from_token(request.headers[\"Authorization\"])\n    with TenantContext(tenant_id=tenant_id, ...):\n        verify_tenant_access(tenant_id, request.path)\n        response = call_next(request)\n        add_tenant_to_audit_log(tenant_id, request, response)\n    return response\n```\n\n**Billing and Usage Tracking:**\n\n```python\nusage_schema = {\n    \"tenant_id\": \"string\",\n    \"timestamp\": \"datetime\",\n    \"operation\": \"embed|retrieve|generate\",\n    \"model\": \"string\",\n    \"tokens_in\": \"int\",\n    \"tokens_out\": \"int\",\n    \"latency_ms\": \"int\",\n    \"cost_cents\": \"decimal\"\n}\n\n# Real-time usage aggregation\nasync def track_usage(tenant_id: str, operation: Usage):\n    # Append to time-series DB\n    await timeseries.write(\"usage\", {\n        \"tenant_id\": tenant_id,\n        **operation.dict()\n    })\n    \n    # Update real-time counter for rate limiting\n    await redis.incr(f\"usage:{tenant_id}:{today()}\", operation.tokens)\n```\n\n---\n\n## Exercise 7: Semantic Search at Scale\n\n### Problem Statement\n\nDesign a semantic search system for an e-commerce site:\n\n- 50 million products\n- 100 million queries per day\n- P99 latency under 100ms\n- Support filters (price, category, brand, ratings)\n- Personalization based on user history\n- Real-time inventory updates\n\n### Solution Highlights\n\n**Key Challenge: 100ms at 100M queries/day**\n\n```\n100M queries/day = 1,157 QPS average\nPeak: 5,000-10,000 QPS\n\nAt 100ms latency, need:\n- Edge caching\n- Pre-computed embeddings\n- Optimized retrieval\n- Minimal LLM involvement\n```\n\n**Architecture:**\n\n```\n┌────────────────────────────────────────────────────────────┐\n│                         CDN/Edge                            │\n│              (Cache popular queries: ~30% hit)              │\n└─────────────────────────────┬──────────────────────────────┘\n                              │\n┌─────────────────────────────▼──────────────────────────────┐\n│                      Query Service                          │\n│  1. Embed query (cached embeddings for common queries)      │\n│  2. Retrieve candidates (ANN search)                        │\n│  3. Apply filters (post-filter or hybrid)                   │\n│  4. Personalize ranking                                     │\n│  5. Return results                                          │\n└─────────────────────────────┬──────────────────────────────┘\n                              │\n┌─────────────────────────────▼──────────────────────────────┐\n│                    Vector Database Cluster                  │\n│  - Sharded by category (reduce search space)                │\n│  - HNSW index with ef_search tuned for speed                │\n│  - Metadata filtering with roaring bitmaps                  │\n└────────────────────────────────────────────────────────────┘\n```\n\n**Latency Budget:**\n\n```\nEdge cache check:    5ms\nEmbedding lookup:   10ms (cached) or 30ms (compute)\nVector search:      30ms\nFiltering:          10ms\nPersonalization:    10ms\nSerialization:      10ms\nNetwork overhead:   25ms\n─────────────────────\nTotal:              100ms target (with cache hit)\n```\n\n**Hybrid Search Strategy:**\n\n```python\ndef search(query: str, filters: dict, user_id: str) -> List[Product]:\n    # Determine search strategy based on query\n    if is_keyword_heavy(query):\n        # \"nike air max 90 size 10\"\n        sparse_weight = 0.7\n        dense_weight = 0.3\n    else:\n        # \"comfortable running shoes for flat feet\"\n        sparse_weight = 0.3\n        dense_weight = 0.7\n    \n    # Parallel retrieval\n    dense_results = vector_db.search(embed(query), top_k=100, filter=filters)\n    sparse_results = elastic.search(query, top_k=100, filter=filters)\n    \n    # Reciprocal rank fusion\n    combined = rrf_merge(\n        [dense_results, sparse_results],\n        weights=[dense_weight, sparse_weight]\n    )\n    \n    # Personalization boost\n    personalized = apply_user_preferences(combined, user_id)\n    \n    return personalized[:20]\n```\n\n**Real-Time Updates:**\n\n```\nProduct updates (price, inventory) flow:\n1. Change event published to Kafka\n2. Consumer updates vector DB metadata\n3. Search reflects change within seconds\n\nReindexing (description changes):\n1. Full re-embed required\n2. Run as async job\n3. Swap index when complete\n```\n\n---\n\n## Exercise 8: Evaluation Pipeline for a Production LLM Product\n\n### Problem Statement\n\n\"Your company ships an AI assistant used by 50,000 daily users. Leadership wants to ship model and prompt changes weekly without quality regressions. Design the evaluation pipeline: offline evals, CI gating, judge calibration, and production monitoring. Budget: the eval system itself should cost under 2% of inference spend.\"\n\n### Clarifying Questions to Ask\n\n- What does \"quality\" mean for this product? (Task success, faithfulness, tone, safety?)\n- Do we have any labeled data today, or are we starting from zero?\n- What is the change velocity? (Prompts daily, models monthly?)\n- What is the cost of a shipped regression? (Support tickets, churn, regulatory exposure?)\n- Who consumes eval results? (Engineers gating PRs, PMs tracking quality, execs tracking trend lines?)\n\n### Solution Walkthrough\n\n**High-level architecture:**\n\n```\n                    ┌────────────────────────────────────────────┐\n                    │              EVAL PIPELINE                  │\n                    │                                             │\n  Prompt/model PR ──► CI runner ── dev set (visible, ~200 cases) │\n                    │     │                                       │\n                    │     ├── held-out set (CI-only, ~300 cases,  │\n                    │     │    rotated quarterly)                  │\n                    │     │                                       │\n                    │     └── gate: pass/fail vs baseline ──► merge│\n                    │                                             │\n  Production ──────► sampler (1-5% of traffic)                   │\n                    │     │                                       │\n                    │     ├── LLM-judge scoring (async, cheap)    │\n                    │     ├── human-graded slice (weekly, ~100)   │\n                    │     └── outcome metrics (thumbs, escalation)│\n                    │                                             │\n                    └──── dashboards + regression alerts ─────────┘\n```\n\n**1. Dataset strategy (the part most candidates skip):**\n\n```\nGolden dataset composition:\n- 40% sampled from real production traces (stratified by intent cluster)\n- 30% known-hard cases from past incidents and complaints\n- 20% adversarial cases (injection attempts, edge formats)\n- 10% canary cases that must never change behavior\n\nSplit: dev (iterate freely) / held-out (CI-only, never inspected)\nRefresh: quarterly, sampled from recent traffic; archive old sets\n```\n\n**2. Scoring design:**\n\n- Binary pass/fail per dimension (faithfulness, completeness, tone, safety), not 1-5 scales. Binary decisions are reproducible; Likert drifts.\n- LLM-as-judge for scale: a cheap model (Claude Haiku 4.5, GPT-5.5-mini) with a rubric and few-shot anchors per dimension.\n- Judge calibration: monthly agreement check against the human-graded slice. Judge-human agreement is itself a dashboard metric; below 85% agreement, the judge prompt gets fixed before any product conclusions are drawn.\n\n**3. CI gating:**\n\n```python\ndef eval_gate(pr_results, baseline_results):\n    # Hard gates: any safety regression blocks merge\n    if pr_results.safety_pass_rate < baseline_results.safety_pass_rate:\n        return Block(reason=\"safety regression\")\n    # Soft gates: quality within noise band\n    delta = pr_results.task_success - baseline_results.task_success\n    if delta < -0.02:                  # 2pt regression threshold\n        return Block(reason=f\"quality drop {delta:.1%}\")\n    if pr_results.held_out_success < pr_results.dev_success - 0.05:\n        return Warn(reason=\"possible dev-set overfitting\")\n    return Pass()\n```\n\n**4. Production monitoring:**\n\n- Sampled judge scoring on live traffic (1-5%), trended daily.\n- Outcome linkage: complaint rate, thumbs-down rate, and escalation rate plotted against eval scores on the same dashboard. Divergence between eval trend and outcome trend triggers an eval review.\n- Drift alarms: input distribution shift (intent cluster mix), score drop by segment, and judge agreement decay.\n\n**5. Cost control:**\n\n```\n50K DAU, ~3 requests each = 150K requests/day\nSample 2% = 3K judged requests/day\nJudge cost: ~1K tokens per judgment on a $1/1M model = ~$3/day\nWeekly human slice: 100 cases x 3 min reviewer time\nCI runs: 500 cases x ~2K tokens per PR = under $2 per PR\nTotal: well under the 2% budget; the human slice is the\ndominant cost and it is what keeps the judge honest.\n```\n\n### What Distinguishes Strong Candidates\n\n- They design the dataset before the scorer; a great judge on a stale dataset measures nothing.\n- They treat the judge as a system component with its own eval (calibration vs humans), not as ground truth.\n- They name eval gaming risks unprompted: dev-set overfitting, judge sycophancy, metric narrowing, silent exclusion of hard cases.\n- They link offline scores to production outcomes instead of celebrating green dashboards.\n- They quantify the eval budget and place the expensive human grading where it has the most leverage.\n\n---\n\n## Exercise 9: Memory and State for a Long-Running Agent\n\n### Problem Statement\n\n\"Design the memory system for a personal AI assistant that works with a user over months: it should remember preferences and facts, learn from past sessions, recall relevant history at the right moments, and forget what it should not keep. Sessions can run for hours. Support 1M users.\"\n\n### Clarifying Questions to Ask\n\n- What memory failures hurt most: forgetting something important, or recalling something wrong or stale?\n- Privacy constraints? (GDPR deletion, per-user isolation, regulated data?)\n- Is memory per-user only, or shared organizational knowledge too?\n- Latency budget for recall on each turn?\n- How long do individual sessions run? (Determines in-session vs cross-session design.)\n\n### Solution Walkthrough\n\n**The memory hierarchy:**\n\n```\n┌──────────────────────────────────────────────────────────┐\n│ L1 Working memory: the context window                     │\n│   Current session, tool results, scratchpad               │\n│   Managed by compaction + just-in-time loading            │\n├──────────────────────────────────────────────────────────┤\n│ L2 Episodic memory: what happened                         │\n│   Past session summaries, trajectories, outcomes          │\n│   Store: vector DB, retrieved by similarity + recency     │\n├──────────────────────────────────────────────────────────┤\n│ L3 Semantic memory: what is true                          │\n│   Extracted facts and preferences with provenance         │\n│   Store: structured records or knowledge graph            │\n├──────────────────────────────────────────────────────────┤\n│ L4 Procedural memory: how to do things                    │\n│   Learned workflows, per-user playbooks (skills)          │\n│   Store: versioned files, loaded on demand                │\n└──────────────────────────────────────────────────────────┘\n```\n\n**1. In-session (L1): context engineering, not storage.**\nCompaction at a window threshold (summarize history, keep recent artifacts), just-in-time loading of large content by reference, and a structured scratch note the agent re-reads after compaction. A session that runs hours never holds its whole transcript in context.\n\n**2. Write path (the hard part):**\n\n```\nSession ends (or hits checkpoint)\n    │\n    ├── Summarize episode → L2 (embedding + metadata:\n    │     timestamp, topics, outcome, sentiment)\n    │\n    └── Fact extraction pass → candidate facts\n          │\n          ├── Deduplicate against existing L3\n          ├── Conflict check: contradicts a stored fact?\n          │     ├── Newer + higher confidence → supersede (keep old\n          │     │     version with valid_to timestamp)\n          │     └── Ambiguous → store as candidate, confirm with\n          │           user at next natural opportunity\n          └── Importance filter: discard chit-chat, keep\n                preferences, commitments, corrections\n```\n\nThe conflict path matters most: \"user moved from Madrid to Lisbon\" must supersede, not coexist. Bitemporal records (valid_from, valid_to) make supersession auditable and reversible.\n\n**3. Read path:**\n\n- Each turn builds a recall query from the current intent, retrieves top-k from L2 (similarity + recency + importance weighting) and matching facts from L3.\n- A relevance gate drops weak matches rather than stuffing them in; wrong memories poison the response worse than missing ones.\n- Recall budget: a few hundred tokens of memory per turn, never a transcript dump.\n\n**4. Forgetting and privacy:**\n\n- Decay: episodic entries lose retrieval weight over time unless reinforced by access.\n- Consolidation: a periodic job merges related episodes into summaries (many \"billing question\" episodes become one pattern note).\n- GDPR deletion: per-user partition keys everywhere; deletion removes L2/L3/L4 rows and invalidates caches. Hard isolation per user; memory is never shared across tenants by similarity.\n\n**5. Scale sketch (1M users):**\n\n```\nStorage: ~thousands of L2 entries + hundreds of L3 facts per\n  active user; vector DB partitioned by user_id (metadata\n  filter or namespace per tenant tier)\nWrite path: async after session close; queue + worker pool\nRead path: p95 < 150ms recall (ANN on a per-user slice is small)\nCost: extraction pass on session close is the main LLM cost;\n  use a cheap model (Haiku 4.5 / V4 Flash) with a strict schema\n```\n\n### What Distinguishes Strong Candidates\n\n- They separate in-session context management from cross-session memory instead of conflating them.\n- They spend time on the write path (extraction, dedup, conflict supersession) rather than only on retrieval.\n- They treat wrong recall as worse than no recall and design the relevance gate accordingly.\n- They name memory poisoning as a security surface: untrusted content written today and trusted tomorrow needs provenance tags and review gates.\n- They mention production frameworks (Mem0, Zep, Letta) as build-vs-buy options while still being able to design from primitives.\n\n---\n\n## Tips for Whiteboard Exercises\n\n### Drawing Tips\n\n1. **Start with boxes and labels** before connecting with arrows\n2. **Use consistent notation**: rectangles for services, cylinders for databases, arrows for data flow\n3. **Label data on arrows**: what flows between components\n4. **Leave space** for additions as you discuss\n\n### Common Patterns to Know\n\n| Pattern | When to Use | Draw As |\n|---------|-------------|---------|\n| Load balancer + service fleet | Any scaled service | LB → multiple boxes |\n| Queue + workers | Async processing | Queue → worker pool |\n| Cache layer | Read-heavy, latency-sensitive | Diamond before service |\n| CDC/streaming | Real-time updates | Kafka/stream icon |\n| Sidecar | Cross-cutting concerns | Small box attached to service |\n\n### Phrases That Signal Strong Candidates\n\n- \"Before I design this, let me understand the scale...\"\n- \"The tradeoff here is...\"\n- \"In production, we would also need...\"\n- \"One failure mode to consider is...\"\n- \"Let me walk you through the latency budget...\"\n- \"For evaluation, I would measure...\"\n\n### Time Management\n\n- Do not spend more than 5 minutes on clarification\n- Draw the complete high-level picture before deep diving\n- Leave time for reliability and evaluation\n- Check in with the interviewer on focus areas\n\n---\n\n*See also: [Question Bank](01-question-bank.md) | [Answer Frameworks](02-answer-frameworks.md) | [Common Pitfalls](03-common-pitfalls.md)*\n", "content_zh": "# AI 系统设计白板练习\n\n白板题的目标是训练你在有限时间内完成需求澄清、架构设计、关键路径深挖、容量估算、评测和可靠性讨论。\n\n## 练习 1：企业 RAG 系统\n\n### 问题\n\n为多个部门设计企业知识库问答，要求支持权限、文档更新、引用、搜索和高并发。\n\n### 35 分钟节奏\n\n5 分钟澄清用户、文档、租户、更新频率、QPS、延迟和质量；8 分钟画数据接入与查询架构；12 分钟深入混合检索、权限和上下文；5 分钟讲评测；5 分钟讲可靠性、成本和扩展。\n\n### 解题重点\n\n数据管道包括解析、OCR、分块、Embedding、BM25 和索引；查询管道包括鉴权、查询改写、混合检索、RRF、重排序、上下文组装、LLM 和引用。权限必须在检索前过滤，并在缓存、日志和异步任务中继续隔离。\n\n## 练习 2：客服聊天机器人\n\n### 问题\n\n设计能回答 FAQ、查询订单、处理退款并转人工的客服系统。\n\n### 解题重点\n\n将知识问答和有副作用的工具调用分开。意图分类后进入 RAG、订单查询或人工路径；退款等动作需要权限、参数校验和用户确认。设置超时、重试上限、Fallback 和审计。用解决率、转人工率、满意度、延迟和成本评估。\n\n## 练习 3：代码审查助手\n\n### 问题\n\n设计一个读取 Pull Request、发现问题、提出修改建议并生成评论的代码助手。\n\n### 解题重点\n\n增量读取 diff 和相关上下文，避免每次加载整个仓库；结合静态分析、依赖扫描、RAG 和 LLM。输出必须引用代码行和规则依据。Agent 可以提出修改，但不能绕过权限直接合并；高风险变更需要人工审查。\n\n### 复盘重点\n\n必须区分真实缺陷、风格建议和不确定推断；评测误报率、漏报率、修复采纳率、测试通过率、延迟和 token 成本。\n\n## 练习 4：文档处理流水线\n\n### 问题\n\n为 PDF、Office、扫描件和图片设计可检索的文档处理系统。\n\n### 解题重点\n\n采用异步队列：上传、病毒扫描、解析、OCR、版面识别、表格/图片抽取、清洗、分块、Embedding、索引和质量检查。每一步使用幂等任务 ID，失败进入重试或 Dead Letter Queue。保存原文件、解析版本、权限、错误原因和索引版本。\n\n## 练习 5：实时内容审核\n\n### 问题\n\n设计文本、图片和多语言内容的实时审核服务。\n\n### 解题重点\n\n使用规则、轻量分类模型、Embedding 检索、视觉模型和 LLM 复核的分层架构。低风险请求快速返回，不确定请求进入更强模型或人工审核。监控 Precision、Recall、误杀、漏放、延迟和审核负载，并为模型故障提供安全默认。\n\n## 练习 6：多租户 AI 平台\n\n### 问题\n\n为多个客户提供模型、RAG、Agent 和工具调用能力，同时实现资源与数据隔离。\n\n### 解题重点\n\n每个请求都携带并校验 tenant context；向量、缓存、Prompt、Checkpoint、日志和计费都必须按租户隔离。通过网关统一限流、配额、模型路由和审计；对高敏感客户使用独立数据库或资源池。\n\n平台还应实时聚合 token、模型、工具和存储用量，提供预算告警和超额策略。\n\n## 练习 7：大规模语义搜索\n\n### 问题\n\n设计高吞吐、低延迟的语义搜索系统。\n\n### 解题重点\n\n比较 HNSW、IVF、PQ 和托管向量数据库，设计分片、复制、增量索引、过滤和重排序。设置召回率、P95/P99 延迟、索引新鲜度、成本和扩容目标。对热门查询使用缓存，对精确词使用 BM25 或混合检索。\n\n## 练习 8：生产 LLM 产品的评测流水线\n\n### 澄清问题\n\n用户任务是什么？哪些输出是高风险的？有没有标准答案？如何定义质量？线上流量和模型版本如何记录？评测结果是否作为发布门禁？\n\n### 解题重点\n\n建立版本化测试集，分为检索、生成、安全、格式、延迟和成本指标。自动评测使用 RAGAS、LLM-as-Judge 和规则，人工作为校准。每次 Prompt、模型、工具或索引变更都跑回归，并在生产抽样和 A/B 测试。\n\n### 优秀候选人的表现\n\n不会把一个总分当成质量真相；会讨论数据漂移、评测投机、评分器偏差、隐藏集、人工抽检和线上业务指标。\n\n## 练习 9：长时间运行 Agent 的记忆与状态\n\n### 问题\n\n设计能运行数十分钟甚至数小时，并支持暂停、恢复和人工接管的 Agent。\n\n### 解题重点\n\n将短期上下文、结构化任务状态、长期记忆和外部知识分开。每一步保存 Checkpoint，使用事件日志和幂等工具支持恢复；对循环、成本、超时、工具失败和人工升级设置边界。记忆写入要有来源、权限、过期和删除策略。\n\n## 白板练习技巧\n\n### 画图技巧\n\n先画用户、网关、核心服务、存储和模型，再补旁路的索引、缓存、评测和监控。箭头标出数据流，虚线标出异步流程，旁边写出关键指标和失败路径。\n\n### 常见模式\n\nRAG 双管线、网关与模型路由、队列与 Worker、Checkpoint、Fallback、人工升级、分层缓存、多租户过滤和评测门禁是高频组件。\n\n### 能体现成熟度的表达\n\n“我先确认假设”；“这个指标如何测量”；“如果供应商不可用怎么办”；“这里需要人工确认”；“我会用离线回归和灰度验证”。\n\n### 时间管理\n\n前 20% 时间澄清和画最小架构，中间 50% 深挖一个关键路径，最后 30% 讨论评测、可靠性、安全、成本和总结。\n", "summary_content": "# 《AI 系统设计白板练习》中文概要\n\n这篇资料提供 9 个场景，训练从需求澄清到可靠性设计的完整面试动作。\n\n## 优先练习\n\n对你的目标岗位，优先练习企业 RAG、评测流水线、长时间 Agent、多租户平台和文档处理。它们能直接连接 AliceFeed 的 RAG、上下文压缩、RAGAS、Langfuse 和 Tool Calling 经历。\n\n## 白板固定结构\n\n```text\n需求与假设 → 指标 → 初始架构 → 关键路径\n→ 评测/观测 → 故障/安全/成本 → 总结权衡\n```\n\n## 一句话总结\n\n白板面试不是比谁画的组件多，而是看谁能设计一条可解释、可评测、可恢复的端到端数据流。\n"}, {"filename": "05-behavioral-for-ai-roles.md", "section_id": "00-interview-prep", "section_label": "00 · 面试准备", "label": "行为面试", "title_zh": "AI 岗位行为面试", "summary": "围绕模糊需求、预期管理、失败复盘、跨团队协作、责任 AI、技术决策和影响力，提供 STAR-L 示例与练习清单。", "detail": "AI 岗位的行为面试不仅考察做过什么，还考察你如何在不确定性中做判断。资料建议使用 STAR-L：背景、任务、行动、结果、学习。准备故事时可以优先选择真实且能体现影响力的经历，例如搭建 Agent 框架、限制模型调用循环、建设上下文压缩 Middleware、接入 Langfuse、使用测评集和 RAGAS 做回归验证，以及带领转档小组协调任务。数据不确定时要明确口径，不能为了让故事更漂亮而补造数字。", "content": "# Behavioral Questions for AI/ML Roles\n\nBehavioral questions in AI roles assess how you approach ambiguous problems, collaborate across disciplines, and handle the unique challenges of AI systems. This chapter covers common questions and frameworks for strong answers.\n\n## Table of Contents\n\n- [Why Behavioral Questions Matter for AI Roles](#why-behavioral-questions-matter-for-ai-roles)\n- [AI-Specific Behavioral Themes](#ai-specific-behavioral-themes)\n- [Question Categories and Examples](#question-categories-and-examples)\n- [Sample Answers Using STAR-L](#sample-answers-using-star-l) (6 worked examples)\n- [Questions to Ask Your Interviewers](#questions-to-ask-your-interviewers)\n- [Red Flags to Avoid](#red-flags-to-avoid)\n- [Practicing Out Loud](#practicing-out-loud) ⭐ *NEW*\n- [Preparation Checklist](#preparation-checklist)\n\n---\n\n## Why Behavioral Questions Matter for AI Roles\n\nAI projects have unique characteristics that behavioral questions probe:\n\n| Challenge | What Interviewers Assess |\n|-----------|--------------------------|\n| Uncertainty | How do you make decisions with incomplete information? |\n| Rapid change | How do you stay current and adapt? |\n| Cross-functional work | How do you collaborate with research, product, legal? |\n| Ethical concerns | How do you handle responsible AI considerations? |\n| Technical debt | How do you balance shipping with correctness? |\n| Stakeholder education | How do you explain AI limitations to non-technical peers? |\n\n---\n\n## AI-Specific Behavioral Themes\n\n### Theme 1: Handling Ambiguity\n\nAI projects often start with unclear requirements. Strong candidates show they can structure ambiguity.\n\n**Questions to expect:**\n- Tell me about a time you started a project without clear requirements\n- How do you decide what to build when the path is not obvious?\n- Describe a situation where you changed direction mid-project\n\n**What they look for:**\n- Systematic approach to exploring unknowns\n- Willingness to prototype and learn\n- Knowing when to commit vs when to keep exploring\n\n---\n\n### Theme 2: Managing Expectations\n\nAI capabilities are often misunderstood. Strong candidates manage stakeholder expectations.\n\n**Questions to expect:**\n- Tell me about a time you had to say no to a stakeholder request\n- How do you explain AI limitations to non-technical colleagues?\n- Describe a situation where expectations were unrealistic\n\n**What they look for:**\n- Clear communication without jargon\n- Proposing alternatives, not just saying no\n- Building trust through honesty about limitations\n\n---\n\n### Theme 3: Dealing with Failure\n\nAI systems fail in ways that differ from traditional software. Strong candidates learn from failures without defensiveness.\n\n**Questions to expect:**\n- Tell me about an AI system that did not work as expected\n- How do you handle a model that performs poorly in production?\n- Describe a time you shipped something that had issues\n\n**What they look for:**\n- Taking responsibility\n- Root cause analysis\n- Systems thinking about prevention\n\n---\n\n### Theme 4: Cross-Functional Collaboration\n\nAI projects require working with research, product, legal, and operations. Strong candidates navigate these relationships.\n\n**Questions to expect:**\n- How do you work with researchers who have different priorities?\n- Tell me about a conflict with a product manager over AI capabilities\n- Describe collaborating with legal on an AI feature\n\n**What they look for:**\n- Respecting different expertise\n- Finding common ground\n- Translating between technical and business language\n\n---\n\n### Theme 5: Responsible AI\n\nAI systems can cause harm. Strong candidates think proactively about ethics and safety.\n\n**Questions to expect:**\n- Tell me about a time you raised an ethical concern\n- How do you think about fairness in AI systems?\n- Describe a situation where you prioritized safety over speed\n\n**What they look for:**\n- Awareness of AI risks\n- Willingness to slow down for safety\n- Practical approach to mitigation\n\n---\n\n## Question Categories and Examples\n\n### Leadership and Influence\n\n**Q: Tell me about a time you led a technical initiative without formal authority.**\n\nStrong answer elements:\n- How you built consensus\n- How you handled disagreement\n- The outcome and what you learned\n\n**Q: Describe a situation where you had to convince others to adopt a new approach.**\n\nStrong answer elements:\n- Understanding their concerns\n- Providing evidence\n- Incremental adoption strategy\n\n---\n\n### Technical Decision Making\n\n**Q: Tell me about a difficult technical decision you made with incomplete information.**\n\nStrong answer elements:\n- What information was missing\n- How you bounded the uncertainty\n- How the decision played out\n\n**Q: Describe a time you chose a simpler solution over a more sophisticated one.**\n\nStrong answer elements:\n- How you evaluated tradeoffs\n- Stakeholder alignment\n- Whether it was the right call\n\n---\n\n### Project Challenges\n\n**Q: Tell me about the most complex AI project you worked on.**\n\nStrong answer elements:\n- Clear description of complexity\n- Your specific contribution\n- How you managed the complexity\n\n**Q: Describe a project that failed. What happened and what did you learn?**\n\nStrong answer elements:\n- Honest assessment of what went wrong\n- Your role in the failure\n- Concrete changes you made afterward\n\n---\n\n### Collaboration and Conflict\n\n**Q: Tell me about a disagreement with a colleague about a technical approach.**\n\nStrong answer elements:\n- Understanding their perspective\n- How you resolved it\n- Relationship afterward\n\n**Q: Describe working with someone who had a very different working style.**\n\nStrong answer elements:\n- Specific differences\n- Adaptations you made\n- What you learned about collaboration\n\n---\n\n### Growth and Learning\n\n**Q: How do you stay current with the rapidly changing AI field?**\n\nStrong answer elements:\n- Specific sources and practices\n- How you filter signal from noise\n- Example of applying new knowledge\n\n**Q: Tell me about a skill you developed recently.**\n\nStrong answer elements:\n- Why you needed it\n- How you learned it\n- How you applied it\n\n---\n\n## Sample Answers Using STAR-L\n\n### Example 1: Handling Ambiguity\n\n**Q: Tell me about a time you started an AI project with unclear requirements.**\n\n**Situation:**\nWe wanted to add AI-powered search to our product, but stakeholders had different visions. Sales wanted \"magic\" search that understood everything. Engineering wanted something we could build in a quarter. Leadership wanted differentiation from competitors.\n\n**Task:**\nAs the tech lead, I needed to align stakeholders and define a concrete first version we could build and learn from.\n\n**Action:**\nI started by interviewing five key stakeholders to understand their underlying needs, not just their feature requests. I found the common thread was reducing time to find information.\n\nI then built three rapid prototypes showing different levels of sophistication:\n1. Keyword search with better ranking\n2. Semantic search with embeddings\n3. Conversational search with RAG\n\nI demoed each with real queries from our support logs, showing actual performance and explaining the engineering effort for each.\n\nThis reframed the conversation from \"what features\" to \"what value at what cost.\" We aligned on starting with semantic search, with a plan to add conversational features in phase two.\n\n**Result:**\nWe shipped semantic search in 6 weeks. User time-to-answer dropped 40%. The clear success made it easy to get buy-in for phase two.\n\n**Learning:**\nI learned that ambiguity often comes from stakeholders optimizing for different things. Showing concrete options with real tradeoffs moves conversations forward faster than abstract discussions. I now start every ambiguous project with quick prototypes.\n\n---\n\n### Example 2: Managing Failed Expectations\n\n**Q: Tell me about a time an AI system did not perform as expected in production.**\n\n**Situation:**\nWe launched a content recommendation system that performed great in testing but showed 30% lower engagement in production than our heuristic baseline.\n\n**Task:**\nAs the ML engineer who built it, I needed to diagnose the issue, decide whether to roll back, and regain stakeholder trust.\n\n**Action:**\nFirst, I did not hide the problem. I immediately flagged it to leadership with the data showing the gap. I proposed keeping 10% of traffic on the new system while I investigated.\n\nInvestigation revealed two issues:\n1. Our test set was not representative. It was from high-engagement users.\n2. Cold start was worse than expected for new users.\n\nI implemented stratified testing that matched production user distribution and added a heuristic fallback for cold users.\n\nI also created a monitoring dashboard so stakeholders could see real-time performance. This transparency helped rebuild trust.\n\n**Result:**\nThe revised system outperformed the baseline by 15% after two more weeks of iteration. More importantly, I established testing practices that caught similar issues in future projects.\n\n**Learning:**\nI learned that production is the only true test for ML systems. I now always instrument for monitoring before launch and plan for rapid iteration. I also learned that transparency during failures builds more trust than hiding problems.\n\n---\n\n### Example 3: Ethical Concern\n\n**Q: Tell me about a time you raised an ethical concern about an AI system.**\n\n**Situation:**\nWe were building a resume screening system to help recruiters process high volumes of applications. During development, I noticed the training data was heavily biased toward engineers from top universities.\n\n**Task:**\nI needed to raise the concern in a way that was taken seriously without being dismissed as slowing down the project.\n\n**Action:**\nI started by quantifying the problem. I showed that the model had 80% precision on Stanford graduates but only 45% on state school graduates with similar qualifications.\n\nI presented this to the team not as \"we should not do this\" but as \"this is a business and legal risk.\" I cited recent cases where companies faced lawsuits over biased hiring and showed how our model could create similar exposure.\n\nI proposed two alternatives:\n1. Rebalance training data to ensure diverse representation\n2. Use the model only for matching, not ranking, with human review for all candidates\n\nThe team chose option one plus adding fairness metrics to our evaluation suite.\n\n**Result:**\nWe delayed launch by three weeks but shipped a system that performed consistently across demographics. Legal and HR were grateful for the proactive approach. The fairness metrics became standard for all our ML models.\n\n**Learning:**\nI learned that framing ethical concerns in terms of business risk makes them more actionable. I also learned that raising concerns early with proposed solutions is more effective than waiting until problems are entrenched.\n\n---\n\n### Example 4: Cross-Functional Collaboration\n\n**Q: Tell me about working with a team that had different priorities.**\n\n**Situation:**\nOur research team had developed a novel retrieval approach that showed 20% better recall on benchmarks. They wanted to publish the paper and move on. Product wanted it shipped. I was the engineer responsible for productionizing it.\n\n**Task:**\nI needed to get the system into production while maintaining a good relationship with researchers who had different incentives.\n\n**Action:**\nI started by understanding what the researchers cared about. They wanted credit for the innovation and did not want their method \"dumbed down\" during productionization.\n\nI proposed a collaboration structure:\n- They would remain authors on any publications about the production system\n- I would document which of their contributions directly impacted production metrics\n- We would meet weekly to review changes and ensure scientific integrity\n\nThis aligned their incentives with mine. They became invested in production success because it validated their research.\n\nWhen I needed to simplify their approach for latency reasons, I showed them benchmarks proving the simplification preserved their key innovations. They actually found this interesting and contributed ideas for further optimization.\n\n**Result:**\nWe shipped in 8 weeks with 18% recall improvement (slightly less than their benchmark due to latency constraints). They published a follow-up paper on production learnings. We established a template for research-to-production collaboration.\n\n**Learning:**\nI learned that understanding what motivates others is the key to collaboration. Researchers want impact and credit. By making production success support those goals, I turned potential friction into partnership.\n\n### Example 5: Being Wrong and Walking It Back\n\n**Question:** \"Tell me about a time you strongly advocated for a technical decision that turned out to be wrong.\"\n\n**Situation:**\nI pushed hard to replace our retrieval pipeline with a pure long-context approach: load the whole knowledge base into the prompt, drop the vector database. I argued it in two design reviews, citing recall benefits and a simpler architecture, and the team committed a quarter to the migration partly on my conviction.\n\n**Task:**\nTwo months in, I owned proving the new system out before full cutover.\n\n**Action:**\nThe eval results were uncomfortable: quality matched, but cost ran four times projection because cache hit rates collapsed under our update frequency, and p95 latency doubled. My first instinct was to tune my way out. After two weeks of marginal gains, I wrote a one-page memo with the numbers, stated plainly that my recommendation had been wrong on the economics, and proposed a hybrid: long-context for the small static corpora where it shone, retrieval for everything else. I presented it to the same audience I had originally convinced.\n\n**Result:**\nWe kept the hybrid, salvaged about 60% of the migration work, and the postmortem produced a new rule the team still uses: any architecture pitch must include a cost model under realistic update patterns, not just a quality benchmark.\n\n**Learning:**\nConviction is useful for getting decisions made and dangerous for unmaking them. I now attach explicit kill criteria to my own proposals, so walking back is a checkpoint, not a confession.\n\n### Example 6: Raising a Concern That Was Dismissed\n\n**Question:** \"Describe a time you raised a concern and the team decided against you. What did you do?\"\n\n**Situation:**\nBefore a launch, I flagged that our agent's tool permissions were broader than the feature needed: it could write to systems it only needed to read. Leadership weighed the two-week delay to scope permissions against launch commitments and decided to ship as-is, with a fast-follow ticket.\n\n**Task:**\nI disagreed with the call. My job was to make sure the decision was made with full information, then either escalate or commit.\n\n**Action:**\nI wrote the risk down concretely: the specific blast radius if the agent was prompt-injected, with a realistic attack path, not a vague \"this is risky.\" I asked for two mitigations that fit inside the launch window: an audit log on the write paths and an anomaly alert on write volume. Both were accepted. I documented my disagreement in the decision record and committed to the launch without relitigating it in hallway conversations.\n\n**Result:**\nThe launch went fine. Three weeks later the alert fired on a misconfigured integration test, not an attack, but it proved the monitoring worked, and the fast-follow got prioritized off the back of that signal. The permission scoping shipped a month later.\n\n**Learning:**\nBeing overruled is not the end of the job. Converting a lost argument into cheap guardrails and a written record is usually worth more than winning the argument, and it builds the credibility that makes the next concern land harder.\n\n---\n\n## Questions to Ask Your Interviewers\n\nStrong candidates ask thoughtful questions. Here are AI-specific questions that demonstrate depth:\n\n### About the Team\n\n- How does the team balance research exploration with production delivery?\n- What is the ratio of building new models versus improving existing systems?\n- How do ML engineers and researchers collaborate here?\n\n### About the Tech\n\n- What is the biggest technical challenge the team is facing right now?\n- How do you evaluate model quality in production?\n- What does your ML infrastructure look like? What would you change?\n\n### About the Culture\n\n- How does the team handle models that do not perform as expected?\n- What is the process for raising concerns about AI safety or ethics?\n- How do you balance moving fast with responsible AI practices?\n\n### About Growth\n\n- What does success look like in this role after 6 months? After a year?\n- How do engineers stay current with the rapidly changing AI landscape?\n- What are the paths for growth from this role?\n\n### About Compensation and Leveling (for later-stage conversations)\n\nSave these for the recruiter call or after an offer signal; asking them shows you evaluate companies the way a senior hire should.\n\n- How is compensation structured at this level: base, bonus, equity split, and the equity refresh cadence?\n- What was the last leveling calibration like for this role? Where do you see me landing and why?\n- What separates this level from the next one up here? Can you give an example of someone who made that jump?\n- How did the team handle compensation during the last market shift?\n- For AI-specialized roles: is there a separate track or premium for AI-critical skills, and how is it reviewed as the market moves?\n\n---\n\n## Red Flags to Avoid\n\n| Behavior | Why It Is a Red Flag |\n|----------|----------------------|\n| Blaming others | Does not take responsibility |\n| No specific examples | May be inflating experience |\n| Only technical answers | Lacks awareness of human factors |\n| Dismissing ethics | May create liability |\n| No questions for interviewer | Lacks curiosity or engagement |\n\n---\n\n## Practicing Out Loud\n\nReading stories is not preparing them. The gap between a written story and a spoken one is where most candidates lose points.\n\n1. **Two lengths per story.** Rehearse each story at 2 minutes (full STAR-L) and at 30 seconds (the elevator version for \"tell me briefly about...\"). If you only have the long version, you will ramble when time is short.\n2. **Record and review once per story.** One listen-through catches filler words, buried results, and the spots where you explain context nobody asked for. You do not need ten takes; you need one honest one.\n3. **Full mock with interruptions.** Have a peer run 3-4 questions and interrupt you mid-story with \"why did you do that?\" and \"what would you do differently?\" Real interviewers probe; rehearsing only clean run-throughs leaves you brittle.\n4. **Drill the bridge sentences.** The transitions (\"the result was...\", \"what I took from it...\") are what keep an interviewer oriented. Practice them until they are automatic so your attention stays on content.\n5. **One mock per loop stage.** A recruiter screen, a hiring-manager behavioral, and a bar-raiser style cross-examination reward different depths. Practice at least one round of each shape before a full onsite.\n\n---\n\n## Preparation Checklist\n\nBefore your behavioral interviews:\n\n- [ ] Prepare 5-7 stories covering: leadership, failure, conflict, ambiguity, learning\n- [ ] Include at least one story where you were wrong and one where you were overruled (Examples 5 and 6 show the shape)\n- [ ] Practice telling stories in 2-3 minutes (timed), plus a 30-second version of each\n- [ ] For each story, identify: situation, your specific actions, measurable results, learnings\n- [ ] Include at least one AI-specific story (model failure, bias, stakeholder education)\n- [ ] Record yourself once per story and fix what you hear\n- [ ] Do one full mock with a peer who interrupts\n- [ ] Prepare 3-5 thoughtful questions for interviewers, including the leveling and compensation set for late-stage calls\n- [ ] Research the company's AI products and potential ethical considerations\n\n---\n\n*See also: [Question Bank](01-question-bank.md) | [Answer Frameworks](02-answer-frameworks.md) | [Common Pitfalls](03-common-pitfalls.md)*\n", "content_zh": "# AI/ML 岗位行为面试\n\nAI 岗位的行为面试重点考察你如何在不确定性、质量风险和跨团队环境中做判断，而不只是问“做过什么”。\n\n## 为什么 AI 岗位特别重视行为面试\n\nAI 项目经常存在目标不清、指标不稳定、模型输出不可控、业务预期过高和责任边界模糊等问题。面试官希望了解你如何澄清问题、管理预期、面对失败、推动协作和处理责任 AI。\n\n## AI 特有的行为主题\n\n### 主题 1：处理模糊性\n\n说明你如何把模糊需求拆成用户、场景、约束、指标和最小实验。不要直接承诺“做一个 AI”，要先定义成功标准。\n\n### 主题 2：管理预期\n\nAI 输出不是确定性的。要提前说明准确率、拒答、人工介入、延迟和成本边界，用可观测指标而不是营销式承诺管理产品和客户。\n\n### 主题 3：处理失败\n\n准备一个模型效果不达标、线上回退、Agent 循环或数据问题的故事。重点讲如何发现、止损、定位根因、修复和防止复发。\n\n### 主题 4：跨职能协作\n\nAI 项目需要产品、领域专家、数据、后端、前端、安全和运维合作。说明你如何建立共同指标、处理冲突、记录决策并推动落地。\n\n### 主题 5：责任 AI\n\n准备数据隐私、幻觉、偏见、误用、权限或安全风险的例子。回答中要体现你既关注交付，也会在风险不可接受时提出异议。\n\n## 问题类别\n\n- **领导力与影响力：** 如何推动没有直接汇报关系的团队\n- **技术决策：** 如何在质量、成本、延迟和风险之间取舍\n- **项目挑战：** 如何处理延期、效果不达标或需求变化\n- **协作与冲突：** 如何面对不同技术意见和业务压力\n- **成长与学习：** 如何学习新框架并验证是否适合生产\n\n## STAR-L 答题法\n\n```text\nS Situation：背景\nT Task：任务\nA Action：行动\nR Result：结果\nL Learning：学习\n```\n\n回答应把重点放在“我做了什么”和“为什么这么做”。结果要使用真实指标并说明口径；如果没有精确数字，直接说明范围或无法确认，不要编造。最后补充复盘和下一次会如何改进。\n\n## 六类示例故事\n\n### 示例 1：处理模糊需求\n\n说明如何把业务方的“提高智能问答效果”拆成测试集、检索质量、答案质量、延迟和用户任务完成率，再通过小实验确定优先级。\n\n### 示例 2：管理失败预期\n\n说明如何向业务方解释模型边界、无答案场景和人工升级，并用数据让团队接受渐进式发布。\n\n### 示例 3：伦理或安全问题\n\n说明如何发现隐私、幻觉、越权或不当输出风险，如何提出证据、推动缓解和记录决策。\n\n### 示例 4：跨团队协作\n\n说明如何与产品、领域专家和平台团队定义接口、标注数据、指标和发布时间。\n\n### 示例 5：承认错误并修正\n\n重点展示你如何发现原有判断错误、及时沟通、回滚或调整方案，并把经验固化为测试或流程。\n\n### 示例 6：提出被忽略的风险\n\n说明你如何在意见未被接受时保留证据、降低对抗、寻找试验或审计机会，并在风险发生前推动改进。\n\n## 可以问面试官的问题\n\n### 团队\n\n团队如何定义 AI 项目的成功？产品、工程、评测和领域专家如何协作？\n\n### 技术\n\n当前使用哪些模型、Agent、RAG 和评测工具？生产系统最主要的质量或可靠性瓶颈是什么？\n\n### 文化\n\n团队如何处理线上事故、技术分歧和不同意见？\n\n### 成长\n\n这个岗位在技术影响力、架构决策和团队协作方面的期待是什么？\n\n### 薪酬和级别\n\n在后期沟通中询问级别范围、评估标准、薪酬结构和晋升路径。\n\n## 应避免的信号\n\n- 把团队成果全部说成自己独立完成\n- 只描述技术，没有业务结果\n- 说“模型自己解决了”，不解释你的工程工作\n- 失败时把责任全部归咎于别人\n- 使用未经确认的指标或夸大项目规模\n\n## 大声练习\n\n每个故事控制在 2～3 分钟，先说结论，再按 STAR-L 展开。录音检查是否有背景过长、行动不具体、结果无指标或没有复盘。\n\n## 准备清单\n\n- 准备 6 个真实故事，覆盖成功、失败、冲突、模糊需求、安全和协作\n- 为每个故事准备 30 秒、2 分钟和 5 分钟版本\n- 明确自己独立负责、参与负责和只了解原理的部分\n- 准备每个故事可能的追问和可验证细节\n", "summary_content": "# 《AI 岗位行为面试》中文概要\n\n## 核心方法\n\n使用 STAR-L：背景、任务、行动、结果、学习。重点是你的判断、行动和复盘，而不是项目背景介绍。\n\n## 最值得准备的故事\n\n- Agent 或 RAG 项目中的模糊需求\n- 模型效果不达标或线上问题\n- Prompt/Skill、评测和回归改进\n- 跨团队协作和技术冲突\n- 安全、隐私或幻觉风险\n- 你判断错误后如何修正\n\n## 与你的经历结合\n\n可以准备 DeepAgents 搭建、Tool Calling、调用循环限制、上下文压缩、Langfuse、RAGAS、自动化回归和团队管理等故事，但必须准确说明个人职责。\n"}, {"filename": "06-job-market-trends-2026.md", "section_id": "00-interview-prep", "section_label": "00 · 面试准备", "label": "2026 岗位趋势", "title_zh": "2026 年 AI 就业市场趋势", "summary": "介绍 AI 岗位从单一模型开发转向应用工程、评测、可靠性、安全、MCP 和 Forward Deployed Engineer 等细分方向的变化。", "detail": "这篇资料从岗位名称、技能层级、招聘要求、薪酬、地区、面试流程和新兴岗位几个角度描述 2026 年市场。对你的定位而言，最有价值的不是记住具体公司或薪资数字，而是理解“AI 应用生产化”正在成为独立能力：包括 Agent 编排、RAG、Tool Calling、评测、可观测性、成本和安全。阅读时要结合自己的 Java 后端基础、Python Agent 开发经验和金融业务背景，形成清晰的岗位叙事。", "content": "# AI Job Market Trends - August 2026\n\n> **Last verified: August 15, 2026.** This chapter distills what's actually happening in AI hiring right now - titles companies post, skills they screen for, compensation ranges, and the interview formats you'll encounter. Sourced from 100+ public job listings, hiring reports, and recruiter signals across April-August 2026. Compensation tables below are from the May 17, 2026 sweep and have not been re-run; treat them as floors.\n\n> **August 2026 update:** Three datapoints worth carrying into interviews and career planning. First, the entry-level squeeze now has administrative payroll evidence behind it: a widely cited Stanford Digital Economy Lab paper revised in August 2026 with ADP data through June reports that workers aged 22-25 in AI-exposed occupations sit about **19% below** the employment level they would have reached had they kept pace with less-exposed peers, while experienced workers show no comparable gap. The mechanism the authors identify is reduced hiring rather than increased separations, which matters: the entry door is narrower, but the people already inside are not being pushed out. Second, the infrastructure buildout is now the clearest wage story in the market. Indeed Hiring Lab (July 14, 2026) puts data-center roles at **six of every 1,000 US job postings, up from two per 1,000 in May 2023**, and reports that data-center installation and maintenance work pays about **42% more per hour** than equivalent non-data-center roles. If you are technical but not an ML researcher, that is where the leverage is. Third, capability-tiered access programs at the frontier labs (Daybreak Blue and Red, Project Glasswing) have created a small but real category of roles that require verified identity and security clearance-adjacent vetting, which is a new consideration in where you apply.\n>\n> **June 2026 update:** Two market-moving events since the May sweep. Anthropic released **Claude Fable 5** (June 9, $10/$50 per 1M), bringing Mythos-class capability to general availability with an Opus 4.8 fallback safeguard; expect a wave of capability-ceiling product work and the eval, safety, and routing roles that come with it. DeepSeek made its **75% V4 Pro discount permanent** (May 22), accelerating the cost-engineering hiring trend: candidates who can exploit a 70x price spread across model tiers are screening well. Compensation rows below are from the May 17 sweep; treat them as floors in the segments those events touch.\n\nThis chapter is for engineers planning their next move, hiring managers building rubrics, and engineering leaders making organizational design decisions. It complements [TRANSITION_GUIDE.md](../TRANSITION_GUIDE.md) (how to transition into AI roles) and the [Question Bank](01-question-bank.md) (what to study).\n\n---\n\n## Table of Contents\n\n- [The Three Headline Shifts](#the-three-headline-shifts)\n- [Role Taxonomy in 2026](#role-taxonomy-in-2026)\n- [Skills by Career Level](#skills-by-career-level)\n- [What Job Listings Actually Require](#what-job-listings-actually-require)\n- [Compensation Reality](#compensation-reality)\n- [Geographic & Industry Distribution](#geographic--industry-distribution)\n- [Interview Process Patterns](#interview-process-patterns)\n- [Emerging Roles to Watch](#emerging-roles-to-watch)\n- [Strategic Takeaways](#strategic-takeaways)\n- [References](#references)\n\n---\n\n## The Three Headline Shifts\n\nIf you read nothing else, internalize these three things.\n\n### 1. The market is paradoxically hot and cold.\n\nQ1 2026 saw ~52,050 tech layoffs (Oracle 30K, Amazon, Meta, Dell), the highest Q1 since 2023 ([Kore1](https://www.kore1.com/tech-layoffs-2026/); [Tom's Hardware](https://www.tomshardware.com/tech-industry/tech-industry-lays-off-nearly-80-000-employees-in-the-first-quarter-of-2026-almost-50-percent-of-affected-positions-cut-due-to-ai)). Simultaneously, AI roles grew +8.9% QoQ and +4.8% YoY, with ~275,000 unfilled AI roles ([Allwork.space](https://allwork.space/2026/05/ai-hiring-is-rising-even-as-tech-layoffs-surge-140/)). Junior/entry-level engineers were hit hardest - routine codegen, QA testing, basic frontend work disproportionately cut. Senior + specialist AI roles remained resilient.\n\n**Implication:** \"Tech hiring\" and \"AI hiring\" are not the same story in 2026. If your career is generalist mid-level SWE work, you're feeling the cold market. If you're AI-specialized at senior level, you're in a sellers' market.\n\n### 2. The title is collapsing; the work is fragmenting.\n\nMost companies now post \"AI Engineer\" as the umbrella, but inside the role you specialize quickly into RAG, agents, evals, fine-tuning, or platform work. [\"Most AI job titles will collapse into 'AI Engineer' over the next 18 months; prestige labels survive only at frontier labs\"](https://www.ivanturkovic.com/2026/04/24/ai-job-titles-2026-naming-chaos/). The \"Prompt Engineer\" standalone title has effectively disappeared from major job boards - the skill survived; the title didn't ([PE Collective](https://pecollective.com/blog/is-prompt-engineering-a-real-career/); [Medium - Prompt Engineering Is Dead 2026](https://medium.com/write-a-catalyst/prompt-engineering-is-dead-2026-ai-systems-engineering-7acdbbcb2160)).\n\n**Implication:** If you're hiring a \"Prompt Engineer,\" you're 18 months behind. Define the actual problem (eval rigor? agent debugging? customer-facing tuning?) and hire for that specific role.\n\n### 3. Forward Deployed Engineer is the breakout role of 2026.\n\nFDE didn't exist as a discrete category at frontier labs in mid-2025. By May 2026, OpenAI, Anthropic, and Google are all hiring hundreds. Google/Box CEOs publicly called it \"the most in-demand job in tech\" ([Fast Company](https://www.fastcompany.com/91541878/google-box-ceos-say-this-is-the-most-in-demand-job-in-tech); [Hashnode FDE guide](https://hashnode.com/blog/a-complete-2026-guide-to-the-forward-deployed-engineer)). TC stabilized at $350-550K mid-to-senior.\n\n**Implication:** Frontier-AI buyers (Fortune 500, government, biotech) demand on-site engineering presence as a contractual deliverable. FDE is the role that exists because the buyer values it - not because it's the most efficient way to deliver software.\n\n---\n\n## Role Taxonomy in 2026\n\n### Established titles (still hiring strongly)\n\n| Title | Description | Where it's posted |\n|-------|-------------|-------------------|\n| **AI Engineer** | The de facto general-purpose AI title. Other titles are collapsing into it. | Universal - most postings |\n| **LLM Engineer** | Centered on transformer fine-tuning, RAG, agents. Distinct from ML Engineer. | Mid-large companies; [iSmart LLM JD 2026](https://www.ismartrecruit.com/job-descriptions/llm-engineer) |\n| **ML Engineer / ML+AI Software Engineer** | Classic training-and-deployment role. | [levels.fyi ML/AI focus](https://www.levels.fyi/t/software-engineer/focus/ml-ai) |\n| **Applied AI Engineer** | Customer-embedded variant at frontier labs. | [Anthropic Applied AI](https://job-boards.greenhouse.io/anthropic/jobs/5116274008) |\n| **Member of Technical Staff (MTS)** | Deliberately ambiguous title that blurs research vs engineering. | OpenAI, Anthropic, Thinking Machines, Mistral ([Scout AI on MTS](https://scoutnow.ai/blog/rebirth-member-of-technical-staff)) |\n| **AI Research Engineer / Research Scientist** | Frontier labs only; PhD-preferred. | [Sundeep Teki - AI Research Eng 2026](https://www.sundeepteki.org/advice/the-ultimate-ai-research-engineer-interview-guide-cracking-openai-anthropic-google-deepmind-top-ai-labs) |\n| **AI Solutions Architect** | Heavy in enterprise. | EY, Caterpillar, Deloitte ([EY listing](https://careers.ey.com/ey/job/Amsterdam-AI-Solution-Architect-1083-HP/1258705801/)) |\n| **AI Platform Engineer** | Owns the internal LLM-ops platform. | [Augment Code spec 2026](https://www.augmentcode.com/guides/ai-platform-engineering-leader-job-spec) |\n| **AI Engineering Manager** | Highest-paying single role; median $293.5K ([AI Pulse benchmarks](https://theaimarketpulse.com/salaries/)). | Universal at scale-ups+ |\n| **AI Product Manager** | Required for nearly every B2B SaaS. | Universal ([Aakash Gupta](https://www.aakashg.com/product-manager-requirements/)) |\n| **AI Technical Program Manager (TPM)** | Specializations: \"Responsible AI TPM,\" \"AI Infrastructure TPM,\" \"GenAI Customer Performance TPM\" | Microsoft, AMD, Together AI |\n\n### NEW titles since 2025\n\n| Title | Why it emerged | Where it's posted |\n|-------|----------------|-------------------|\n| **Forward Deployed Engineer (FDE)** | Frontier-AI buyers demand on-site engineering as a deliverable. | OpenAI, Anthropic, Google ([Anthropic FDE](https://job-boards.greenhouse.io/anthropic/jobs/4985877008)) |\n| **AI Evaluation Engineer** | Eval work matured into a discrete discipline. | OpenAI ([Applied Evals](https://openai.com/careers/software-engineer-applied-evals-san-francisco/), [Frontier Evals](https://openai.com/careers/research-engineer-frontier-evals-and-environments-san-francisco/)), Apple, Scale AI, Distyl, Apex |\n| **Agentic Systems Engineer / AI Agent Engineer** | Agents became their own engineering surface. | Teradata, GE Vernova, Deloitte, OpenAI ([Agent Infrastructure SWE](https://openai.com/careers/software-engineer-agent-infrastructure-san-francisco/)) |\n| **AI Reliability Engineer** | Production AI needs SRE-like discipline; distinct from traditional SRE. | Anthropic ([Staff/Sr AI Reliability](https://www.anthropic.com/jobs)); AI SRE as a category being defined by Resolve.ai, Rootly. |\n| **AI Security Engineer / LLM Red Team Specialist** | Prompt-injection defense and jailbreak research as a discipline. | Life360 ([Principal AI Security Engineer](https://www.remoterocketship.com/us/company/life360/jobs/principal-ai-security-engineer-ai-native-platform-united-states-remote/)); 10 emerging AI security roles enumerated by [Practical DevSecOps](https://www.practical-devsecops.com/emerging-ai-security-roles/). |\n| **MCP Engineer / MCP Software Engineer** | MCP adoption made server development its own specialty. | Descope ([MCP SWE](https://careers.descope.com/p/fe57f6224769-mcp-model-context-protocol-software-engineer)) |\n| **AI Operator / Computer-Use Specialist** | Tied to OpenAI Operator and Claude Cowork. | $75-120K specialist tier ([Coasty](https://coasty.ai/blog/best-computer-use-platform-2026-20260402)) |\n\n### Roles disappearing or consolidating\n\n- **Prompt Engineer (standalone):** Title is dying. Skill remains as table stakes.\n- **Distillation Engineer:** Appears as a *responsibility* in fine-tuning/inference engineer postings, not its own widely-posted req.\n\n---\n\n## Skills by Career Level\n\n### L4-L5 (Mid-level IC, 3-5 yrs)\n\n- Python production proficiency - **71% of AI job postings** ([Second Talent](https://www.secondtalent.com/resources/most-in-demand-ai-engineering-skills-and-salary-ranges/))\n- Hands-on with at least one major LLM provider SDK (OpenAI, Anthropic, Bedrock) and one orchestration framework - most commonly LangChain/LangGraph (34.3% of agentic AI postings; [Agentic Engineering Jobs](https://agentic-engineering-jobs.com/langchain-job-market-2026))\n- Vector DB fundamentals: Pinecone, Weaviate, pgvector - tool-specific experience is learnable in weeks; conceptual understanding matters most\n- RAG: chunking, hybrid search, BM25, reranking, retrieval evals\n- Containerization: Docker (15.4%), Kubernetes (17.6%)\n- Cloud: AWS (32.9%), Azure (26%)\n\n### L6-L7 (Senior / Staff)\n\n- Production LLM systems shipped end-to-end - \"industry experience shipping real systems is a better signal than an academic credential\"\n- Multi-tenant isolation across vector indexes, GPU memory, agent state\n- Eval frameworks (LangSmith / Langfuse / Braintrust); eval-gated CI/CD\n- Fine-tuning / LoRA / QLoRA / RLHF\n- Cost optimization - token budgets, model routing, caching\n- \"Reason about LLMs, vector stores, and RAG as part of standard system design, not as a niche specialty\" ([Design Gurus](https://designgurus.substack.com/p/system-design-interviews-changed))\n\n### L8+ (Principal / Leadership IC)\n\n- Own agent orchestration layers, model-routing, LLMOps platforms serving all eng teams\n- Runtime governance for non-deterministic systems\n- Architect for SOC 2 / HIPAA / EU AI Act compliance - trigger DPIA + FRIA under AI Act Article 27\n- \"Define technical vision and scale engineering teams matters more than coding prowess alone\"\n\n### Manager track (EM / Director)\n\n- AI Engineering Manager median $293.5K - highest-paying single role ([AI Pulse](https://theaimarketpulse.com/salaries/))\n- Hiring rubrics now weight: \"can you put this person in a room with a PM and a junior eng and have them drive technical direction without making a mess\" - 5 of 7 hiring managers surveyed ([Design Gurus](https://designgurus.substack.com/p/system-design-interviews-changed))\n- Mission alignment and safety judgment heavily weighted at frontier labs ([Anthropic EM guide](https://www.gethireready.com/interview-guides/engineering-manager-anthropic))\n\n### PM track (AI PM / AI TPM)\n\n- \"AI is the new baseline, not a bonus skill\"\n- 4+ yrs PM, ideally B2B SaaS or AI-driven product\n- Critical: \"fewer than 1 in 4 senior AI PM candidates meet the bar for technical fluency + product rigor\" ([Aakash Gupta](https://www.aakashg.com/product-manager-requirements/))\n- \"Candidates who can show a working prototype outperform those who can only describe one\"\n\n---\n\n## What Job Listings Actually Require\n\n### Must-Have (called out as required across 100+ postings)\n\n- Python production code, 3+ yrs\n- LLM API integration (OpenAI / Anthropic / Bedrock)\n- RAG pipeline experience including vector DB, chunking, retrieval evals\n- Production-grade observability and eval pipelines\n- Cloud + Kubernetes + IaC\n- Agent debugging / multi-step workflow tracing\n- Prompt injection / jailbreak defense for security-sensitive roles\n\n### Nice-to-Have (explicitly listed as \"plus\" or \"bonus\")\n\n- Publications or OSS contributions; working portfolio of 3-5 projects beats a paper for applied roles\n- CUDA / GPU-level optimization - must-have at NVIDIA/frontier labs, nice-to-have elsewhere\n- Distillation / model compression\n- Distributed inference experience\n- Java/C++ for legacy enterprise integration\n- Reinforcement learning beyond RLHF\n\n### Top Tech Stack in Listings (May 2026)\n\nRanked by frequency:\n\n1. **Python** - 71% of all AI postings\n2. **PyTorch / JAX** - universal at frontier labs\n3. **LangChain / LangGraph** - 34.3% of agentic postings, #1 framework\n4. **LlamaIndex** - co-occurs in 38% of LangChain listings\n5. **AWS (32.9%) / Azure (26%) / GCP / Vertex / Bedrock**\n6. **Kubernetes (17.6%) + Docker (15.4%)**\n7. **Vector DBs:** Pinecone, Weaviate, Qdrant, Chroma, pgvector\n8. **MCP (Model Context Protocol)** - now [\"a fundamental requirement\"](https://medium.com/@adnanmasood/the-rise-of-model-context-protocol-mcp-skills-5f0d6a1c3579) at cutting-edge teams\n9. **Observability:** LangSmith, Langfuse, Braintrust, Arize\n10. **Inference engines:** vLLM, SGLang, TensorRT-LLM\n11. **Terraform / Helm / Ray / Kubeflow / MLflow / Feast** - internal platform stack\n12. **Provider SDKs:** OpenAI Agents SDK, Claude SDK, Vercel AI SDK, Mastra, Pydantic AI\n\n### By Company Tier\n\n- **Frontier labs** (Anthropic, OpenAI, xAI): PyTorch/JAX, vLLM/custom inference, internal evals, MCP servers, CUDA/GPU-level optimization\n- **Scale-ups** (Cursor, Harvey, Sierra, Decagon, Glean, Perplexity): TypeScript + Python mix, LangGraph / OpenAI Agents SDK, Pinecone/pgvector, LangSmith/Braintrust evals\n- **Enterprises** (Deloitte, EY, Caterpillar, Citi): Azure-heavy, Bedrock, LangChain, governance/MLOps focus, on-prem capability\n\n### Non-Technical Requirements\n\n- **Communication / cross-functional collaboration** - table stakes at senior+\n- **Customer-facing skills** - load-bearing for FDE roles; Anthropic requires 3+ yrs in \"technical, customer-facing role\"\n- **OSS contributions** - Anthropic states explicitly: [\"if you have done interesting independent research, written an insightful blog post, or made substantial contributions to open-source software, put that at the TOP of your resume\"](https://www.sundeepteki.org/advice/how-to-get-hired-at-openai-anthropic-and-google-deepmind-in-2026)\n- **Publications** - required for AI Research Engineer; only ~50% of Anthropic technical staff hold PhDs\n- **Mission alignment** - Anthropic explicitly screens for it via a Behavioral and Values round\n- **Regulatory experience:** SOC 2 / HIPAA / FedRAMP for enterprise; EU AI Act familiarity (FRIA/DPIA) for EU operations\n- **Security clearance** - required for Lockheed and federal-adjacent roles\n\n---\n\n## Compensation Reality\n\n> Public-source ranges only. Verify with [levels.fyi](https://www.levels.fyi/) for current data. All figures USD unless noted.\n\n| Tier / Company | Level | Total Comp |\n|---|---|---|\n| **Anthropic (SF)** | Senior SWE | $316K base / $563K TC |\n| **Anthropic (SF)** | Lead SWE | $332K base / $785K TC |\n| **OpenAI (SF)** | All SWE | $251K – $1.28M+ TC |\n| **OpenAI (SF)** | L5 SWE | $336K base + $774K stock = $1.15M TC |\n| **OpenAI MTS / Research Scientist** | - | $245K – $685K base |\n| **Cursor (Anysphere)** | SWE | $850K – $1.28M TC |\n| **Sierra** | SWE | $200K – $460K TC; median $450K |\n| **Thinking Machines Lab** | All eng | $450K – $500K base (Q1 H-1B filings) |\n| Google AI Engineer | L3-L6 | $183K – $583K TC; median $280K |\n| Microsoft AI Engineer | All | $238K – $355K+ TC; median $282K |\n| **US National AI Engineer** | Entry (0-2y) | $90-135K base / $110-160K TC |\n| **US National AI Engineer** | Mid (3-5y) | $140-210K base / $170-260K TC |\n| **US National AI Engineer** | Senior (6-9y) | $180-280K base / $220-350K+ TC |\n| **US National AI Engineer** | Staff/Principal (10+y) | $250-400K+ base / $350-600K+ TC |\n| RAG Engineer Senior | - | $195-290K base; $400K+ TC at frontier |\n| LLM Fine-Tuning Specialist | - | $195K-$350K |\n| AI Security Engineer | - | $152-210K |\n| LLM Red Team Specialist | - | $160-230K |\n| **AI Engineering Manager** | - | $293.5K median (highest-paying single role) |\n| AI Product Manager | - | $141K – $250K (median $159K) |\n| **Agentic AI Architect** | - | $260K – $420K base |\n| AI Evaluation Engineer | - | Too few public postings for a stable range; companies level it against their senior SWE band. Use the US National Senior row as the anchor. |\n| MCP / Integrations Engineer | - | New title with thin public data; typically leveled as senior platform engineering. Anchor to the senior SWE band. |\n| London (Quant fund / FAANG) | Senior ML | £140-180K base; £200K+ TC |\n| London (Google DeepMind) | Senior | £110-155K base + RSU |\n| Berlin / Germany | Senior | €95-130K |\n| **Bangalore (Top GCC / AI-first)** | Senior | ₹1-2 Cr TC |\n| Bangalore (Fresh PhD / top MS) | Entry | ₹22-32 LPA |\n| Singapore | Avg | S$221,200 |\n| Singapore (Principal/Lead) | 10+y | S$323,505 |\n\n**Sources:** [levels.fyi Anthropic](https://www.levels.fyi/companies/anthropic/salaries/software-engineer), [OpenAI](https://www.levels.fyi/companies/openai/salaries/software-engineer), [Cursor](https://www.levels.fyi/companies/cursor/salaries/software-engineer), [Sierra](https://www.levels.fyi/companies/sierra/salaries/software-engineer), [Pin AI Comp Guide 2026](https://www.pin.com/blog/ai-compensation-salary-guide/), [Kore1 salary guide](https://www.kore1.com/ai-engineer-salary-guide/), [AI Pulse benchmarks](https://theaimarketpulse.com/salaries/), [Career Check London 2026](https://www.careercheck.io/blog/ml-engineer-salary-london-2026), [Zen van Riel Europe](https://zenvanriel.com/job/ai-engineer-salary-europe/), [Scaler India](https://www.scaler.com/topics/ai-ml-engineer-salary-complete-guide/).\n\n### Compensation insight\n\nThe gap between frontier-lab MTS comp (~$600-795K median at Anthropic/OpenAI) and enterprise AI engineering (~$170-260K mid-level) is **3-5x**. Choose your company tier with eyes open.\n\n---\n\n## Geographic & Industry Distribution\n\n- **Concentration:** 65%+ of AI engineers are in SF + NYC\n- **Two-tier market:** Indeed Hiring Lab reports ~95% of hiring firms have NOT posted an AI job - adoption is concentrated among largest firms ([Indeed Hiring Lab Jan 2026](https://www.hiringlab.org/2026/01/16/ai-adoption-accelerating-still-concentrated-among-largest-firms/))\n- **Enterprise adoption:** 72% of enterprises have at least one AI workload in production as of Q1 2026 ([Medha Cloud](https://medhacloud.com/blog/ai-adoption-statistics-2026))\n- **Consulting boom:** BCG reports 25% of $14.4B 2025 revenue ($3.6B) was AI consulting ([Metaintro BCG](https://www.metaintro.com/blog/bcg-25-percent-ai-revenue-consulting-jobs-2026))\n- **International hiring up 82% YoY**; 67% of companies offering relocation packages\n- **Remote-friendly:** LangChain ecosystem 35.2% remote, 48.4% hybrid, 16.4% strictly onsite\n- **Indeed AI Tracker:** 4.2% of all postings in Dec 2025 - sustained growth amid broader hiring weakness\n\n---\n\n## Interview Process Patterns\n\nThe May 2026 standard at AI-native companies:\n\n1. **Recruiter screen** (30 min) - culture/mission + comp + visa\n2. **Technical phone screen** (60-90 min) - practical coding, production-style\n3. **Take-home** (48 hr - 3 day) - common at LangChain, Mistral, Eightfold; build a small RAG/agent system. [\"Not a test of whether you can build, but how - code quality, evals, error handling\"](https://github.com/alexeygrigorev/ai-engineering-field-guide/blob/main/interview/01-interview-process.md)\n4. **Onsite/virtual loop** (4-6 hr): coding round + AI system design + project deep dive + behavioral. [\"Whiteboard-only rounds are mostly gone, even Google's format is collaborative now\"](https://designgurus.substack.com/p/system-design-interviews-changed)\n5. **Hiring manager / values round** - explicit at Anthropic\n\n### AI-role specifics\n\n- **System design rounds** now expect LLM infra, GPU scheduling, vector stores, RAG, eval-gated CI, cost/latency tradeoffs\n- **AI-assisted coding rounds** at Meta, Canva, Google, Microsoft, Sierra, Cursor explicitly allow AI tools (Cursor, Copilot, Claude) - evaluating prompt skill and output validation\n- **Take-home transparency:** Add an \"AI audit note\" - what you used AI for, what you changed, why. Transparency beats stealth\n- **Sierra:** in-person-only at SF or NY offices; \"Plan + Build + Present\" 2-hour agent assessment with no algorithm rounds\n- **Cursor:** 8-hour take-home using their own product with limited docs and a Slack channel - assesses product sense, autonomy, system design\n- **Anthropic:** \"the answer that sounds like it was written the night before is a bad signal\"\n\n### Frontier-lab specifics\n\n- **Anthropic:** 90-minute, 4-level progressively harder coding problem testing whether you write clean modular code that absorbs new requirements. Values round explicit.\n- **OpenAI:** \"Design the OpenAI Playground\" - wireframes + API + DB schema for thread/message history; multi-tenant secure cloud IDE\n- **Mistral (Paris):** 5-round process, no remote, with a dedicated \"LLM theory\" stage covering transformer internals and alignment\n\n---\n\n## Emerging Roles to Watch\n\nThese roles are growing fastest in May 2026 - bet on them if you're planning a 12-month career trajectory.\n\n### Forward Deployed Engineer (FDE)\n- **Why:** Frontier-AI buyers (Fortune 500, government, biotech) demand on-site engineering as a contractual deliverable\n- **Comp:** $350-550K mid-to-senior at frontier labs\n- **Skills:** RAG, fine-tuning, distillation, MCP, customer-facing communication, evals at the customer site\n- **Where:** OpenAI, Anthropic, Google, ElevenLabs, Cohere, Mistral, scale-ups\n\n### AI Evaluation Engineer\n- **Why:** Eval matured into a discipline; production needs eval-gated CI/CD\n- **Comp:** $100-110/hr contractor; $200-400K FT at frontier labs\n- **Skills:** LLM-as-judge calibration, error analysis methodology, statistical correction, dataset curation, regression detection\n- **Where:** OpenAI (Applied Evals, Frontier Evals), Apple, Scale AI, Distyl, Apex\n\n### Agentic Systems Engineer\n- **Why:** Multi-agent and tool-use are first-class systems engineering\n- **Comp:** $84-250K typical; agentic AI architect $260-420K\n- **Skills:** LangGraph / multi-agent orchestration, MCP, A2A protocol, agent debugging, tool design, sandbox security\n- **Where:** Teradata, GE Vernova, Deloitte, OpenAI (Agent Infrastructure)\n\n### AI Reliability Engineer\n- **Why:** Production AI needs SRE-like discipline for non-deterministic systems\n- **Comp:** Senior $250-400K at frontier labs (Anthropic posting Staff/Sr roles)\n- **Skills:** Incident response for AI agents, runaway-loop containment, cost anomaly detection, multi-provider fallback\n- **Where:** Anthropic; \"AI SRE\" category being defined by Resolve.ai, Rootly\n\n### AI Security Engineer / LLM Red Team Specialist\n- **Why:** Prompt injection + jailbreak research became discrete disciplines after the May 2026 AI security inflection (Mythos disclosure, Daybreak, MDASH, first in-the-wild AI-built zero-day)\n- **Comp:** $152-230K depending on specialty\n- **Skills:** Indirect prompt injection defense, jailbreak research, constitutional classifiers, model supply-chain trust, MCP threat modeling\n- **Where:** Life360, frontier labs, security-focused enterprises\n\n### MCP Engineer\n- **Why:** MCP ecosystem maturity made server development its own specialty\n- **Skills:** MCP server design (HTTP/STDIO), OAuth resource server pattern, agent-card signing, MCP security\n- **Where:** Descope, Anthropic-aligned scale-ups, internal platforms at Fortune 500\n\n---\n\n## Strategic Takeaways\n\nFor **engineers** planning the next move:\n\n1. **Position as a specialist, not \"Prompt Engineer.\"** Pick a discipline (evals, agents, RAG, FDE, MLOps) and build depth.\n2. **Working portfolio > paper.** Ship 3-5 production-grade projects with evals and observability. Anthropic, OpenAI, and scale-ups all weight this over publications for applied roles.\n3. **FDE is high-leverage.** If you can pair technical depth with customer-facing communication, FDE comp at frontier labs is the top of the market outside founder/staff equity at unicorns.\n4. **The market is bifurcated.** Generalist mid-level SWE work is being cut. Senior AI specialists are in a sellers' market. Plan your trajectory accordingly.\n\nFor **hiring managers** building rubrics:\n\n1. **Hire for the specific problem, not for \"AI Engineer.\"** If you write a generic AI Engineer JD, you'll get generic candidates.\n2. **Evaluate shipped systems first.** A take-home that simulates your actual workload (build a small RAG agent for our domain) is more predictive than algorithm puzzles.\n3. **AI-assisted coding rounds are now standard.** Watching candidates prompt + validate model output is more informative than blocking AI use.\n4. **Comp banding matters.** Frontier-lab comp is creating retention pressure 2 tiers down. If you're an enterprise hiring AI talent, calibrate to local market plus a 15-25% AI premium for senior+.\n\nFor **engineering leaders** doing org design:\n\n1. **Map roles to the work, not to titles.** \"AI Engineer\" is your umbrella. Inside it: name explicit specializations (RAG lead, agent lead, eval lead, platform lead).\n2. **Eval Engineer is a real role.** Don't make a feature engineer own the metric they're trying to improve. Separate measurement from delivery.\n3. **FDE only pays off above ~$500K customer ARR.** Below that, use solutions engineering. Above, FDE earns its comp through customer-specific engineering that documentation can't generalize.\n4. **AI Reliability Engineer is the role you don't know you need yet.** When your first agent loops at 3 AM and burns $50K of API spend before the loop guard fires, you'll wish you had this role 6 months earlier.\n\n---\n\n## References\n\nThis chapter is sourced from 100+ public job listings, hiring reports, and recruiter signals as of May 17, 2026. Key sources:\n\n### Hiring market reports\n- [Ivan Turkovic - AI Job Titles 2026: A CTO's Guide to the Naming Chaos](https://www.ivanturkovic.com/2026/04/24/ai-job-titles-2026-naming-chaos/)\n- [Kore1 - AI Engineer Salary Guide 2026](https://www.kore1.com/ai-engineer-salary-guide/)\n- [Kore1 - Tech Layoffs Q1 2026](https://www.kore1.com/tech-layoffs-2026/)\n- [Pin - AI Compensation Benchmarks 2026](https://www.pin.com/blog/ai-compensation-salary-guide/)\n- [Allwork.space - AI Hiring Rising vs Layoffs](https://allwork.space/2026/05/ai-hiring-is-rising-even-as-tech-layoffs-surge-140/)\n- [Tom's Hardware - Q1 2026 Layoffs](https://www.tomshardware.com/tech-industry/tech-industry-lays-off-nearly-80-000-employees-in-the-first-quarter-of-2026-almost-50-percent-of-affected-positions-cut-due-to-ai)\n- [Indeed Hiring Lab - Jan 2026 AI in Postings](https://www.hiringlab.org/2026/01/22/january-labor-market-update-jobs-mentioning-ai-are-growing-amid-broader-hiring-weakness/)\n- [Indeed Hiring Lab - AI Adoption Concentration](https://www.hiringlab.org/2026/01/16/ai-adoption-accelerating-still-concentrated-among-largest-firms/)\n- [Second Talent - Top 10 In-Demand AI Engineering Skills](https://www.secondtalent.com/resources/most-in-demand-ai-engineering-skills-and-salary-ranges/)\n- [World Economic Forum - AI Added 1.3M Jobs](https://www.weforum.org/stories/2026/01/ai-has-already-added-1-3-million-new-jobs-according-to-linkedin-data/)\n- [AI Pulse - AI & ML Engineer Salary Benchmarks 2026](https://theaimarketpulse.com/salaries/)\n- [Agentic Engineering Jobs - LangChain Market 2026](https://agentic-engineering-jobs.com/langchain-job-market-2026)\n\n### Compensation data\n- [levels.fyi - Anthropic](https://www.levels.fyi/companies/anthropic/salaries/software-engineer)\n- [levels.fyi - OpenAI](https://www.levels.fyi/companies/openai/salaries/software-engineer)\n- [levels.fyi - Cursor](https://www.levels.fyi/companies/cursor/salaries/software-engineer)\n- [levels.fyi - Sierra](https://www.levels.fyi/companies/sierra/salaries/software-engineer)\n- [levels.fyi - Google AI](https://www.levels.fyi/companies/google/salaries/software-engineer/title/ai-engineer)\n- [levels.fyi - Microsoft AI](https://www.levels.fyi/companies/microsoft/salaries/software-engineer/title/ai-engineer)\n- [Entrepreneur - OpenAI Salaries (Federal Filing)](https://www.entrepreneur.com/business-news/how-much-openai-employees-make-salaries-685000)\n- [Career Check - ML Engineer Salary London 2026](https://www.careercheck.io/blog/ml-engineer-salary-london-2026)\n- [Zen van Riel - AI Engineer Salary Europe](https://zenvanriel.com/job/ai-engineer-salary-europe/)\n- [Scaler - AI/ML Engineer Salary India](https://www.scaler.com/topics/ai-ml-engineer-salary-complete-guide/)\n- [Morgan McKinley - Singapore AI/ML Enginee
