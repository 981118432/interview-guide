-preview` Mar 26, 2026; Project Mariner shut down May 4, 2026. Gemini 2.5 Pro/Flash deprecated June 17, 2026.\n>\n> **Price moves:** Anthropic released **Claude Fable 5** on June 9, 2026 at $10 / $50 per 1M: its most capable widely released model (Mythos-class with safeguards), priced at 2x Opus 4.8 but less than half of Claude Mythos Preview. **Claude Mythos 5** (same model, safeguards lifted, Glasswing-only) shares the $10 / $50 price. Anthropic released **Claude Opus 4.8** on May 28, 2026 at the same $5 / $25 per 1M as Opus 4.7, with an optional fast mode at $10 / $50 per 1M (about 2.5x faster and 3x cheaper than the Opus 4.7 fast mode, which was $30 / $150). DeepSeek made its 75% V4 Pro discount **permanent** on May 22, 2026: from June 1, 2026 the new list price drops to 25% of the original ($0.435 / $0.87 per 1M input/output), and the cache-hit input price for all DeepSeek models was cut to 1/10 of the launch price on April 26, 2026. DeepSeek V4 Flash ($0.14 / $0.28 per 1M, 1M context) is the cheapest frontier-class API by a wide margin.\n\n#### OpenAI (GPT-5.x Generation)\n| Model | Input / 1M | Output / 1M | Notes |\n|-------|------------|-------------|-------|\n| **GPT-5.6 Sol** ⭐ NEW | $5.00 | $30.00 | GA July 9, 2026. Flagship of the three-tier GPT-5.6 line. 1M context, 128K max output. |\n| **GPT-5.6 Terra** ⭐ NEW | $2.00 | $12.00 | Cut 20% on July 30, 2026 from $2.50 / $15. GPT-5.5-class quality at roughly half the price; the general production default. |\n| **GPT-5.6 Luna** ⭐ NEW | $0.20 | $1.20 | Cut 80% on July 30, 2026 from $1 / $6. Priced against open-weight competition; the volume tier for classification, extraction, and routing. |\n| **GPT-5.6-Cyber** ⭐ NEW | $12.50 | $75.00 | August 10, 2026. Cached input $1.25. 400K context. Daybreak Red tier only: identity verification, legal attestations, approved use cases, Responses API only. Hardware security keys mandatory on individual accounts from September 1, 2026. |\n| **GPT-5.5** | $5.00 | $30.00 | Released April 23, 2026. 1M context. New class of multimodal flagship. |\n| **GPT-5.5 Instant** ⭐ NEW | check latest | check latest | Default in ChatGPT and `chat-latest` since May 5, 2026. 52.5% fewer hallucinations on high-stakes prompts. |\n| **GPT-Realtime-2** ⭐ NEW | $32.00 (audio) | $64.00 (audio) | Released May 7, 2026. GPT-5-class realtime voice. |\n| **GPT-Realtime-Translate** ⭐ NEW | (audio pricing) | (audio pricing) | 70+ input → 13 output languages. |\n| **GPT-5.4 Pro** | $30.00 | $180.00 | Maximum reasoning; long-context doubles to $60/$270 |\n| **GPT-5.4** | $2.50 | $15.00 | Flagship; native computer use; cached input $1.25 |\n| **GPT-5.4-mini** | $0.75 | $4.50 | Best cost/performance in GPT-5 tier |\n| **GPT-5.4-nano** | check latest | check latest | Smallest GPT-5.4 variant; released March 2026 |\n| **GPT-4o** | $2.50 | $10.00 | Retired from ChatGPT Feb 13, 2026; API access varies |\n| **GPT-4o-mini** | $0.15 | $0.60 | Legacy; check API availability |\n\n#### Anthropic (Claude Fable + 4.x Generation)\n| Model | Input / 1M | Output / 1M | Context | Notes |\n|-------|------------|-------------|---------|-------|\n| **Claude Opus 5** ⭐ NEW | $5.00 | $25.00 | 1M | Released July 24, 2026 (`claude-opus-5`). Unchanged from Opus 4.8. Optional Fast mode at $10 / $50 per 1M, about 2.5x faster. New default on Claude Max. |\n| **Claude Sonnet 5** ⭐ NEW | $2.00 | $10.00 | 1M | Released June 30, 2026 (`claude-sonnet-5`), default across products. **Introductory pricing made permanent August 10, 2026**; the scheduled September 1 rise to $3 / $15 was canceled. Cache write $2.50 (5 min) / $4.00 (1 hr); cache hit $0.20; Batch $1 / $5. Permanently cheaper than Sonnet 4.6. |\n| **Claude Fable 5** ⭐ NEW | $10.00 | $50.00 | 1M | Released June 9, 2026 (`claude-fable-5`) on Claude API, Claude Platform on AWS, Bedrock, Vertex AI, Microsoft Foundry. Most capable widely released Anthropic model (Mythos-class with safeguards; sensitive queries fall back to Opus 4.8 in under 5% of s not available on the Batch API or Claude Platform on AWS. No Fable-tier fast mode at launch.\n\n#### Google (Gemini 3.x Generation)\n| Model | Input / 1M | Output / 1M | Context | Notes |\n|-------|------------|-------------|---------|-------|\n| **Gemini 3.7 Flash** ⭐ NEW | $0.75 | $3.75 | 1M | GA August 13, 2026. Half-price introductory rate through **December 31, 2026**, then $1.50 / $7.50. Context caching $0.075/1M; Batch $0.375 / $1.875. Model cards and cost plans should use the January 2027 numbers for anything long-lived. |\n| **Gemini 3.1 Pro** | $2.00 | $12.00 | 1M | 200K+ context: $4.00/$18.00 |\n| **Gemini 3.1 Flash** | $0.10 | $3.00 | 1M | Best price/performance; high-volume |\n| **Gemini 2.5 Flash-Lite** | $0.10 | $0.40 | 1M | Deprecated June 2026 |\n\n> [!WARNING]\n> **Gemini 2.5 deprecation**: Gemini 2.5 Pro and 2.5 Flash are scheduled for deprecation on June 17, 2026. Migrate to Gemini 3.x models.\n\n#### xAI (Grok)\n| Model | Input / 1M | Output / 1M | Context | Notes |\n|-------|------------|-------------|---------|-------|\n| **Grok 4.6** ⭐ NEW | $2.00 | $6.00 | 500K | Released August 12, 2026. Cached input $0.50 (up from $0.30 on Grok 4.5, so cache-heavy loops do not get cheaper). At or above a 200K prompt the rate doubles to $4 / $12 **for every token in the request**, not just the excess. Fast variant is 2x. |\n| **Grok 4** | $3.00 | $15.00 | 256K | Native tool use; real-time search |\n| **Grok 4.1 Fast** | $0.20 | $0.50 | 2M | High-volume, low-cost |\n| **Grok 3 mini** | check latest | check latest | - | Faster, less accurate |\n\n#### Open-Weight and Value-Tier Models via API (August 2026)\n| Model | Input / 1M | Output / 1M | Context | Provider Examples |\n|-------|------------|-------------|---------|-------------------|\n| **DeepSeek V4 Pro** ⭐ REPRICING AUG 16 | $1.32 peak / $0.66 off-peak | $3.96 peak / $1.98 off-peak | 1M | **Effective August 16, 2026 at 16:00 UTC**, DeepSeek moved to peak/off-peak billing and raised prices 3x to 12x depending on token type (cache-hit input went from $0.003625 to $0.044, a 12.1x rise). Off-peak is exactly half peak. GA as build 0813 on August 13 with MIT weights. |\n| **DeepSeek V4 Flash** ⭐ REPRICING AUG 16 | $0.44 peak / $0.22 off-peak | $1.32 peak / $0.66 off-peak | 1M | Same August 16 repricing (was $0.14 / $0.28). GA as build 0731 on July 31 with MIT weights. At peak, output now exceeds GPT-5.6 Luna's $1.20 per 1M. |\n| **Qwen3.8-Max** ⭐ NEW | check latest | check latest | 262K (to ~1M) | Alibaba API; open weights August 12 under a commercially gated license. |\n| **Tencent Hy3** ⭐ NEW | ~$0.13 | ~$0.53 | 256K | Via OpenRouter. 295B / 21B-active MoE, Apache 2.0, global from August 5, 2026. Among the cheapest frontier-adjacent rates available. |\n| **MAI-Code-1.1-Flash** ⭐ NEW | $0.20 | $1.20 | check latest | Microsoft, August 11, 2026. A 73% list-price cut versus MAI-Code-1-Flash; shipped into GitHub Copilot. |\n| **Muse Spark 1.2** ⭐ NEW | $1.25 | $4.25 | 1M | Meta Model API. A `muse-spark-1.2-contributor` tier costs $0.10 / $0.20 in exchange for permission to train on your prompts and completions: check policy before enabling. |\n| **DeepSeek-V3.2** | $0.28 | $0.42 | 128K | DeepSeek API. 98% cache-hit discount. Effective rates can drop 10–30× via routing. |\n| **Mistral Medium 3.5** ⭐ NEW | $1.50 | check latest | 256K | Mistral API. Unified chat/reasoning/coding/vision; 77.6% SWE-Bench Verified. |\n| **Kimi K2.6** ⭐ NEW | check latest | check latest | - | Moonshot API. 1T MoE / 32B active; agent swarm to 300 sub-agents. |\n| **Qwen 3.6-35B-A3B** ⭐ NEW | check latest | check latest | - | Apache 2.0 weights; self-host or via API providers. |\n| **Llama 4 Scout** | $0.11 | $0.34 | 10M | Together AI, Groq, Fireworks. Note: effective context degrades fast past 32K. |\n| **Llama 4 Maverick** | $0.27 | $0.85 | 1M | Together AI, Groq, Fireworks. MoE-aware serving required. |\n| **DeepSeek-V3** | $0.25 | $1.10 | 128K | DeepSeek API, Together AI |\n| **DeepSeek-R1** | $0.55 | $2.19 | 128K | DeepSeek API |\n| **Mistral Large 3** | $0.50 | $1.50 | 256K | Mistral API, AWS Bedrock |\n| **Llama 3.3 70B** | ~$0.10–0.20 | ~$0.30–0.60 | 128K | Groq, Together AI |\n| **Qwen2.5-Coder-32B** | ~$0.50 | ~$1.00 | 32K | Together AI |\n| **Gemma 4 (31B / 26B-A4B MoE / E4B / E2B)** ⭐ NEW | self-host | self-host | 256K | Apache 2.0. 140+ languages; native vision/audio; function calling. |\n\n#### Embedding Models\n| Model | Cost / 1M tokens | Dimension |\n|-------|------------------|-----------|\n| **Cohere Embed 4** ⭐ NEW | $0.10 | 256 / 512 / 1024 / 1536 (Matryoshka) |\n| **text-embedding-3-large** | $0.13 | 3072 |\n| **text-embedding-3-small** | $0.02 | 1536 |\n| **Voyage-3** | $0.06 | 1024 |\n| **Cohere embed-v3** | $0.10 | 1024 |\n\n> [!IMPORTANT]\n> **Inference-time Compute Costs:** For models with \"Extended Thinking\" or reasoning modes (GPT-5.4 Pro, Claude Opus 4.6), you are charged for **internal thinking tokens** even if not shown to the user. This can increase total request cost by 2x-10x for logic-heavy tasks. Always set a `budget_tokens` cap in production.\n\n---\n\n## Cost Calculation\n\n### Basic Cost Formula\n\n```python\ndef calculate_request_cost(\n    input_tokens: int,\n    output_tokens: int,\n    model: str\n) -> float:\n    pricing = {\n        \"gpt-5.4\": {\"input\": 2.50, \"output\": 15.00},\n        \"gpt-5.4-mini\": {\"input\": 0.75, \"output\": 4.50},\n        \"claude-sonnet-4.6\": {\"input\": 3.00, \"output\": 15.00},\n        \"claude-opus-4.6\": {\"input\": 5.00, \"output\": 25.00},\n        \"gemini-3.1-flash\": {\"input\": 0.10, \"output\": 3.00},\n    }\n    \n    rates = pricing[model]\n    cost = (\n        (input_tokens / 1_000_000) * rates[\"input\"] +\n        (output_tokens / 1_000_000) * rates[\"output\"]\n    )\n    return cost\n```\n\n### Example Cost Calculations\n\n**Scenario 1: RAG Chatbot**\n```\nPer request:\n- System prompt: 500 tokens\n- Retrieved context: 2,000 tokens\n- User message: 100 tokens\n- Response: 300 tokens\n\nInput: 2,600 tokens, Output: 300 tokens\n\nGPT-5.4 cost: (2600 × $2.50 + 300 × $15) / 1M = $0.0110 per request\n\nAt 10,000 requests/day:\nDaily: $95\nMonthly: $2,850\n```\n\n**Scenario 2: Document Summarization**\n```\nPer document:\n- Document: 8,000 tokens\n- Summary: 500 tokens\n\nGPT-5.4 cost: (8000 × $2.50 + 500 × $15) / 1M = $0.0275\n\n1,000 documents: $27.50\n10,000 documents: $275\n```\n\n### Monthly Cost Projection\n\n```python\ndef project_monthly_cost(\n    requests_per_day: int,\n    avg_input_tokens: int,\n    avg_output_tokens: int,\n    model: str\n) -> dict:\n    per_request = calculate_request_cost(\n        avg_input_tokens, avg_output_tokens, model\n    )\n    \n    daily = per_request * requests_per_day\n    monthly = daily * 30\n    yearly = monthly * 12\n    \n    return {\n        \"per_request\": per_request,\n        \"daily\": daily,\n        \"monthly\": monthly,\n        \"yearly\": yearly\n    }\n\n# Example\ncosts = project_monthly_cost(\n    requests_per_day=50000,\n    avg_input_tokens=2000,\n    avg_output_tokens=400,\n    model=\"gpt-5.4\"\n)\n# Output: ~$18,750/month\n```\n\n---\n\n## Cost Optimization Strategies\n\n### Strategy 1: Model Routing\n\nRoute requests to appropriate model tiers:\n\n```python\nclass ModelRouter:\n    def __init__(self):\n        self.classifier = load_complexity_classifier()\n    \n    def route(self, query: str, context: str) -> str:\n        complexity = self.classifier.predict(query)\n        \n        if complexity < 0.3:\n            return \"gpt-5.4-mini\"  # Simple queries\n        elif complexity < 0.7:\n            return \"gpt-5.4-mini\"  # Medium, try cheap first\n        else:\n            return \"gpt-5.4\"  # Complex queries\n\n    def route_with_fallback(self, query: str, context: str) -> str:\n        # Try cheap model first\n        response = self.try_model(\"gpt-5.4-mini\", query, context)\n\n        if self.is_quality_sufficient(response):\n            return response\n\n        # Fallback to expensive model\n        return self.try_model(\"gpt-5.4\", query, context)\n```\n\n**Potential savings:** 50-70% with minimal quality impact\n\n### Strategy 2: Prompt Optimization\n\nReduce token count without losing quality:\n\n```python\n# Before: 2,500 tokens\nsystem_prompt = \"\"\"\nYou are a helpful customer support assistant for Acme Corp. \nYou have access to our product documentation and should answer \nquestions accurately and helpfully. Always be polite and professional.\nIf you don't know something, say so rather than making things up.\nFormat your responses clearly with bullet points when listing items.\n[... more verbose instructions ...]\n\"\"\"\n\n# After: 800 tokens\nsystem_prompt = \"\"\"\nYou are Acme Corp's support assistant.\nRules:\n- Answer from provided context only\n- Admit uncertainty\n- Use bullet points for lists\n- Be concise\n\"\"\"\n\n# Savings: 1,700 tokens × $2.50/1M = $0.00425 per request\n# At 10K requests/day: $42.50/day = $1,275/month\n```\n\n### Strategy 3: Caching\n\nCache responses for repeated or similar queries:\n\n```python\nclass ResponseCache:\n    def __init__(self, ttl_seconds: int = 3600):\n        self.exact_cache = TTLCache(maxsize=10000, ttl=ttl_seconds)\n        self.semantic_cache = SemanticCache(threshold=0.95)\n    \n    def get_or_generate(self, query: str, context: str) -> tuple[str, bool]:\n        # Check exact cache\n        cache_key = self.make_key(query, context)\n        if cache_key in self.exact_cache:\n            return self.exact_cache[cache_key], True  # Cache hit\n        \n        # Check semantic cache\n        similar = self.semantic_cache.find_similar(query)\n        if similar:\n            return similar.response, True  # Semantic hit\n        \n        # Generate new response\n        response = self.generate(query, context)\n        self.exact_cache[cache_key] = response\n        self.semantic_cache.add(query, response)\n        \n        return response, False  # Cache miss\n\n# With 30% cache hit rate:\n# Baseline: $3,000/month\n# With caching: $2,100/month\n# Savings: $900/month\n```\n\n### Strategy 4: Batch Processing\n\nProcess multiple requests together for efficiency:\n\n```python\n# Real-time: pay full price\nfor query in queries:\n    response = model.generate(query)\n\n# Batch API (OpenAI offers 50% discount):\nbatch_responses = model.batch_generate(queries)\n# Cost: 50% of real-time pricing\n```\n\n### Strategy 5: Output Length Control\n\nLimit response length appropriately:\n\n```python\n# Reduce unnecessary output\nresponse = model.generate(\n    prompt=prompt,\n    max_tokens=300,  # Limit output\n    stop=[\"\\n\\n\"]    # Stop at natural break\n)\n\n# Cost impact:\n# Before: avg 500 output tokens = $0.0075 per request (GPT-5.4)\n# After: avg 250 output tokens = $0.00375 per request\n# Savings: 50% on output costs\n```\n\n### Cost Optimization Summary\n\n| Strategy | Effort | Potential Savings |\n|----------|--------|-------------------|\n| Model routing | Medium | 50-70% |\n| **Context Caching** | Low | **60-90% (Input)** |\n| Prompt optimization | Low | 20-40% |\n| Response caching | Medium | 20-40% |\n| Batch processing | Low | 50% (OpenAI/Anthropic) |\n\n---\n\n## Context Caching Economics\n\n**The \"Golden Rule\" for RAG (still true in 2026).**\nIf you have a fixed system prompt or a shared knowledge base (prefix) larger than 10,000 tokens, **Context Caching** is mandatory.\n\n**Break-even Analysis (Claude Sonnet 4.6):**\n- **Standard Input**: $3.00 / 1M tokens\n- **Cached Input**: $0.30 / 1M tokens (90% discount)\n- **Cache Write Fee**: $3.75 / 1M tokens (5-min TTL at 1.25x); $6.00 (1-hour TTL at 2x)\n\n`Break-even = (Write Fee) / (Standard Rate - Cached Rate) ≈ 1.4 requests (5-min) or 2.2 requests (1-hour)`\n\nIf your long prefix is used by **more than 2 users**, caching it is strictly cheaper than sending it raw every time. Both OpenAI and Anthropic now offer batch API discounts (50% off) that stack with caching.\n\n---\n\n## Self-Hosting & GPU Cloud Arbitrage\n\n**The Reserved vs. Serverless Tradeoff:**\n\n| Model Size | Serverless (RunPod/Together) | Reserved (Lambda/AWS) |\n|------------|-----------------------------|-----------------------|\n| **Burst Capacity** | Infinite (cold starts) | Fixed |\n| **Utilization** | Pay only for compute time | 24/7 fixed cost |\n| **TCO Break-even**| **Cost-effective < 40% util** | **Cost-effective > 40% util** |\n\n**Principal-level Nuance:**\n\"GPU Cloud Arbitrage\" involves moving production workloads between providers based on **spot instance availability**. Tools like **Skypilot** automate this, saving up to 60% on self-hosting costs by following \"low-demand\" regions globally. The rise of MoE models (Llama 4 Scout fits on a single H100, Maverick on ~2x H100, DeepSeek V4 Flash on 4x H100) has further reduced self-hosting GPU requirements compared to dense models.\n\n### When Self-Hosting Makes Sense\n\n```\nBreak-even analysis:\n\nAPI cost at scale:\n- 1M requests/month\n- 2,500 tokens average\n- GPT-5.4: ~$37,500/month\n- Claude Sonnet 4.6: ~$30,000/month\n\nSelf-hosted equivalent (Llama 4 Maverick via MoE):\n- 2x H100 80GB: ~$6/hour × 730 = $4,380/month\n- Engineering time: $5,000/month (0.5 FTE)\n- Ops overhead: $2,000/month\n- Total: ~$11,380/month\n\nSavings vs GPT-5.4: $26,120/month = 70%\nSavings vs Claude Sonnet 4.6: $18,620/month = 62%\n```\n\n### Self-Hosting Cost Components\n\n| Component | Monthly Cost | Notes |\n|-----------|--------------|-------|\n| GPU compute | $5K-20K | Depends on model size |\n| Storage | $200-500 | Model weights, logs |\n| Networking | $100-500 | Egress, load balancing |\n| Engineering | $5K-15K | Partial FTE for ops |\n| Monitoring | $100-500 | Observability tools |\n\n### GPU Requirements by Model Size\n\n| Model Size | GPU Config | Estimated Cost/Month |\n|------------|------------|---------------------|\n| 7B (INT4) | 1x A10G | $500-800 |\n| 7B (FP16) | 1x A100 40GB | $1,500-2,500 |\n| 70B (INT4) | 2x A100 80GB | $5,000-8,000 |\n| 70B (FP16) | 4x A100 80GB | $10,000-15,000 |\n| 405B (INT4) | 8x H100 | $20,000-30,000 |\n\n### Decision Framework\n\n```\nChoose API when:\n- Volume < 100K requests/month\n- No ML ops expertise\n- Need highest quality (frontier models)\n- Fast iteration needed\n\nChoose self-hosting when:\n- Volume > 500K requests/month\n- Have ML infrastructure team\n- Data privacy requirements\n- Predictable, stable workload\n- Custom fine-tuning needed\n```\n\n---\n\n## Total Cost of Ownership\n\n### TCO Components\n\n```python\ndef calculate_tco(scenario: dict) -> dict:\n    # Direct costs\n    api_or_compute = scenario[\"monthly_api_cost\"]\n    \n    # Engineering costs\n    development = scenario[\"dev_hours\"] * scenario[\"engineer_rate\"]\n    maintenance = scenario[\"maintenance_hours\"] * scenario[\"engineer_rate\"]\n    \n    # Infrastructure\n    vector_db = scenario[\"vector_db_cost\"]\n    monitoring = scenario[\"monitoring_cost\"]\n    \n    # Indirect costs\n    downtime_risk = scenario[\"expected_downtime_hours\"] * scenario[\"revenue_per_hour\"]\n    \n    monthly_tco = (\n        api_or_compute +\n        development / 12 +  # Amortized over year\n        maintenance +\n        vector_db +\n        monitoring +\n        downtime_risk\n    )\n    \n    return {\n        \"monthly_tco\": monthly_tco,\n        \"yearly_tco\": monthly_tco * 12,\n        \"breakdown\": {\n            \"llm\": api_or_compute,\n            \"engineering\": development / 12 + maintenance,\n            \"infrastructure\": vector_db + monitoring,\n            \"risk\": downtime_risk\n        }\n    }\n```\n\n### Example TCO Comparison\n\n**Scenario: Customer Support Bot (50K requests/month)**\n\n| Cost Component | API-Based | Self-Hosted |\n|----------------|-----------|-------------|\n| LLM costs | $5,000 | $3,000 |\n| Vector DB | $70 | $200 |\n| Engineering (monthly) | $500 | $3,000 |\n| Monitoring | $100 | $200 |\n| **Monthly Total** | **$5,670** | **$6,400** |\n\n*At this scale, API is cheaper due to engineering overhead.*\n\n**Scenario: Large-Scale RAG (2M requests/month)**\n\n| Cost Component | API-Based | Self-Hosted |\n|----------------|-----------|-------------|\n| LLM costs | $50,000 | $15,000 |\n| Vector DB | $500 | $1,000 |\n| Engineering (monthly) | $1,000 | $8,000 |\n| Monitoring | $200 | $500 |\n| **Monthly Total** | **$51,700** | **$24,500** |\n\n*At this scale, self-hosting is significantly cheaper.*\n\n---\n\n## Interview Questions\n\n### Q: How would you optimize costs for a high-volume RAG application?\n\n**Strong answer:**\nI would approach cost optimization in layers:\n\n**1. Architecture optimization:**\n- Model routing: Use cheap model for simple queries\n- Caching: 30-40% of queries may be cacheable\n- Prompt compression: Minimize system prompt tokens\n\n**2. Model selection:**\n```\nSimple queries (60%): GPT-5.4-mini at $0.003/request\nComplex queries (40%): GPT-5.4 at $0.011/request\nWeighted avg: $0.0062/request (vs $0.011 all GPT-5.4)\nSavings: 44%\n```\n\n**3. Infrastructure:**\n- Batch embedding updates (50% cheaper)\n- Right-size vector DB\n- Use spot instances where possible\n\n**4. Monitoring:**\n- Track cost per query type\n- Alert on anomalies\n- Regular cost reviews\n\n### Q: When would you recommend self-hosting vs using APIs?\n\n**Strong answer:**\nDecision depends on multiple factors:\n\n**Volume threshold:**\n- Below 100K/month: Almost always API\n- 100K-500K: Evaluate case by case\n- Above 500K: Often self-hosting wins\n\n**Team capabilities:**\n- No ML ops: API regardless of scale\n- Strong infra team: Consider self-hosting earlier\n\n**Quality requirements:**\n- Need absolute best: APIs (frontier models)\n- Good enough works: Self-hosted open models\n\n**Other factors:**\n- Data privacy: May force self-hosting\n- Latency control: Self-hosting gives more control\n- Fine-tuning needs: Self-hosting enables more customization\n\n**My recommendation process:**\n1. Start with APIs for fastest iteration\n2. Build abstraction layer for model switching\n3. Evaluate self-hosting when spend exceeds $10K/month\n4. Pilot with shadow deployment before committing\n\n---\n\n## References\n\n- OpenAI Pricing: https://developers.openai.com/api/docs/pricing\n- Anthropic Pricing: https://platform.claude.com/docs/en/about-claude/pricing\n- Google AI Pricing: https://ai.google.dev/gemini-api/docs/pricing\n- xAI Pricing: https://docs.x.ai/developers/models\n- Mistral Pricing: https://docs.mistral.ai/getting-started/changelog\n- Lambda Labs GPU Pricing: https://lambdalabs.com/service/gpu-cloud\n- RunPod Pricing: https://www.runpod.io/pricing\n- LLM Pricing Comparison: https://pricepertoken.com/\n\n---\n\n*Previous: [Capability Assessment](02-capability-assessment.md) | Next: [Model Selection Guide](04-model-selection-guide.md)*\n", "content_zh": "# 模型价格与成本\n\n## 成本结构\n\nAPI 可能按输入/输出 token、缓存、分层价格、承诺用量或批处理计费。完整成本还包括 Embedding、重排序、存储、GPU、带宽、重试、评测、监控和人工处理。\n\n## 基本计算\n\n```text\n月成本 = 请求量 ×（输入 token × 输入单价 + 输出 token × 输出单价）\n```\n\n实际计算还要加入缓存命中、模型路由、失败重试和峰值容量。每次上线前都应进行月度预测，并按租户、功能和模型追踪实际成本。\n\n## 优化策略\n\n模型路由、Prompt/上下文压缩、缓存、批处理、输出长度控制和自托管都是常见方向。自托管还需计算 GPU、折旧、电力、工程、维护和闲置成本，不能只比较 API 单价。最终关注单位成功任务成本和质量回归。\n", "summary_content": "# 《模型价格与成本》中文概要\n\n建立完整成本模型，覆盖 token、缓存、重试、检索、GPU 和运维；用路由、压缩、缓存、批处理和输出控制降低单位成功任务成本。\n"}, {"filename": "02-model-landscape/04-model-selection-guide.md", "section_id": "02-model-landscape", "section_label": "02 · 模型版图", "label": "04 model selection guide", "title_zh": "模型选择指南", "summary": "模型选择不是排行榜选择，而是围绕任务能力、质量、延迟、成本、可用性和风险的决策。推荐统一网关、多模型路由和可回滚设计。", "detail": "", "content": "# Model Selection Guide\n\nA practical framework for choosing the right LLM for your use case, considering capability, cost, latency, and operational factors.\n\n## Table of Contents\n\n- [Selection Framework](#selection-framework)\n- [Capability Comparison](#capability-comparison)\n- [Use Case Mapping](#use-case-mapping)\n- [Cost Analysis](#cost-analysis)\n- [Operational Considerations](#operational-considerations)\n- [Multi-Model Strategies](#multi-model-strategies)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## Selection Framework\n\n### Decision Tree (June 2026)\n\n```\nStart Here\n    │\n    ├── Need the absolute capability ceiling?\n    │   └── Yes ─────────────────────────────────────────┐\n    │   └── No ──┐                                       │\n    │            │                                       ▼\n    │            │                              ┌─────────────────┐\n    │            │                              │ Claude Fable 5  │\n    │            │                              │ ($10/$50, 1M)   │\n    │            │                              └─────────────────┘\n    │            │\n    ├── Need autonomous agents / long-horizon planning?\n    │   └── Yes ─────────────────────────────────────────┐\n    │   └── No ──┐                                       │\n    │            │                                       ▼\n    │            │                              ┌─────────────────┐\n    │            │                              │ Claude Opus 4.8 │\n    │            │                              │ GPT-5.5 reason. │\n    │            │                              └─────────────────┘\n    │            │\n    ├── Need best software engineering / coding?\n    │   └── Yes ─────────────────────────────────────────┐\n    │   └── No ──┐                                       │\n    │            │                                       ▼\n    │            │                              ┌─────────────────┐\n    │            │                              │ Fable 5 ceiling /│\n    │            │                              │ GPT-5.5 88.7%   │\n    │            │                              │ Opus 4.8 88.6%  │\n    │            │                              │ Sonnet 4.6 cheap│\n    │            │                              └─────────────────┘\n    │            │\n    ├── Need to process massive context (>1M)?\n    │   └── Yes ─────────────────────────────────────────┐\n    │   └── No ──┐                                       │\n    │            │                                       ▼\n    │            │                              ┌─────────────────┐\n    │            │                              │ Gemini 3.0 Pro  │\n    │            │                              │ (2.5M context)  │\n    │            │                              └─────────────────┘\n    │            │\n    ├── Cost-sensitive high volume?\n    │   └── Yes ─────────────────────────────────────────┐\n    │   └── No ──┐                                       │\n    │            │                                       ▼\n    │            │                              ┌─────────────────┐\n    │            │                              │ Gemini 3 Flash /│\n    │            │                              │ o4-mini         │\n    │            │                              └─────────────────┘\n    │            │\n    └── Default: Production Choice\n                 ▼\n        ┌─────────────────┐\n        │ Claude Sonnet 4.6│\n        │ GPT-5.5-mini    │\n        └─────────────────┘\n```\n\n### Key Selection Factors\n\n| Factor | Weight | Considerations |\n|--------|--------|----------------|\n| **Agentic Reliability** | High | Tool-calling accuracy, multi-step planning |\n| **Context Recall** | High | Needle-in-a-haystack performance at 1M+ |\n| **Rate Limit Ceiling** | High | **(Principal Nuance)**: Can the provider handle your P99 throughput without 429 errors? |\n| **Ecosystem Maturity** | High | Production track record, SDK support, and Enterprise SLA |\n| **Cost / Output Token** | Medium | Agentic loops consume 5x-10x more tokens |\n\n---\n\n## Capability Comparison\n\n### Frontier Model Comparison (June 2026)\n\n| Model | Strengths | Cons | Context | Best For |\n|-------|-----------|------|---------|----------|\n| **Claude Fable 5** | Most capable widely released model; Mythos-class capability with safeguards; always-on adaptive thinking; SOTA vision; sustains the longest autonomous runs | 2x Opus 4.8 price ($10/$50); under 5% of sessions fall back to Opus 4.8 on sensitive topics; 30-day data retention | 1M | Capability-ceiling work: hardest reasoning, vision, longest-horizon agents |\n| **Claude Opus 4.8** | Long-running agentic coding (SWE-bench 88.6%), Dynamic Workflows with parallel subagents, $10/$50 fast mode | GPT-5.5 narrowly leads single-shot SWE-bench; Fable 5 now sits above it on capability | 1M | Codebase-scale migrations, autonomous coding loops, best price-to-capability at the frontier |\n| **GPT-5.5** | SWE-bench Verified leader (88.7%), Terminal-Bench leader (78.2%), native omni multimodal | High cost ($5/$30) | 1M | Multi-agent systems, single-shot coding |\n| **Claude Opus 4.7** | Predecessor flagship (SWE-bench 87.6%, SWE-Bench Pro 64.3%) | Superseded by 4.8 at same price | 1M | Existing 4.7 deployments without migration pressure |\n| **Claude Opus 5** | Current Opus flagship (July 24, 2026) at unchanged $5/$25; optional Fast mode $10/$50 | Newer than most published third-party evals | 1M | Long-horizon agentic coding and computer use |\n| **Claude Sonnet 5** | The production workhorse since June 30, 2026, at a permanent $2/$10 (cheaper than the Sonnet 4.6 it replaced) | Deliberately reduced cyber capability versus Opus tier | 1M | Default tier for agent fleets and coding at scale |\n| **GPT-5.6 Terra** | GPT-5.5-class quality at $2/$12 after the July 30 cut | Newer line, thinner independent evaluation | 1M | General production default on the OpenAI side |\n| **Claude Sonnet 4.6** | Strong cost/quality balance, full 1M at standard price | Superseded by Sonnet 5, which is both newer and cheaper | 1M | Existing deployments not yet migrated |\n| **Gemini 3.1 Pro** | GPQA Diamond leader (94.3%), 1M multimodal, Deep Think mode | Latency spikes on Deep Think | 1M | Scientific reasoning, multimodal |\n| **DeepSeek-R1** | Open-source reasoning, competitive math | Reasoning only; non-frontier general use | 128K | Math, complex debug, open-weight reasoning |\n\n### Budget Model Comparison\n\n| Model | Cost (per 1M input/output) | Quality | Context | Best For |\n|-------|----------------------------|---------|---------|----------|\n| **Gemini 3 Flash** | $0.05 / $0.20 | Frontier-tier | 1M | High-volume RAG |\n| **o4-mini** | $0.10 / $0.40 | Excellent | 128K | Fast reasoning tasks |\n| **Llama 4 8B** | Self-hosted (H100/L40) | Strong | 128K | On-device, private |\n\n### Open Source Models\n\n| Model | Parameters | Quality | Best For |\n|-------|------------|---------|----------|\n| **Llama 4 70B** | 70B | Frontier-competitive | Universal open choice |\n| **Nemotron 3 Ultra** | 500B MoE | Agentic mastery | Scalable open agents |\n| **DeepSeek V3.2** | 671B MoE | Ultra performance | Lowest TCO for frontier quality |\n\n---\n\n## Use Case Mapping\n\n### By Application Type (June 2026)\n\n| Use Case | Recommended Models | Rationale |\n|----------|-------------------|-----------|\n| **Capability-ceiling research / hardest problems** | Claude Fable 5 | Mythos-class capability, generally available; route only ceiling-bound work to it at $10/$50 |\n| **Autonomous Dev** | Claude Opus 4.8 with Dynamic Workflows, Claude Sonnet 4.6 | Parallel-subagent runs in Claude Code; top SWE-Bench Pro at 69.2% |\n| **Enterprise RAG** | Gemini 3.1 Pro, Gemini 3.1 Flash, DeepSeek V4 Flash | 1M context and aggressive cache discounts remove retrieval complexity |\n| **Customer Support** | Gemini 3.1 Flash, GPT-5.5-mini, Claude Haiku 4.5 | Near-zero latency with strong reasoning |\n| **Reasoning / Debug** | GPT-5.5 reasoning, Claude Opus 4.8 (thinking), DeepSeek-R1 | Best at hidden-CoT for code and logic |\n| **Video / Multimodal** | Gemini 3.1 Pro, GPT-5.5, Claude Opus 4.8 | Native interleaved multimodal processing |\n| **Private Agent** | Llama 4 Maverick, DeepSeek V4 Pro (open weights) | Strongest open-weight agentic planning |\n\n### By Constraint\n\n| Constraint | Approach |\n|------------|----------|\n| **Max latency < 100ms** | Gemini 3.1 Flash, GPT-5.5-mini, Claude Haiku 4.5, or self-hosted Nano models |\n| **Context > 1M tokens** | Claude Fable 5 / Opus 4.8 / Opus 4.7 / Sonnet 4.6, Gemini 3.1 Pro, GPT-5.5, Llama 4 Scout (10M) |\n| **Zero-data Leakage** | Llama 4 70B, DeepSeek V4 Pro on internal VPC |\n| **Complex Tool Use** | Claude Opus 4.8 or GPT-5.5 (best planning accuracy) |\n\n---\n\n## Cost Analysis\n\n### Cost Modeling (June 2026)\n\n| Model | Input / 1M | Output / 1M | Notes |\n|-------|------------|-------------|-------|\n| **Claude Fable 5** | $10.00 | $50.00 | Capability ceiling; 2x Opus 4.8; reserve for ceiling-bound work |\n| **Claude Opus 4.8** | $5.00 | $25.00 | Frontier coding and agentic; optional fast mode $10 / $50 |\n| **Claude Opus 4.7** | $5.00 | $25.00 | Same standard price; fast mode is the more expensive $30 / $150 |\n| **GPT-5.5** | $5.00 | $30.00 | Single-shot SWE-bench leader |\n| **Claude Opus 5** | $5.00 | $25.00 | Current Opus flagship; Fast mode $10/$50 |\n| **Claude Sonnet 5** | $2.00 | $10.00 | Permanent price since Aug 10, 2026; the default workhorse |\n| **GPT-5.6 Terra** | $2.00 | $12.00 | Cut 20% on July 30, 2026 |\n| **GPT-5.6 Luna** | $0.20 | $1.20 | Cut 80% on July 30, 2026; volume tier |\n| **Claude Sonnet 4.6** | $3.00 | $15.00 | Superseded by the cheaper Sonnet 5 |\n| **Gemini 3.1 Pro** | $2.00 | $12.00 | Best value frontier; multimodal |\n| **DeepSeek V4 Pro** | $0.435 | $0.87 | Rises to $1.32 / $3.96 at peak (half that off-peak) from Aug 16, 2026 |\n| **Gemini 3.1 Flash** | $0.10 | $3.00 | RAG-at-scale; cache discount |\n| **DeepSeek V4 Flash** | $0.14 | $0.28 | Cheapest frontier-class 1M context |\n\n### Cost Comparison Example\n\nAssume 1M queries/month, 1K input tokens + 500 output tokens per query:\n\n| Volume | GPT-5.5 | Claude Sonnet | Gemini 3 Pro | Gemini 3 Flash |\n|--------|---------|---------------|--------------|----------------|\n| 10K queries/mo | $150 | $105 | $37.50 | $1.50 |\n| 1M queries/mo | $15,000 | $10,500 | $3,750 | $150 |\n\n*Insight: DeepSeek V4 Flash ($0.14 / $0.28) and Gemini 3.1 Flash ($0.10 / $3.00) have effectively commoditized RAG, making long-context processing cheaper than traditional vector search infra at scale.*\n\n---\n\n## Operational Considerations\n\n### Rate Limits and Quotas\n\n| Provider | Tier | RPM | TPM |\n|----------|------|-----|-----|\n| OpenAI (Tier 1) | Basic | 500 | 30K |\n| OpenAI (Tier 5) | Enterprise | 10K | 10M |\n| Anthropic (Tier 1) | Basic | 50 | 40K |\n| Anthropic (Tier 4) | Enterprise | 4K | 400K |\n\n### Reliability Patterns\n\n```python\nclass ReliableModelClient:\n    def __init__(self):\n        self.providers = {\n            \"primary\": OpenAIClient(),\n            \"fallback1\": AnthropicClient(),\n            \"fallback2\": GoogleClient()\n        }\n    \n    async def generate(self, prompt: str) -> str:\n        for name, client in self.providers.items():\n            try:\n                return await client.generate(prompt)\n            except RateLimitError:\n                continue\n            except ServiceError:\n                continue\n        \n        raise AllProvidersUnavailable()\n```\n\n### Abstraction Layer\n\n```python\nclass LLMClient:\n    \"\"\"Unified interface for multiple providers.\"\"\"\n    \n    def __init__(self, config: dict):\n        self.default_model = config[\"default_model\"]\n        self.clients = self._init_clients(config)\n    \n    async def generate(\n        self,\n        messages: list[dict],\n        model: str = None,\n        **kwargs\n    ) -> str:\n        model = model or self.default_model\n        client = self._get_client(model)\n        \n        # Normalize request format\n        normalized = self._normalize_request(messages, kwargs)\n        \n        # Call provider\n        response = await client.generate(**normalized)\n        \n        # Normalize response\n        return self._normalize_response(response)\n    \n    def _normalize_request(self, messages: list[dict], kwargs: dict) -> dict:\n        # Handle differences between providers\n        # OpenAI uses 'messages', Anthropic uses 'messages' with different format\n        pass\n```\n\n---\n\n## Multi-Model Strategies\n\n### Model Routing\n\n```python\nclass ModelRouter:\n    def __init__(self):\n        self.classifier = QueryClassifier()\n        self.models = {\n            \"simple\": \"gpt-4o-mini\",\n            \"complex\": \"claude-3.5-sonnet\",\n            \"code\": \"claude-3.5-sonnet\",\n            \"long_context\": \"gemini-1.5-pro\",\n            \"reasoning\": \"o1-mini\"\n        }\n    \n    async def route(self, query: str, context_length: int) -> str:\n        # Classify query complexity\n        query_type = await self.classifier.classify(query)\n        \n        # Override for long context\n        if context_length > 100_000:\n            return self.models[\"long_context\"]\n        \n        return self.models[query_type]\n```\n\n### Cascade Pattern (2025 Refinement)\n\n**The Logic**: Never use a 70B model for a task a 1B model can do. Use a \"Router\" to score confidence.\n\n```python\nclass ModelCascade:\n    \"\"\"The 'Efficiency First' Pattern.\"\"\"\n    \n    async def generate_optimized(self, query: str):\n        # 1. Draft check (SLM / Classifier)\n        if is_simple_intent(query):\n            return await gpt4o_mini.generate(query)\n            \n        # 2. Main Generation (Efficient model)\n        response = await claude_sonnet.generate(query)\n        \n        # 3. Validation / Escalate\n        if needs_verification(response):\n            return await o3.generate(f\"Verify this: {response}\")\n            \n        return response\n```\n\n**Principal-level Tip:** Implement \"Semantic Fallback\" where you don't just retry the same model on error, but immediately jump to a larger model or a different provider (OpenAI -> Anthropic) to avoid correlated failures.\n\n---\n\n## Interview Questions\n\n### Q: How do you choose between GPT-4o, Claude, and Gemini for a production application?\n\n**Strong answer:**\n\n\"My selection depends on specific requirements:\n\n**For most production workloads**, I default to Claude 3.5 Sonnet or GPT-4o. Both are excellent general-purpose models. Sonnet has a slight edge on coding, GPT-4o has better ecosystem integration.\n\n**For long-context applications**, Gemini 1.5 Pro is the clear winner with 1-2 million token context. If I need to process entire codebases or very long documents, Gemini is my choice.\n\n**For cost-sensitive high-volume**, GPT-4o-mini or Claude Haiku. These are 10-20x cheaper and handle straightforward tasks well.\n\n**My practical approach:**\n1. Prototype with Sonnet or GPT-4o to validate the use case\n2. Evaluate on MY specific task, not just benchmarks\n3. Build abstraction layer so I can switch easily\n4. Optimize costs by routing simpler requests to cheaper models\n\nI never rely solely on benchmark scores. A model that ranks lower on MMLU might excel on my domain.\"\n\n### Q: When would you self-host vs use API providers?\n\n**Strong answer:**\n\n\"It is a tradeoff of control vs operational burden.\n\n**Use APIs when:**\n- Volume under 1M queries/month (cost crossover)\n- Need latest models immediately\n- Team lacks GPU infrastructure expertise\n- Variable workload hard to capacity plan\n- Time-to-market is critical\n\n**Self-host when:**\n- Data cannot leave infrastructure (compliance)\n- Volume exceeds 10M queries/month (cost savings)\n- Need latency under 100ms P99\n- Need custom model weights or fine-tuning\n- Full control over model behavior\n\n**Hybrid often works best:**\n- Self-host for high-volume predictable workloads\n- API for spikes and specialized models\n- API as fallback when self-hosted fails\n\nHidden costs of self-hosting: GPU procurement, engineering time, model updates, monitoring. Factor in 1-2 dedicated engineers for infrastructure.\"\n\n---\n\n## References\n\n- OpenAI API: https://platform.openai.com/\n- Anthropic API: https://docs.anthropic.com/\n- Google AI: https://ai.google.dev/\n- LMSys Leaderboard: https://chat.lmsys.org/\n\n---\n\n*Next: [Fine-Tuning Guide](../03-training-and-adaptation/02-fine-tuning-strategies.md)*\n", "content_zh": "# 模型选择指南\n\n## 选择框架\n\n先判断任务是否需要复杂推理、工具调用、多模态、长上下文、低延迟或高吞吐，再评估质量、价格、可用性、配额、隐私、合规和运营能力。\n\n## 多模型策略\n\n统一模型网关后，可以使用请求路由、Cascade 和 Fallback：简单任务先走便宜模型，失败或质量不足时升级；关键供应商故障时切换备用模型。每个模型必须通过契约测试、质量评测、成本评估和灰度发布。\n\n## 运营注意\n\n不要让业务代码绑定单一 API。记录模型版本、Prompt、参数、路由理由和最终质量；对价格、限流、服务区域和供应商变更建立监控和回滚机制。\n", "summary_content": "# 《模型选择指南》中文概要\n\n模型选择不是排行榜选择，而是围绕任务能力、质量、延迟、成本、可用性和风险的决策。推荐统一网关、多模型路由和可回滚设计。\n"}, {"filename": "03-training-and-adaptation/01-pretraining-basics.md", "section_id": "03-training-and-adaptation", "section_label": "03 · 训练与适配", "label": "01 pretraining basics", "title_zh": "预训练基础", "summary": "掌握预训练目标、数据质量、Scaling Laws、Chinchilla、训练稳定性和 FP8/BF16，并能解释训练 token 与模型规模的权衡。", "detail": "", "content": "# Pretraining Basics\n\nPretraining is the most computationally expensive phase of building an LLM, where a model learns general knowledge and language patterns from massive datasets.\n\n## Table of Contents\n\n- [The Pretraining Objective](#the-pretraining-objective)\n- [Data Curriculum and Quality](#data-curriculum-and-quality)\n- [Scaling Laws (Inference-Optimal)](#scaling-laws)\n- [Computational Requirements](#computational-requirements)\n- [Training Stability](#training-stability)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## The Pretraining Objective\n\nMost modern LLMs are **Decoder-only** and use **Causal Language Modeling (CLM)**:\n\n```python\n# Objective: Minimize Cross-Entropy Loss\nLoss = -sum(log P(token_i | token_1, ..., token_{i-1}))\n```\n\nThe model predicts the next token given the context. This simple objective, at scale, leads to emergent reasoning capabilities.\n\n---\n\n## Data Curriculum and Quality\n\nThe focus has shifted from \"More Data\" to \"Better Curriculum.\"\n\n### The 100T Token Horizon\nFrontier models (Llama 4, GPT-5.5, Claude Opus 4.7, Gemini 3.1 Pro) are trained on 15T to 100T tokens. At this scale, **Deduplication** and **Quality Filtering** are the primary differentiators.\n\n### Data Mixture Standard\n| Component | Percentage | Purpose |\n|-----------|------------|---------|\n| Web (CommonCrawl) | 50-60% | General knowledge, diverse styles |\n| Code (Github, StackOverflow)| 15-20% | **Critical for Logic & Reasoning** |\n| Books (Project Gutenberg) | 10% | Narrative coherence, long context |\n| Academic (ArXiv, PubMed) | 10% | Specialized technical knowledge |\n| Synthetic (Model-generated) | 5-10% | Math, Logic, and specific instruction paths |\n\n**Nuance: The \"Code Effect\":**\nResearch shows that increasing code in the pretraining mix improves a model's performance on **non-coding** reasoning tasks (e.g., math, logic puzzles) by teaching structured thinking.\n\n---\n\n## Scaling Laws: Training vs. Inference Optimal\n\n### The Chinchilla Paradigm (2022-2024)\n`Data Tokens (D) ≈ 20 * Parameters (N)`\nFor a 70B model, this suggests ~1.4T tokens.\n\n### The Inference-Optimal Paradigm\nModern models (Llama 3, Llama 4) are **heavily overtrained** relative to Chinchilla.\n- **Why?**: Training cost is paid once; inference cost is paid billions of times.\n- **Result**: Small models (8B) are now trained on 15T+ tokens, making them as capable as older 70B models but much cheaper to serve.\n\n| Strategy | Token/Param Ratio | Best For |\n|----------|-------------------|----------|\n| Chinchilla | 20:1 | Research / Proof of Concept |\n| **Inference-Optimal** | **200:1 to 500:1**| Production deployment |\n\n---\n\n## Training Stability\n\nTraining at the \"Ultra\" scale (100k+ GPUs) faces massive stability issues.\n\n### 1. Loss Spikes\nSudden jumps in loss that can ruin a training run.\n- **Standard fix**: **Periodic Checkpointing** and **Automatic Rollbacks**.\n- **Architecture fix**: **Residual Scaling** (initializing weights such that the residual branch starts at near-zero).\n\n### 2. Precision: FP8 vs BF16\n- **BF16**: The 2023-2024 stability standard.\n- **FP8**: The current production standard. Supported natively by H100/B200, it halves memory usage and doubles throughput while maintaining training stability through **Stochastic Rounding**.\n\n---\n\n## Interview Questions\n\n### Q: Why train an 8B model on 15T tokens if Chinchilla says 160B tokens is optimal?\n\n**Strong answer:**\nChinchilla optimality focuses on the best use of a fixed **training** compute budget. However, in production, we care about the **Total Cost of Ownership (TCO)**, which is dominated by inference. By overtraining a small model, we \"bake in\" more intelligence into fewer parameters. This results in a model that is significantly more efficient to serve (higher TPS, lower VRAM) while maintaining frontier-level quality.\n\n### Q: What is the \"curriculum\" in LLM pretraining?\n\n**Strong answer:**\nCurriculum refers to the order and mixture of data. A common modern pattern is:\n1. **General Knowledge Phase:** 80% of tokens (Web, Books).\n2. **Reasoning Focus Phase:** 15% tokens (Code, Math, Logic).\n3. **High-Quality \"Cooling\" Phase:** The last 1-5% of tokens are extremely high-quality, human-curated, or textbook data. This \"cooling\" phase helps the model jitter less and follow instructions better before any fine-tuning starts.\n\n---\n\n## References\n- Kaplan et al. \"Scaling Laws for Neural Language Models\" (2020)\n- Hoffmann et al. \"Training Compute-Optimal Large Language Models\" (Chinchilla, 2022)\n- Meta AI. \"The Llama 3/4 Herd of Models\" (2024/2025)\n\n---\n\n*Next: [Fine-Tuning Strategies](02-fine-tuning-strategies.md)*\n", "content_zh": "# 预训练基础\n\n## 目标\n\n预训练通常通过最小化下一个 token 的 Cross-Entropy Loss 学习通用语言和世界知识。数据质量、混合比例、去重、训练 token 数和模型规模共同决定最终能力。\n\n## Scaling Laws\n\nChinchilla 范式强调模型参数和训练 token 的平衡；推理最优范式则会在部署成本和服务量较高时偏向更小、更高效的模型。不能只根据参数数量判断训练是否合理。\n\n## 稳定性\n\nLoss Spike 可能来自数据异常、学习率、数值精度或分布式同步问题。FP8 节省内存和计算，BF16 通常提供更宽的数值范围；实践中需要监控 loss、梯度、吞吐、通信和 checkpoint。\n\n## 面试角度\n\n能够解释为什么一个 8B 模型可能使用远多于理论最优的 token，也要知道 curriculum 如何改变数据难度和训练顺序。\n", "summary_content": "# 《预训练基础》中文概要\n\n掌握预训练目标、数据质量、Scaling Laws、Chinchilla、训练稳定性和 FP8/BF16，并能解释训练 token 与模型规模的权衡。\n"}, {"filename": "03-training-and-adaptation/02-fine-tuning-strategies.md", "section_id": "03-training-and-adaptation", "section_label": "03 · 训练与适配", "label": "02 fine tuning strategies", "title_zh": "微调策略", "summary": "掌握 SFT、Continued Pretraining、PEFT、全参数微调和关键超参数，并能解释领域适应、质量数据和灾难性遗忘。", "detail": "", "content": "# Fine-Tuning Strategies\n\nFine-tuning adapts a pretrained model to specific tasks, domains, or styles. Today, fine-tuning is less about \"teaching facts\" and more about \"teaching format and behavior.\"\n\n## Table of Contents\n\n- [When to Fine-Tune](#when-to-fine-tune)\n- [Supervised Fine-Tuning (SFT)](#supervised-fine-tuning)\n- [Continued Pretraining (Domain Adaptation)](#continued-pretraining)\n- [Instruction Tuning](#instruction-tuning)\n- [PEFT vs. Full-Parameter](#peft-vs-full-parameter)\n- [Hyperparameter Tuning](#hyperparameter-tuning)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## When to Fine-Tune\n\nBefore fine-tuning, ask: **Can this be solved with Prompt Engineering or RAG?**\n\n| Requirement | Better Solution | Why |\n|-------------|-----------------|-----|\n| New Facts / Knowledge | **RAG** | LLMs are bad at memorizing facts from FT; RAG is easier to update. |\n| Specific Output Format | **Fine-Tuning** | Teaches the model to reliably output JSON/XML without complex prompting. |\n| Tone / Persona | **Fine-Tuning** | Much more consistent than system prompts. |\n| Latency Reduction | **Fine-Tuning** | Reduces the need for long few-shot prompts. |\n| Private Domain Language| **Continued Pretraining** | Teaches specialized vocabulary (medical, legal, custom code). |\n\n---\n\n## Supervised Fine-Tuning (SFT)\n\nThe first step after pretraining. The model is trained on `(Prompt, Response)` pairs.\n\n### The Quality Hierarchy\n**1,000 \"Perfect\" examples beat 1,000,000 noisy examples.**\n- **Golden Sets:** Hand-curated by domain experts (PhD level for technical tasks).\n- **Negative Constraint Training:** Including examples of what the model **should not** do (e.g., \"Don't apologize,\" \"Don't mention you are an AI\").\n\n---\n\n## Continued Pretraining (Domain Adaptation)\n\nAlso known as \"Second-stage Pretraining.\"\n- **How**: Train on raw text from a specific domain (e.g., all SEC filings for a finance model).\n- **Objective**: Learn the statistical distribution of the domain language.\n- **Nuance**: Requires a much lower learning rate (~1/10th of original) to prevent \"catastrophic forgetting.\"\n\n---\n\n## PEFT vs. Full-Parameter\n\n| Feature | Full-Parameter FT | PEFT (LoRA, QLoRA) |\n|---------|-------------------|--------------------|\n| GPU VRAM | Very High (Model Size * 4-12) | Low (Model Size * 1.5) |\n| Speed | Base | 2x-3x Faster |\n| Risk | High (Catastrophic Forgetting) | Low |\n| Deployment | One model per task | One base model + multiple adapters |\n| **Verdict**| Reserved for foundation training | **The Production Standard** |\n\n---\n\n## Hyperparameter Tuning\n\n### 1. Learning Rate (LR)\n- **SFT**: `1e-5` to `5e-5` is standard.\n- **Too high**: Model \"collapses\" and starts repeating or speaking gibberish.\n\n### 2. Rank (r) for LoRA\n- Higher ranks (`r=64` to `r=256`) for complex reasoning tasks.\n- Lower ranks (`r=8`) for simple style/tone changes.\n\n### 3. Packaged Training (Packing)\nTo maximize throughput, we \"pack\" multiple short examples into a single 4k or 8k sequence, separated by EOS tokens.\n- **Challenge**: Self-attention might leak across examples.\n- **Solution**: **FlashAttention with block-masking** to prevent cross-example attention.\n\n---\n\n## Interview Questions\n\n### Q: Why use Continued Pretraining instead of just putting domain data in the SFT set?\n\n**Strong answer:**\nSFT is \"expensive\" in terms of data creation—you need prompt/answer pairs. Continued Pretraining allows you to leverage massive amounts of raw, unlabeled domain text to teach the model's inner representations the specialized vocabulary and style. Once the model \"speaks the language,\" you use a small SFT set to teach it the \"tasks\" (e.g., classification, summarization) in that language.\n\n### Q: How do you prevent a model from \"unlearning\" general capabilities during fine-tuning?\n\n**Strong answer:**\nThis is \"Catastrophic Forgetting.\" Two main mitigations:\n1. **Rehearsal:** Mix in 5-10% of the original pretraining data into your fine-tuning set.\n2. **PEFT (LoRA):** Since we only train a small percentage of weights, the original \"knowledge\" remains frozen in the base model weights, significantly reducing the risk of forgetting.\n\n---\n\n## References\n- Hu et al. \"LoRA: Low-Rank Adaptation of Large Language Models\" (2021)\n- Ouyang et al. \"Training language models to follow instructions\" (InstructGPT, 2022)\n- Dettmers et al. \"QLoRA: Efficient Finetuning of Quantized LLMs\" (2023)\n\n---\n\n*Next: [LoRA, QLoRA, and PEFT](03-lora-qlora-peft.md)*\n", "content_zh": "# 微调策略\n\n## 什么时候微调\n\n当任务行为、风格、格式、工具调用或领域模式需要稳定改变，且拥有高质量数据时考虑微调。知识频繁变化或必须引用来源时，优先使用 RAG。\n\n## 方法\n\nSFT 使用高质量输入—输出示例；Continued Pretraining 让模型先适应领域语料；PEFT/LoRA 只训练少量参数，降低显存和存储成本；全参数微调成本高，但改变能力更彻底。\n\n## 调参与风险\n\n学习率、LoRA rank、batch、packing、序列长度和数据混合会影响结果。要防止灾难性遗忘，保留通用数据、降低学习率、混合任务、做通用能力回归和设置早停。\n\n## 面试要点\n\n说明为什么选择 Continued Pretraining 或 SFT，如何构建质量层级的数据，如何评估领域能力提升是否以通用能力下降为代价。\n", "summary_content": "# 《微调策略》中文概要\n\n掌握 SFT、Continued Pretraining、PEFT、全参数微调和关键超参数，并能解释领域适应、质量数据和灾难性遗忘。\n"}, {"filename": "03-training-and-adaptation/03-lora-qlora-peft.md", "section_id": "03-training-and-adaptation", "section_label": "03 · 训练与适配", "label": "03 lora qlora peft", "title_zh": "LoRA、QLoRA 与 PEFT", "summary": "理解 LoRA 的低秩更新、QLoRA 的 4-bit 训练、DoRA/rsLoRA 变体和 Multi-LoRA 服务，重点关注显存、适配器隔离和质量保持。", "detail": "", "content": "# LoRA, QLoRA, and PEFT\n\nParameter-Efficient Fine-Tuning (PEFT) is the industry standard for adapting LLMs. This chapter covers the mechanics and advanced variants of LoRA and other PEFT methods.\n\n## Table of Contents\n\n- [The PEFT Revolution](#the-peft-revolution)\n- [LoRA Mechanics](#lora-mechanics)\n- [QLoRA: 4-bit Fine-Tuning](#qlora)\n- [Advanced Variants (DoRA, Vera, RS-LoRA)](#advanced-variants)\n- [Multi-LoRA Serving (Adapters)](#multi-lora-serving)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## The PEFT Revolution\n\nFull fine-tuning of frontier models (GPT-5.5, Claude Opus 4.7, Llama 4 405B) is economically unfeasible for most enterprises. PEFT allows:\n1. **Memory Efficiency**: Train 70B models on a single A100.\n2. **Speed**: 2x faster training by updating <1% of weights.\n3. **Modularity**: Swap \"skills\" (adapters) onto a shared base model without reloading weights.\n\n---\n\n## LoRA Mechanics\n\nLoRA (Low-Rank Adaptation) injects trainable rank-decomposition matrices into the transformer layers.\n\n```python\n# The LoRA Equation for a Weight Matrix W:\nh = Wx + (BA)x * (alpha/r)\n```\n- **W**: Pretrained weights (Frozen, Gradient = None)\n- **A, B**: LoRA adapters (Trainable)\n- **r**: Rank (e.g., 8, 16, 64)\n- **alpha**: Scaling factor (typically 2 * rank)\n\n### Principal Nuance: Target Modules\nHistorically, we only targeted query/value projections (`q_proj`, `v_proj`).\n**Modern standard**: Target **all** linear layers (`q, k, v, o, gate, up, down`) for maximum stability and performance, even at lower ranks.\n\n---\n\n## QLoRA: 4-bit Fine-Tuning\n\nQLoRA pushes efficiency further by quantizing the base model to 4-bit (NF4) while maintaining 16-bit gradients.\n\n| Optimization | Method | Benefit |\n|--------------|--------|---------|\n| **NF4 Quantization** | Normalized Float 4 | Better info density than standard Int4 |\n| **Double Quant** | Quantizing the quant constants | Saves ~0.5 GB VRAM per model |\n| **Paging** | Unified Memory (Nvidia) | Prevents OOM by spilling to CPU RAM |\n\n---\n\n## Advanced Variants\n\n### 1. DoRA (Weight-Decomposed Low-Rank Adaptation)\nDoRA decomposes the weight update into **Magnitude** and **Direction**.\n- **Result**: Learns 2x faster than LoRA and performs closer to full fine-tuning.\n- **Why it wins**: It allows the model to adjust how much it changes vs. what it's changing independently.\n\n### 2. Vera (Vector-based Random Aggregation)\nInstead of low-rank matrices `A` and `B`, Vera uses fixed random projections with a small trainable vector.\n- **Efficiency**: Reduces adapter size by **10x** compared to LoRA.\n- **Use Case**: Massive-scale Multi-LoRA serving.\n\n### 3. RS-LoRA (Rank-Stabilized LoRA)\nUses a scaling factor of `alpha / sqrt(r)`.\n- **Benefit**: Allows you to increase rank (to 256+) without the model becoming unstable or requiring a lower learning rate.\n\n---\n\n## Multi-LoRA Serving (Adapters)\n\nProduction systems now serve one base model (e.g., Llama 4 70B) and dynamically swap adapters in the same batch.\n\n```python\n# vLLM/LMCache Multi-LoRA Pattern:\n# Request 1 -> Base + Finance_Adapter\n# Request 2 -> Base + Legal_Adapter\n# Request 3 -> Base + Medical_Adapter\n```\n**The Tech**: **Continuous Batching + PagedAttention v3** allows serving 100+ adapters with only a 5-10% latency overhead compared to the base model.\n\n---\n\n## Interview Questions\n\n### Q: Why is the LoRA alpha parameter usually set to 2x the rank?\n\n**Strong answer:**\nThe `alpha` parameter is a scaling factor for the LoRA update. When we initialize LoRA matrices, B is usually zero-initialized, and A is random. As we train, the update size depends on the rank `r`. By setting `alpha=2r` (or any constant), we ensure that if we decide to change the rank later (e.g., from 8 to 16), we don't need to retune the learning rate. The scaling factor `alpha/r` normalizes the update magnitude relative to the learning rate.\n\n### Q: What is DoRA, and why would you use it over standard LoRA?\n\n**Strong answer:**\nDoRA (Weight-Decomposed Low-Rank Adaptation) is a 2024 technique that separates the pretrained weight updates into magnitude and direction components, similar to Weight Normalization. While standard LoRA updates magnitude and direction simultaneously, DoRA allows them to be learned independently. Empirically, DoRA shows much better convergence and higher accuracy, often matching full-parameter fine-tuning even at low ranks, making it the preferred choice for high-stakes domain adaptation.\n\n---\n\n## References\n- Hu et al. \"LoRA: Low-Rank Adaptation of Large Language Models\" (2021)\n- Liu et al. \"DoRA: Weight-Decomposed Low-Rank Adaptation\" (2024)\n- Dettmers et al. \"QLoRA: Efficient Finetuning of Quantized LLMs\" (2023)\n\n---\n\n*Next: [RLHF and DPO](04-rlhf-and-dpo.md)*\n", "content_zh": "# LoRA、QLoRA 与 PEFT\n\n## LoRA 原理\n\nLoRA 冻结基础权重 W，只训练低秩更新矩阵 A、B：`W' = W + α/r · BA`。它减少可训练参数、显存和适配器存储，适合多任务和多租户部署。\n\n## QLoRA 与变体\n\nQLoRA 将基础模型以 4-bit 量化加载，同时训练 LoRA 适配器；NF4、双重量化和分页优化器进一步降低显存。DoRA、rsLoRA 等变体分别改善权重方向/幅度或 rank 稳定性。\n\n## Multi-LoRA Serving\n\n共享一个基础模型，按请求加载 Finance、Legal、Medical 等适配器，可以节省重复权重成本，但要管理适配器版本、缓存、并发、租户权限和切换延迟。评估时同时比较适配效果和基础能力保持情况。\n", "summary_content": "# 《LoRA、QLoRA 与 PEFT》中文概要\n\n理解 LoRA 的低秩更新、QLoRA 的 4-bit 训练、DoRA/rsLoRA 变体和 Multi-LoRA 服务，重点关注显存、适配器隔离和质量保持。\n"}, {"filename": "03-training-and-adaptation/04-rlhf-and-dpo.md", "section_id": "03-training-and-adaptation", "section_label": "03 · 训练与适配", "label": "04 rlhf and dpo", "title_zh": "RLHF 与 DPO", "summary": "掌握 RLHF 的多阶段流程、DPO 的直接偏好优化、奖励投机、对齐税和推理模型的可验证奖励，能解释 DPO 的工程优势与数据依赖。", "detail": "", "content": "# RLHF and DPO (Alignment)\n\nAlignment is the process of ensuring an LLM's behavior matches human values and instructions. The field has moved from traditional RLHF to more efficient and scalable methods like DPO and Online RL.\n\n## Table of Contents\n\n- [The Alignment Problem](#the-alignment-problem)\n- [RLHF: The Foundation](#rlhf-foundation)\n- [DPO: Direct Preference Optimization](#dpo)\n- [Online Alignment](#online-alignment)\n- [Alignment for Reasoning Models](#alignment-for-reasoning)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## The Alignment Problem\n\nPretrained models are \"knowledgeable but uncontrolled.\" They may:\n1. Generate harmful content (Safety).\n2. Fail to follow instructions (Instruction Following).\n3. Hallucinate wildly (Factuality).\n\nAlignment creates \"Reward Models\" and \"Policy Updates\" to steer the model.\n\n---\n\n## RLHF: The Foundation\n\nReinforcement Learning from Human Feedback (RLHF) involves three steps:\n1. **SFT**: Supervised Fine-Tuning.\n2. **Reward Model (RM)**: Train a model on `(Prompt, Winning_Response, Losing_Response)` to predict human scores.\n3. **PPO (Proximal Policy Optimization)**: Use the RM to provide a \"reward signal\" to the LLM via Reinforcement Learning.\n\n**Nuance**: Traditional RLHF is now considered too complex/unstable for most teams due to the overhead of training a separate Reward Model and the instability of PPO.\n\n---\n\n## DPO: Direct Preference Optimization\n\nDPO is the industry standard. It eliminates the Reward Model.\n\n### How it Works:\nDPO uses the LLM itself as the Reward Model by mathematically deriving the optimal policy directly from preference data.\n- **Goal**: Maximize the probability of the \"winning\" response and minimize the \"losing\" response, relative to a fixed \"reference model.\"\n\n### The Multi-Stage Alignment Pattern:\n1. **Base SFT**: 5k-10k high-quality samples.\n2. **DPO Step 1**: Alignment for instruction following.\n3. **DPO Step 2**: Alignment for safety and specific tone.\n\n---\n\n## Online Alignment\n\n**The Problem with Offline DPO**: It only learns from static data. If the model improves beyond that data, it hits a ceiling.\n\n**The Solution: Online DPO (or RLOO)**:\n1. The model generates 4-8 responses to a prompt.\n2. A **Judge Model** (e.g., GPT-5.5, Claude Opus 4.7) or a **Rule-based Reward** (e.g., Code Execution) ranks them in real-time.\n3. The model updates its policy immediately based on this \"Online\" feedback.\n\n---\n\n## Alignment for Reasoning Models (o1/DeepSeek-R1 style)\n\nAligning \"Thinking\" models requires a shift from **Response Preference** to **Process Preference**.\n\n| Feature | Standard Alignment | Reasoning Alignment |\n|---------|-------------------|---------------------|\n| Reward Target | The final answer | The **Chain of Thought (CoT)** |\n| Reward Signal | Helpful/Safe | **Correctness + Conciseness** |\n| Method | Human Ranking | Rule-based (e.g., \"Did the code run?\") |\n\n**Principal-level Nuance**: \"Verification-based RL\" is the secret to today's frontier models. Instead of humans saying what is better, we use hard verifiable outcomes (Math answers, Code test cases) as the reward signal.\n\n---\n\n## Interview Questions\n\n### Q: Why is DPO often preferred over RLHF/PPO?\n\n**Strong answer:**\nDPO is preferred primarily due to its simplicity and stability. PPO requires maintaining four models in memory (Policy, Reference, Value, and Reward), which is extremely VRAM-intensive. Furthermore, PPO is notoriously sensitive to hyperparameters and often suffers from \"reward hacking\" or sudden collapse. DPO treats alignment as a simple classification problem on preference pairs, making it much more robust, easier to tune, and significantly cheaper to run.\n\n### Q: What is the risk of \"Alignment Tax\"?\n\n**Strong answer:**\nThe \"Alignment Tax\" refers to the decline in a model's raw capabilities (e.g., coding, creative writing, or logical reasoning) after it is aligned for safety or specific personas. Because the model is being forced to prioritize safety or adherence to a specific style, it may become \"too cautious\" or lose the nuance it learned during pretraining. Modern techniques like **Steerable Alignment** and **DPO-with-KL-penalty** aim to minimize this by ensuring the model's policy doesn't drift too far from the original pretrained distribution.\n\n---\n\n## References\n- Rafailov et al. \"Direct Preference Optimization: Your Language Model is Secretly a Reward Model\" (2023)\n- Schulman et al. \"Proximal Policy Optimization Algorithms\" (2017)\n- OpenAI. \"Learning to Reason with LLMs\" (2024)\n\n---\n\n*Next: [Knowledge Distillation](05-knowledge-distillation.md)*\n", "content_zh": "# RLHF 与 DPO\n\n## 对齐问题\n\n预训练模型学习的是语言分布，不一定符合用户偏好、帮助性、安全和格式要求。对齐训练利用偏好数据把模型行为推向目标。\n\n## RLHF\n\n典型 RLHF 流程包括 SFT、训练 Reward Model，再用 PPO 等强化学习优化策略。它灵活但工程复杂，需要处理奖励投机、训练不稳定、KL 约束和昂贵的在线采样。\n\n## DPO\n\nDPO 直接使用偏好对优化 chosen/rejected 概率，不需要单独在线训练 Reward Model，工程更简单、稳定性更好，但依赖高质量偏好数据和正确的参考策略。\n\n## Reasoning 对齐\n\n推理模型可以使用可验证奖励、程序化检查器和在线采样。对齐税表示安全或偏好优化可能损害通用能力，必须做通用能力回归和安全评测。\n", "summary_content": "# 《RLHF 与 DPO：对齐训练》中文概要\n\n掌握 RLHF 的多阶段流程、DPO 的直接偏好优化、奖励投机、对齐税和推理模型的可验证奖励，能解释 DPO 的工程优势与数据依赖。\n"}, {"filename": "03-training-and-adaptation/05-knowledge-distillation.md", "section_id": "03-training-and-adaptation", "section_label": "03 · 训练与适配", "label": "05 knowledge distillation", "title_zh": "知识蒸馏", "summary": "理解 Teacher-Student、Hard/Soft Label、Output/Feature Distillation、温度和 KL Loss，并注意 Teacher 错误、偏见、许可和能力退化风险。", "detail": "", "content": "# Knowledge Distillation\n\nKnowledge distillation is the process of transferring the intelligence from a large, complex model (\"Teacher\") to a smaller, more efficient one (\"Student\"). This is the secret to the high performance of today's small open-weight models that punch well above their parameter count.\n\n## Table of Contents\n\n- [The Teacher-Student Paradigm](#teacher-student-paradigm)\n- [How Distillation Works](#how-distillation-works)\n- [Feature vs. Output Distillation](#feature-vs-output)\n- [Self-Distillation from Proof (SDP)](#self-distillation-proof)\n- [Quantization-Aware Distillation](#quantization-aware-distillation)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## The Teacher-Student Paradigm\n\nSmall models (e.g., Llama 4 8B, Gemini 3.1 Flash, Claude Haiku 4.5) are not trained on raw web data alone. They are trained on **Synthetic Data** generated or curated by a much larger model (e.g., GPT-5.5, Claude Opus 4.7, or Llama 4 405B).\n\n| Model | Role | Intelligence Source |\n|-------|------|---------------------|\n| **Teacher** | Large (100B+ Params) | Pretraining on 50T+ tokens |\n| **Student** | Small (1B - 8B Params) | Teacher's filtered logic/output |\n\n---\n\n## How Distillation Works\n\n### 1. Hard Label Distillation\nThe student learns from the teacher's final predictions (e.g., the answer to a question).\n\n### 2. Soft Label Distillation (Temperature Scaling)\nThe student learns from the teacher's **probability distribution** (Logits). This is much richer because it tells the student not just the right answer, but which wrong answers were \"almost\" right.\n\n```python\n# Distillation Loss (KL Divergence):\nLoss = KL_Div(Teacher_Logits / T, Student_Logits / T)\n```\n*Where T is the Temperature (typically 2.0 - 5.0).*\n\n---\n\n## Feature vs. Output Distillation\n\n### Output Distillation (Standard)\nStudent matches the teacher's text responses.\n- **Pros**: Easy to implement via API.\n- **Cons**: Only learns behavioral surface patterns.\n\n### Feature/Hidden State Distillation\nStudent matches the inner **Hidden States** (vector representations) of the teacher.\n- **Requirement**: You need access to the teacher's weights (Open Weights).\n- **Pro**: The student learns the teacher's \"internal conceptual map,\" leading to much higher reasoning depth.\n\n---\n\n## Self-Distillation from Proof (SDP)\n\n**The reasoning breakthrough.**\nModels like o1, DeepSeek-R1, and Claude Opus 4.7 use SDP to improve without new human data.\n\n1. **Generation**: The model generates 100 possible solutions to a hard math/code problem.\n2. **Verification**: A rule-based system (compiler/calculator) identifies the 1 correct solution.\n3. **Distillation**: The model is fine-tuned on the \"Chain of Thought\" (CoT) that led to that correct solution.\n\n**Result**: The model \"distills itself\" by keeping only the high-quality reasoning paths.\n\n---\n\n## Quantization-Aware Distillation\n\nStandard quantization (e.g., 16-bit to 4-bit) causes a small drop in accuracy.\n**The Fix**: Use Knowledge Distillation *during* the quantization process. The 16-bit model acts as the teacher, guiding the 4-bit model to minimize its error. This is how modern 4-bit models match 16-bit performance.\n\n---\n\n## Interview Questions\n\n### Q: Why is a distilled 8B model better than an 8B model trained from scratch on the same tokens?\n\n**Strong answer:**\nTraining from scratch (Pretraining) on raw web data is noisy; the model spends a lot of capacity learning to navigate that noise. A distilled model, however, is trained on a \"purified\" curriculum. The teacher model acts as a high-quality filter, providing structured logic, clear explanations, and a cleaner distribution of language. Essentially, the teacher provides \"hints\" through its logit distribution that tell the student exactly which features of the language are most important to learn.\n\n### Q: What are the risks of using GPT-4o as a teacher to distill a Llama student?\n\n**Strong answer:**\n1. **Model Collapse**: If the student only sees the teacher's output, it may lose the \"long tail\" of creative or diverse knowledge and only learn the teacher's narrow biases.\n2. **License Violations**: Most proprietary models (OpenAI, Anthropic) have clauses forbidding the use of their outputs to train \"competing\" models. This is a major legal risk for enterprises distilling their own models from API outputs.\n3. **Linguistic Mimicry**: The student might learn to *sound* confident (like the teacher) without actually having the same level of logical depth, leading to confident but incorrect hallucinations.\n\n---\n\n## References\n- Hinton et al. \"Distilling the Knowledge in a Neural Network\" (2015)\n- Gou et al. \"Knowledge Distillation: A Survey\" (2021)\n- DeepSeek. \"DeepSeek-R1: Incentivizing Reasoning Capability\" (2025)\n\n---\n\n*Next: [Synthetic Data Generation](06-synthetic-data-generation.md)*\n", "content_zh": "# 知识蒸馏\n\n## Teacher-Student\n\n大模型 Teacher 生成软概率、答案、解释或轨迹，Student 学习这些信息，在较小体积和更低成本下逼近 Teacher 能力。蒸馏通常比从相同 token 从零训练小模型更有效，因为 Teacher 提供了压缩后的行为信号。\n\n## 方法\n\nHard Label 蒸馏学习最终答案；Soft Label 使用温度缩放后的概率和 KL Divergence；Output Distillation 学输出，Feature Distillation 学隐藏状态。还可以蒸馏推理过程、工具轨迹和可验证结果。\n\n## 风险\n\nTeacher 的错误、偏见、版权/隐私、格式习惯和奖励投机会被学生继承。使用 GPT-4o 等外部 Teacher 时，要验证许可、数据治理、领域覆盖、通用能力和安全行为，并建立独立测试集。\n", "summary_content": "# 《知识蒸馏》中文概要\n\n理解 Teacher-Student、Hard/Soft Label、Output/Feature Distillation、温度和 KL Loss，并注意 Teacher 错误、偏见、许可和能力退化风险。\n"}, {"filename": "03-training-and-adaptation/06-synthetic-data-generation.md", "section_id": "03-training-and-adaptation", "section_label": "03 · 训练与适配", "label": "06 synthetic data generation", "title_zh": "合成数据生成", "summary": "合成数据适合扩展长尾和可验证任务，但必须控制重复、错误、偏差和 Model Collapse；质量检测要结合规则、程序验证和人工抽样。", "detail": "", "content": "# Synthetic Data Generation\n\nThe industry has hit the \"Data Wall\", the exhaustion of high-quality human text on the web. Synthetic data is now the primary engine for model improvement, sitting at the core of every modern frontier-model recipe.\n\n## Table of Contents\n\n- [The Data Wall and the Synthetic Shift](#synthetic-shift)\n- [Evol-Instruct Pattern](#evol-instruct)\n- [Constitutional AI & Self-Correction](#constitutional-ai)\n- [Verifiable Synthetic Data (Math/Code)](#verifiable-data)\n- [De-biasing and Diversity](#diversity)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## After the \"Data Wall\": The Synthetic Shift\n\nFrontier models (Llama 4, GPT-5.5, Claude Opus 4.7, Gemini 3.1 Pro) are trained on 100T+ tokens. There simply isn't enough human text to sustain this scaling.\n**The reality:** More than **50% of the training mixture** for frontier fine-tuning (and 10% of pretraining) is now synthetic.\n\n| Source | Human Data | Synthetic Data |\n|--------|------------|----------------|\n| **Volume** | Fixed (Finite) | Infinite |\n| **Quality** | Variable (Noisy) | Controllable (Purified) |\n| **Cost** | High (Human Labelers) | Cheap (Inference/GPU) |\n| **Bias** | Mirror of internet | Can be manually balanced |\n\n---\n\n## Evol-Instruct Pattern\n\nEvol-Instruct is a recursive process where an LLM takes a simple instruction and evolves it into a more complex one.\n\n**The Evolution Directions:**\n1. **Breadth**: Increase the number of tasks.\n2. **Depth**: Add constraints, complicating factors, or multi-step logic.\n3. **De-noising**: Clean up phrasing to remove \"AI-isms.\"\n\n```python\n# Simple Instruction: \"Write a function to add two numbers.\"\n# Evolved Instruction: \"Write a thread-safe Python class that performs \n# matrix addition with error handling and unit tests, adhering to PEP8.\"\n```\n\n---\n\n## Constitutional AI & AI Feedback (RLAIF)\n\nDeveloped by Anthropic and widely adopted across the industry, RLAIF uses a \"Constitution\" (a set of rules) to guide a model in evaluating and improving its own data.\n\n**The Loop:**\n1. **Propose**: Model A generates a response.\n2. **Critique**: Model B (the constitutional judge) identifies flaws based on guidelines.\n3. **Revise**: Model A produces a better version based on the critique.\n4. **Train**: The final (Prompt, Revise) pair is added to the SFT set.\n\n---\n\n## Verifiable Synthetic Data\n\nThe biggest risk of synthetic data is **Model Collapse** (the model learning its own mistakes).\n**The 2025 Solution**: Focus on domains where the \"Truth\" is verifiable without an LLM.\n\n- **Math**: Use Formal Verification (Lean/Isabelle) or Python execution to verify answers.\n- **Code**: Run generated code against test cases (Unit Tests).\n- **RAG**: Use \"Gold Context\" to generate questions where the answer is explicitly in the text.\n\n---\n\n## De-biasing and Diversity\n\nSynthetic data is used to \"fill the gaps\" in human data.\n- **Languages**: Generating high-quality text in low-resource languages (e.g., Swahili, Marathi) by translating conceptual templates.\n- **Logic**: Creating 1,000,000 variations of a specific logical fallacy to \"harden\" the model against it.\n\n---\n\n## Interview Questions\n\n### Q: What is the risk of \"Model Collapse\" when training on synthetic data?\n\n**Strong answer:**\nModel Collapse occurs when a model is trained on data generated by an earlier version of itself. Because the model's distribution is narrower than the real world (it has preferences/biases for certain words and patterns), the training loop becomes a \"positive feedback loop\" of errors and blandness. By 2025, we mitigate this by:\n1. Mixing in 5-20% \"Golden\" human-authenticated data.\n2. Using \"Verifiable\" rewards (Math/Code) so mistakes are never learned.\n3. Using more powerful \"Teacher\" models to generate data for \"Student\" models.\n\n### Q: How do you ensure the *quality* of a synthetic dataset of 10 million rows?\n\n**Strong answer:**\nWe use a **Multi-Stage Filtering Pipeline**:\n1. **Semantic Deduplication**: Using embeddings to remove near-identical clusters.\n2. **LLM-as-Judge**: Sampling 1% of the data and having a stronger model (e.g., GPT-5.2) score it for logic and safety.\n3. **Perplexity Filtering**: Using a small model to calculate the perplexity of the text. If it's too high (nonsense) or too low (repetitive/simple), it's discarded.\n4. **Verifiable Execution**: If the data contains code or math, it must pass a local compiler/interpreter check.\n\n---\n\n## References\n- Xu et al. \"WizardLM: Empowering Large Language Models to Follow Complex Instructions\" (2023)\n- Bai et al. \"Constitutional AI: Harmlessness from AI Feedback\" (2022)\n- OpenAI. \"Weak-to-Strong Generalization\" (2023)\n\n---\n\n*Next: [Quantization Deep Dive](07-quantization-deep-dive.md)*\n", "content_zh": "# 合成数据生成\n\n## 为什么使用合成数据\n\n高质量人工数据稀缺且昂贵，合成数据可以扩展长尾场景、生成困难样本、提供程序化标签和训练偏好模型。Evol-Instruct 通过逐步增加约束把简单指令变成复杂任务。\n\n## 质量控制\n\n使用规则验证、编译/单元测试、来源模型交叉检查、去重、难度分层、人工抽样和污染检测。可验证任务应优先使用程序化奖励，而不是完全依赖模型评分。\n\n## 风险\n\n重复使用模型生成数据可能导致 Model Collapse、错误放大、风格收窄和偏差继承。要混合真实数据、保持多样性、去偏、跟踪数据版本，并用隐藏集和人工评测监控质量。\n", "summary_content": "# 《合成数据生成》中文概要\n\n合成数据适合扩展长尾和可验证任务，但必须控制重复、错误、偏差和 Model Collapse；质量检测要结合规则、程序验证和人工抽样。\n"}, {"filename": "03-training-and-adaptation/07-quantization-deep-dive.md", "section_id": "03-training-and-adaptation", "section_label": "03 · 训练与适配", "label": "07 quantization deep dive", "title_zh": "量化深入理解", "summary": "掌握 NF4、AWQ、FP8、GGUF、EXL2、KV Cache Quantization 和 QAT，理解显存/吞吐/质量损失之间的关系。", "detail": "", "content": "# Quantization Deep Dive\n\nQuantization is the process of reducing the precision of model weights (e.g., from 16-bit to 4-bit) to save memory and increase inference speed. This is the primary tool for deploying large models on consumer and single-GPU hardware.\n\n## Table of Contents\n\n- [The Precision-Performance Tradeoff](#precision-performance)\n- [Quantization Methods (NF4, GPTQ, AWQ)](#methods)\n- [GGUF vs. EXL2](#formats)\n- [KV Cache Quantization (The VRAM Saver)](#kv-cache)\n- [Quantization-Aware Fine-Tuning](#qaft)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## The Precision-Performance Tradeoff\n\nTraditional models use **BF16** (16-bit). Quantization seeks to reduce this to **8-bit (FP8)**, **4-bit (Int4/NF4)**, or even **1.5-bit (BitNet)**.\n\n| Precision | Bits | Weight size (8B Model) | Quality Loss | GPU Compatibility |\n|-----------|------|------------------------|--------------|-------------------|\n| **BF16** | 16 | 16 GB | 0% (Baseline) | All Modern |\n| **FP8** | 8 | 8 GB | < 1% | H100 / B200 / RTX 4090 |\n| **4-bit (NF4)**| 4 | 5 GB | 1-2% | All Modern |\n| **2-bit** | 2 | 2.5 GB | 10-15% | Research / Specialized |\n\n---\n\n## Quantization Methods\n\n### 1. NF4 (NormalFloat4)\nThe gold standard for fine-tuning (QLoRA). It assumes weights follow a normal distribution and maps them to a set of 16 values.\n\n### 2. AWQ (Activation-aware Weight Quantization)\nInstead of quantizing all weights equally, AWQ identifies the **1% of \"salient\" weights** that are most important for quality and keeps them in higher precision.\n- **Pro**: Better accuracy than GPTQ.\n\n### 3. FP8 (Multi-Node Standard)\nHardware-native quantization supported by Nvidia's Transformer Engine.\n- **Why it wins**: It provides the speed of Int8 but with the dynamic range of Float16, making it stable for both training and inference.\n\n---\n\n## GGUF vs. EXL2\n\n### GGUF (llama.cpp)\n- **Deployment**: CPU + GPU offloading. \n- **Pros**: Cross-platform (Mac, Linux, Windows), single file, highly portable.\n- **Cons**: Slower than pure GPU formats.\n\n### EXL2 (ExLlamaV2)\n- **Deployment**: GPU-only (Nvidia).\n- **Pros**: The **fastest 4-bit format on Nvidia GPUs**. Significant performance boost over AutoGPTQ/AWQ.\n- **Cons**: Inflexible (Nvidia only).\n\n---\n\n## KV Cache Quantization (The VRAM Saver)\n\nIn long-context RAG (1M+ tokens), the **KV Cache** often consumes more VRAM than the model weights themselves.\n\n- **BF16 KV Cache**: 2M tokens ≈ 32GB VRAM (on 8B model).\n- **FP8/Int4 KV Cache**: 2M tokens ≈ 8GB - 16GB VRAM.\n\n**Nuance**: Modern serving frameworks (vLLM, SGLang, TensorRT-LLM) now support **Streaming Quantization** where the KV cache is compressed on-the-fly, allowing 4x higher concurrency on the same GPU.\n\n---\n\n## Quantization-Aware Training (QAT)\n\nInstead of quantizing a model *after* it's trained (Post-training Quantization), QAT simulates quantization *during* the training process.\n- **Result**: The model learns to compensate for the lost precision.\n- **Status**: Mandatory for models smaller than 3B parameters to remain useful at 4-bit.\n\n---\n\n## Interview Questions\n\n### Q: Why do we use NF4 instead of standard Float4 for QLoRA?\n\n**Strong answer:**\nStandard Float4 has a fixed grid that doesn't map well to the actual distribution of LLM weights, which typically follow a zero-centered normal distribution. NF4 (NormalFloat4) is a data type that is mathematically optimized so that each quantization bin contains an equal number of values from the normal distribution. This prevents \"clustering\" of weights and ensures that the model preserves as much information (entropy) as possible, leading to significantly higher accuracy than standard 4-bit integers.\n\n### Q: How does AWQ differ from GPTQ?\n\n**Strong answer:**\nGPTQ is a \"Layer-wise\" quantization method that minimizes the mean squared error of the weights. AWQ (Activation-aware Weight Quantization) is \"input-aware.\" It identifies which weights are the most \"salient\" based on the actual activation values seen during a small calibration run. By preserving only these important weights (usually 1%) in higher precision and quantizing the rest, AWQ achieves better perplexity than GPTQ, especially for smaller models or more aggressive quantization (e.g., 3-bit).\n\n---\n\n## References\n- Dettmers et al. \"QLoRA: Efficient Finetuning of Quantized LLMs\" (2023)\n- Frantar et al. \"GPTQ: Accurate Post-Training Quantization for Generative Pre-trained Transformers\" (2022)\n- Lin et al. \"AWQ: Activation-aware Weight Quantization for LLM Compression and Acceleration\" (2023)\n\n---\n\n*Next: [Training Reasoning Models: RLVR and GRPO](08-rlvr-and-reasoning-models.md)*\n", "content_zh": "# 量化深入理解\n\n## 核心权衡\n\n量化把 FP16/BF16 权重或激活转换为更低精度表示，减少显存、带宽和成本，但可能损失质量或引入延迟。需要在目标模型、硬件、任务和并发下做基准。\n\n## 方法\n\nNF4 面向近似正态分布权重，常用于 QLoRA；AWQ 关注激活敏感权重；FP8 在现代 GPU 和多节点服务中提供速度与精度折中。
