section_id": "01-foundations", "section_label": "01 · 基础知识", "label": "03 attention mechanisms", "title_zh": "Attention 机制", "summary": "掌握 Q/K/V、缩放点积、Causal Mask、MHA、MQA、GQA、FlashAttention 和 Prefill/Decode 的区别，理解它们对推理服务的影响。", "detail": "", "content": "# Attention Mechanisms\n\nAttention is the core innovation that enables transformers. This chapter covers the mathematical foundations, variants, and optimizations that are essential for system design and interviews.\n\n## Table of Contents\n\n- [Attention Fundamentals](#attention-fundamentals)\n- [Scaled Dot-Product Attention](#scaled-dot-product-attention)\n- [Multi-Head Attention](#multi-head-attention)\n- [Attention Patterns](#attention-patterns)\n- [Efficient Attention Variants](#efficient-attention-variants)\n- [Flash Attention (v2 & v3)](#flash-attention)\n- [Multi-head Latent Attention (MLA)](#multi-head-latent-attention-mla)\n- [KV Cache Optimizations & Context Caching](#kv-cache-optimizations)\n- [Practical Implications](#practical-implications)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## Attention Fundamentals\n\n### The Core Idea\n\nAttention allows each position in a sequence to gather information from all other positions. Unlike recurrence (which passes information step by step), attention creates direct connections.\n\n**Mental model for distributed systems engineers:**\n- RNN: Message passing along a chain\n- Attention: Pub/sub where every node can query every other node\n\n### Query, Key, Value Framework\n\nAttention uses three projections of the input:\n\n| Component | Role | Analogy |\n|-----------|------|---------|\n| Query (Q) | What am I looking for? | Search query |\n| Key (K) | What do I contain? | Document index |\n| Value (V) | What do I contribute? | Document content |\n\n```python\n# Input: x of shape [batch, seq_len, d_model]\n\nQ = x @ W_q  # [batch, seq_len, d_k]\nK = x @ W_k  # [batch, seq_len, d_k]\nV = x @ W_v  # [batch, seq_len, d_v]\n```\n\n---\n\n## Scaled Dot-Product Attention\n\nThe fundamental attention operation:\n\n```python\ndef scaled_dot_product_attention(Q, K, V, mask=None):\n    d_k = Q.shape[-1]\n    \n    # Compute attention scores\n    scores = Q @ K.transpose(-2, -1)  # [batch, seq_len, seq_len]\n    scores = scores / math.sqrt(d_k)  # Scale\n    \n    # Apply mask (for causal attention)\n    if mask is not None:\n        scores = scores.masked_fill(mask == 0, float('-inf'))\n    \n    # Convert to probabilities\n    attention_weights = F.softmax(scores, dim=-1)\n    \n    # Weighted sum of values\n    output = attention_weights @ V\n    \n    return output, attention_weights\n```\n\n### Why Scale by Square Root of d_k?\n\n**Interview favorite**: This question tests numerical intuition.\n\nWithout scaling, dot products grow with dimension:\n- For random unit vectors q and k of dimension d\n- E[q . k] = 0, but Var[q . k] = d\n- Standard deviation = sqrt(d)\n\nWhen d is large (512 or more), dot products can be very large or very small. Softmax on large values approaches one-hot, causing vanishing gradients.\n\n```python\n# Demonstration\nimport numpy as np\n\nd = 512\nq = np.random.randn(d)\nk = np.random.randn(d)\n\nunscaled = np.dot(q, k)      # Magnitude ~ sqrt(512) ~ 22\nscaled = unscaled / np.sqrt(d)  # Magnitude ~ 1\n```\n\n### Causal Masking\n\nFor autoregressive generation, each position can only attend to previous positions:\n\n```python\ndef create_causal_mask(seq_len):\n    # Lower triangular matrix\n    mask = torch.tril(torch.ones(seq_len, seq_len))\n    return mask\n\n# Example for seq_len=4:\n# [[1, 0, 0, 0],\n#  [1, 1, 0, 0],\n#  [1, 1, 1, 0],\n#  [1, 1, 1, 1]]\n```\n\nPositions with mask=0 get score of negative infinity, becoming 0 after softmax.\n\n---\n\n## Multi-Head Attention\n\nInstead of one attention function, use multiple \"heads\" that attend to different aspects:\n\n```python\nclass MultiHeadAttention(nn.Module):\n    def __init__(self, d_model, num_heads):\n        super().__init__()\n        self.num_heads = num_heads\n        self.d_k = d_model // num_heads\n        \n        self.W_q = nn.Linear(d_model, d_model)\n        self.W_k = nn.Linear(d_model, d_model)\n        self.W_v = nn.Linear(d_model, d_model)\n        self.W_o = nn.Linear(d_model, d_model)\n    \n    def forward(self, x, mask=None):\n        batch_size, seq_len, d_model = x.shape\n        \n        # Project to Q, K, V\n        Q = self.W_q(x)  # [batch, seq_len, d_model]\n        K = self.W_k(x)\n        V = self.W_v(x)\n        \n        # Reshape to multiple heads\n        Q = Q.view(batch_size, seq_len, self.num_heads, self.d_k).transpose(1, 2)\n        K = K.view(batch_size, seq_len, self.num_heads, self.d_k).transpose(1, 2)\n        V = V.view(batch_size, seq_len, self.num_heads, self.d_k).transpose(1, 2)\n        # Now: [batch, num_heads, seq_len, d_k]\n        \n        # Attention per head\n        attn_output, _ = scaled_dot_product_attention(Q, K, V, mask)\n        \n        # Concatenate heads\n        attn_output = attn_output.transpose(1, 2).contiguous()\n        attn_output = attn_output.view(batch_size, seq_len, d_model)\n        \n        # Final projection\n        output = self.W_o(attn_output)\n        return output\n```\n\n**Why multiple heads?**\n1. Different heads learn different patterns (syntax, semantics, coreference)\n2. Provides representational diversity (ensemble effect)\n3. Enables parallel computation across heads\n\n### Head Count Patterns\n\n| Model | d_model | Heads | d_k per head |\n|-------|---------|-------|--------------|\n| BERT-base | 768 | 12 | 64 |\n| GPT-2 | 768 | 12 | 64 |\n| GPT-3 175B | 12288 | 96 | 128 |\n| Llama 2 70B | 8192 | 64 | 128 |\n\nThe d_k of 64 or 128 is remarkably consistent across model sizes.\n\n---\n\n## Attention Patterns\n\n### What Attention Learns\n\nDifferent heads specialize in different patterns:\n\n| Pattern Type | What It Captures | Example |\n|--------------|------------------|---------|\n| Positional | Adjacent tokens | Next/previous word |\n| Syntactic | Grammatical relations | Subject-verb |\n| Semantic | Meaning relations | Coreference |\n| Delimiter | Punctuation, structure | Section boundaries |\n| Rare | Infrequent patterns | Rare word copying |\n\n### Visualizing Attention\n\nAttention weights can be visualized as heatmaps showing which positions attend to which:\n\n```\nQuery positions (rows) vs Key positions (columns)\n\n\"The cat sat on the mat\"\n\n         The  cat  sat  on   the  mat\nThe     [□    ○    ○    ○    ○    ○ ]\ncat     [●    □    ○    ○    ○    ○ ]\nsat     [○    ●    □    ○    ○    ○ ]\non      [○    ○    ●    □    ○    ○ ]\nthe     [○    ○    ○    ○    □    ○ ]\nmat     [○    ●    ○    ●    ●    □ ]\n\n● = high attention, ○ = low attention\n```\n\n\"mat\" attends strongly to \"cat\" (semantic), \"on\" (syntactic), and \"the\" (determiner).\n\n---\n\n## Efficient Attention Variants\n\nStandard attention is O(n^2) in sequence length. Many variants reduce this:\n\n### Sparse Attention\n\nAttend only to a subset of positions rather than all:\n\n| Variant | Pattern | Complexity | Example |\n|---------|---------|------------|---------|\n| Local | Window around each position | O(n * w) | Longformer |\n| Strided | Every k-th position | O(n^2 / k) | Sparse Transformer |\n| Global | Special tokens attend everywhere | O(n * g) | Longformer, BigBird |\n| Block | Block-diagonal attention | O(n * b) | BigBird |\n\n**Longformer pattern:**\n```\nLocal window + Global tokens\n\n[G] [L] [L] [L] [L] [G] [L] [L] [L] [L]\n\nG: Global tokens (attend to/from all)\nL: Local tokens (attend within window)\n```\n\n### Linear Attention\n\nReplace softmax with linearizable alternatives:\n\n```python\n# Standard attention (quadratic)\nattention = softmax(Q @ K.T) @ V\n\n# Linear attention approximation\nattention = (Q @ (K.T @ V))  # Associativity trick\n```\n\n**Variants:**\n- Performer: Random feature approximation\n- Linear Transformer: elu(Q) @ (elu(K).T @ V)\n\n**Tradeoff:** Faster but quality degrades, especially for tasks requiring precise attention.\n\n### Complexity Comparison\n\n| Method | Time | Space | Quality | Notes |\n|--------|------|-------|---------|-------|\n| Standard | O(n^2) | O(n^2) | Best | Baseline |\n| Sparse (Longformer) | O(n) | O(n) | Near best | For long docs |\n| Linear (Performer) | O(n) | O(n) | Degraded | Best for very long |\n| Flash Attention | O(n^2) | O(n) | Best | Best of both |\n\n---\n\n## Flash Attention\n\nFlash Attention is the state-of-the-art implementation that achieves O(n) memory while computing exact attention.\n\n### The Problem It Solves\n\nStandard attention requires materializing the n x n attention matrix:\n- For 8K context: 64M floats = 256 MB per layer per head\n- For 100K context: 10B floats = 40 GB per layer per head\n\nThis memory requirement limits batch sizes and context lengths.\n\n### How It Works\n\nFlash Attention uses tiling and recomputation to avoid storing the full attention matrix:\n\n```\nStandard: Q, K -> Attention Matrix (n x n) -> Output\nFlash:    Q, K -> Tiles (block_size x block_size) -> Incremental Output\n```\n\n**Key ideas:**\n1. Process attention in blocks that fit in SRAM\n2. Never materialize full attention matrix in HBM\n3. Recompute attention during backward pass (faster than loading from HBM)\n\n### Performance Impact\n\n### FlashAttention-2 (Work Partitioning)\nOptimized for A100/H100 by improving parallelism across heads and sequence length.\n\n### FlashAttention-3 (FP8 & H100 Optimization)\n**The current standard for H100/B200 clusters:**\n- **Asynchronous Execution**: Overlaps GEMM (matrix mult) and softmax operations using TMA (Tensor Memory Accelerator) on H100.\n- **FP8 Support**: Native support for FP8 precision, doubling throughput compared to FP16 while maintaining attention accuracy via stochastic rounding.\n- **Speedup**: ~1.5x-2.0x faster than FlashAttention-2 for long context prefill.\n\n---\n\n## Multi-head Latent Attention (MLA)\n\nIntroduced by DeepSeek (V2/V3), **MLA is the modern alternative to GQA** for extreme KV cache pressure.\n\nInstead of just grouping heads, MLA compresses the Key and Value vectors into a **low-dimensional latent space** before storing them in the cache.\n\n```\nQuery (Up-projected) ────────┐\n                             ▼\nKey, Value (Down-projected) ─▶ [Low-dim Latent Cache] ─▶ [Output]\n                             ▲\n                             └─ Projection Matrices\n```\n\n| Metric | MHA | GQA | MLA (Dec 2025) |\n|--------|-----|-----|----------------|\n| KV Cache Size | 100% | 12.5% | **~5%** |\n| Quality | Baseline | Near-Baseline | **Superior to GQA** |\n| Latency | Baseline | Faster | **Fastest (Reduced I/O)** |\n\n**Why MLA wins**: It uses \"Decoupled Rotary Positional Embeddings\" which allow the compressed latent KV to be reused without decoding, saving massive memory bandwidth during long-context generation.\n\n---\n\n## KV Cache Optimizations & Context Caching\n\n### Context Caching (System-level)\nAPI providers (OpenAI, Gemini, Anthropic) now offer **Context Caching**. \n- **How it works**: Pre-computes and stores the KV tensors for a long \"prefix\" (e.g., a 100k token law book).\n- **Benefit**: Reduces TTFT (Time to First Token) by 90% and cost by 50-90% for repeated prefixes.\n\n### Sliding Window Attention (SWA)\nUsed in Mistral/Gemma models to limit the attention depth to a fixed window (e.g., 4096 tokens), preventing the KV cache from growing indefinitely.\n\n### Multi-Query Attention (MQA)\n\nShare a single K and V across all query heads:\n\n```python\n# Standard MHA\nQ: [batch, num_heads, seq, d_k]  # 32 heads\nK: [batch, num_heads, seq, d_k]  # 32 separate K\nV: [batch, num_heads, seq, d_k]  # 32 separate V\n\n# MQA\nQ: [batch, num_heads, seq, d_k]  # 32 heads\nK: [batch, 1, seq, d_k]          # 1 shared K\nV: [batch, 1, seq, d_k]          # 1 shared V\n```\n\n**Effect:** 32x reduction in KV cache size, some quality loss.\n\n### Grouped-Query Attention (GQA)\n\nShare K and V across groups of query heads:\n\n```python\n# GQA with 8 KV heads for 64 query heads (8:1 ratio)\nQ: [batch, 64, seq, d_k]  # 64 query heads\nK: [batch, 8, seq, d_k]   # 8 KV heads\nV: [batch, 8, seq, d_k]   # 8 KV heads\n\n# Each KV head serves 8 query heads\n```\n\n**Effect:** 8x KV cache reduction with minimal quality loss.\n\n**Models using GQA:**\n- Llama 2 70B: 8 KV heads for 64 query heads\n- Mistral 7B: 8 KV heads for 32 query heads\n- Gemma: Various configurations\n\n### Comparison\n\n| Attention | KV Cache | Quality | Models |\n|-----------|----------|---------|--------|\n| MHA | Full | Best | GPT-3 |\n| GQA | 1/8 typical | Near best | Llama 2, Mistral |\n| MQA | 1/n_heads | Reduced | PaLM, Falcon |\n\n---\n\n## Practical Implications\n\n### For System Design\n\n1. **Batch size vs context tradeoff:**\n   - Total GPU memory = Model + KV cache * batch_size\n   - Longer contexts mean smaller batches\n   - GQA models can serve more concurrent requests\n\n2. **Latency budget allocation:**\n   - Attention is O(n^2) compute, O(n) with Flash\n   - Prefill (processing prompt) scales with prompt length\n   - Decode (generating) scales with generated + prompt length\n\n3. **Memory bandwidth bottleneck:**\n   - Generation is often memory-bound\n   - Loading KV cache for each token dominates\n   - Larger batches amortize this cost\n\n### Prefill vs Decode\n\n| Phase | Compute Pattern | Bottleneck |\n|-------|-----------------|------------|\n| Prefill | Process all input tokens | Compute (GPU cores) |\n| Decode | Generate one token at a time | Memory (bandwidth) |\n\nThis is why TTFT (time to first token) and TPS (tokens per second) are measured separately.\n\n### Context Length Scaling\n\n| Context | Attention Compute | KV Cache (Llama 70B) |\n|---------|-------------------|---------------------|\n| 4K | Baseline | 10.7 GB |\n| 8K | 4x | 21.5 GB |\n| 32K | 64x | 86 GB |\n| 128K | 1024x | 344 GB |\n\nLong context requires:\n- Flash Attention (memory efficient)\n- GQA or MQA (smaller KV cache)\n- Potentially model parallelism\n\n---\n\n## Interview Questions\n\n### Q: Explain the attention mechanism and why it scales quadratically.\n\n**Strong answer:**\nAttention computes pairwise interactions between all positions. For n positions:\n\n1. Q @ K^T produces an n x n matrix of scores\n2. Each attention score is a dot product of a query and key\n3. Total: n^2 dot products\n\nThis is quadratic in sequence length. For 8K tokens, that is 64 million pairwise scores per layer per head. For 128K tokens, it is 16 billion.\n\nThe quadratic scaling limits context length. Solutions include:\n- Flash Attention: O(n^2) compute but O(n) memory\n- Sparse attention: O(n) by attending to subsets\n- Linear attention: O(n) approximations\n\n### Q: What is the KV cache and why is it critical for serving?\n\n**Strong answer:**\nDuring autoregressive generation, we produce one token at a time. Without caching, each new token would require recomputing K and V for all previous positions.\n\nThe KV cache stores K and V tensors from previous positions. On each new token:\n1. Compute Q, K, V only for the new position\n2. Append new K, V to cache\n3. Attend to full cached K, V\n\nThis reduces per-token complexity from O(n) to O(1) for projection computation.\n\nThe cost is memory: KV cache scales linearly with sequence length. For Llama 70B at 8K context, it is about 21 GB per request. This directly limits batch size and throughput.\n\nGQA and MQA reduce this by sharing K, V across query heads.\n\n### Q: Compare MHA, GQA, and MQA.\n\n**Strong answer:**\n| Variant | K,V heads | KV Cache | Quality | Use Case |\n|---------|-----------|----------|---------|----------|\n| MHA | Equal to Q heads | Full | Best | Training, quality-critical |\n| GQA | Fewer than Q heads | Reduced | Near MHA | Production serving |\n| MQA | 1 | Minimal | Reduced | Memory-constrained |\n\nMHA: Each query head has its own K and V. Best quality but largest KV cache.\n\nGQA: Groups of query heads share K and V. Llama 2 uses 8 KV heads for 64 query heads (8:1 ratio). 8x smaller cache with minimal quality loss.\n\nMQA: All query heads share one K and V. Maximum memory savings but measurable quality reduction. Used by PaLM.\n\nFor serving, GQA is the best tradeoff. It enables larger batch sizes (higher throughput) with quality nearly identical to MHA.\n\n### Q: How does Flash Attention achieve O(n) memory?\n\n**Strong answer:**\nStandard attention materializes the full n x n attention matrix in GPU memory. Flash Attention avoids this by:\n\n1. **Tiling:** Process blocks of Q and K that fit in on-chip SRAM\n2. **Online softmax:** Compute softmax incrementally without storing all scores\n3. **Recomputation:** During backward pass, recompute attention rather than loading saved values\n\nThe key insight is that GPU SRAM (20 MB per SM) is 10x faster than HBM (80 GB). By doing more arithmetic in SRAM and fewer HBM reads/writes, Flash Attention is both faster and uses less memory.\n\nThe result is exact attention (not an approximation) with O(n) memory and 2-4x speedup.\n\n---\n\n## References\n\n- Vaswani et al. \"Attention Is All You Need\" (2017)\n- Dao et al. \"FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness\" (2022)\n- Dao \"FlashAttention-2: Faster Attention with Better Parallelism and Work Partitioning\" (2023)\n- Beltagy et al. \"Longformer: The Long-Document Transformer\" (2020)\n- Ainslie et al. \"GQA: Training Generalized Multi-Query Transformer Models\" (2023)\n- Shazeer \"Fast Transformer Decoding: One Write-Head is All You Need\" (MQA, 2019)\n- [Flash Attention Repository](https://github.com/Dao-AILab/flash-attention)\n\n---\n\n*Previous: [Tokenization Deep Dive](02-tokenization-deep-dive.md) | Next: [Transformer Architecture](04-transformer-architecture.md)*\n", "content_zh": "# Attention 机制\n\n## 核心概念\n\nAttention 通过 Query、Key、Value 计算序列中不同位置之间的相关性。Scaled Dot-Product Attention 会除以 √d_k，避免点积过大导致 Softmax 梯度过小；Causal Mask 保证生成 token 不能看到未来内容。\n\n## 效率优化\n\n- Sparse Attention 只连接部分位置，减少长序列计算。\n- Linear Attention 用近似形式降低复杂度，但可能损失表达能力。\n- FlashAttention 通过分块和 IO 优化减少显存读写，通常不改变数学结果。\n- MQA/GQA 共享 Key/Value 头，显著减少 KV Cache 和带宽。\n- Sliding Window Attention 只关注局部窗口，适合局部依赖明显的任务。\n\n## 生产视角\n\n区分 Prefill 和 Decode：Prefill 处理整段输入，计算密集；Decode 逐 token 生成，通常受 KV Cache、内存带宽和批处理影响。面试中应把注意力机制连接到 TTFT、TPS、上下文长度和 GPU 显存，而不只是讲公式。\n", "summary_content": "# 《Attention 机制》中文概要\n\n掌握 Q/K/V、缩放点积、Causal Mask、MHA、MQA、GQA、FlashAttention 和 Prefill/Decode 的区别，理解它们对推理服务的影响。\n"}, {"filename": "01-foundations/04-transformer-architecture.md", "section_id": "01-foundations", "section_label": "01 · 基础知识", "label": "04 transformer architecture", "title_zh": "Transformer 架构", "summary": "从输入 token 到最终 logits 梳理 Transformer 前向过程，并理解 Llama、Mistral、MoE、MLA、Pre-Norm 和 GQA 等现代变体。", "detail": "", "content": "# Transformer Architecture\n\nThis chapter provides a comprehensive view of the complete transformer architecture, bringing together the components from previous chapters into a unified understanding.\n\n## Table of Contents\n\n- [Architecture Overview](#architecture-overview)\n- [Input Processing](#input-processing)\n- [The Transformer Block](#the-transformer-block)\n- [Output Processing](#output-processing)\n- [Modern Architecture Variations (Hybrid MoE, MLA)](#mixture-of-experts-moe--hybrid-architectures)\n- [Untied vs. Tied Embeddings](#untied-vs-tied-embeddings)\n- [Scaling Properties](#scaling-properties)\n- [Architecture Comparison Table](#architecture-comparison-table)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## Architecture Overview\n\nA decoder-only transformer (the architecture used by GPT, Claude, Llama) consists of:\n\n```\n┌─────────────────────────────────────────────────────────────────┐\n│                     Token Embeddings                            │\n│              + Position Embeddings (or RoPE)                    │\n└──────────────────────────┬──────────────────────────────────────┘\n                           │\n                           ▼\n┌─────────────────────────────────────────────────────────────────┐\n│                                                                 │\n│    ┌─────────────────────────────────────────────────────┐      │\n│    │                  Transformer Block                   │      │\n│    │  ┌─────────────────────────────────────────────┐    │      │\n│    │  │              RMSNorm/LayerNorm              │    │      │\n│    │  └───────────────────┬─────────────────────────┘    │      │\n│    │                      ▼                              │      │\n│    │  ┌─────────────────────────────────────────────┐    │      │\n│    │  │         Masked Multi-Head Attention         │    │      │\n│    │  │            (with KV Cache)                  │    │      │\n│    │  └───────────────────┬─────────────────────────┘    │      │\n│    │                      │                              │      │\n│    │                  + Residual                         │      │\n│    │                      │                              │      │\n│    │  ┌─────────────────────────────────────────────┐    │      │\n│    │  │              RMSNorm/LayerNorm              │    │      │\n│    │  └───────────────────┬─────────────────────────┘    │      │\n│    │                      ▼                              │      │\n│    │  ┌─────────────────────────────────────────────┐    │      │\n│    │  │             Feed-Forward Network            │    │      │\n│    │  │               (SwiGLU/GELU)                 │    │      │\n│    │  └───────────────────┬─────────────────────────┘    │      │\n│    │                      │                              │      │\n│    │                  + Residual                         │      │\n│    └──────────────────────┴──────────────────────────────┘      │\n│                           │                                     │\n│                    Repeat × N layers                            │\n└───────────────────────────┬─────────────────────────────────────┘\n                            │\n                            ▼\n┌─────────────────────────────────────────────────────────────────┐\n│                      Output RMSNorm                             │\n└───────────────────────────┬─────────────────────────────────────┘\n                            │\n                            ▼\n┌─────────────────────────────────────────────────────────────────┐\n│                   Language Model Head                           │\n│              (Linear: hidden_dim → vocab_size)                  │\n└───────────────────────────┬─────────────────────────────────────┘\n                            │\n                            ▼\n                         Logits\n```\n\n---\n\n## Input Processing\n\n### Token Embedding\n\nConvert token IDs to dense vectors:\n\n```python\nclass TokenEmbedding(nn.Module):\n    def __init__(self, vocab_size, d_model):\n        super().__init__()\n        self.embedding = nn.Embedding(vocab_size, d_model)\n    \n    def forward(self, token_ids):\n        return self.embedding(token_ids)\n```\n\n**Dimensions:**\n- Input: [batch_size, seq_len] token IDs\n- Output: [batch_size, seq_len, d_model] embeddings\n\n### Position Information\n\nPosition is incorporated via one of:\n\n**1. Rotary Position Embedding (RoPE):**\nApplied within attention, not added to embeddings:\n```python\ndef apply_rope(q, k, positions):\n    # Rotate q and k vectors based on position\n    freqs = compute_frequencies(positions)\n    q_rotated = rotate_embeddings(q, freqs)\n    k_rotated = rotate_embeddings(k, freqs)\n    return q_rotated, k_rotated\n```\n\n**2. Learned Position Embeddings:**\nAdded directly to token embeddings:\n```python\nposition_embeddings = nn.Embedding(max_seq_len, d_model)\nx = token_embeddings + position_embeddings(positions)\n```\n\n**Modern models (Llama, Mistral, GPT-4) use RoPE** for better length generalization.\n\n---\n\n## The Transformer Block\n\n### Pre-Norm Structure\n\nModern transformers use pre-normalization:\n\n```python\nclass TransformerBlock(nn.Module):\n    def __init__(self, config):\n        super().__init__()\n        self.attn_norm = RMSNorm(config.d_model)\n        self.attn = GroupedQueryAttention(\n            d_model=config.d_model,\n            n_heads=config.n_heads,\n            n_kv_heads=config.n_kv_heads\n        )\n        self.ff_norm = RMSNorm(config.d_model)\n        self.ff = SwiGLUFFN(\n            d_model=config.d_model,\n            d_ff=config.d_ff\n        )\n    \n    def forward(self, x, mask=None, kv_cache=None):\n        # Attention with residual\n        h = x + self.attn(self.attn_norm(x), mask, kv_cache)\n        \n        # FFN with residual\n        out = h + self.ff(self.ff_norm(h))\n        \n        return out\n```\n\n### Attention Component\n\n```python\nclass GroupedQueryAttention(nn.Module):\n    def __init__(self, d_model, n_heads, n_kv_heads):\n        super().__init__()\n        self.n_heads = n_heads\n        self.n_kv_heads = n_kv_heads\n        self.head_dim = d_model // n_heads\n        \n        self.q_proj = nn.Linear(d_model, n_heads * self.head_dim)\n        self.k_proj = nn.Linear(d_model, n_kv_heads * self.head_dim)\n        self.v_proj = nn.Linear(d_model, n_kv_heads * self.head_dim)\n        self.o_proj = nn.Linear(n_heads * self.head_dim, d_model)\n    \n    def forward(self, x, mask, kv_cache):\n        B, T, D = x.shape\n        \n        # Project\n        q = self.q_proj(x).view(B, T, self.n_heads, self.head_dim)\n        k = self.k_proj(x).view(B, T, self.n_kv_heads, self.head_dim)\n        v = self.v_proj(x).view(B, T, self.n_kv_heads, self.head_dim)\n        \n        # Apply RoPE\n        q, k = apply_rope(q, k, positions)\n        \n        # Update KV cache\n        if kv_cache is not None:\n            k = torch.cat([kv_cache.k, k], dim=1)\n            v = torch.cat([kv_cache.v, v], dim=1)\n            kv_cache.update(k, v)\n        \n        # Repeat KV heads for GQA\n        k = k.repeat_interleave(self.n_heads // self.n_kv_heads, dim=2)\n        v = v.repeat_interleave(self.n_heads // self.n_kv_heads, dim=2)\n        \n        # Attention (using Flash Attention in practice)\n        attn_out = flash_attention(q, k, v, mask)\n        \n        # Output projection\n        out = self.o_proj(attn_out.view(B, T, -1))\n        return out\n```\n\n### Feed-Forward Network\n\n```python\nclass SwiGLUFFN(nn.Module):\n    def __init__(self, d_model, d_ff):\n        super().__init__()\n        # SwiGLU has 3 projections instead of 2\n        self.gate_proj = nn.Linear(d_model, d_ff, bias=False)\n        self.up_proj = nn.Linear(d_model, d_ff, bias=False)\n        self.down_proj = nn.Linear(d_ff, d_model, bias=False)\n    \n    def forward(self, x):\n        gate = F.silu(self.gate_proj(x))  # SiLU = Swish\n        up = self.up_proj(x)\n        return self.down_proj(gate * up)\n```\n\n**FFN hidden dimension** is typically 2.7x the model dimension for SwiGLU (vs 4x for standard FFN with GELU).\n\n### RMSNorm\n\n```python\nclass RMSNorm(nn.Module):\n    def __init__(self, d_model, eps=1e-6):\n        super().__init__()\n        self.weight = nn.Parameter(torch.ones(d_model))\n        self.eps = eps\n    \n    def forward(self, x):\n        rms = torch.sqrt(torch.mean(x ** 2, dim=-1, keepdim=True) + self.eps)\n        return self.weight * (x / rms)\n```\n\nSimpler and faster than LayerNorm since it skips mean centering.\n\n---\n\n## Output Processing\n\n### Final Normalization\n\nApply RMSNorm after the last transformer block:\n\n```python\nhidden_states = self.output_norm(hidden_states)\n```\n\n### Language Model Head\n\nProject to vocabulary size:\n\n```python\nclass LMHead(nn.Module):\n    def __init__(self, d_model, vocab_size):\n        super().__init__()\n        self.linear = nn.Linear(d_model, vocab_size, bias=False)\n    \n    def forward(self, x):\n        return self.linear(x)  # Returns logits\n```\n\n## Untied vs. Tied Embeddings\n\n**Standard Pattern (GPT-3, Llama 2):** Weight Tying\n- Output head shares weights with input embeddings.\n- **Pro**: Saves memory (vocab_size * hidden_dim).\n- **Con**: Forces input and output latent spaces to be identical, which can be suboptimal.\n\n**2025 Frontier Pattern (Llama 3/4, GPT-5.2):** Untied Embeddings\n- Output head has its own weights.\n- **Why?**: Larger vocabularies (128k+) make the embedding table a significant portion of the model. Untying allows the output head to specialize in \"predictive logic\" while input embeddings focus on \"semantic understanding.\"\n- **System Impact**: Increases parameter count but often improves perplexity for multilingual and code tasks.\n\n### Getting Predictions\n\n```python\n# During generation\nlogits = lm_head(hidden_states[:, -1, :])  # Last position only\nnext_token = sample(logits)\n\n# During training\nlogits = lm_head(hidden_states)  # All positions\nloss = cross_entropy(logits, targets)\n```\n\n---\n\n## Modern Architecture Variations\n\n### Llama 2/3 Architecture\n\n| Component | Implementation |\n|-----------|----------------|\n| Attention | Grouped Query Attention (GQA) |\n| Position | Rotary Position Embedding (RoPE) |\n| Normalization | RMSNorm (pre-norm) |\n| Activation | SwiGLU |\n| Bias | No bias in linear layers |\n\n### Mistral Architecture\n\nSame as Llama but adds:\n- **Sliding Window Attention:** Each layer only attends to 4K tokens\n- Still achieves effective 32K+ context via stacking\n\n### Mixture of Experts (MoE) & Hybrid Architectures\n\nState-of-the-art models often use **Hybrid MoE/Dense** blocks:\n- **Periodic Dense Layers**: Every few MoE layers, a dense layer is added to ensure \"global\" knowledge is shared across all experts.\n- **Expert Parallelism**: Distributing different experts across different GPUs. This makes **inter-node bandwidth** (NVLink/InfiniBand) a primary architecture bottleneck.\n\n### Multi-head Latent Attention (MLA) Integration\nThe standard attention block in [DeepSeek-V3 / V4](03-attention-mechanisms.md#multi-head-latent-attention-mla) and equivalent modern architectures replaces the standard Q/K/V projections with low-rank latent compressions.\n- **Architectural Shift**: The \"KV Cache\" is now a compressed latent representation, changing the memory/compute ratio of the entire transformer block.\n\n### Comparison of Choices\n\n| Choice | Old Approach | Modern Approach | Benefit |\n|--------|--------------|-----------------|---------|\n| Norm | Post-LN | Pre-LN / RMSNorm | Training stability, speed |\n| Position | Sinusoidal/Learned | RoPE | Better extrapolation |\n| Activation | GELU | SwiGLU | Quality (+1% on benchmarks) |\n| Attention | MHA | GQA | 8x smaller KV cache |\n| Bias | With bias | No bias | Fewer parameters, similar quality |\n\n---\n\n## Scaling Properties\n\n### Parameter Counts\n\n| Component | Parameters |\n|-----------|------------|\n| Token embedding | vocab_size * d_model |\n| Per layer Q/K/V | 3 * d_model * d_model (for MHA) |\n| Per layer O proj | d_model * d_model |\n| Per layer FFN | 3 * d_model * d_ff (for SwiGLU) |\n| LM head | d_model * vocab_size (often tied) |\n\n**Approximation for decoder-only:**\n```\nTotal ≈ 12 * n_layers * d_model^2 (for d_ff = 4 * d_model, MHA)\n```\n\n### Compute Requirements\n\n**Training:** FLOPs per token ≈ 6 * parameters (forward + backward)\n\n**Inference:** FLOPs per token ≈ 2 * parameters (forward only)\n\n### Scaling Laws\n\nThe Chinchilla scaling law suggests optimal allocation:\n\n```\nD (data tokens) ≈ 20 * N (parameters)\n```\n\nFor a 70B model, train on ~1.4T tokens for compute-optimal training.\n\n**But:** Many modern models overtrain relative to Chinchilla for better inference efficiency. Llama was trained on 2T+ tokens.\n\n---\n\n## Architecture Comparison Table\n\n| Model | Params | Layers | d_model | Heads | KV Heads | FFN | Context |\n|-------|--------|--------|---------|-------|----------|-----|---------|\n| GPT-3 | 175B | 96 | 12288 | 96 | 96 | GELU | 2K |\n| Llama 2 70B | 70B | 80 | 8192 | 64 | 8 | SwiGLU | 4K |\n| Llama 3 405B| 405B | 126 | 16384 | 128 | 16 | SwiGLU | 128K |\n| DeepSeek V3 | 671B | 128 | 7168 | 128 | MLA | MoE | 128K |\n| Llama 4 (spec)| 1T+ | 140+ | 18432 | 192 | 24 | MoE/H | 1M+ |\n\n*Mistral uses sliding window attention for effective long context.\n\n---\n\n## Interview Questions\n\n### Q: Walk me through the forward pass of a transformer.\n\n**Strong answer:**\nFor a decoder-only model generating text:\n\n1. **Tokenization:** Convert input text to token IDs\n\n2. **Embedding:** Look up token embeddings from the embedding table\n\n3. **For each transformer layer:**\n   - Apply RMSNorm to input\n   - Compute Q, K, V projections\n   - Apply RoPE to Q and K for position\n   - For generation: append new K, V to KV cache\n   - Compute attention (masked, so each position only sees previous)\n   - Project attention output and add residual\n   - Apply RMSNorm\n   - Pass through SwiGLU feed-forward network\n   - Add residual\n\n4. **Output norm:** Apply final RMSNorm\n\n5. **LM head:** Project to vocabulary size to get logits\n\n6. **Sample:** Select next token from logits using temperature/top-p\n\nFor generation, repeat steps 3-6 for each new token, reusing the KV cache from previous positions.\n\n### Q: What is the difference between pre-norm and post-norm?\n\n**Strong answer:**\nThe difference is where layer normalization is applied relative to sublayers (attention, FFN):\n\n**Post-norm (original transformer):**\n```\nx = LayerNorm(x + Sublayer(x))\n```\nNormalize after adding residual.\n\n**Pre-norm (modern transformers):**\n```\nx = x + Sublayer(LayerNorm(x))\n```\nNormalize before the sublayer.\n\nPre-norm is preferred because:\n1. Gradients flow more directly through residual connections\n2. Training is more stable, especially for deep models\n3. Less sensitive to initialization and learning rate\n4. No need for learning rate warmup\n\nThe cost is slightly lower final performance in some benchmarks, but the training stability is worth it for large models.\n\n### Q: Explain GQA and why it matters for serving.\n\n**Strong answer:**\nGrouped Query Attention (GQA) shares Key and Value heads across groups of Query heads.\n\nStandard Multi-Head Attention: 64 query heads, 64 KV heads (1:1)\nGQA: 64 query heads, 8 KV heads (8:1)\n\nImplementation: Each KV head is used by 8 query heads via repetition.\n\n**Why it matters:**\nThe KV cache stores K and V for all positions during generation. For Llama 70B at 8K context:\n- MHA: 2.6 MB/token * 8K = 21 GB per request\n- GQA (8:1): ~2.6 GB per request\n\n8x reduction enables:\n- Larger batch sizes (more concurrent users)\n- Longer contexts\n- Lower GPU memory requirements\n\nQuality impact: Minimal. Research shows GQA achieves 99%+ of MHA quality.\n\n### Q: What changed between GPT-2 and Llama 2?\n\n**Strong answer:**\nKey architecture improvements:\n\n| Component | GPT-2 | Llama 2 |\n|-----------|-------|---------|\n| Norm | Post-LayerNorm | Pre-RMSNorm |\n| Position | Learned absolute | RoPE (rotary) |\n| Activation | GELU | SwiGLU |\n| Attention | MHA | GQA (for 70B) |\n| Bias | Present | Removed |\n\nImpact:\n- RMSNorm: Faster and equally effective\n- RoPE: Better length extrapolation\n- SwiGLU: ~1% quality improvement\n- GQA: 8x smaller KV cache for serving\n- No bias: Fewer parameters, no quality loss\n\nThese changes enable training larger models more stably and serving them more efficiently.\n\n---\n\n## References\n\n- Vaswani et al. \"Attention Is All You Need\" (2017)\n- Touvron et al. \"Llama: Open and Efficient Foundation Language Models\" (2023)\n- Touvron et al. \"Llama 2: Open Foundation and Fine-Tuned Chat Models\" (2023)\n- Zhang and Sennrich. \"Root Mean Square Layer Normalization\" (2019)\n- Shazeer. \"GLU Variants Improve Transformer\" (2020)\n- Su et al. \"RoFormer: Enhanced Transformer with Rotary Position Embedding\" (2021)\n- Jiang et al. \"Mistral 7B\" (2023)\n\n---\n\n*Previous: [Attention Mechanisms](03-attention-mechanisms.md) | Next: [Embeddings and Vector Spaces](05-embeddings-and-vector-spaces.md)*\n", "content_zh": "# Transformer 架构\n\n## 前向过程\n\n输入文本先经过 Token Embedding 和位置表示，依次进入多个 Transformer Block。每个 Block 通常包含 Pre-Norm、Self-Attention、残差连接和 Feed-Forward Network，最后经过归一化和 Language Model Head 得到下一 token 的概率。\n\n## 现代变体\n\nLlama 类模型常使用 Pre-Norm、RoPE、RMSNorm 和 GQA；Mistral 等架构会加入滑动窗口或其他效率优化；MoE 通过专家路由扩大参数规模而控制激活计算；MLA 通过压缩潜在表示降低 KV Cache。\n\n## 系统设计要点\n\n参数数量影响训练和权重显存，序列长度和并发影响 KV Cache，token 生成速度决定在线延迟。解释 GPT-2 到现代模型的变化时，可从归一化、位置编码、注意力头、上下文、训练数据和服务优化几个维度比较。\n", "summary_content": "# 《Transformer 架构》中文概要\n\n从输入 token 到最终 logits 梳理 Transformer 前向过程，并理解 Llama、Mistral、MoE、MLA、Pre-Norm 和 GQA 等现代变体。\n"}, {"filename": "01-foundations/05-embeddings-and-vector-spaces.md", "section_id": "01-foundations", "section_label": "01 · 基础知识", "label": "05 embeddings and vector spaces", "title_zh": "Embedding 与向量空间", "summary": "理解 Embedding、Bi-Encoder、Cross-Encoder、距离度量、Matryoshka、Late Chunking、量化和 Embedding 版本漂移，重点关注 RAG 端到端效果。", "detail": "", "content": "# Embeddings and Vector Spaces\n\nEmbeddings are dense vector representations of text that capture semantic meaning. They are foundational to RAG systems, semantic search, and many AI applications.\n\n## Table of Contents\n\n- [What Are Embeddings](#what-are-embeddings)\n- [Embedding Model Architectures](#embedding-model-architectures)\n- [Training Objectives](#training-objectives)\n- [Distance Metrics](#distance-metrics)\n- [Embedding Model Comparison](#embedding-model-comparison)\n- [Matryoshka and Adaptive Dimensions](#matryoshka-and-adaptive-dimensions)\n- [Late Interaction vs. Late Chunking](#late-chunking-and-interaction)\n- [Binary and Scalar Quantization](#quantization-for-scale)\n- [Practical Considerations (Batching, Caching)](#practical-considerations)\n- [Embedding Drift and Versioning](#embedding-drift-and-versioning)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## What Are Embeddings\n\nEmbeddings map discrete text (words, sentences, documents) to continuous vector spaces where semantic similarity corresponds to geometric proximity.\n\n**Key properties:**\n- Similar meanings are close together\n- Relationships can be encoded as vector operations (king - man + woman = queen)\n- Enable efficient similarity search through approximate nearest neighbor algorithms\n\n**Mental model:**\nThink of embeddings as coordinates in a very high-dimensional space. Dimensionality (512 to 4096) provides expressiveness. Each dimension captures some aspect of meaning, though individual dimensions are not interpretable.\n\n---\n\n## Embedding Model Architectures\n\n### Word Embeddings (Historical)\n\nEarly approaches embedded individual words:\n\n| Model | Year | Approach | Limitation |\n|-------|------|----------|------------|\n| Word2Vec | 2013 | Skip-gram, CBOW | Static: \"bank\" same in all contexts |\n| GloVe | 2014 | Co-occurrence matrix | Static |\n| FastText | 2017 | Subword embeddings | Static, but handles OOV |\n\n**Key limitation:** Same word gets same embedding regardless of context.\n\n### Contextual Embeddings\n\nTransformer-based models produce context-dependent embeddings:\n\n```python\n# Static embedding (Word2Vec)\nembed(\"bank\") = [0.1, 0.3, ...]  # Same vector always\n\n# Contextual embedding (BERT)\nembed(\"river bank\") = [0.1, 0.3, ...]   # Geography sense\nembed(\"bank account\") = [0.5, 0.2, ...]  # Finance sense\n```\n\n### Sentence/Document Embeddings\n\nFor retrieval, we need to embed entire texts:\n\n| Approach | Method | Pros | Cons |\n|----------|--------|------|------|\n| Mean pooling | Average token embeddings | Simple | Loses information |\n| CLS token | Use [CLS] token embedding | Standard for BERT | May not capture full text |\n| Last token | Use final token | Works for decoder models | Position bias |\n| Trained pooling | Learn pooling weights | Better quality | Requires training |\n\nModern embedding models are trained specifically for sentence/document embedding, not just adapted from language models.\n\n### Bi-Encoder Architecture\n\nStandard retrieval embedding architecture:\n\n```\nDocument -> Encoder -> Document Embedding\nQuery    -> Encoder -> Query Embedding\n\nSimilarity = cosine(doc_embedding, query_embedding)\n```\n\n**Properties:**\n- Documents can be pre-computed and indexed\n- Query embedding computed at query time\n- O(1) similarity computation per document (with ANN)\n\n### Cross-Encoder Architecture\n\nAlternative that processes query and document together:\n\n```\n[Query, Document] -> Encoder -> Relevance Score\n```\n\n**Properties:**\n- More accurate (sees both together)\n- Cannot pre-compute: O(n) inference for n documents\n- Used for reranking, not retrieval\n\n---\n\n## Training Objectives\n\n### Contrastive Learning\n\nMost modern embedding models use contrastive learning:\n\n```python\n# Simplified contrastive loss\ndef contrastive_loss(anchor, positive, negatives):\n    pos_sim = cosine_similarity(anchor, positive)\n    neg_sims = [cosine_similarity(anchor, neg) for neg in negatives]\n    \n    # Push positive close, negatives far\n    loss = -log(exp(pos_sim / tau) / \n                (exp(pos_sim / tau) + sum(exp(neg_sim / tau) for neg_sim in neg_sims)))\n    return loss\n```\n\n**Key factors:**\n- **Positive pairs:** Semantically similar texts (parallel sentences, query-document pairs)\n- **Hard negatives:** Similar but not matching texts (BM25 retrieved non-relevant)\n- **In-batch negatives:** Other batch items as negatives (efficient)\n\n### Training Data Sources\n\n| Source | Positive Pairs | Quality | Scale |\n|--------|---------------|---------|-------|\n| Parallel sentences | Translation pairs | High | Medium |\n| Query-document | Search logs | High | Medium |\n| Title-body | Document structure | Medium | Large |\n| Paraphrase | NLI datasets | High | Small |\n| Generated | LLM creates pairs | Variable | Large |\n\n### Instruction-Tuned Embeddings\n\nRecent models accept task instructions:\n\n```python\n# Instruction-tuned (e.g., E5, BGE)\nquery_embedding = embed(\"Represent this query for retrieval: What is RAG?\")\ndoc_embedding = embed(\"Represent this document for retrieval: RAG combines...\")\n```\n\nThis improves performance by specifying the intended use.\n\n---\n\n## Distance Metrics\n\n### Cosine Similarity\n\nMost common for text embeddings:\n\n```python\ndef cosine_similarity(a, b):\n    return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))\n```\n\n**Properties:**\n- Range: [-1, 1] (for normalized vectors, [0, 1] if positive)\n- Measures angle, not magnitude\n- Invariant to vector length\n\n**When to use:** Default choice for text embeddings.\n\n### Dot Product\n\n```python\ndef dot_product(a, b):\n    return np.dot(a, b)\n```\n\n**Properties:**\n- Magnitude matters\n- Unbounded range\n- Equivalent to cosine for normalized vectors\n\n**When to use:** When embeddings are already normalized, or magnitude is meaningful.\n\n### Euclidean Distance\n\n```python\ndef euclidean_distance(a, b):\n    return np.linalg.norm(a - b)\n```\n\n**Properties:**\n- Measures absolute difference\n- Affected by magnitude\n- For normalized vectors: sqrt(2 - 2 * cosine)\n\n**When to use:** Rarely for text; more common for image embeddings.\n\n### Metric Selection\n\n| Metric | Vector Databases | Common Use |\n|--------|------------------|------------|\n| Cosine | Pinecone, Qdrant, Weaviate | Text embeddings |\n| Dot Product | All major DBs | Normalized embeddings |\n| Euclidean | All major DBs | Image, multimodal |\n\n---\n\n## Embedding Model Comparison\n\n### Current Top Models (December 2025)\n\n| Model | Dimensions | Max Tokens | MTEB Retrieval | Cost / 1M tokens |\n|-------|------------|------------|----------------|------------------|\n| OpenAI text-embedding-4 | 3072 | 16k | 68.2 | $0.10 |\n| Voyage-4 | 1024 | 128k | 70.1 | $0.05 |\n| Cohere embed-v3.5 | 1024 | 512 | 67.5 | $0.10 |\n| Google text-embedding-005 | 768 | 8k | 67.2 | $0.02 |\n\n*MTEB scores are approximate and vary by benchmark subset. Always verify current values. The English leaderboard is currently led by Gemini Embedding 001 (68.32); the multilingual leaderboard by Qwen3-Embedding-8B (70.58) and Llama-Embed-Nemotron-8B.*\n\n### Open Source Models\n\n| Model | Dimensions | Max Tokens | MTEB Retrieval | Notes |\n|-------|------------|------------|----------------|-------|\n| BGE-large-en-v1.5 | 1024 | 512 | 63.9 | Strong open model |\n| E5-large-v2 | 1024 | 512 | 62.4 | Instruction-tuned |\n| GTE-large | 1024 | 512 | 63.1 | Alibaba |\n| Nomic-embed-text-v1.5 | 768 | 8192 | 62.3 | Long context, open |\n\n### Selection Criteria\n\n| Factor | Considerations |\n|--------|----------------|\n| Quality (MTEB) | Higher is better, but task-specific evaluation matters more |\n| Dimensions | Higher = more expressive but more storage/compute |\n| Max tokens | Must accommodate your document sizes |\n| Cost | API vs self-hosting tradeoffs |\n| Latency | Embedding generation time |\n| Multilingual | If serving non-English content |\n\n---\n\n## Matryoshka and Adaptive Dimensions\n\n### The Idea\n\nMatryoshka Representation Learning (MRL) trains embeddings such that prefixes of the full embedding are also meaningful:\n\n```python\nfull_embedding = model.encode(text)  # 1024 dimensions\n\n# All these are valid embeddings with decreasing quality\ndim_512 = full_embedding[:512]  \ndim_256 = full_embedding[:256]\ndim_128 = full_embedding[:128]\ndim_64 = full_embedding[:64]\n```\n\n### Why It Matters\n\n| Use Case | Dimension | Tradeoff |\n|----------|-----------|----------|\n| Full Retrieval | 1024-3072 | Peak Accuracy |\n| **Two-Stage Retrieval**| 128 -> 1024 | **Production standard**: retrieve 1000 with 128-d, refine top 100 with 1024-d. |\n| Cost-sensitive | 256 | 12x storage savings, <2% MRR loss |\n| Edge / Mobile | 64 | Maximum speed, handles simple intent |\n\n### Models with Matryoshka Support\n\n- OpenAI text-embedding-3-* (native)\n- Nomic-embed-text-v1.5\n- Several fine-tuned models\n\n### Using Matryoshka Embeddings\n\n```python\nfrom openai import OpenAI\nclient = OpenAI()\n\n# Request smaller dimensions\nresponse = client.embeddings.create(\n    model=\"text-embedding-3-large\",\n    input=\"Your text here\",\n    dimensions=256  # Request 256 instead of full 3072\n)\n```\n\n---\n\n### Late Chunking (The 2025 Shift)\n\n**Traditional Chunking:**\n`Document -> Split into chunks -> Embed chunks individually`\n- **Issue**: Chunk 2 loses the context from Chunk 1.\n\n**Late Chunking (introduced by Jina AI/Voyage):**\n`Full Document -> Model Encoder -> Token-level Embeddings -> Pool into chunk boundaries`\n- **Benefit**: Each chunk's embedding contains information from the **entire document** because the transformer's self-attention was applied to the full sequence before pooling.\n- **Requirement**: A model with long-context support (at least 8k+ tokens).\n\n---\n\n## Quantization for Scale\n\nTo handle billions of vectors, **Binary** and **Scalar (Int8)** quantization are now standard.\n\n| Type | Data Size | Memory Savings | Quality Loss | Supported By |\n|------|-----------|----------------|--------------|--------------|\n| Float32 | 4 bytes/dim | Baseline | 0% | All |\n| Int8 | 1 byte/dim | 4x | <1% | Cohere, BGE |\n| **Binary** | **1 bit/dim** | **32x** | ~5-10% | Cohere v3, v4 |\n\n**Binary Quantization Pattern:**\n1. Retrieve top 1000 using Binary embeddings (extreme speed).\n2. Rerank top 50 using Float32 or a Cross-Encoder (peak accuracy).\n\n### When to Use ColBERT\n\n- Retrieval precision is critical\n- Can afford storage overhead\n- Query latency budget > 50ms\n\n### Implementation\n\n```python\n# Using RAGatouille\nfrom ragatouille import RAGPretrainedModel\n\nmodel = RAGPretrainedModel.from_pretrained(\"colbert-ir/colbertv2.0\")\n\n# Index documents\nmodel.index(\n    collection=documents,\n    index_name=\"my_index\"\n)\n\n# Search\nresults = model.search(query=\"What is RAG?\", k=10)\n```\n\n---\n\n## Practical Considerations\n\n### Batch Processing\n\n```python\n# Inefficient: one API call per document\nembeddings = [embed(doc) for doc in documents]\n\n# Efficient: batch API calls\nbatch_size = 100\nembeddings = []\nfor i in range(0, len(documents), batch_size):\n    batch = documents[i:i + batch_size]\n    batch_embeddings = embed_batch(batch)\n    embeddings.extend(batch_embeddings)\n```\n\n### Chunking for Embeddings\n\nLong documents must be chunked before embedding:\n\n```python\ndef embed_document(document: str, max_tokens: int = 512) -> list[np.array]:\n    chunks = chunk_document(document, max_tokens=max_tokens)\n    embeddings = []\n    for chunk in chunks:\n        embedding = embed(chunk)\n        embeddings.append(embedding)\n    return embeddings\n```\n\n**Considerations:**\n- Chunk size should be less than model max tokens\n- Overlap helps preserve context across chunk boundaries\n- Store chunk-to-document mapping for retrieval\n\n### Normalization\n\nMany systems expect normalized embeddings:\n\n```python\ndef normalize(embedding):\n    norm = np.linalg.norm(embedding)\n    return embedding / norm\n\n# Cosine similarity of normalized vectors = dot product\nsimilarity = np.dot(normalize(a), normalize(b))\n```\n\nMost vector databases and embedding APIs handle normalization, but verify.\n\n### Caching\n\nEmbedding computation is expensive. Cache aggressively:\n\n```python\nimport hashlib\n\ndef get_embedding(text: str, cache: dict) -> np.array:\n    key = hashlib.sha256(text.encode()).hexdigest()\n    \n    if key in cache:\n        return cache[key]\n    \n    embedding = compute_embedding(text)\n    cache[key] = embedding\n    return embedding\n```\n\n---\n\n## Embedding Drift and Versioning\n\n### The Problem\n\nEmbeddings are not comparable across:\n- Different models\n- Different versions of the same model\n- Sometimes different API calls (some APIs have non-determinism)\n\n### Consequences\n\nIf you update your embedding model:\n- All existing embeddings become incompatible\n- Must re-embed entire corpus\n- Search results will be inconsistent during migration\n\n### Mitigation Strategies\n\n**1. Version your embeddings:**\n```python\nembedding_metadata = {\n    \"model\": \"text-embedding-3-large\",\n    \"model_version\": \"2024-01\",\n    \"dimensions\": 3072,\n    \"created_at\": \"2025-12-16\"\n}\n```\n\n**2. Plan for re-embedding:**\n- Estimate cost and time for full re-embed\n- Build pipelines that can run in background\n- Test new embeddings before switching\n\n**3. Blue-green deployment:**\n```\nIndex A: Current embeddings\nIndex B: New embeddings (building)\n\nQuery -> Both indexes -> Merge or switch\n```\n\n**4. Track embedding quality:**\n- Monitor retrieval metrics continuously\n- Detect drift in embedding distributions\n- Alert on quality degradation\n\n---\n\n## Interview Questions\n\n### Q: How do embedding models learn semantic similarity?\n\n**Strong answer:**\nEmbedding models are trained with contrastive learning. The objective is to make embeddings of semantically similar texts close together and dissimilar texts far apart.\n\nTraining process:\n1. Positive pairs: Texts that should be similar (query-document pairs, paraphrases, translations)\n2. Negative pairs: Texts that should be dissimilar (often from same batch or hard negatives from BM25)\n3. Loss function: Pushes positive pairs close, negative pairs far\n\nThe model learns to place texts in a high-dimensional space where distance correlates with semantic similarity. This enables retrieval: embed the query, find nearest neighbors in the document embedding space.\n\nModern models like E5 and BGE are also instruction-tuned, where you prefix with task instructions to specialize the embedding.\n\n### Q: When would you use ColBERT over a bi-encoder?\n\n**Strong answer:**\nColBERT uses late interaction: instead of one embedding per document, it keeps per-token embeddings. At query time, it computes token-level similarity.\n\nChoose ColBERT when:\n- Retrieval precision is critical (legal, medical, high-stakes)\n- You can afford 10-100x storage overhead per document\n- Query latency budget is 50ms+ (slightly slower than bi-encoder)\n- Your queries benefit from lexical matching (technical terms)\n\nChoose bi-encoder when:\n- Storage is constrained\n- Need sub-20ms latency\n- Retrieval precision from bi-encoder is sufficient\n- Frequent re-indexing (ColBERT reindex is expensive)\n\nIn practice, a common pattern is: bi-encoder for first-stage retrieval (top 100), then cross-encoder or ColBERT for reranking.\n\n### Q: How do you handle embedding drift when updating models?\n\n**Strong answer:**\nEmbedding models produce vectors that are only meaningful relative to the same model. If you update the model, all old embeddings become incompatible.\n\nMy approach:\n1. **Never update in place.** Create a parallel index with new embeddings.\n2. **Test before switching.** Compare retrieval quality on a test set with both old and new embeddings.\n3. **Background rebuild.** Re-embed the entire corpus with the new model in the background.\n4. **Atomic switch.** Once the new index is complete and validated, switch traffic atomically.\n5. **Rollback plan.** Keep the old index available for quick rollback.\n\nFor cost estimation: if you have 10M documents at 500 tokens average, and text-embedding-3-large costs $0.13/1M tokens, re-embedding costs about $650. Plan for this cost when considering model updates.\n\n### Q: How do you choose dimensions for embeddings?\n\n**Strong answer:**\nHigher dimensions capture more information but cost more storage and computation.\n\nConsiderations:\n- **Storage:** 1024-d float32 = 4 KB per embedding. At 10M docs = 40 GB just for embeddings.\n- **Search speed:** Higher dimensions = slower nearest neighbor search.\n- **Quality:** Diminishing returns above certain dimensions for most tasks.\n\nPractical approach:\n1. Start with the model's recommended dimensions.\n2. If using Matryoshka models (like text-embedding-3), experiment with lower dimensions on your task.\n3. Benchmark quality at different dimensions: often 256-512 is 95% of full quality.\n4. For two-stage retrieval: use low dimensions for first stage, full dimensions for reranking.\n\nFor most applications, 768-1024 dimensions provide good balance. The exception is very high-precision requirements where 2048-4096 may help.\n\n---\n\n## References\n\n- Reimers and Gurevych. \"Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks\" (2019)\n- Khattab and Zaharia. \"ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction over BERT\" (2020)\n- Wang et al. \"Text Embeddings by Weakly-Supervised Contrastive Pre-training\" (E5, 2022)\n- Xiao et al. \"C-Pack: Packaged Resources To Advance General Chinese Embedding\" (BGE, 2023)\n- Kusupati et al. \"Matryoshka Representation Learning\" (MRL, 2022)\n- MTEB Leaderboard: https://huggingface.co/spaces/mteb/leaderboard\n- OpenAI Embeddings Guide: https://platform.openai.com/docs/guides/embeddings\n\n---\n\n*Previous: [Transformer Architecture](04-transformer-architecture.md) | Next: [Inference Pipeline](06-inference-pipeline.md)*\n", "content_zh": "# Embedding 与向量空间\n\n## 核心概念\n\nEmbedding 把词、句子、文档或其他对象映射到向量空间，使语义相近的内容距离更近。Word2Vec 是静态表示，BERT 等模型提供上下文表示，Sentence/Document Embedding 面向检索和分类。\n\n## 模型与指标\n\nBi-Encoder 分别编码查询和文档，速度快，适合大规模召回；Cross-Encoder 同时读取二者，精度高但成本更高，适合重排序。常用距离包括 Cosine、Dot Product 和 Euclidean，选择要与训练目标和向量归一化保持一致。\n\n## 生产实践\n\n关注批处理、缓存、分块、维度、量化、版本和漂移。Matryoshka Embedding 允许在不同维度截断向量，用于在质量、索引空间和延迟之间调整。Late Chunking 先编码更长上下文，再按块聚合，可保留跨段落信息。模型升级必须重新评测和管理索引版本。\n", "summary_content": "# 《Embedding 与向量空间》中文概要\n\n理解 Embedding、Bi-Encoder、Cross-Encoder、距离度量、Matryoshka、Late Chunking、量化和 Embedding 版本漂移，重点关注 RAG 端到端效果。\n"}, {"filename": "01-foundations/06-inference-pipeline.md", "section_id": "01-foundations", "section_label": "01 · 基础知识", "label": "06 inference pipeline", "title_zh": "推理流水线", "summary": "掌握 Prefill/Decode、采样、TTFT、TPS、Streaming、Continuous Batching、Prefix Caching 和 Speculative Decoding，能把模型生成过程映射到线上指标。", "detail": "", "content": "# Inference Pipeline\n\nThis chapter covers how LLMs generate text at inference time, the computational phases involved, and the key metrics for production serving.\n\n## Table of Contents\n\n- [Generation Basics](#generation-basics)\n- [Prefill and Decode Phases](#prefill-and-decode-phases)\n- [Sampling Strategies](#sampling-strategies)\n- [Stopping Conditions](#stopping-conditions)\n- [Latent Optimization: Speculative Decoding](#speculative-decoding)\n- [Latency Metrics & TTFT vs. TPS](#latency-metrics)\n- [Memory and Compute Requirements](#memory-and-compute-requirements)\n- [Continuous Batching & Prefix Caching](#continuous-batching-and-prefix-caching)\n- [Multi-LoRA Serving](#multi-lora-serving)\n- [Streaming](#streaming)\n- [Production Considerations](#production-considerations)\n- [Interview Questions](#interview-questions)\n- [References](#references)\n\n---\n\n## Generation Basics\n\nLLMs generate text autoregressively: one token at a time, using all previous tokens as context.\n\n```\nInput: \"The quick brown\"\nStep 1: Generate \"fox\" -> \"The quick brown fox\"\nStep 2: Generate \"jumps\" -> \"The quick brown fox jumps\"\nStep 3: Generate \"over\" -> \"The quick brown fox jumps over\"\n...\n```\n\n### The Generation Loop\n\n```python\ndef generate(prompt: str, max_tokens: int, model) -> str:\n    tokens = tokenize(prompt)\n    \n    for _ in range(max_tokens):\n        # Forward pass: get logits for next token\n        logits = model.forward(tokens)\n        \n        # Sample next token from probability distribution\n        next_token = sample(logits[-1])\n        \n        # Check for stop condition\n        if next_token == EOS_TOKEN:\n            break\n        \n        tokens.append(next_token)\n    \n    return detokenize(tokens)\n```\n\n---\n\n## Prefill and Decode Phases\n\nInference has two distinct phases with different characteristics:\n\n### Prefill Phase\n\nProcesses the entire input prompt in parallel.\n\n```\nInput: \"The quick brown fox\" (4 tokens)\n\nPrefill:\n- Process all 4 tokens simultaneously\n- Compute attention across all pairs\n- Populate KV cache for all positions\n- Output: logits for next token\n```\n\n**Characteristics:**\n- Compute-bound (lots of matrix operations)\n- Parallelizable across tokens\n- Time scales with prompt length\n- Happens once per generation\n\n### Decode Phase\n\nGenerates one token at a time.\n\n```\nDecode step 1:\n- Input: new token position only\n- Attend to all KV cache (prompt + previously generated)\n- Generate one token\n\nDecode step 2:\n- Append new K, V to cache\n- Input: newest token position\n- Generate next token\n\n...repeat until done\n```\n\n**Characteristics:**\n- Memory-bound (loading KV cache from HBM)\n- Sequential (must complete each step to start next)\n- Time per token roughly constant\n- Repeated until stopping condition\n\n### Why This Matters\n\n| Phase | Bottleneck | Optimization |\n|-------|------------|--------------|\n| Prefill | Compute (GPU cores) | Flash Attention, better GPU |\n| Decode | Memory bandwidth | GQA, batching, quantization |\n\n**Implication for serving:**\n- Long prompts increase prefill time (affects TTFT)\n- Long generations increase decode time (affects total latency)\n- Batching helps decode efficiency more than prefill\n\n---\n\n## Sampling Strategies\n\nAfter computing logits, we need to select the next token. Different strategies produce different outputs.\n\n### Greedy Decoding\n\nAlways pick the highest probability token:\n\n```python\ndef greedy_sample(logits):\n    return torch.argmax(logits)\n```\n\n**Properties:**\n- Deterministic\n- Often repetitive for long generations\n- Good for factual/structured outputs\n\n### Temperature Sampling\n\nScale logits before softmax to control randomness:\n\n```python\ndef temperature_sample(logits, temperature=1.0):\n    scaled_logits = logits / temperature\n    probs = torch.softmax(scaled_logits, dim=-1)\n    return torch.multinomial(probs, num_samples=1)\n```\n\n**Temperature effects:**\n\n| Temperature | Behavior | Use Case |\n|-------------|----------|----------|\n| 0 | Greedy (deterministic) | Factual Q&A, code |\n| 0.3-0.7 | Low randomness | General tasks |\n| 1.0 | Baseline | Creative writing |\n| 1.5+ | High randomness | Brainstorming |\n\n### Top-K Sampling\n\nOnly consider the K highest probability tokens:\n\n```python\ndef top_k_sample(logits, k=50):\n    values, indices = torch.topk(logits, k)\n    probs = torch.softmax(values, dim=-1)\n    sampled_idx = torch.multinomial(probs, num_samples=1)\n    return indices[sampled_idx]\n```\n\n**Effect:** Filters out low-probability tokens that might be nonsensical.\n\n### Top-P (Nucleus) Sampling\n\nInclude tokens until cumulative probability exceeds P:\n\n```python\ndef top_p_sample(logits, p=0.9):\n    sorted_probs, sorted_indices = torch.sort(\n        torch.softmax(logits, dim=-1), descending=True\n    )\n    cumulative_probs = torch.cumsum(sorted_probs, dim=-1)\n    \n    # Find cutoff\n    cutoff_idx = torch.searchsorted(cumulative_probs, p)\n    \n    # Sample from truncated distribution\n    selected_probs = sorted_probs[:cutoff_idx + 1]\n    selected_probs = selected_probs / selected_probs.sum()\n    sampled_idx = torch.multinomial(selected_probs, num_samples=1)\n    \n    return sorted_indices[sampled_idx]\n```\n\n**Advantage over Top-K:** Dynamically adjusts based on probability distribution. High-confidence predictions include fewer tokens; uncertain predictions include more.\n\n### Common Configurations\n\n| Use Case | Temperature | Top-P | Top-K |\n|----------|-------------|-------|-------|\n| Code generation | 0-0.2 | 0.95 | - |\n| Factual Q&A | 0.1-0.3 | 1.0 | - |\n| General chat | 0.7 | 0.9 | - |\n| Creative writing | 1.0 | 0.95 | - |\n| Brainstorming | 1.2 | 1.0 | - |\n\n### Repetition Penalties\n\nReduce probability of recently generated tokens:\n\n```python\ndef apply_repetition_penalty(logits, generated_tokens, penalty=1.2):\n    for token_id in set(generated_tokens):\n        logits[token_id] /= penalty\n    return logits\n```\n\n**Variants:**\n- Presence penalty: Penalize all tokens that appeared\n- Frequency penalty: Penalize proportional to occurrence count\n\n---\n\n## Stopping Conditions\n\nGeneration continues until a stopping condition is met:\n\n### EOS Token\n\nModel generates end-of-sequence token:\n\n```python\nif next_token == tokenizer.eos_token_id:\n    break\n```\n\n### Max Tokens\n\nHard limit on generation length:\n\n```python\nfor i in range(max_tokens):\n    # generate...\n```\n\n### Stop Sequences\n\nCustom strings that terminate generation:\n\n```python\nstop_sequences = [\"###\", \"\\n\\n\", \"Human:\"]\n\nfor seq in stop_sequences:\n    if output.endswith(seq):\n        output = output[:-len(seq)]\n        break\n```\n\n## Latent Optimization: Speculative Decoding\n\n**The current standard for high-bandwidth serving.**\n\nSpeculative decoding uses a smaller \"draft model\" to predict multiple future tokens in a single step, which the larger \"target model\" then verifies in parallel.\n\n```\nDraft Model (Small): Predicts 5 tokens -> \"The\", \"quick\", \"brown\", \"fox\", \"jumps\"\nTarget Model (Large): Verifies all 5 tokens in ONE forward pass.\nResult: If target agrees on 4 tokens, we've generated 4 tokens for the cost of 1 large forward pass.\n```\n\n| Method | Approach | Speedup | Example |\n|--------|----------|---------|---------|\n| Draft Model | Small model (e.g., 1B) + Large (70B) | 2x-3x | vLLM, TGI |\n| **Medusa Heads** | Multiple LM heads on the same model | 1.5x-2x | Medusa, Eagle |\n| Prompt Lookup | Uses substrings from prompt as speculation| 1.2x | RAG / Code completion |\n\n---\n\n## Latency Metrics\n\n### Time to First Token (TTFT)\n\nTime from request to first generated token.\n\n```\nTTFT = network_latency + queue_time + prefill_time\n```\n\n**What affects TTFT:**\n- Prompt length (prefill is O(n))\n- Model size\n- GPU speed\n- Queue depth\n\n**Targets:**\n- Interactive chat: < 500ms\n- Real-time: < 200ms\n- Batch: Less critical\n\n### Tokens Per Second (TPS)\n\nRate of token generation after first token.\n\n```\nTPS = (total_tokens - 1) / (total_time - TTFT)\n```\n\n**What affects TPS:**\n- Model size\n- Batch size\n- GPU memory bandwidth\n- KV cache size\n\n**Typical values:**\n- Llama 70B on H100: 30-50 tokens/sec per request\n- GPT-4 via API: 20-80 tokens/sec (varies)\n- Small model (7B): 100+ tokens/sec\n\n### Total Latency\n\n```\nTotal = TTFT + (output_tokens / TPS)\n```\n\n**Example:**\n- TTFT: 200ms\n- TPS: 50 tokens/sec\n- Output: 100 tokens\n- Total: 200ms + 2000ms = 2.2s\n\n### Throughput\n\nRequests completed per unit time:\n\n```\nThroughput = concurrent_requests * TPS / average_output_tokens\n```\n\nHigher batch sizes increase throughput but may increase per-request latency.\n\n---\n\n## Memory and Compute Requirements\n\n### Model Weights\n\n```\nMemory = parameters * bytes_per_parameter\n\n70B model in FP16:\n= 70B * 2 bytes\n= 140 GB\n\n70B model in INT4:\n= 70B * 0.5 bytes\n= 35 GB\n```\n\n### KV Cache\n\n```\nPer token: 2 * layers * heads * head_dim * bytes\nPer request: per_token * sequence_length\n\nLlama 70B (80 layers, 64 heads, 128 dim, FP16):\n= 2 * 80 * 64 * 128 * 2 bytes\n= 2.6 MB per token\n\nAt 4K context: 10.5 GB per request\nAt 8K context: 21 GB per request\n```\n\n### Total GPU Memory\n\n```\nTotal = model_weights + kv_cache * batch_size + activations\n\nExample: Llama 70B serving\n- Weights (INT4): 35 GB\n- KV cache (8K, batch 4): 84 GB\n- Activations: ~5 GB\n- Total: ~124 GB (fits on 2x H100 80GB)\n```\n\n### FLOPs per Token\n\n```\nForward pass FLOPs ≈ 2 * parameters\n\n70B model:\n≈ 140 TFLOPs per token\n\nAt 40 tokens/sec:\n≈ 5.6 PFLOPs sustained\n```\n\n---\n\n## Streaming\n\nFor interactive applications, stream tokens as they are generated:\n\n### Server-Side Events (SSE)\n\n```python\n# Server\nasync def generate_stream(prompt: str):\n    for token in model.generate_iter(prompt):\n        yield f\"data: {json.dumps({'token': token})}\\n\\n\"\n    yield \"data: [DONE]\\n\\n\"\n\n# Client\nasync for event in sse_client.stream(\"/generate\"):\n    token = json.loads(event.data)[\"token\"]\n    display(token)\n```\n\n### Benefits\n\n| Aspect | Streaming | Non-streaming |\n|--------|-----------|---------------|\n| Perceived latency | TTFT only | Full generation time |\n| User experience | Progressive | Waiting, then complete |\n| Early termination | User can stop | Must wait |\n| Memory | Lower | Higher (buffer response) |\n\n### Implementation Details\n\n- Flush after each token\n- Handle connection drops gracefully\n- Consider buffering for very fast generation\n- Some frameworks buffer by default; disable for streaming\n\n---\n\n## Production Considerations\n\n### Batching for Throughput\n\nCombine multiple requests to maximize GPU utilization:\n\n```python\n# Without batching: GPU underutilized\nfor request in requests:\n    response = model.generate(request)\n\n# With batching: parallel processing\nbatch = collect_requests(timeout=10ms, max_batch=32)\nresponses = model.generate_batch(batch)\n```\n\n### Continuous Batching and Prefix Caching\n\n**Continuous Batching (Iteration-level Scheduling):**\nUnlike static batching, continuous batching injects new requests as soon as any request in the batch hits an EOS token. This increases throughput by up to 20x.\n\n**Prefix Caching (RAD-O):**\nCaches the KV tensors of common prefixes (e.g., system prompts, few-shot examples).\n- **TTFT Reduction**: 90%\n- **Mechanism**: Use a hash of the prefix to lookup KV tensors in a GPU-memory LRU cache.\n\n### Multi-LoRA Serving\n\n**Scenario:** Serving 1000 different fine-tuned models (adapters) on one base model.\n**The Challenge:** Loading 1000 separate models would take terabytes of VRAM.\n\n**The Solution (LoRAX / S-LoRA):**\n1. Load one base model in VRAM.\n2. Store LoRA adapters (megabytes) in host RAM or SSD.\n3. Dynamically swap adapters during the forward pass based on the request ID.\n4. **Implementation**: Use a specialized kernel (S-LoRA) that performs matrix-vector multiplication for multiple different adapters in the same batch.\n\n### Request Prioritization\n\n```python\nclass RequestQueue:\n    def __init__(self):\n        self.high_priority = asyncio.Queue()\n        self.low_priority = asyncio.Queue()\n    \n    async def get_next(self):\n        if not self.high_priority.empty():\n            return await self.high_priority.get()\n        return await self.low_priority.get()\n```\n\n**Priority criteria:**\n- Customer tier\n- Request type\n- Wait time\n- Estimated compute cost\n\n### Timeout Handling\n\n```python\nasync def generate_with_timeout(prompt: str, timeout: float):\n    try:\n        result = await asyncio.wait_for(\n            model.generate(prompt),\n            timeout=timeout\n        )\n        return result\n    except asyncio.TimeoutError:\n        return {\"error\": \"timeout\", \"partial\": partial_output}\n```\n\n### Graceful Degradation\n\n```python\nasync def generate_with_fallback(prompt: str):\n    try:\n        return await primary_model.generate(prompt)\n    except RateLimitError:\n        return await fallback_model.generate(prompt)\n    except TimeoutError:\n        return await small_fast_model.generate(prompt)\n```\n\n### Cost Tracking\n\n```python\n@dataclass\nclass RequestMetrics:\n    input_tokens: int\n    output_tokens: int\n    model: str\n    latency_ms: float\n    cost_usd: float\n\ndef calculate_cost(metrics: RequestMetrics) -> float:\n    pricing = {\n        \"gpt-4o\": {\"input\": 2.50, \"output\": 10.00},\n        \"gpt-4o-mini\": {\"input\": 0.15, \"output\": 0.60},\n    }\n    rates = pricing[metrics.model]\n    return (\n        (metrics.input_tokens / 1_000_000) * rates[\"input\"] +\n        (metrics.output_tokens / 1_000_000) * rates[\"output\"]\n    )\n```\n\n---\n\n## Interview Questions\n\n### Q: Explain the difference between prefill and decode phases.\n\n**Strong answer:**\nLLM inference has two distinct phases:\n\n**Prefill:**\n- Processes the entire input prompt at once\n- All tokens attend to each other in parallel\n- Populates the KV cache for all prompt positions\n- Compute-bound: uses GPU cores efficiently\n- Time scales with prompt length\n\n**Decode:**\n- Generates one token at a time\n- New token attends to all KV cache entries\n- Appends new K, V to cache\n- Memory-bound: bottlenecked by loading KV cache\n- Time per token is roughly constant\n\nThis matters for system design because:\n- Long prompts increase TTFT (prefill intensive)\n- Batching helps decode more than prefill\n- Different optimization strategies for each phase\n\n### Q: How do temperature and top-p affect generation?\n\n**Strong answer:**\nBoth control randomness in token selection:\n\n**Temperature:**\n- Scales logits before softmax\n- Low (0-0.3): More deterministic, picks high-probability tokens\n- High (1.0+): More random, flattens probability distribution\n- Zero: Greedy decoding\n\n**Top-p (nucleus sampling):**\n- Filters to smallest set of tokens with cumulative probability > p\n- Dynamically adjusts cutoff based on distribution\n- High confidence: few tokens considered\n- Low confidence: many tokens considered\n\nTypical production settings:\n- Factual Q&A: temperature 0.1, top-p 0.95\n- General chat: temperature 0.7, top-p 0.9\n- Creative: temperature 1.0+, top-p 0.95\n\nThe key insight is that these work together. Temperature reshapes the distribution; top-p truncates it.\n\n### Q: What determines TTFT vs TPS?\n\n**Strong answer:**\n**TTFT (Time to First Token):**\n- Network latency to reach the server\n- Queue wait time\n- Prefill computation time\n- Dominated by: prompt length, GPU compute speed\n\n**TPS (Tokens Per Second):**\n- Decode phase efficiency\n- Memory bandwidth for loading KV cache\n- Dominated by: memory bandwidth, batch size, model size\n\nOptimization strategies differ:\n- TTFT: Reduce prompt when possible, use faster networking, minimize queueing\n- TPS: Increase batch size, use GQA/MQA models, optimize memory access\n\nThe tradeoff: batching improves TPS (throughput) but may increase TTFT (latency) if requests wait for batch formation.\n\n### Q: How would you estimate GPU requirements for serving a model?\n\n**Strong answer:**\nThree main memory consumers:\n\n1. **Model weights:**\n   - FP16: parameters * 2 bytes\n   - INT8: parameters * 1 byte\n   - INT4: parameters * 0.5 bytes\n\n2. **KV cache:**\n   - Per token: 2 * layers * kv_heads * head_dim * 2 bytes (FP16)\n   - Per request: per_token * sequence_length\n   - Total: per_request * batch_size\n\n3. **Activations:** Typically 5-10% overhead\n\nExample for Llama 70B serving:\n- Weights (INT4): 35 GB\n- KV cache (8K context, batch 8): 168 GB\n- Need: ~200 GB total\n\nHardware options:\n- 3x A100 80GB with tensor parallelism\n- 2x H100 80GB with tensor parallelism\n- 8x A100 40GB with more parallelism\n\nThen verify throughput meets requirements via benchmarking.\n\n---\n\n## References\n\n- Holtzman et al. \"The Curious Case of Neural Text Degeneration\" (nucleus sampling, 2020)\n- Kwon et al. \"Efficient Memory Management for Large Language Model Serving with PagedAttention\" (vLLM, 2023)\n- [vLLM Documentation](https://docs.vllm.ai/)\n- [TensorRT-LLM](https://github.com/NVIDIA/TensorRT-LLM)\n- [OpenAI API Documentation](https://platform.openai.com/docs/api-reference)\n\n---\n\n*Previous: [Embeddings and Vector Spaces](05-embeddings-and-vector-spaces.md) | Next: [Model Taxonomy](../02-model-landscape/01-model-taxonomy.md)*\n", "content_zh": "# 推理流水线\n\n## 生成过程\n\n模型先执行 Prefill，处理输入上下文并建立 KV Cache；然后进入 Decode，逐 token 生成输出。采样可以使用 Greedy、Temperature、Top-K、Top-P 和重复惩罚，停止条件包括 EOS、最大 token 和 Stop Sequence。\n\n## 关键指标\n\n- TTFT：从请求到第一个 token 的时间。\n- TPS：生成速度。\n- Total Latency：完整响应时间。\n- Throughput：单位时间处理的请求或 token 数。\n\n## 生产优化\n\n使用 Streaming/SSE 改善体验，Continuous Batching 提高吞吐，Prefix Caching 减少重复 Prefill，Speculative Decoding 提高 Decode 速度，Multi-LoRA 支持多个适配器。还要设置请求优先级、超时、降级、成本追踪和 GPU 显存预算。\n", "summary_content": "# 《推理流水线》中文概要\n\n掌握 Prefill/Decode、采样、TTFT、TPS、Streaming、Continuous Batching、Prefix Caching 和 Speculative Decoding，能把模型生成过程映射到线上指标。\n"}, {"filename": "02-model-landscape/01-model-taxonomy.md", "section_id": "02-model-landscape", "section_label": "02 · 模型版图", "label": "01 model taxonomy", "title_zh": "模型分类与版图", "summary": "模型版图变化很快，重点不是背模型名称，而是掌握按能力、推理、上下文、成本、部署和供应商风险进行分类与选择。", "detail": "", "content": "# Model Taxonomy\n\nThis chapter provides a comprehensive guide to the model landscape as of **August 2026**, covering model families, capabilities, and selection criteria for production systems.\n\n> **Last verified: August 15, 2026.** The model landscape evolves rapidly. Always cross-check with provider pricing pages and release notes.\n>\n> **August 2026 headline:** Most of the month's releases were post-training refreshes or derivatives rather than new pretraining runs, and no US frontier lab shipped a new flagship base model. The action moved to prices, licenses, and access control. The clear exception is Alibaba's Qwen3.8-Max, a genuinely new 2.4T base whose weights landed August 12. **Claude Sonnet 5's introductory $2/$10 per 1M became the permanent price on August 10**, and the scheduled September 1 rise to $3/$15 was canceled, making Sonnet 5 permanently cheaper than the Sonnet 4.6 it replaced. Running the other way, **DeepSeek raises V4 prices 3x to 12x effective August 16 at 16:00 UTC**, moving to peak and off-peak billing (off-peak is exactly half peak, and peak covers only 01:00-04:00 and 06:00-10:00 UTC). That ends its run as the unambiguous cheap option. **OpenAI shipped GPT-5.6-Cyber** (August 10, $12.50/$75 per 1M) behind a new two-tier Daybreak Blue and Daybreak Red access program, the most concrete production example yet of capability-tiered gating. **Google released Gemini 3.7 Flash** (August 13) at half price through year-end, and **SpaceXAI released Grok 4.6** (August 12) with a 500K context. On open weights the licensing picture split: **Alibaba's Qwen3.8-Max** (August 12, 2.4T/95B active) shipped under a bespoke commercially gated license while its **Qwen3.8-27B** sibling (August 14) shipped plain Apache 2.0, **Meta returned to open weights with Muse Glimmer** (August 10, 30B, Apache 2.0), and **Z.ai withheld GLM-5.3's weights** pending safety evaluation after cyber capability grew faster than expected. **Claude Opus 4.1 retired on August 5**, closing out the last $15/$75 Opus tier. Benchmark figures throughout this section are largely vendor-reported; confirm on independent leaderboards.\n>\n> **July 2026 headline:** Anthropic shipped a full generation refresh: **Claude Sonnet 5** (June 30, `claude-sonnet-5`, new default everywhere, introductory $2/$10 per 1M through August 31 then $3/$15) and **Claude Opus 5** (July 24, `claude-opus-5`, unchanged $5/$25 with an optional Fast mode at $10/$50 about 2.5x faster). **Claude Fable 5 was restored globally July 1** after the export-control suspension, with a new jailbreak-specific cybersecurity classifier; Mythos 5 returned only to roughly 100 US critical-infrastructure organizations via Project Glasswing. **GPT-5.6 (Sol, Terra, Luna) reached general availability July 9**, and on July 30 OpenAI cut Luna 80% to $0.20/$1.20 and Terra 20% to $2/$12 (Sol stays $5/$30). The open-weight frontier had its strongest month ever: **Moonshot Kimi K3** (July 16, weights July 27) is the largest open-weight model to date at 2.8T total / 104B active with a 1M context, and **Thinking Machines Lab** debuted **Inkling** (July 15, 975B / 41B active, open weights), the leading US open-weights model. Google shipped **Gemini 3.6 Flash**, **3.5 Flash-Lite**, and a government-gated **3.5 Flash Cyber** (July 21) while delaying Gemini 3.5 Pro. **Meta Muse Spark 1.1** (July 9) arrived with Meta's first paid self-serve model API ($1.25/$4.25 per 1M). Black Forest Labs announced **FLUX 3** (July 23), a unified image, video, audio, and action model, in gated early access. Benchmark figures across these launches are largely vendor-reported; confirm on independent leaderboards.\n>\n> **June 2026 headline:** Anthropic released **Claude Fable 5** (June 9, `claude-fable-5`, $10/$50 per 1M, 1M context), its most capable widely released model: a Mythos-class model made safe for general availability, with an Opus 4.8 fallback safeguard on sensitive topics. **Claude Mythos 5** ships the same day as the unrestricted variant for Project Glasswing partners, succeeding Mythos Preview at less than half its price.\n>\n> **June 10-26 update:** A dense second wave of June launches followed. **Google DeepMind DiffusionGemma** (June 10, Apache 2.0) is Google DeepMind's first open-weight text-diffusion model: a 26B Mixture-of-Experts (~4B active) that denoises blocks of tokens in parallel for roughly 4x faster generation on a single H100, trading some quality versus standard Gemma 4. **Gemini 3.5 Live Translate** (June 9, built on Gemini 3 Pro) added real-time speech-to-speech translation across 70+ languages in public preview via the Gemini Live API and AI Studio. **Cohere North Mini Code 1.0** (June 9, Apache 2.0) is Cohere's first open coding model, a 30B / 3B-active MoE that runs on one H100. **Moonshot Kimi K2.7 Code** (June 12, Modified MIT) tunes K2.6 for long-horizon software work (1T / 32B-active MoE, roughly 30% fewer thinking tokens). **Z.ai GLM-5.2** (coding-plan access June 13, open weights under MIT June 16-17) is a 744B / 40B-active MoE with a 1M context that reports SWE-Bench Pro 62.1, ahead of GPT-5.5 on that benchmark, at roughly $1.40 / $4.
